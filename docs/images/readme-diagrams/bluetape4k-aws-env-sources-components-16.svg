<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-label="Secrets Manager and Parameter Store environment source components">
<defs>
  <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
  <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F6DE0"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F8B57"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#168E86"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#EA580C"/></marker>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter";font-size:38px;fill:#102033}
  .subtitle,.detail,.tiny,.chip{font-family:"Comic Mono";fill:#526274}
  .subtitle{font-size:16px}.detail{font-size:13px}.tiny{font-size:11px}.chip{font-size:11px;fill:#243447}
  .layer-title{font-family:"Architects Daughter";font-size:24px;fill:#102033}
  .layer-detail{font-family:"Comic Mono";font-size:12px;fill:#526274}
  .card-title{font-family:"Architects Daughter";font-size:21px;fill:#102033}
  .layer{fill:#F8FAFC;stroke:#D9E2EC;stroke-width:1.4}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter";font-size:17px;fill:#FFFFFF}
  .footer-detail{font-family:"Comic Mono";font-size:12px;fill:#DDE7F2}
</style>

<rect x="26" y="26" width="1388" height="708" rx="14" class="frame"/>
<text class="title" x="54" y="74">Environment sources</text>
<text class="subtitle" x="56" y="106">Secrets Manager and Parameter Store load configured sources before configuration properties bind.</text>

<g>
  <rect x="936" y="57" width="140" height="25" rx="12.5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="chip" x="1006" y="70.5" text-anchor="middle" dominant-baseline="middle">Secrets JSON/TEXT</text>
  <rect x="1092" y="57" width="140" height="25" rx="12.5" fill="#EAF7EF" stroke="#58A978"/>
  <text class="chip" x="1162" y="70.5" text-anchor="middle" dominant-baseline="middle">SSM path</text>
  <rect x="1248" y="57" width="122" height="25" rx="12.5" fill="#FFF7ED" stroke="#F97316"/>
  <text class="chip" x="1309" y="70.5" text-anchor="middle" dominant-baseline="middle">Refresh</text>
</g>

<g id="layers">
  <rect class="layer" x="70" y="142" width="280" height="410" rx="12"/>
  <text class="layer-title" x="92" y="178">Activation</text>
  <text class="layer-detail" x="94" y="200">post-process only when sources exist</text>
  <rect class="layer" x="390" y="142" width="300" height="410" rx="12"/>
  <text class="layer-title" x="412" y="178">AWS loaders</text>
  <text class="layer-detail" x="414" y="200">sync clients and source descriptors</text>
  <rect class="layer" x="730" y="142" width="310" height="410" rx="12"/>
  <text class="layer-title" x="752" y="178">Key mapping</text>
  <text class="layer-detail" x="754" y="200">flatten JSON and path segments</text>
  <rect class="layer" x="1080" y="142" width="290" height="410" rx="12"/>
  <text class="layer-title" x="1102" y="178">Spring Environment</text>
  <text class="layer-detail" x="1104" y="200">property sources before binding</text>
</g>

<g id="cards">
  <rect class="card" x="100" y="224" width="220" height="92" rx="9" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="210" y="258" text-anchor="middle">Secrets sources</text>
  <text class="detail" x="210" y="284" text-anchor="middle">secretId + prefix</text>
  <text class="detail" x="210" y="304" text-anchor="middle">JSON or TEXT</text>
  <rect class="card" x="100" y="382" width="220" height="92" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="210" y="416" text-anchor="middle">Parameter sources</text>
  <text class="detail" x="210" y="442" text-anchor="middle">path + prefix</text>
  <text class="detail" x="210" y="462" text-anchor="middle">recursive + decrypt</text>

  <rect class="card" x="420" y="224" width="240" height="92" rx="9" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="540" y="258" text-anchor="middle">Secrets loader</text>
  <text class="detail" x="540" y="284" text-anchor="middle">getSecretValue</text>
  <text class="detail" x="540" y="304" text-anchor="middle">optional / failFast</text>
  <rect class="card" x="420" y="382" width="240" height="92" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="540" y="416" text-anchor="middle">SSM loader</text>
  <text class="detail" x="540" y="442" text-anchor="middle">getParametersByPath</text>
  <text class="detail" x="540" y="462" text-anchor="middle">token pagination</text>

  <rect class="card" x="760" y="224" width="250" height="92" rx="9" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="885" y="258" text-anchor="middle">Flatten JSON</text>
  <text class="detail" x="885" y="284" text-anchor="middle">db.password</text>
  <text class="detail" x="885" y="304" text-anchor="middle">prefix joins keys</text>
  <rect class="card" x="760" y="382" width="250" height="92" rx="9" fill="#F3FBFA" stroke="#63B8B3"/>
  <text class="card-title" x="885" y="416" text-anchor="middle">Path to key</text>
  <text class="detail" x="885" y="442" text-anchor="middle">trim source path</text>
  <text class="detail" x="885" y="462" text-anchor="middle">slashes become dots</text>

  <rect class="card" x="1110" y="224" width="230" height="92" rx="9" fill="#FFF7ED" stroke="#F97316"/>
  <text class="card-title" x="1225" y="258" text-anchor="middle">PropertySource</text>
  <text class="detail" x="1225" y="284" text-anchor="middle">after command-line</text>
  <text class="detail" x="1225" y="304" text-anchor="middle">AWS order preserved</text>
  <rect class="card" x="1110" y="382" width="230" height="92" rx="9" fill="#FFF4E6" stroke="#F59E0B"/>
  <text class="card-title" x="1225" y="416" text-anchor="middle">Refreshing source</text>
  <text class="detail" x="1225" y="442" text-anchor="middle">optional interval</text>
  <text class="detail" x="1225" y="462" text-anchor="middle">keeps last good value</text>
</g>

<g id="connections">
  <path class="edge" d="M 320 270 L 420 270" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M 320 428 L 420 428" stroke="#2F8B57" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M 660 270 L 760 270" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M 660 428 L 760 428" stroke="#2F8B57" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M 1010 270 L 1110 270" stroke="#168E86" marker-end="url(#arrow-teal)"/>
  <path class="edge" d="M 1010 428 L 1110 428" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
</g>

<g id="contracts">
  <rect x="86" y="584" width="600" height="72" rx="10" fill="#FFFFFF" stroke="#D9E2EC"/>
  <text class="card-title" x="110" y="616">Remote lookup gate</text>
  <text class="detail" x="424" y="614">sources required</text>
  <text class="detail" x="582" y="614">SDK dependency</text>
  <text class="tiny" x="110" y="640">No Secrets Manager or SSM call is made when the matching sources list is empty.</text>
  <rect x="724" y="584" width="630" height="72" rx="10" fill="#FFFFFF" stroke="#D9E2EC"/>
  <text class="card-title" x="748" y="616">Binding boundary</text>
  <text class="detail" x="984" y="614">Environment first</text>
  <text class="detail" x="1172" y="614">properties later</text>
  <text class="tiny" x="748" y="640">Loaded values are available before @ConfigurationProperties binding starts.</text>
</g>

<rect class="footer" x="54" y="690" width="1332" height="34" rx="8"/>
<text class="footer-title" x="74" y="710" dominant-baseline="middle">Boundary</text>
<text class="footer-detail" x="178" y="710" dominant-baseline="middle">Environment sources translate AWS values into Spring property keys before application beans bind.</text>
</svg>
