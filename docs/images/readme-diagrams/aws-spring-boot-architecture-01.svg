<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-label="aws-spring-boot architecture">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <marker id="arrow-dax" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#2F9E96"/></marker>
  <marker id="arrow-cw" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#4F83D1"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .layer{fill:#F8FAFD;stroke:#E1E8F0;stroke-width:1.2;stroke-dasharray:6 7}
  .layer-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#6B7B8D;letter-spacing:0.5px}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-dax{fill:none;stroke:#2F9E96;stroke-width:2.2;marker-end:url(#arrow-dax)}
  .edge-cw{fill:none;stroke:#4F83D1;stroke-width:2.2;marker-end:url(#arrow-cw)}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="1388" height="1068" rx="14" class="frame"/>
<text class="title" x="54" y="72">aws-spring-boot architecture</text>
<text class="subtitle" x="56" y="102">Spring Boot auto-configurations share AWS defaults, publish operations beans, and support local services.</text>
<rect x="1305" y="54" width="71" height="24" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="chip" x="1340.5" y="70" text-anchor="middle">Boot 4</text>
<rect x="1180.5" y="54" width="108.5" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="chip" x="1234.75" y="70" text-anchor="middle">Auto-config</text>
<rect x="1071" y="54" width="93.5" height="24" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="chip" x="1117.75" y="70" text-anchor="middle">Local AWS</text>

<g id="layers">
  <rect class="layer" x="54" y="124" width="1332" height="108" rx="10"/>
