  <text class="detail" x="720" y="912" text-anchor="middle">CloudWatch, Logs, DAX, LocalStack, Floci, RDS</text>
</g>
<rect class="footer" x="54" y="1000" width="1332" height="54" rx="8"/>
<text class="footer-title" x="72" y="1019" dominant-baseline="middle">Module role</text>
<text class="footer-detail" x="72" y="1037" dominant-baseline="middle">Keep common AWS client defaults central while service auto-configurations expose focused operations.</text>
</svg>
