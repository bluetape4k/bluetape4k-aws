  <path class="edge-dax" d="M720 482 L720 514 L708 514 L708 560"/>
  <path class="edge-cw" d="M720 482 L720 514 L963 514 L963 560"/>
  <path class="edge" d="M720 482 L720 514 L1218 514 L1218 560" stroke="#66758A"/>
  <path class="edge-dax" d="M708 646 L708 690"/>
  <path class="edge" d="M198 646 L198 814 L720 814 L720 850" stroke="#66758A"/>
  <path class="edge" d="M453 646 L453 814 L720 814 L720 850" stroke="#66758A"/>
  <path class="edge-dax" d="M708 776 L708 814 L720 814 L720 850"/>
  <path class="edge-cw" d="M963 646 L963 814 L720 814 L720 850"/>
  <path class="edge" d="M1218 646 L1218 814 L720 814 L720 850" stroke="#66758A"/>
</g>

<g id="app">
  <rect class="card" x="560" y="136" width="320" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="720" y="172" text-anchor="middle">Spring Boot application</text>
  <text class="detail" x="720" y="196" text-anchor="middle">controllers and services</text>
</g>
