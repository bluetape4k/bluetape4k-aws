  <text class="detail" x="962.5" y="633" text-anchor="middle">Micrometer snapshots</text>
</g>
<g id="kms">
  <rect class="card" x="1100" y="560" width="235" height="86" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="1217.5" y="600" text-anchor="middle">KmsAutoConfiguration</text>
  <text class="detail" x="1217.5" y="624" text-anchor="middle">KmsOperations</text>
</g>
<g id="ddb">
  <rect class="card" x="590" y="690" width="235" height="86" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="707.5" y="726" text-anchor="middle">DynamoDB auto-config</text>
  <text class="detail" x="707.5" y="750" text-anchor="middle">enhanced repositories</text>
</g>
<g id="aws">
  <rect class="card" x="510" y="850" width="420" height="82" rx="10" fill="#FFF0E3" stroke="#F47B36"/>
