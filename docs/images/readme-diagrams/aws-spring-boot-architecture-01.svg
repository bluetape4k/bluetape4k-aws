<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">AWS Spring Boot Module Architecture</title>
  <desc id="desc">Spring Boot 4 auto-configuration layers for AWS SDK v2 clients, coroutine operations, listener containers, repositories, environment sources, Exposed database registry, and runtime AWS services.</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#d97706"/>
    </marker>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#f8fafc}
      .frame{fill:#ffffff;stroke:#8aa6cf;stroke-width:3;filter:url(#softShadow)}
      .title{font-family:"Architects Daughter";font-size:48px;fill:#17233a}
      .subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
      .band{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;stroke-dasharray:9 8}
      .bandTitle{font-family:"Comic Mono";font-size:18px;font-weight:700;fill:#475569}
      .card{fill:#ffffff;stroke-width:2.2;filter:url(#softShadow)}
      .cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#17233a}
      .cardText{font-family:"Comic Mono";font-size:13px;fill:#475569}
      .pill{fill:#ffffff;stroke-width:2}
      .pillText{font-family:"Comic Mono";font-size:13px;fill:#334155}
      .route{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .routeText{font-family:"Comic Mono";font-size:13px;fill:#334155}
      .footerText{font-family:"Comic Mono";font-size:14px;fill:#475569}
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1120"/>
  <rect class="frame" x="42" y="36" width="1516" height="1044" rx="24"/>
  <text class="title" x="800" y="96" text-anchor="middle">AWS Spring Boot Module Architecture</text>
  <text class="subtitle" x="800" y="132" text-anchor="middle">Spring Boot 4 auto-configuration without awspring: SDK v2 clients, coroutine operations, listeners, repositories, and config sources.</text>

  <g id="app">
    <rect class="band" x="92" y="178" width="1416" height="132" rx="18"/>
    <text class="bandTitle" x="118" y="216">SPRING BOOT APPLICATION</text>
    <rect class="card" x="142" y="238" width="300" height="52" rx="14" stroke="#2563eb"/>
    <text class="cardTitle" x="292" y="271" text-anchor="middle">ConfigurationProperties</text>
    <rect class="card" x="478" y="238" width="300" height="52" rx="14" stroke="#059669"/>
    <text class="cardTitle" x="628" y="271" text-anchor="middle">Business services</text>
    <rect class="card" x="814" y="238" width="300" height="52" rx="14" stroke="#d97706"/>
    <text class="cardTitle" x="964" y="271" text-anchor="middle">@SqsListener methods</text>
    <rect class="card" x="1150" y="238" width="300" height="52" rx="14" stroke="#7c3aed"/>
    <text class="cardTitle" x="1300" y="271" text-anchor="middle">Exposed repositories</text>
  </g>

  <g id="autoconfig">
    <rect class="band" x="92" y="354" width="1416" height="322" rx="18"/>
    <text class="bandTitle" x="118" y="392">BLUETAPE4K AWS SPRING BOOT AUTO-CONFIGURATION</text>

    <rect class="card" x="132" y="430" width="266" height="92" rx="16" stroke="#2563eb"/>
    <text class="cardTitle" x="265" y="462" text-anchor="middle">Shared AWS beans</text>
    <text class="cardText" x="265" y="488" text-anchor="middle">AwsProperties</text>
    <text class="cardText" x="265" y="508" text-anchor="middle">credentials + customizers</text>

    <rect class="card" x="432" y="430" width="266" height="92" rx="16" stroke="#059669"/>
    <text class="cardTitle" x="565" y="462" text-anchor="middle">Operations/templates</text>
    <text class="cardText" x="565" y="488" text-anchor="middle">S3, SNS, SES, SQS</text>
    <text class="cardText" x="565" y="508" text-anchor="middle">KMS, CloudWatch, IMDS</text>

    <rect class="card" x="732" y="430" width="266" height="92" rx="16" stroke="#d97706"/>
    <text class="cardTitle" x="865" y="462" text-anchor="middle">Messaging runtime</text>
    <text class="cardText" x="865" y="488" text-anchor="middle">listener containers</text>
    <text class="cardText" x="865" y="508" text-anchor="middle">retry + interceptors</text>

    <rect class="card" x="1032" y="430" width="266" height="92" rx="16" stroke="#7c3aed"/>
    <text class="cardTitle" x="1165" y="462" text-anchor="middle">Data integrations</text>
    <text class="cardText" x="1165" y="488" text-anchor="middle">DynamoDB repository</text>
    <text class="cardText" x="1165" y="508" text-anchor="middle">Exposed registry</text>

    <rect class="card" x="132" y="562" width="266" height="76" rx="16" stroke="#2563eb"/>
    <text class="cardTitle" x="265" y="592" text-anchor="middle">Environment sources</text>
    <text class="cardText" x="265" y="616" text-anchor="middle">S3, Secrets, SSM before binding</text>

    <rect class="card" x="432" y="562" width="266" height="76" rx="16" stroke="#059669"/>
    <text class="cardTitle" x="565" y="592" text-anchor="middle">Observability</text>
    <text class="cardText" x="565" y="616" text-anchor="middle">CloudWatch + Micrometer timers</text>

    <rect class="card" x="732" y="562" width="266" height="76" rx="16" stroke="#d97706"/>
    <text class="cardTitle" x="865" y="592" text-anchor="middle">Optional classpath</text>
    <text class="cardText" x="865" y="616" text-anchor="middle">S3 transfer, JavaMail, DAX, STS</text>

    <rect class="card" x="1032" y="562" width="266" height="76" rx="16" stroke="#7c3aed"/>
    <text class="cardTitle" x="1165" y="592" text-anchor="middle">Security helpers</text>
    <text class="cardText" x="1165" y="616" text-anchor="middle">KMS TextEncryptor + field codec</text>
  </g>

  <g id="runtime">
    <rect class="band" x="92" y="720" width="1416" height="154" rx="18"/>
    <text class="bandTitle" x="118" y="758">RUNTIME AWS SDK V2 SERVICES</text>
    <rect class="pill" x="142" y="790" width="138" height="38" rx="13" stroke="#2563eb"/>
    <text class="pillText" x="211" y="814" text-anchor="middle">S3 / S3 Vectors</text>
    <rect class="pill" x="304" y="790" width="132" height="38" rx="13" stroke="#059669"/>
    <text class="pillText" x="370" y="814" text-anchor="middle">SNS / SES</text>
    <rect class="pill" x="460" y="790" width="110" height="38" rx="13" stroke="#d97706"/>
    <text class="pillText" x="515" y="814" text-anchor="middle">SQS</text>
    <rect class="pill" x="594" y="790" width="142" height="38" rx="13" stroke="#7c3aed"/>
    <text class="pillText" x="665" y="814" text-anchor="middle">DynamoDB / DAX</text>
    <rect class="pill" x="760" y="790" width="190" height="38" rx="13" stroke="#2563eb"/>
    <text class="pillText" x="855" y="814" text-anchor="middle">CloudWatch / Logs</text>
    <rect class="pill" x="974" y="790" width="116" height="38" rx="13" stroke="#059669"/>
    <text class="pillText" x="1032" y="814" text-anchor="middle">IMDS</text>
    <rect class="pill" x="1114" y="790" width="110" height="38" rx="13" stroke="#d97706"/>
    <text class="pillText" x="1169" y="814" text-anchor="middle">KMS</text>
    <rect class="pill" x="1248" y="790" width="176" height="38" rx="13" stroke="#7c3aed"/>
    <text class="pillText" x="1336" y="814" text-anchor="middle">Secrets / SSM</text>
  </g>

  <g id="contract">
    <rect class="band" x="92" y="918" width="1416" height="98" rx="18"/>
    <text class="bandTitle" x="118" y="956">MODULE CONTRACT</text>
    <text class="footerText" x="140" y="990">No awspring runtime dependency. AWS service SDKs are compileOnly here; applications add only the runtime services they use.</text>
  </g>

  <path class="route" d="M 800 310 V 354" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
  <text class="routeText" x="846" y="338">Spring Boot imports conditional auto-configurations</text>
  <path class="route" d="M 800 676 V 720" stroke="#059669" marker-end="url(#arrowGreen)"/>
  <text class="routeText" x="846" y="704">created beans call selected AWS SDK clients</text>
  <path class="route" d="M 800 874 V 918" stroke="#d97706" marker-end="url(#arrowAmber)"/>
  <text class="routeText" x="846" y="902">runtime dependency choice stays with the application</text>
</svg>
