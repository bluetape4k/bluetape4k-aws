  <text class="detail" x="720" y="328" text-anchor="middle">region, endpoint, credentials</text>
</g>
<g id="auto">
  <rect class="card" x="560" y="400" width="320" height="82" rx="10" fill="#F4F7FA" stroke="#8CA0B3"/>
  <text class="card-title" x="720" y="438" text-anchor="middle">AwsAutoConfiguration</text>
  <text class="detail" x="720" y="462" text-anchor="middle">common SDK client defaults</text>
</g>
<g id="s3">
  <rect class="card" x="80" y="560" width="235" height="86" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="197.5" y="600" text-anchor="middle">S3AutoConfiguration</text>
  <text class="detail" x="197.5" y="624" text-anchor="middle">S3Operations</text>
</g>
<g id="sqs">
  <rect class="card" x="335" y="560" width="235" height="86" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="card-title" x="452.5" y="600" text-anchor="middle">SqsAutoConfiguration</text>
  <text class="detail" x="452.5" y="624" text-anchor="middle">SqsOperations, listeners</text>
</g>
