<rect class="canvas" x="0" y="0" width="1400" height="820"/><rect class="frame" x="24" y="24" width="1352" height="772" rx="14"/>
<text class="title" x="54" y="74">CloudWatch metrics DSL support map</text>
<text class="subtitle" x="54" y="108">The aws-kotlin module wraps CloudWatchClient with scoped lifecycle, MetricDatum builders, publish helpers, and list filters.</text>
<rect class="card-blue" x="824" y="62" width="102" height="24" rx="12" opacity="0.24"/><text class="legend" x="875" y="78" text-anchor="middle">Client</text>
<rect class="card-green" x="946" y="62" width="102" height="24" rx="12" opacity="0.24"/><text class="legend" x="997" y="78" text-anchor="middle">DSL</text>
<rect class="card-pink" x="1068" y="62" width="112" height="24" rx="12" opacity="0.24"/><text class="legend" x="1124" y="78" text-anchor="middle">CloudWatch</text>
<rect class="card-orange" x="1200" y="62" width="102" height="24" rx="12" opacity="0.24"/><text class="legend" x="1251" y="78" text-anchor="middle">Query</text>

<rect class="layer" x="64" y="140" width="292" height="560" rx="12"/><text class="layer-title" x="92" y="177">Client lifecycle</text><text class="layer-sub" x="92" y="195">configure and close safely</text>
<rect class="card-blue" x="92" y="240" width="236" height="68" rx="8"/><text class="card-title" x="210" y="264" text-anchor="middle">cloudWatchClientOf</text><text class="card-text" x="210" y="286" text-anchor="middle">endpoint, region, credentials</text>
<rect class="card-blue" x="92" y="394" width="236" height="68" rx="8"/><text class="card-title" x="210" y="418" text-anchor="middle">withCloudWatchClient</text><text class="card-text" x="210" y="440" text-anchor="middle">useSafe suspend block</text>

<rect class="layer" x="386" y="140" width="292" height="560" rx="12"/><text class="layer-title" x="414" y="177">Metric DSL</text><text class="layer-sub" x="414" y="195">build MetricDatum values</text>
<rect class="card-green" x="414" y="240" width="236" height="68" rx="8"/><text class="card-title" x="532" y="264" text-anchor="middle">metricDatum</text><text class="card-text" x="532" y="286" text-anchor="middle">builder DSL</text>
<rect class="card-green" x="414" y="394" width="236" height="68" rx="8"/><text class="card-title" x="532" y="418" text-anchor="middle">metricDatumOf</text><text class="card-text" x="532" y="440" text-anchor="middle">name, value, unit</text>
<rect class="card-teal" x="414" y="548" width="236" height="68" rx="8"/><text class="card-title" x="532" y="572" text-anchor="middle">StandardUnit</text><text class="card-text" x="532" y="594" text-anchor="middle">defaults to None</text>

<rect class="layer" x="708" y="140" width="292" height="560" rx="12"/><text class="layer-title" x="736" y="177">Publish metrics</text><text class="layer-sub" x="736" y="195">single or multiple metric data</text>
<rect class="card-pink" x="736" y="240" width="236" height="68" rx="8"/><text class="card-title" x="854" y="264" text-anchor="middle">putMetricData</text><text class="card-text" x="854" y="286" text-anchor="middle">single datum</text>
<rect class="card-pink" x="736" y="394" width="236" height="68" rx="8"/><text class="card-title" x="854" y="418" text-anchor="middle">metricData list</text><text class="card-text" x="854" y="440" text-anchor="middle">multiple MetricDatum</text>
<rect class="card-red" x="736" y="548" width="236" height="68" rx="8"/><text class="card-title" x="854" y="572" text-anchor="middle">Namespace guard</text><text class="card-text" x="854" y="594" text-anchor="middle">requireNotBlank</text>

<rect class="layer" x="1030" y="140" width="306" height="560" rx="12"/><text class="layer-title" x="1058" y="177">List metrics</text><text class="layer-sub" x="1058" y="195">observe published metric metadata</text>
<rect class="card-orange" x="1058" y="240" width="250" height="68" rx="8"/><text class="card-title" x="1183" y="264" text-anchor="middle">listMetrics</text><text class="card-text" x="1183" y="286" text-anchor="middle">namespace, name, dimensions</text>
<rect class="card-orange" x="1058" y="394" width="250" height="68" rx="8"/><text class="card-title" x="1183" y="418" text-anchor="middle">Metric filters</text><text class="card-text" x="1183" y="440" text-anchor="middle">optional request fields</text>
<rect class="card-pink" x="1058" y="548" width="250" height="68" rx="8"/>
