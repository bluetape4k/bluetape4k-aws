<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" role="img" aria-label="Ktor SQS example">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="1068" height="808" rx="14" class="frame"/>
<text class="title" x="54" y="72">Ktor SQS example</text>
<text class="subtitle" x="56" y="102">Ktor queue routes and SqsConsumer demonstrate send, poll, ack/nack, and telemetry hooks.</text>
<rect x="988" y="54" width="68" height="24" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="chip" x="1022" y="70" text-anchor="middle">Ktor</text>
<rect x="904" y="54" width="68" height="24" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="chip" x="938" y="70" text-anchor="middle">SQS</text>
<rect x="794.5" y="54" width="93.5" height="24" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="chip" x="841.25" y="70" text-anchor="middle">Telemetry</text>
<g><g><path class="edge" d="M312 219 L351 219 L351 208 L390 208" stroke="#66758A"/></g>
<g><path class="edge" d="M535 260 L535 426 L535 426 L535 592" stroke="#66758A"/><rect class="label-bg" x="495.2" y="412" width="79.60000000000001" height="22" rx="11"/>
<text class="edge-label" x="535" y="428" text-anchor="middle">publish</text></g>
<g><path class="edge" d="M535 592 L535 524 L535 524 L535 456" stroke="#66758A"/><rect class="label-bg" x="490.8" y="510" width="88.4" height="22" rx="11"/>
<text class="edge-label" x="535" y="526" text-anchor="middle">messages</text></g>
<g><path class="edge" d="M680 408 L719 408 L719 408 L758 408" stroke="#66758A"/></g>
<g><path class="edge" d="M903 360 L903 310 L903 310 L903 260" stroke="#66758A"/></g>
<g><path class="edge" d="M680 208 L719 208 L719 208 L758 208" stroke="#66758A"/><rect class="label-bg" x="679.2" y="194" width="79.60000000000001" height="22" rx="11"/>
<text class="edge-label" x="719" y="210" text-anchor="middle">inspect</text></g></g>
<g id="client">
  <rect class="card" x="72" y="176" width="240" height="86" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="192" y="216" text-anchor="middle">HTTP client / test</text>
  <text class="detail" x="192" y="240" text-anchor="middle">queue route calls</text>
</g>
<g id="routes">
  <rect class="card" x="390" y="156" width="290" height="104" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="535" y="196.5" text-anchor="middle">Ktor queue routes</text>
  <text class="detail" x="535" y="220.5" text-anchor="middle">send, create, delete</text>
<text class="detail" x="535" y="237.5" text-anchor="middle">attributes, inspect state</text>
</g>
<g id="plugin">
  <rect class="card" x="390" y="360" width="290" height="96" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="535" y="405" text-anchor="middle">SqsConsumer plugin</text>
  <text class="detail" x="535" y="429" text-anchor="middle">polling coroutines</text>
</g>
<g id="hooks">
  <rect class="card" x="758" y="360" width="290" height="96" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="903" y="396.5" text-anchor="middle">Advanced hooks</text>
  <text class="detail" x="903" y="420.5" text-anchor="middle">manual ack/nack</text>
<text class="detail" x="903" y="437.5" text-anchor="middle">interceptors, observers</text>
</g>
<g id="store">
  <rect class="card" x="758" y="156" width="290" height="104" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="card-title" x="903" y="196.5" text-anchor="middle">Inspection state</text>
  <text class="detail" x="903" y="220.5" text-anchor="middle">received bodies</text>
<text class="detail" x="903" y="237.5" text-anchor="middle">events and observations</text>
</g>
<g id="sqs">
  <rect class="card" x="390" y="592" width="290" height="78" rx="10" fill="#FFF0E3" stroke="#F47B36"/>
  <text class="card-title" x="535" y="628" text-anchor="middle">Floci-backed SQS</text>
  <text class="detail" x="535" y="652" text-anchor="middle">through SqsAsyncClient</text>
</g>
<rect class="footer" x="54" y="756" width="1012" height="54" rx="8"/>
<text class="footer-title" x="72" y="785">Example role</text>
<text class="footer-detail" x="72" y="805">Show deterministic retry-once redelivery plus interceptor and observer surfaces for production telemetry.</text>
</svg>