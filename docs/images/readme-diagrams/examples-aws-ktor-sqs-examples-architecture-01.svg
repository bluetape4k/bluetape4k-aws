<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-label="Ktor SQS example">
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter";font-size:34px;fill:#102033}
  .seqTitle{font-family:"Architects Daughter";font-size:44px;fill:#102033}
  .seqSubtitle{font-family:"Comic Mono";font-size:16px;fill:#526274}
  .seqParticipantTitle{font-family:"Architects Daughter";font-size:24px;fill:#102033}
  .seqParticipantDetail{font-family:"Comic Mono";font-size:13px;fill:#526274}
  .subtitle,.detail,.tiny,.label{font-family:"Comic Mono";fill:#526274}
  .subtitle{font-size:14px}
  .label{font-size:12px;fill:#344456}
  .card-title{font-family:"Architects Daughter";font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .tiny{font-size:10px}
  .chip{font-family:"Comic Mono";font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .seq{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .seqReturn{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7}
  .labelPill{fill:#FFFFFF;stroke:#D6E3EF;stroke-width:1.4}
  .numberBadge{font-family:"Comic Mono";font-size:12px;fill:#FFFFFF}
  .altBox{fill:#FFFFFF;fill-opacity:.44;stroke:#D6A441;stroke-width:1.8;stroke-dasharray:8 8}
  .activation{stroke-width:1.4}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter";font-size:16px;fill:#FFFFFF}
  .footer-detail{font-family:"Comic Mono";font-size:11px;fill:#DDE7F2}
  .seq-line{stroke:#CBD5E1;stroke-width:1.6;stroke-dasharray:6 8}
  .bar-label{font-family:"Architects Daughter";font-size:17px;fill:#102033}
</style>

<defs>
  <marker id="arrow-blue" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2F6DE0"/></marker>
  <marker id="arrow-green" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2F8B57"/></marker>
  <marker id="arrow-teal" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#168E86"/></marker>
  <marker id="arrow-amber" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B98518"/></marker>
  <marker id="arrow-rose" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C74E68"/></marker>
  <marker id="arrow-violet" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#7255C7"/></marker>
  <marker id="arrow-orange" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#EA580C"/></marker>
  <marker id="arrow-slate" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#475569"/></marker>
</defs>
<rect x="26" y="26" width="1388" height="588" rx="14" class="frame"/>
<text class="title" x="54" y="72">Ktor SQS example</text>
<text class="subtitle" x="56" y="104">Ktor SQS consumer/runtime demonstrates manual ack, retry-once redelivery, interceptors, and observer events.</text>
<g><rect x="956" y="58" width="118" height="24" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/><text class="chip" x="1015.0" y="70" text-anchor="middle" dominant-baseline="middle">example app</text></g>
<g><rect x="1090" y="58" width="118" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/><text class="chip" x="1149.0" y="70" text-anchor="middle" dominant-baseline="middle">library API</text></g>
<g><rect x="1224" y="58" width="118" height="24" rx="12" fill="#FFF7ED" stroke="#F97316"/><text class="chip" x="1283.0" y="70" text-anchor="middle" dominant-baseline="middle">local target</text></g>
<text class="chip" x="290" y="210" text-anchor="middle">trigger / route layer</text>
<text class="chip" x="730" y="136" text-anchor="middle">bluetape4k API used by this example</text>
<text class="chip" x="1150" y="210" text-anchor="middle">emulator or container target</text>
<text class="chip" x="730" y="398" text-anchor="middle">verification proves the README scenario</text>
<g id="routes">
<path class="edge" d="M 430.0 298.0 L 505.0 298.0 L 505.0 218.0 L 580.0 218.0" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
<path class="edge" d="M 880.0 218.0 L 935.0 218.0 L 935.0 298.0 L 1010.0 298.0" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
<path class="edge" d="M 580.0 478.0 L 290.0 478.0 L 290.0 346.0" stroke="#168E86" marker-end="url(#arrow-teal)"/>
<path class="edge" d="M 880.0 478.0 L 1150.0 478.0 L 1150.0 346.0" stroke="#168E86" marker-end="url(#arrow-teal)"/>
</g>
<g id="route">
  <rect class="card" x="150.0" y="250.0" width="280.0" height="96.0" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="290.0" y="286.0" text-anchor="middle" dominant-baseline="middle">Ktor runtime app</text>
  <text class="detail" x="290.0" y="310.0" text-anchor="middle" dominant-baseline="middle">consumer + publisher</text>
  <text class="detail" x="290.0" y="328.0" text-anchor="middle" dominant-baseline="middle">observer hooks</text>
</g>
<g id="module">
  <rect class="card" x="580.0" y="170.0" width="300.0" height="96.0" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="730.0" y="206.0" text-anchor="middle" dominant-baseline="middle">SqsConsumerRuntime</text>
  <text class="detail" x="730.0" y="230.0" text-anchor="middle" dominant-baseline="middle">manual ack/nack</text>
  <text class="detail" x="730.0" y="248.0" text-anchor="middle" dominant-baseline="middle">retry-once</text>
</g>
<g id="service">
  <rect class="card" x="1010.0" y="250.0" width="280.0" height="96.0" rx="10" fill="#FFF7ED" stroke="#F97316"/>
  <text class="card-title" x="1150.0" y="286.0" text-anchor="middle" dominant-baseline="middle">SQS queue</text>
  <text class="detail" x="1150.0" y="310.0" text-anchor="middle" dominant-baseline="middle">Floci emulator</text>
  <text class="detail" x="1150.0" y="328.0" text-anchor="middle" dominant-baseline="middle">redelivery check</text>
</g>
<g id="tests">
  <rect class="card" x="580.0" y="430.0" width="300.0" height="96.0" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="730.0" y="466.0" text-anchor="middle" dominant-baseline="middle">Consumer tests</text>
  <text class="detail" x="730.0" y="490.0" text-anchor="middle" dominant-baseline="middle">interceptors</text>
  <text class="detail" x="730.0" y="508.0" text-anchor="middle" dominant-baseline="middle">observer events</text>
</g>
<rect class="footer" x="54" y="558" width="1332" height="42" rx="8"/>
<text class="footer-title" x="74" y="583" dominant-baseline="middle">Reader cue</text>
<text class="footer-detail" x="194" y="583" dominant-baseline="middle">Examples are not published; they document runnable integration patterns.</text>
</svg>