<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">Advanced S3 Helper Architecture</title>
  <desc id="desc">Architecture of S3KtorClient advanced helpers for config objects, content-type detection, server-side encryption headers, presigned URLs, and client-side envelope encryption.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669"/></marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d97706"/></marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#f8fafc}
      .frame{fill:#ffffff;stroke:#8aa6cf;stroke-width:3;filter:url(#shadow)}
      .title{font-family:"Architects Daughter";font-size:48px;fill:#17233a}
      .subtitle{font-family:"Comic Mono";font-size:15px;fill:#475569}
      .layer{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;stroke-dasharray:9 8}
      .layerTitle{font-family:"Comic Mono";font-size:17px;font-weight:700;fill:#475569}
      .card{fill:#ffffff;stroke-width:2.3;filter:url(#shadow)}
      .cardTitle{font-family:"Architects Daughter";font-size:22px;fill:#17233a}
      .cardText{font-family:"Comic Mono";font-size:13px;fill:#475569}
      .wideTitle{font-family:"Architects Daughter";font-size:22px;fill:#17233a}
      .blue{stroke:#2563eb}
      .green{stroke:#059669}
      .orange{stroke:#d97706}
      .purple{stroke:#7c3aed}
      .slate{stroke:#64748b}
      .blueLine{stroke:#2563eb;stroke-width:4;marker-end:url(#blueArrow);fill:none}
      .greenLine{stroke:#059669;stroke-width:4;marker-end:url(#greenArrow);fill:none}
      .orangeLine{stroke:#d97706;stroke-width:4;marker-end:url(#orangeArrow);fill:none}
      .purpleLine{stroke:#7c3aed;stroke-width:4;marker-end:url(#purpleArrow);fill:none}
      .label{font-family:"Comic Mono";font-size:13px;fill:#334155}
      .footer{font-family:"Comic Mono";font-size:13px;fill:#475569}
    </style>
  </defs>

  <rect class="canvas" width="1500" height="920"/>
  <rect class="frame" x="38" y="34" width="1424" height="852" rx="26"/>
  <text class="title" x="750" y="92" text-anchor="middle">Advanced S3 Helper Architecture</text>
  <text class="subtitle" x="750" y="126" text-anchor="middle">S3KtorClient keeps advanced object workflows opt-in: helpers render request details, while apps own config parsing and key-provider policy.</text>

  <rect class="layer" x="80" y="168" width="1340" height="118" rx="18"/>
  <text class="layerTitle" x="106" y="204">KTOR-OWNED WORKFLOW</text>
  <rect class="card blue" x="125" y="218" width="255" height="52" rx="14"/>
  <text class="cardText" x="252" y="249" text-anchor="middle">Config bootstrap text</text>
  <rect class="card green" x="435" y="218" width="255" height="52" rx="14"/>
  <text class="cardText" x="562" y="249" text-anchor="middle">Payload upload or presign</text>
  <rect class="card orange" x="745" y="218" width="255" height="52" rx="14"/>
  <text class="cardText" x="872" y="249" text-anchor="middle">S3-managed encryption</text>
  <rect class="card purple" x="1055" y="218" width="300" height="52" rx="14"/>
  <text class="cardText" x="1205" y="249" text-anchor="middle">Process-local envelope encryption</text>

  <rect class="layer" x="80" y="330" width="1340" height="170" rx="18"/>
  <text class="layerTitle" x="106" y="366">HELPERS</text>
  <rect class="card blue" x="125" y="390" width="255" height="86" rx="14"/>
  <text class="cardTitle" x="252" y="420" text-anchor="middle">Config Object</text>
  <text class="cardText" x="252" y="446" text-anchor="middle">putConfigObject</text>
  <text class="cardText" x="252" y="466" text-anchor="middle">getConfigObject</text>
  <rect class="card green" x="435" y="390" width="255" height="86" rx="14"/>
  <text class="cardTitle" x="562" y="420" text-anchor="middle">Object Helpers</text>
  <text class="cardText" x="562" y="446" text-anchor="middle">content-type detector</text>
  <text class="cardText" x="562" y="466" text-anchor="middle">presigned GET/PUT</text>
  <rect class="card orange" x="745" y="390" width="255" height="86" rx="14"/>
  <text class="cardTitle" x="872" y="420" text-anchor="middle">SSE Headers</text>
  <text class="cardText" x="872" y="446" text-anchor="middle">SSE-S3, KMS, DSSE</text>
  <text class="cardText" x="872" y="466" text-anchor="middle">bucket key, SSE-C</text>
  <rect class="card purple" x="1055" y="390" width="300" height="86" rx="14"/>
  <text class="cardTitle" x="1205" y="420" text-anchor="middle">Client-Side Helper</text>
  <text class="cardText" x="1205" y="446" text-anchor="middle">AES-GCM ciphertext</text>
  <text class="cardText" x="1205" y="466" text-anchor="middle">metadata carries key + nonce</text>

  <rect class="layer" x="80" y="548" width="1340" height="164" rx="18"/>
  <text class="layerTitle" x="106" y="584">DECISIONS</text>
  <rect class="card blue" x="125" y="610" width="255" height="68" rx="14"/>
  <text class="cardText" x="252" y="636" text-anchor="middle">loads text only</text>
  <text class="cardText" x="252" y="656" text-anchor="middle">parser stays application-owned</text>
  <rect class="card green" x="435" y="610" width="255" height="68" rx="14"/>
  <text class="cardText" x="562" y="636" text-anchor="middle">fallback:</text>
  <text class="cardText" x="562" y="656" text-anchor="middle">application/octet-stream</text>
  <rect class="card orange" x="745" y="610" width="255" height="68" rx="14"/>
  <text class="cardText" x="872" y="636" text-anchor="middle">renders headers only</text>
  <text class="cardText" x="872" y="656" text-anchor="middle">no mandatory KMS client</text>
  <rect class="card purple" x="1055" y="610" width="300" height="68" rx="14"/>
  <text class="cardText" x="1205" y="636" text-anchor="middle">S3KtorDataKeyProvider</text>
  <text class="cardText" x="1205" y="656" text-anchor="middle">KMS wrapper or in-memory test key</text>

  <rect class="layer" x="80" y="748" width="1340" height="96" rx="18"/>
  <text class="layerTitle" x="106" y="782">RUNTIME TARGET</text>
  <rect class="card slate" x="330" y="786" width="840" height="42" rx="14"/>
  <text class="wideTitle" x="750" y="812" text-anchor="middle">S3 object store: bytes, content type, metadata, SSE request headers</text>

  <path class="blueLine" d="M 252 270 V 378"/>
  <path class="greenLine" d="M 562 270 V 378"/>
  <path class="orangeLine" d="M 872 270 V 378"/>
  <path class="purpleLine" d="M 1205 270 V 378"/>
  <path class="blueLine" d="M 252 476 V 598"/>
  <path class="greenLine" d="M 562 476 V 598"/>
  <path class="orangeLine" d="M 872 476 V 598"/>
  <path class="purpleLine" d="M 1205 476 V 598"/>
  <path class="blueLine" d="M 252 678 V 738 H 520 V 776"/>
  <path class="greenLine" d="M 562 678 V 776"/>
  <path class="orangeLine" d="M 872 678 V 776"/>
  <path class="purpleLine" d="M 1205 678 V 738 H 980 V 776"/>

  <text class="label" x="1018" y="728">provider boundary is outside S3KtorClient</text>
  <text class="footer" x="100" y="868">Reader contract: these helpers add S3 request structure; they do not parse app config, create mandatory AWS service clients, or persist plaintext data keys.</text>
</svg>
