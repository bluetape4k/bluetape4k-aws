<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="960" viewBox="0 0 1140 960" role="img" aria-label="Ktor S3 advanced helpers">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="1088" height="908" rx="14" class="frame"/>
<text class="title" x="54" y="72">Ktor S3 advanced helpers</text>
<text class="subtitle" x="56" y="102">Advanced S3 helpers add content detection, encryption metadata, SigV4 signing, and application-owned SDKs.</text>
<rect x="1008" y="54" width="68" height="24" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="chip" x="1042" y="70" text-anchor="middle">S3</text>
<rect x="924" y="54" width="68" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="chip" x="958" y="70" text-anchor="middle">SigV4</text>
<rect x="822" y="54" width="86" height="24" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="chip" x="865" y="70" text-anchor="middle">Envelope</text>
<g><g><path class="edge" d="M570 214 L570 240 L570 240 L570 266" stroke="#66758A"/></g>
<g><path class="edge" d="M570 348 L570 386 L206 386 L206 424" stroke="#66758A"/></g>
<g><path class="edge" d="M570 348 L570 386 L570 386 L570 424" stroke="#66758A"/></g>
<g><path class="edge" d="M570 348 L570 386 L934 386 L934 424" stroke="#66758A"/></g>
<g><path class="edge" d="M570 510 L570 550 L570 550 L570 590" stroke="#66758A"/></g>
<g><path class="edge" d="M934 510 L934 550 L570 550 L570 590" stroke="#66758A"/></g>
<g><path class="edge" d="M570 672 L570 694 L570 694 L570 716" stroke="#66758A"/></g></g>
<g id="app">
  <rect class="card" x="410" y="136" width="320" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="570" y="172" text-anchor="middle">Ktor application</text>
  <text class="detail" x="570" y="196" text-anchor="middle">object route handlers</text>
</g>
<g id="client">
  <rect class="card" x="410" y="266" width="320" height="82" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="570" y="304" text-anchor="middle">S3KtorClient</text>
  <text class="detail" x="570" y="328" text-anchor="middle">advanced helper</text>
</g>
<g id="detect">
  <rect class="card" x="76" y="424" width="260" height="86" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="206" y="464" text-anchor="middle">Content type detector</text>
  <text class="detail" x="206" y="488" text-anchor="middle">metadata inference</text>
</g>
<g id="headers">
  <rect class="card" x="410" y="424" width="320" height="86" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="card-title" x="570" y="464" text-anchor="middle">Encryption headers</text>
  <text class="detail" x="570" y="488" text-anchor="middle">server-side options</text>
</g>
<g id="envelope">
  <rect class="card" x="804" y="424" width="260" height="86" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="934" y="464" text-anchor="middle">Envelope encryption</text>
  <text class="detail" x="934" y="488" text-anchor="middle">client-side data key</text>
</g>
<g id="sigv4">
  <rect class="card" x="410" y="590" width="320" height="82" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="570" y="628" text-anchor="middle">AwsSigV4Plugin</text>
  <text class="detail" x="570" y="652" text-anchor="middle">signed REST requests</text>
</g>
<g id="s3">
  <rect class="card" x="410" y="716" width="320" height="78" rx="10" fill="#FFF0E3" stroke="#F47B36"/>
  <text class="card-title" x="570" y="752" text-anchor="middle">AWS S3 / Floci / LocalStack</text>
  <text class="detail" x="570" y="776" text-anchor="middle">compatible endpoint</text>
</g>
<rect class="footer" x="54" y="856" width="1032" height="54" rx="8"/>
<text class="footer-title" x="72" y="885">Advanced role</text>
<text class="footer-detail" x="72" y="905">Separate request routing from optional helper concerns so applications choose only the pieces they need.</text>
</svg>