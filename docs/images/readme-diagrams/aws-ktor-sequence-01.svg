<svg xmlns="http://www.w3.org/2000/svg" width="1532" height="1544" viewBox="0 0 1532 1544" role="img" aria-label="SQS Consumer And Publisher">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1532" height="1544"/>
<rect class="frame" x="32" y="28" width="1468" height="1488" rx="28"/>
<text class="title" x="66" y="82">SQS Consumer And Publisher</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="1.5" y="166" width="277" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Ktor Application</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1484" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="418.83333333333326" y="166" width="277" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="557.3333333333333" y="209" text-anchor="middle">SqsConsumer Plugin</text>
<line class="lifeline" x1="557.3333333333333" y1="252" x2="557.3333333333333" y2="1484" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="836.1666666666666" y="166" width="277" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="974.6666666666666" y="209" text-anchor="middle">SqsConsumerRuntime</text>
<line class="lifeline" x1="974.6666666666666" y1="252" x2="974.6666666666666" y2="1484" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1253.5" y="166" width="277" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1392" y="209" text-anchor="middle">Amazon SQS</text>
<line class="lifeline" x1="1392" y1="252" x2="1392" y2="1484" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="237.66666666666663" y="286" width="222" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="255.66666666666663" y="313" text-anchor="start">1. install(SqsConsumer)</text>
<path class="line" d="M140 344 L557.3333333333333 344"/>
<rect x="635" y="396" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="653" y="423" text-anchor="start">2. build runtime from config</text>
<path class="line" d="M557.3333333333333 454 L974.6666666666666 454"/>
<rect x="243.66666666666663" y="506" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="261.66666666666663" y="533" text-anchor="start">3. ApplicationStarted</text>
<path class="dashed" d="M140 564 L557.3333333333333 564"/>
<rect x="661" y="616" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="679" y="643" text-anchor="start">4. start()</text>
<path class="line" d="M557.3333333333333 674 L974.6666666666666 674"/>
<rect x="70" y="726" width="1392" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="753" text-anchor="start">LOOP: poller coroutines</text>
<rect x="1052.3333333333333" y="794" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1070.3333333333333" y="821" text-anchor="start">6. receiveMessage(long poll)</text>
<path class="line" d="M974.6666666666666 852 L1392 852"/>
<rect x="1078.3333333333333" y="904" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1096.3333333333333" y="931" text-anchor="start">7. messages</text>
<path class="dashed" d="M1392 962 L974.6666666666666 962"/>
<rect x="887.6666666666666" y="1014" width="270" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="905.6666666666666" y="1041" text-anchor="start">8. convert and invoke handler</text>
<path class="line" d="M974.6666666666666 1072 C1038.6666666666665 1072 1038.6666666666665 1106 974.6666666666666 1106"/>
<rect x="1056.3333333333333" y="1144" width="254" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1074.3333333333333" y="1171" text-anchor="start">9. deleteMessage on success</text>
<path class="line" d="M974.6666666666666 1202 L1392 1202"/>
<rect x="237.66666666666663" y="1254" width="222" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="255.66666666666663" y="1281" text-anchor="start">10. ApplicationStopping</text>
<path class="dashed" d="M140 1312 L557.3333333333333 1312"/>
<rect x="639" y="1364" width="254" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="657" y="1391" text-anchor="start">11. stop and drain handlers</text>
<path class="line" d="M557.3333333333333 1422 L974.6666666666666 1422"/>
</svg>
