<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1160" viewBox="0 0 980 1160" role="img" aria-label="Ktor SQS consumer lifecycle">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="928" height="1108" rx="14" class="frame"/>
<text class="title" x="54" y="72">Ktor SQS consumer lifecycle</text>
<text class="subtitle" x="56" y="102">SqsConsumer installs defaults, launches pollers, handles messages, and drains during shutdown.</text>
<rect x="837.5" y="54" width="78.5" height="24" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="chip" x="876.75" y="70" text-anchor="middle">Install</text>
<rect x="753.5" y="54" width="68" height="24" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="chip" x="787.5" y="70" text-anchor="middle">Poll</text>
<rect x="669.5" y="54" width="68" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="chip" x="703.5" y="70" text-anchor="middle">Ack</text>
<g><g><path class="edge" d="M490 214 L490 246 L490 246 L490 266" stroke="#66758A"/></g>
<g><path class="edge" d="M490 348 L490 380 L490 380 L490 400" stroke="#66758A"/></g>
<g><path class="edge" d="M490 482 L490 514 L490 514 L490 534" stroke="#66758A"/></g>
<g><path class="edge" d="M490 616 L490 648 L490 648 L490 668" stroke="#66758A"/></g>
<g><path class="edge" d="M490 750 L490 782 L490 782 L490 802" stroke="#66758A"/></g>
<g><path class="edge" d="M490 884 L490 916 L490 916 L490 936" stroke="#66758A"/></g></g>
<g id="install">
  <rect class="card" x="330" y="136" width="320" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="490" y="172" text-anchor="middle">Install SqsConsumer</text>
  <text class="detail" x="490" y="196" text-anchor="middle">Ktor app plugin</text>
</g>
<g id="defaults">
  <rect class="card" x="330" y="266" width="320" height="82" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="490" y="304" text-anchor="middle">Resolve AWS defaults</text>
  <text class="detail" x="490" y="328" text-anchor="middle">service-local SQS config</text>
</g>
<g id="runtime">
  <rect class="card" x="330" y="400" width="320" height="82" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="490" y="438" text-anchor="middle">Build runtime</text>
  <text class="detail" x="490" y="462" text-anchor="middle">client, converters, hooks</text>
</g>
<g id="pollers">
  <rect class="card" x="330" y="534" width="320" height="82" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="490" y="572" text-anchor="middle">Launch pollers</text>
  <text class="detail" x="490" y="596" text-anchor="middle">ApplicationStarted</text>
</g>
<g id="poll">
  <rect class="card" x="330" y="668" width="320" height="82" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="card-title" x="490" y="706" text-anchor="middle">Long poll SQS</text>
  <text class="detail" x="490" y="730" text-anchor="middle">ReceiveMessage</text>
</g>
<g id="handler">
  <rect class="card" x="330" y="802" width="320" height="82" rx="10" fill="#F4F7FA" stroke="#8CA0B3"/>
  <text class="card-title" x="490" y="840" text-anchor="middle">Invoke handler</text>
  <text class="detail" x="490" y="864" text-anchor="middle">interceptors, observer event</text>
</g>
<g id="ack">
  <rect class="card" x="330" y="936" width="320" height="82" rx="10" fill="#FFF0E3" stroke="#F47B36"/>
  <text class="card-title" x="490" y="974" text-anchor="middle">Ack / nack</text>
  <text class="detail" x="490" y="998" text-anchor="middle">delete or change visibility</text>
</g>
<rect class="footer" x="54" y="1056" width="872" height="54" rx="8"/>
<text class="footer-title" x="72" y="1075" dominant-baseline="middle">Lifecycle role</text>
<text class="footer-detail" x="72" y="1093" dominant-baseline="middle">Vertical steps keep listener startup, long polling, handler hooks, and shutdown behavior visible.</text>
</svg>