<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180" role="img" aria-labelledby="title desc">
  <title id="title">SQS Consumer And Publisher Sequence</title>
  <desc id="desc">Sequence diagram for the Ktor SqsConsumer plugin showing lifecycle start and stop, publishing, polling, handler invocation, ack or nack outcome, observer and interceptor hooks, and client ownership.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669"/></marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d97706"/></marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/></marker>
    <marker id="slateArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#f8fafc}
      .frame{fill:#ffffff;stroke:#8aa6cf;stroke-width:3;filter:url(#shadow)}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#17233a}
      .subtitle{font-family:"Comic Mono";font-size:15px;fill:#475569}
      .participant{fill:#ffffff;stroke-width:2.4;filter:url(#shadow)}
      .pTitle{font-family:"Architects Daughter";font-size:22px;fill:#17233a}
      .pText{font-family:"Comic Mono";font-size:12px;fill:#475569}
      .lifeline{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:8 8}
      .region{fill:#ffffff;fill-opacity:.58;stroke-width:2;stroke-dasharray:10 8}
      .regionTitle{font-family:"Comic Mono";font-size:14px;font-weight:700;fill:#475569}
      .msg{stroke-width:4;fill:none}
      .return{stroke-width:3;stroke-dasharray:9 7;fill:none}
      .blue{stroke:#2563eb}
      .green{stroke:#059669}
      .orange{stroke:#d97706}
      .purple{stroke:#7c3aed}
      .slate{stroke:#64748b}
      .blueLine{stroke:#2563eb;marker-end:url(#blueArrow)}
      .greenLine{stroke:#059669;marker-end:url(#greenArrow)}
      .orangeLine{stroke:#d97706;marker-end:url(#orangeArrow)}
      .purpleLine{stroke:#7c3aed;marker-end:url(#purpleArrow)}
      .slateLine{stroke:#64748b;marker-end:url(#slateArrow)}
      .label{font-family:"Comic Mono";font-size:13px;fill:#334155}
      .note{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.8}
      .noteText{font-family:"Comic Mono";font-size:12px;fill:#475569}
      .footer{font-family:"Comic Mono";font-size:13px;fill:#475569}
    </style>
  </defs>

  <rect class="canvas" width="1500" height="1180"/>
  <rect class="frame" x="38" y="34" width="1424" height="1108" rx="26"/>
  <text class="title" x="750" y="92" text-anchor="middle">SQS Consumer And Publisher Sequence</text>
  <text class="subtitle" x="750" y="126" text-anchor="middle">A single runtime starts pollers, exposes send, invokes handlers, and drains in-flight work before closing only plugin-owned clients.</text>

  <rect class="participant blue" x="80" y="166" width="180" height="74" rx="14"/>
  <text class="pTitle" x="170" y="195" text-anchor="middle">Ktor App</text>
  <text class="pText" x="170" y="220" text-anchor="middle">lifecycle + routes</text>
  <rect class="participant green" x="365" y="166" width="190" height="74" rx="14"/>
  <text class="pTitle" x="460" y="195" text-anchor="middle">SqsConsumer</text>
  <text class="pText" x="460" y="220" text-anchor="middle">runtime</text>
  <rect class="participant orange" x="655" y="166" width="190" height="74" rx="14"/>
  <text class="pTitle" x="750" y="195" text-anchor="middle">SqsAsyncClient</text>
  <text class="pText" x="750" y="220" text-anchor="middle">AWS SDK v2</text>
  <rect class="participant blue" x="950" y="166" width="180" height="74" rx="14"/>
  <text class="pTitle" x="1040" y="195" text-anchor="middle">SQS Queue</text>
  <text class="pText" x="1040" y="220" text-anchor="middle">messages</text>
  <rect class="participant purple" x="1240" y="166" width="180" height="74" rx="14"/>
  <text class="pTitle" x="1330" y="195" text-anchor="middle">Handler</text>
  <text class="pText" x="1330" y="220" text-anchor="middle">onMessage</text>

  <path class="lifeline" d="M 170 240 V 1060"/>
  <path class="lifeline" d="M 460 240 V 1060"/>
  <path class="lifeline" d="M 750 240 V 1060"/>
  <path class="lifeline" d="M 1040 240 V 1060"/>
  <path class="lifeline" d="M 1330 240 V 1060"/>

  <rect class="region blue" x="92" y="278" width="1320" height="112" rx="16"/>
  <text class="regionTitle" x="118" y="308">LIFECYCLE START</text>
  <path class="msg blueLine" d="M 170 350 H 460"/>
  <text class="label" x="230" y="334">ApplicationStarted</text>
  <rect class="note" x="530" y="318" width="420" height="44" rx="12"/>
  <text class="noteText" x="740" y="344" text-anchor="middle">start is idempotent; poller count = configured coroutines</text>

  <rect class="region green" x="92" y="430" width="1320" height="144" rx="16"/>
  <text class="regionTitle" x="118" y="460">PUBLISH PATH</text>
  <path class="msg greenLine" d="M 170 508 H 460"/>
  <text class="label" x="220" y="492">sqsConsumer().send(body)</text>
  <path class="msg orangeLine" d="M 460 548 H 750"/>
  <text class="label" x="535" y="532">sendMessage</text>
  <path class="msg orangeLine" d="M 750 588 H 1040"/>
  <text class="label" x="805" y="564">body + optional delay</text>

  <rect class="region orange" x="92" y="616" width="1320" height="228" rx="16"/>
  <text class="regionTitle" x="118" y="646">CONSUME LOOP</text>
  <path class="msg orangeLine" d="M 460 700 H 750"/>
  <text class="label" x="508" y="684">receiveMessage(maxMessages, waitTime)</text>
  <path class="msg orangeLine" d="M 750 742 H 1040"/>
  <text class="label" x="820" y="726">long poll</text>
  <path class="return slate" d="M 1040 784 H 460"/>
  <text class="label" x="690" y="772">messages</text>
  <path class="msg purpleLine" d="M 460 826 H 1330"/>
  <text class="label" x="660" y="810">convert payload, acquire permit, invoke handler</text>
  <rect class="note" x="1020" y="650" width="330" height="50" rx="12"/>
  <text class="noteText" x="1185" y="672" text-anchor="middle">interceptors wrap receive/invoke</text>
  <text class="noteText" x="1185" y="692" text-anchor="middle">observers emit lightweight events</text>

  <rect class="region purple" x="92" y="886" width="1320" height="136" rx="16"/>
  <text class="regionTitle" x="118" y="916">ACK / NACK OUTCOME</text>
  <path class="msg purpleLine" d="M 1330 962 H 460"/>
  <text class="label" x="640" y="946">ack(), deleteOnSuccess, or nack(timeout)</text>
  <path class="msg orangeLine" d="M 460 1002 H 750"/>
  <text class="label" x="520" y="986">deleteMessage or changeVisibility</text>
  <path class="msg orangeLine" d="M 750 1042 H 1040"/>
  <text class="label" x="808" y="1018">remove or make visible later</text>

  <rect class="region slate" x="92" y="1052" width="1320" height="76" rx="16"/>
  <text class="regionTitle" x="118" y="1082">SHUTDOWN</text>
  <path class="msg slateLine" d="M 170 1102 H 460"/>
  <text class="label" x="230" y="1088">ApplicationStopping</text>
  <rect class="note" x="540" y="1076" width="520" height="42" rx="12"/>
  <text class="noteText" x="800" y="1102" text-anchor="middle">cancel pollers, drain handlers, close owned client only</text>

  <text class="footer" x="92" y="1158">Reader contract: injected SqsAsyncClient remains application-owned; observers avoid queue URLs, message IDs, and receipt handles by default.</text>
</svg>
