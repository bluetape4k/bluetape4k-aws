<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">AWS Exposed Configuration Flow</title>
  <desc id="desc">Configuration flow from application properties through resolver, validation, authentication, Hikari datasource creation, Exposed database handle creation, and registry cleanup behavior.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12.5" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563eb" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="none"/>
    </marker>
    <marker id="soft-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-width="1.2" stroke-dasharray="none"/>
    </marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .canvas { fill: #f8fafc; }
      .title { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 52px; fill: #17233a; }
      .subtitle { font-family: "Comic Mono", monospace; font-size: 22px; fill: #475569; }
      .step-title { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 27px; fill: #17233a; }
      .step-text { font-family: "Comic Mono", monospace; font-size: 17px; fill: #475569; }
      .lane-title { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 31px; fill: #475569; }
      .lane-note { font-family: "Comic Mono", monospace; font-size: 17px; fill: #5a6c7a; }
      .tag { font-family: "Comic Mono", monospace; font-size: 17px; fill: #29465f; }
      .footer { font-family: "Comic Mono", monospace; font-size: 18px; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 3; }
      .lane-auth { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 3; }
      .lane-output { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 3; }
      .step { fill: #ffffff; stroke: #2563eb; stroke-width: 2.6; }
      .step-strong { fill: #ffffff; stroke: #059669; stroke-width: 2.8; }
      .branch { fill: #ffffff; stroke: #d97706; stroke-width: 2.8; }
      .danger { fill: #fffefa; stroke: #d97706; stroke-width: 2.6; stroke-dasharray: 10 8; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 5; marker-end: url(#arrow); }
      .soft { fill: none; stroke: #64748b; stroke-width: 3.2; stroke-dasharray: 8 7; marker-end: url(#soft-arrow); }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1060"/>
  <rect x="34" y="30" width="1532" height="996" rx="28" fill="#ffffff" stroke="#8aa6cf" stroke-width="3"/>

  <text class="title" x="80" y="102">AWS Exposed Configuration Flow</text>
  <text class="subtitle" x="82" y="140">A resolved database definition becomes a Hikari-backed Exposed handle; auth mode decides how the JDBC password is supplied.</text>

  <rect class="lane" x="82" y="188" width="1436" height="288" rx="22"/>
  <text class="lane-title" x="112" y="235">Configuration pipeline</text>
  <text class="lane-note" x="112" y="266">The foundation receives final settings and validates them before opening an Exposed boundary.</text>

  <g filter="url(#shadow)">
    <rect class="step" x="122" y="306" width="240" height="116" rx="16"/>
    <text class="step-title" x="148" y="343">1. Supply config</text>
    <text class="step-text" x="148" y="374">defaultDatabase</text>
    <text class="step-text" x="148" y="400">namedDatabases</text>

    <rect class="step" x="426" y="306" width="240" height="116" rx="16"/>
    <text class="step-title" x="452" y="343">2. Resolve</text>
    <text class="step-text" x="452" y="374">resolver hook</text>
    <text class="step-text" x="452" y="400">databaseName scoped</text>

    <rect class="step-strong" x="730" y="306" width="240" height="116" rx="16"/>
    <text class="step-title" x="756" y="343">3. Validate</text>
    <text class="step-text" x="756" y="374">url and driver class</text>
    <text class="step-text" x="756" y="400">auth mode invariants</text>

    <rect class="step" x="1034" y="306" width="240" height="116" rx="16"/>
    <text class="step-title" x="1060" y="343">4. Build data</text>
    <text class="step-text" x="1060" y="374">Hikari config</text>
    <text class="step-text" x="1060" y="400">JDBC properties</text>

    <rect class="step" x="1308" y="306" width="170" height="116" rx="16"/>
    <text class="step-title" x="1336" y="343">5. Connect</text>
    <text class="step-text" x="1336" y="374">Exposed</text>
    <text class="step-text" x="1336" y="400">Database</text>
  </g>

  <path class="flow" d="M 362 364 H 414"/>
  <path class="flow" d="M 666 364 H 718"/>
  <path class="flow" d="M 970 364 H 1022"/>
  <path class="flow" d="M 1274 364 H 1296"/>

  <path class="flow" d="M 850 422 V 530"/>

  <rect class="lane-auth" x="82" y="530" width="1436" height="302" rx="22"/>
  <text class="lane-title" x="112" y="577">Authentication branch</text>
  <text class="lane-note" x="112" y="608">`STATIC_PASSWORD` and `RDS_IAM` are mutually exclusive in `AwsDatabaseConnectionProperties`.</text>

  <g filter="url(#shadow)">
    <rect class="branch" x="156" y="652" width="420" height="118" rx="16"/>
    <text class="step-title" x="184" y="690">STATIC_PASSWORD</text>
    <text class="step-text" x="184" y="722">uses `AwsSecretString.reveal()` only</text>
    <text class="step-text" x="184" y="748">at the JDBC boundary</text>

    <rect class="branch" x="636" y="652" width="420" height="118" rx="16"/>
    <text class="step-title" x="664" y="690">RDS_IAM</text>
    <text class="step-text" x="664" y="722">requires region, real RDS hostname,</text>
    <text class="step-text" x="664" y="748">port, effective username, SDK RDS runtime</text>

    <rect class="branch" x="1116" y="652" width="320" height="118" rx="16"/>
    <text class="step-title" x="1144" y="690">Token cache</text>
    <text class="step-text" x="1144" y="722">refreshes before expiry</text>
    <text class="step-text" x="1144" y="748">wraps generator failures</text>
  </g>

  <path class="flow" d="M 836 610 C 732 648 512 612 380 640"/>
  <path class="flow" d="M 864 610 C 852 622 850 632 850 640"/>
  <path class="flow" d="M 1056 710 H 1104"/>

  <path class="flow" d="M 366 770 C 472 840 640 856 790 892"/>
  <path class="flow" d="M 1276 770 C 1164 840 1048 856 932 892"/>

  <rect class="lane-output" x="82" y="892" width="1436" height="86" rx="22"/>
  <text class="lane-title" x="112" y="944">Registry output</text>
  <text class="footer" x="420" y="930">`createRegistry()` builds the default handle first, then named handles.</text>
  <text class="footer" x="420" y="956">Any creation failure closes already-created handles in reverse order.</text>

  <path class="soft" d="M 850 422 C 1010 504 1220 508 1276 640"/>
  <rect class="danger" x="1092" y="488" width="386" height="82" rx="14"/>
  <text class="tag" x="1122" y="514">RDS IAM token generation</text>
  <text class="tag" x="1122" y="538">uses RdsUtilities; credentials</text>
  <text class="tag" x="1122" y="562">may come from the SDK chain.</text>
</svg>
