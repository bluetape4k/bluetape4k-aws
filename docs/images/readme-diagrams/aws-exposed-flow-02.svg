<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1020" viewBox="0 0 940 1020" role="img" aria-label="aws-exposed configuration flow">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="888" height="968" rx="14" class="frame"/>
<text class="title" x="54" y="72">aws-exposed configuration flow</text>
<text class="subtitle" x="56" y="102">Configuration moves from adapter-provided settings to validated pools and named Exposed handles.</text>
<rect x="797.5" y="54" width="78.5" height="24" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="chip" x="836.75" y="70" text-anchor="middle">Resolve</text>
<rect x="695.5" y="54" width="86" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="chip" x="738.5" y="70" text-anchor="middle">Validate</text>
<rect x="593.5" y="54" width="86" height="24" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="chip" x="636.5" y="70" text-anchor="middle">Register</text>
<g><g><path class="edge" d="M470 218 L470 242 L470 242 L470 266" stroke="#66758A"/></g>
<g><path class="edge" d="M470 348 L470 372 L470 372 L470 396" stroke="#66758A"/></g>
<g><path class="edge" d="M470 478 L470 502 L470 502 L470 526" stroke="#66758A"/></g>
<g><path class="edge" d="M470 608 L470 632 L470 632 L470 656" stroke="#66758A"/></g>
<g><path class="edge" d="M470 738 L470 762 L470 762 L470 786" stroke="#66758A"/></g></g>
<g id="source">
  <rect class="card" x="300" y="136" width="340" height="82" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="470" y="165.5" text-anchor="middle">Configured source</text>
  <text class="detail" x="470" y="189.5" text-anchor="middle">static, Secrets Manager</text>
<text class="detail" x="470" y="206.5" text-anchor="middle">Parameter Store, or adapter</text>
</g>
<g id="props">
  <rect class="card" x="300" y="266" width="340" height="82" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="470" y="304" text-anchor="middle">AwsDatabaseConnectionProperties</text>
  <text class="detail" x="470" y="328" text-anchor="middle">URL, driver, username, pool</text>
</g>
<g id="secret">
  <rect class="card" x="300" y="396" width="340" height="82" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="470" y="434" text-anchor="middle">AwsSecretString</text>
  <text class="detail" x="470" y="458" text-anchor="middle">redacted diagnostics</text>
</g>
<g id="auth">
  <rect class="card" x="300" y="526" width="340" height="82" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="card-title" x="470" y="564" text-anchor="middle">Authentication mode</text>
  <text class="detail" x="470" y="588" text-anchor="middle">static password or RDS IAM</text>
</g>
<g id="hikari">
  <rect class="card" x="300" y="656" width="340" height="82" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="470" y="694" text-anchor="middle">HikariDataSource</text>
  <text class="detail" x="470" y="718" text-anchor="middle">physical JDBC pool</text>
</g>
<g id="handle">
  <rect class="card" x="300" y="786" width="340" height="82" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="470" y="824" text-anchor="middle">Exposed Database handle</text>
  <text class="detail" x="470" y="848" text-anchor="middle">registered by name</text>
</g>
<rect class="footer" x="54" y="916" width="832" height="54" rx="8"/>
<text class="footer-title" x="72" y="945">Flow role</text>
<text class="footer-detail" x="72" y="965">A vertical flow makes static password, RDS IAM, Hikari, and registry handoff easy to scan.</text>
</svg>