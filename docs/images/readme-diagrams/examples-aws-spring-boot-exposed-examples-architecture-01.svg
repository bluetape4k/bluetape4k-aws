<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" role="img" aria-label="Spring Boot Exposed example">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="1068" height="808" rx="14" class="frame"/>
<text class="title" x="54" y="72">Spring Boot Exposed example</text>
<text class="subtitle" x="56" y="102">MVC endpoints separate HTTP, service transactions, Exposed queries, and auto-configured JDBC resources.</text>
<rect x="985" y="54" width="71" height="24" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="chip" x="1020.5" y="70" text-anchor="middle">Boot 4</text>
<rect x="890.5" y="54" width="78.5" height="24" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="chip" x="929.75" y="70" text-anchor="middle">Exposed</text>
<rect x="773.5" y="54" width="101" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="chip" x="824" y="70" text-anchor="middle">PostgreSQL</text>
<g><g><path class="edge" d="M312 219 L344 219 L344 204 L390 204" stroke="#66758A"/></g>
<g><path class="edge" d="M535 252 L535 284 L535 284 L535 360" stroke="#66758A"/></g>
<g><path class="edge" d="M680 408 L712 408 L712 408 L758 408" stroke="#66758A"/></g>
<g><path class="edge" d="M903 252 L903 284 L535 284 L535 360" stroke="#66758A"/><rect class="label-bg" x="674.8" y="292" width="88.4" height="22" rx="11"/>
<text class="edge-label" x="719" y="308" text-anchor="middle">Database</text></g>
<g><path class="edge" d="M903 456 L903 488 L698 488 L698 592" stroke="#66758A"/></g>
<g><path class="edge" d="M903 252 L903 284 L698 284 L698 592" stroke="#66758A" stroke-dasharray="8 8"/><rect class="label-bg" x="774.4" y="408" width="53.2" height="22" rx="11"/>
<text class="edge-label" x="801" y="424" text-anchor="middle">pool</text></g></g>
<g id="client">
  <rect class="card" x="72" y="176" width="240" height="86" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="192" y="216" text-anchor="middle">HTTP client / test</text>
  <text class="detail" x="192" y="240" text-anchor="middle">order route calls</text>
</g>
<g id="controller">
  <rect class="card" x="390" y="156" width="290" height="96" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="535" y="201" text-anchor="middle">OrderController</text>
  <text class="detail" x="535" y="225" text-anchor="middle">MVC endpoints</text>
</g>
<g id="service">
  <rect class="card" x="390" y="360" width="290" height="96" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="535" y="405" text-anchor="middle">OrderService</text>
  <text class="detail" x="535" y="429" text-anchor="middle">owns Exposed transaction</text>
</g>
<g id="repo">
  <rect class="card" x="758" y="360" width="290" height="96" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="903" y="405" text-anchor="middle">OrderRepository</text>
  <text class="detail" x="903" y="429" text-anchor="middle">active transaction required</text>
</g>
<g id="auto">
  <rect class="card" x="758" y="156" width="290" height="96" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="card-title" x="903" y="201" text-anchor="middle">AwsExposedAutoConfiguration</text>
  <text class="detail" x="903" y="225" text-anchor="middle">DataSource, Database, Registry</text>
</g>
<g id="pg">
  <rect class="card" x="548" y="592" width="300" height="78" rx="10" fill="#FFF0E3" stroke="#F47B36"/>
  <text class="card-title" x="698" y="628" text-anchor="middle">PostgreSQL database</text>
  <text class="detail" x="698" y="652" text-anchor="middle">Testcontainers or production</text>
</g>
<rect class="footer" x="54" y="756" width="1012" height="54" rx="8"/>
<text class="footer-title" x="72" y="775" dominant-baseline="middle">Example role</text>
<text class="footer-detail" x="72" y="793" dominant-baseline="middle">Keep controller, service transaction ownership, repository, and database lifecycle boundaries visible.</text>
</svg>