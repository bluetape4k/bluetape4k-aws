<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-label="Bluetape4k AWS repository overview">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#d97706"/>
    </marker>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#f8fafc}
      .frame{fill:#ffffff;stroke:#8aa6cf;stroke-width:3;filter:url(#softShadow)}
      .title{font-family:"Architects Daughter";font-size:48px;fill:#17233a}
      .subtitle{font-family:"Comic Mono";font-size:17px;fill:#475569}
      .bandTitle{font-family:"Architects Daughter";font-size:27px;fill:#1e2f4d}
      .bandNote{font-family:"Comic Mono";font-size:14px;fill:#64748b}
      .band{stroke-width:2.4}
      .card{fill:#ffffff;stroke-width:2.2;filter:url(#softShadow)}
      .cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#17233a}
      .cardBody{font-family:"Comic Mono";font-size:13px;fill:#475569}
      .chip{fill:#ffffff;stroke-width:2}
      .chipText{font-family:"Comic Mono";font-size:13px;fill:#334155}
      .route{fill:none;stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round}
      .routeText{font-family:"Comic Mono";font-size:13px;fill:#334155}
      .footer{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
      .footerText{font-family:"Comic Mono";font-size:15px;fill:#475569}
    </style>
  </defs>

  <rect class="canvas" width="1500" height="1000"/>
  <rect class="frame" x="48" y="38" width="1404" height="924" rx="24"/>

  <text class="title" x="750" y="104" text-anchor="middle">Bluetape4k AWS Repository Overview</text>
  <text class="subtitle" x="750" y="142" text-anchor="middle">One Kotlin service can choose Java SDK coroutine adapters, native Kotlin suspend clients, framework integration, and emulator-proven examples.</text>

  <g id="application-band">
    <rect class="band" x="92" y="184" width="1316" height="126" rx="22" fill="#eff6ff" stroke="#93b4e6"/>
    <text class="bandTitle" x="132" y="224">Application adoption entry</text>
    <text class="bandNote" x="132" y="256">Apps add the AWS service artifacts they use; library modules keep service SDKs compileOnly.</text>
    <g>
      <rect class="chip" x="1002" y="214" width="154" height="48" rx="14" stroke="#60a5fa"/>
      <text class="chipText" x="1079" y="243" text-anchor="middle">Kotlin/JVM</text>
      <rect class="chip" x="1174" y="214" width="162" height="48" rx="14" stroke="#60a5fa"/>
      <text class="chipText" x="1255" y="243" text-anchor="middle">AWS services</text>
    </g>
  </g>

  <g id="sdk-band">
    <rect class="band" x="92" y="356" width="1316" height="204" rx="22" fill="#ecfdf5" stroke="#8ed1bb"/>
    <text class="bandTitle" x="132" y="398">SDK wrapper choice</text>
    <text class="bandNote" x="132" y="430">Choose one core client surface first; both keep AWS service coverage close to the SDK families they wrap.</text>

    <g id="java-card">
      <rect class="card" x="174" y="464" width="330" height="72" rx="16" stroke="#2563eb"/>
      <text class="cardTitle" x="339" y="492" text-anchor="middle">bluetape4k-aws-java</text>
      <text class="cardBody" x="339" y="520" text-anchor="middle">sync, CompletableFuture, coroutine await</text>
    </g>
    <g id="kotlin-card">
      <rect class="card" x="584" y="464" width="330" height="72" rx="16" stroke="#059669"/>
      <text class="cardTitle" x="749" y="492" text-anchor="middle">bluetape4k-aws-kotlin</text>
      <text class="cardBody" x="749" y="520" text-anchor="middle">native suspend APIs and DSL builders</text>
    </g>
    <g id="coverage-card">
      <rect class="card" x="994" y="464" width="330" height="72" rx="16" stroke="#0891b2"/>
      <text class="cardTitle" x="1159" y="492" text-anchor="middle">service coverage</text>
      <text class="cardBody" x="1159" y="520" text-anchor="middle">DynamoDB, S3, SQS, SNS, KMS, CW</text>
    </g>
  </g>

  <g id="integration-band">
    <rect class="band" x="92" y="608" width="1316" height="176" rx="22" fill="#fff7ed" stroke="#e8c47b"/>
    <text class="bandTitle" x="132" y="650">Framework and data integration</text>
    <text class="bandNote" x="132" y="682">Add only the integration surface the application needs: database config, Spring Boot operations, or Ktor runtime plugins.</text>

    <g id="exposed-card">
      <rect class="card" x="184" y="712" width="324" height="54" rx="14" stroke="#d97706"/>
      <text class="cardTitle" x="346" y="744" text-anchor="middle">AWS Exposed</text>
    </g>
    <g id="spring-card">
      <rect class="card" x="588" y="712" width="324" height="54" rx="14" stroke="#dc2626"/>
      <text class="cardTitle" x="750" y="744" text-anchor="middle">Spring Boot 4</text>
    </g>
    <g id="ktor-card">
      <rect class="card" x="992" y="712" width="324" height="54" rx="14" stroke="#7c3aed"/>
      <text class="cardTitle" x="1154" y="744" text-anchor="middle">Ktor 3</text>
    </g>
  </g>

  <g id="verification-band">
    <rect class="band" x="92" y="824" width="1316" height="82" rx="22" fill="#f5f3ff" stroke="#b59ce8"/>
    <text class="bandTitle" x="132" y="858">Runnable examples and local verification</text>
    <text class="bandNote" x="132" y="884">Ktor and Spring Boot examples prove S3, SQS/SNS, DynamoDB, Exposed, AOT, and Floci-first emulator flows before adoption.</text>
  </g>

  <path class="route" d="M 502 310 L 502 354" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
  <path class="route" d="M 998 310 L 998 354" stroke="#059669" marker-end="url(#arrowGreen)"/>
  <text class="routeText" x="750" y="338" text-anchor="middle">pick SDK surface</text>

  <path class="route" d="M 339 536 L 339 608" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
  <path class="route" d="M 749 536 L 749 608" stroke="#059669" marker-end="url(#arrowGreen)"/>
  <path class="route" d="M 1159 536 L 1159 608" stroke="#0891b2" marker-end="url(#arrowGreen)"/>
  <text class="routeText" x="750" y="586" text-anchor="middle">wire framework or data layer</text>

  <path class="route" d="M 346 766 L 346 824" stroke="#d97706" marker-end="url(#arrowAmber)"/>
  <path class="route" d="M 750 766 L 750 824" stroke="#d97706" marker-end="url(#arrowAmber)"/>
  <path class="route" d="M 1154 766 L 1154 824" stroke="#7c3aed" marker-end="url(#arrowAmber)"/>

  <rect class="footer" x="118" y="914" width="1264" height="38" rx="16"/>
  <text class="footerText" x="750" y="938" text-anchor="middle">Start with a core SDK lane, add Exposed/Spring/Ktor only when needed, and validate with emulator-backed examples.</text>
</svg>
