<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1060" viewBox="0 0 980 1060" role="img" aria-label="Ktor S3 advanced sequence">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="928" height="1008" rx="14" class="frame"/>
<text class="title" x="54" y="72">Ktor S3 advanced sequence</text>
<text class="subtitle" x="56" y="102">Put/get helpers sign requests and optionally encrypt or decrypt payloads before reaching S3.</text>
<rect x="837.5" y="54" width="78.5" height="24" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="chip" x="876.75" y="70" text-anchor="middle">Put/Get</text>
<rect x="743" y="54" width="78.5" height="24" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="chip" x="782.25" y="70" text-anchor="middle">Encrypt</text>
<rect x="659" y="54" width="68" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="chip" x="693" y="70" text-anchor="middle">Sign</text>
<g><g><path class="edge" d="M490 218 L490 250 L490 250 L490 270" stroke="#66758A"/></g>
<g><path class="edge" d="M490 352 L490 384 L490 384 L490 404" stroke="#66758A"/><rect class="label-bg" x="445.8" y="364" width="88.4" height="22" rx="11"/>
<text class="edge-label" x="490" y="380" text-anchor="middle">optional</text></g>
<g><path class="edge" d="M490 486 L490 518 L490 518 L490 538" stroke="#66758A"/></g>
<g><path class="edge" d="M490 620 L490 652 L490 652 L490 672" stroke="#66758A"/></g>
<g><path class="edge" d="M490 754 L490 786 L490 786 L490 806" stroke="#66758A"/></g></g>
<g id="app">
  <rect class="card" x="330" y="140" width="320" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="490" y="176" text-anchor="middle">Ktor app</text>
  <text class="detail" x="490" y="200" text-anchor="middle">put/get config object</text>
</g>
<g id="client">
  <rect class="card" x="330" y="270" width="320" height="82" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="490" y="308" text-anchor="middle">S3KtorClient</text>
  <text class="detail" x="490" y="332" text-anchor="middle">advanced helper</text>
</g>
<g id="crypto">
  <rect class="card" x="330" y="404" width="320" height="82" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="490" y="442" text-anchor="middle">Envelope encryptor</text>
  <text class="detail" x="490" y="466" text-anchor="middle">optional encrypt/decrypt</text>
</g>
<g id="key">
  <rect class="card" x="330" y="538" width="320" height="82" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="card-title" x="490" y="576" text-anchor="middle">Data key provider</text>
  <text class="detail" x="490" y="600" text-anchor="middle">generate or decrypt data key</text>
</g>
<g id="sign">
  <rect class="card" x="330" y="672" width="320" height="82" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="490" y="710" text-anchor="middle">AwsSigV4Plugin</text>
  <text class="detail" x="490" y="734" text-anchor="middle">sign REST request</text>
</g>
<g id="bucket">
  <rect class="card" x="330" y="806" width="320" height="82" rx="10" fill="#FFF0E3" stroke="#F47B36"/>
  <text class="card-title" x="490" y="844" text-anchor="middle">S3 bucket</text>
  <text class="detail" x="490" y="868" text-anchor="middle">PutObject or GetObject</text>
</g>
<rect class="footer" x="54" y="956" width="872" height="54" rx="8"/>
<text class="footer-title" x="72" y="975" dominant-baseline="middle">Sequence role</text>
<text class="footer-detail" x="72" y="993" dominant-baseline="middle">A vertical sequence keeps optional encryption and signing paths readable at README width.</text>
</svg>