<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img" aria-labelledby="title desc">
  <title id="title">Advanced S3 Secure Config Bootstrap Sequence</title>
  <desc id="desc">Sequence diagram for storing and loading S3 config text, parsing it in the application layer, uploading payloads with content type detection, and choosing server-side or client-side encryption.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669"/></marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d97706"/></marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/></marker>
    <marker id="slateArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#f8fafc}
      .frame{fill:#ffffff;stroke:#8aa6cf;stroke-width:3;filter:url(#shadow)}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#17233a}
      .subtitle{font-family:"Comic Mono";font-size:15px;fill:#475569}
      .participant{fill:#ffffff;stroke-width:2.4;filter:url(#shadow)}
      .pTitle{font-family:"Architects Daughter";font-size:21px;fill:#17233a}
      .pText{font-family:"Comic Mono";font-size:12px;fill:#475569}
      .lifeline{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:8 8}
      .region{fill:#ffffff;fill-opacity:.58;stroke-width:2;stroke-dasharray:10 8}
      .regionTitle{font-family:"Comic Mono";font-size:14px;font-weight:700;fill:#475569}
      .msg{stroke-width:4;fill:none}
      .return{stroke-width:3;stroke-dasharray:9 7;fill:none}
      .blue{stroke:#2563eb}
      .green{stroke:#059669}
      .orange{stroke:#d97706}
      .purple{stroke:#7c3aed}
      .slate{stroke:#64748b}
      .blueLine{stroke:#2563eb;marker-end:url(#blueArrow)}
      .greenLine{stroke:#059669;marker-end:url(#greenArrow)}
      .orangeLine{stroke:#d97706;marker-end:url(#orangeArrow)}
      .purpleLine{stroke:#7c3aed;marker-end:url(#purpleArrow)}
      .slateLine{stroke:#64748b;marker-end:url(#slateArrow)}
      .label{font-family:"Comic Mono";font-size:13px;fill:#334155}
      .note{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.8}
      .noteText{font-family:"Comic Mono";font-size:12px;fill:#475569}
      .footer{font-family:"Comic Mono";font-size:13px;fill:#475569}
    </style>
  </defs>

  <rect class="canvas" width="1500" height="1250"/>
  <rect class="frame" x="38" y="34" width="1424" height="1182" rx="26"/>
  <text class="title" x="750" y="92" text-anchor="middle">Secure Config Bootstrap Sequence</text>
  <text class="subtitle" x="750" y="126" text-anchor="middle">Text config stays application-owned, S3 receives request metadata, and client-side data keys never leave the provider boundary in plaintext.</text>

  <g id="participants">
    <rect class="participant blue" x="70" y="166" width="170" height="74" rx="14"/>
    <text class="pTitle" x="155" y="195" text-anchor="middle">Ktor Service</text>
    <text class="pText" x="155" y="220" text-anchor="middle">routes + startup</text>
    <rect class="participant slate" x="300" y="166" width="170" height="74" rx="14"/>
    <text class="pTitle" x="385" y="195" text-anchor="middle">Config Parser</text>
    <text class="pText" x="385" y="220" text-anchor="middle">application-owned</text>
    <rect class="participant green" x="530" y="166" width="170" height="74" rx="14"/>
    <text class="pTitle" x="615" y="195" text-anchor="middle">S3KtorClient</text>
    <text class="pText" x="615" y="220" text-anchor="middle">S3 REST helper</text>
    <rect class="participant purple" x="760" y="166" width="190" height="74" rx="14"/>
    <text class="pTitle" x="855" y="195" text-anchor="middle">CSE Helper</text>
    <text class="pText" x="855" y="220" text-anchor="middle">AES-GCM envelope</text>
    <rect class="participant orange" x="1010" y="166" width="190" height="74" rx="14"/>
    <text class="pTitle" x="1105" y="195" text-anchor="middle">DataKeyProvider</text>
    <text class="pText" x="1105" y="220" text-anchor="middle">KMS or test key</text>
    <rect class="participant blue" x="1260" y="166" width="170" height="74" rx="14"/>
    <text class="pTitle" x="1345" y="195" text-anchor="middle">S3</text>
    <text class="pText" x="1345" y="220" text-anchor="middle">object store</text>
  </g>

  <path class="lifeline" d="M 155 240 V 1130"/>
  <path class="lifeline" d="M 385 240 V 1130"/>
  <path class="lifeline" d="M 615 240 V 1130"/>
  <path class="lifeline" d="M 855 240 V 1130"/>
  <path class="lifeline" d="M 1105 240 V 1130"/>
  <path class="lifeline" d="M 1345 240 V 1130"/>

  <rect class="region blue" x="82" y="276" width="1288" height="204" rx="16"/>
  <text class="regionTitle" x="108" y="306">CONFIG BOOTSTRAP</text>
  <path class="msg blueLine" d="M 155 342 H 615"/>
  <text class="label" x="262" y="328">putConfigObject(text, metadata)</text>
  <path class="msg blueLine" d="M 615 382 H 1345"/>
  <text class="label" x="820" y="368">PUT config object</text>
  <path class="return slate" d="M 1345 422 H 615"/>
  <text class="label" x="902" y="410">ETag</text>
  <path class="msg blueLine" d="M 155 462 H 615"/>
  <text class="label" x="280" y="448">getConfigObject()</text>
  <path class="msg greenLine" d="M 615 502 H 1345"/>
  <text class="label" x="828" y="488">GET config bytes</text>
  <path class="return slate" d="M 615 542 H 155"/>
  <text class="label" x="250" y="530">S3KtorConfigObject(text only)</text>
  <path class="msg slateLine" d="M 155 582 H 385"/>
  <text class="label" x="190" y="568">parse in app layer</text>

  <rect class="region green" x="82" y="620" width="1288" height="126" rx="16"/>
  <text class="regionTitle" x="108" y="650">NORMAL PAYLOAD</text>
  <path class="msg greenLine" d="M 155 686 H 615"/>
  <text class="label" x="202" y="672">putObjectDetectingContentType(key, bytes)</text>
  <rect class="note" x="705" y="648" width="240" height="58" rx="12"/>
  <text class="noteText" x="825" y="672" text-anchor="middle">detect by key/payload</text>
  <text class="noteText" x="825" y="692" text-anchor="middle">fallback to octet-stream</text>
  <path class="msg greenLine" d="M 615 728 H 1345"/>
  <text class="label" x="776" y="716">PUT bytes + content type</text>

  <rect class="region orange" x="82" y="776" width="1288" height="130" rx="16"/>
  <text class="regionTitle" x="108" y="806">SERVER-SIDE ENCRYPTION</text>
  <path class="msg orangeLine" d="M 155 848 H 615"/>
  <text class="label" x="210" y="834">putEncryptedObject(SSE mode)</text>
  <path class="msg orangeLine" d="M 615 888 H 1345"/>
  <text class="label" x="760" y="876">PUT bytes + SSE request headers</text>

  <rect class="region purple" x="82" y="940" width="1288" height="220" rx="16"/>
  <text class="regionTitle" x="108" y="970">CLIENT-SIDE ENVELOPE ENCRYPTION</text>
  <path class="msg purpleLine" d="M 155 1010 H 855"/>
  <text class="label" x="340" y="996">putEncryptedObject(plaintext)</text>
  <path class="msg orangeLine" d="M 855 1050 H 1105"/>
  <text class="label" x="885" y="1028">generateDataKey(context)</text>
  <path class="return slate" d="M 1105 1090 H 855"/>
  <text class="label" x="890" y="1070">plaintext key + encrypted key</text>
  <path class="msg purpleLine" d="M 855 1130 H 615"/>
  <text class="label" x="660" y="1110">putObject(ciphertext + metadata)</text>
  <path class="msg purpleLine" d="M 615 1170 H 1345"/>
  <text class="label" x="760" y="1146">PUT ciphertext, encrypted key, nonce</text>

  <text class="footer" x="92" y="1200">Reader contract: SSE helpers render headers only; client-side encryption encrypts before upload and stores only encrypted key material plus nonce in S3 metadata.</text>
</svg>
