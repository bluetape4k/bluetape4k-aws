<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">EventBridge Spring Boot And Ktor Class Map</title>
  <desc id="desc">Class diagram showing EventBridge Spring Boot and Ktor integration surfaces, shared core adapters, and the AWS SDK EventBridge async client.</desc>
  <defs>
    <style>
      .canvas { fill: #f8fafc; }
      .title { font: 700 34px "Architects Daughter", "Comic Sans MS", cursive; fill: #111827; }
      .subtitle { font: 17px "Comic Mono", "SFMono-Regular", monospace; fill: #475569; }
      .layer { fill: #eef6ff; stroke: #9cc7ee; stroke-width: 2; rx: 20; }
      .layer.ktor { fill: #f1f7ec; stroke: #9ccf9a; }
      .layer.shared { fill: #fff8e8; stroke: #e6bf63; }
      .layer-title { font: 700 19px "Comic Mono", "SFMono-Regular", monospace; fill: #1f2937; }
      .card { fill: #ffffff; stroke: #64748b; stroke-width: 1.6; rx: 10; }
      .interface-card { fill: #f0f9ff; stroke: #2f80bd; }
      .impl-card { fill: #f8fafc; stroke: #475569; }
      .config-card { fill: #fff7ed; stroke: #c47f23; }
      .runtime-card { fill: #f3f8ee; stroke: #5e9a56; }
      .shared-card { fill: #fffbeb; stroke: #b5851b; }
      .aws-card { fill: #fff3e6; stroke: #d97706; }
      .legend-box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; rx: 10; }
      .card-title { font: 700 15px "Comic Mono", "SFMono-Regular", monospace; fill: #111827; text-anchor: middle; }
      .stereo { font: 12px "Comic Mono", "SFMono-Regular", monospace; fill: #2563a6; text-anchor: middle; }
      .method { font: 12px "Comic Mono", "SFMono-Regular", monospace; fill: #334155; }
      .note { font: 12px "Comic Mono", "SFMono-Regular", monospace; fill: #475569; }
      .divider { stroke: #cbd5e1; stroke-width: 1; }
      .connector { fill: none; stroke: #334155; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .connector.dashed { stroke-dasharray: 7 6; }
      .connector.blue { stroke: #2f80bd; }
      .connector.green { stroke: #4f8b47; }
      .connector.amber { stroke: #b87912; }
      .connector.gray { stroke: #475569; }
      .arrow-open { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: none; style: stroke-dasharray:none; }
      .triangle { fill: #f8fafc; stroke-width: 2.2; stroke-linejoin: round; stroke-dasharray: none; style: stroke-dasharray:none; }
      .legend { font: 12px "Comic Mono", "SFMono-Regular", monospace; fill: #475569; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1500" height="980"/>
  <text class="title" x="750" y="48" text-anchor="middle">EventBridge Framework Integration Class Map</text>
  <text class="subtitle" x="750" y="80" text-anchor="middle">Spring Boot auto-configuration and Ktor plugin surfaces share the focused EventBridge core adapters.</text>

  <rect class="layer" x="60" y="115" width="650" height="565"/>
  <text class="layer-title" x="95" y="150">Spring Boot 4 integration</text>
  <rect class="layer ktor" x="790" y="115" width="650" height="565"/>
  <text class="layer-title" x="825" y="150">Ktor 3 integration</text>
  <rect class="layer shared" x="410" y="725" width="680" height="210"/>
  <text class="layer-title" x="750" y="962" text-anchor="middle">Shared EventBridge core and AWS SDK</text>

  <!-- Spring cards: generous 120px+ column gap. -->
  <g id="spring-props">
    <rect id="card-spring-props" class="card config-card" x="105" y="190" width="240" height="132"/>
    <text class="card-title" x="225" y="220">EventBridgeProperties</text>
    <line class="divider" x1="105" y1="238" x2="345" y2="238"/>
    <text class="method" x="124" y="262">+ enabled</text>
    <text class="method" x="124" y="282">+ region / endpoint</text>
    <text class="method" x="124" y="302">+ defaultEventBusName</text>
  </g>

  <g id="spring-ops">
    <rect id="card-spring-ops" class="card interface-card" x="470" y="190" width="220" height="132"/>
    <text class="stereo" x="580" y="214">&lt;&lt;interface&gt;&gt;</text>
    <text class="card-title" x="580" y="238">EventBridge</text>
    <text class="card-title" x="580" y="258">Operations</text>
    <line class="divider" x1="470" y1="274" x2="690" y2="274"/>
    <text class="method" x="489" y="298">+ suspend operations</text>
  </g>

  <g id="spring-auto">
    <rect id="card-spring-auto" class="card config-card" x="105" y="435" width="240" height="132"/>
    <text class="card-title" x="225" y="464">EventBridge</text>
    <text class="card-title" x="225" y="484">AutoConfiguration</text>
    <line class="divider" x1="105" y1="500" x2="345" y2="500"/>
    <text class="method" x="124" y="524">+ async client bean</text>
    <text class="method" x="124" y="544">+ operations bean</text>
  </g>

  <g id="spring-template">
    <rect id="card-spring-template" class="card impl-card" x="470" y="435" width="220" height="132"/>
    <text class="card-title" x="580" y="464">EventBridge</text>
    <text class="card-title" x="580" y="484">CoroutinesTemplate</text>
    <line class="divider" x1="470" y1="500" x2="690" y2="500"/>
    <text class="method" x="489" y="524">- async client</text>
    <text class="method" x="489" y="544">+ raw SDK responses</text>
  </g>

  <!-- Ktor cards: generous spacing and one relationship per corridor. -->
  <g id="ktor-plugin">
    <rect id="card-ktor-plugin" class="card runtime-card" x="835" y="185" width="240" height="114"/>
    <text class="card-title" x="955" y="218">EventBridge</text>
    <text class="card-title" x="955" y="238">KtorPlugin</text>
    <line class="divider" x1="835" y1="254" x2="1075" y2="254"/>
    <text class="method" x="854" y="278">+ install runtime</text>
  </g>

  <g id="ktor-ops">
    <rect id="card-ktor-ops" class="card interface-card" x="1190" y="185" width="220" height="142"/>
    <text class="stereo" x="1300" y="210">&lt;&lt;interface&gt;&gt;</text>
    <text class="card-title" x="1300" y="234">EventBridge</text>
    <text class="card-title" x="1300" y="254">KtorOperations</text>
    <line class="divider" x1="1190" y1="270" x2="1410" y2="270"/>
    <text class="method" x="1209" y="294">+ suspend operations</text>
    <text class="method" x="1209" y="314">+ *Async futures</text>
  </g>

  <g id="ktor-config">
    <rect id="card-ktor-config" class="card config-card" x="835" y="435" width="240" height="132"/>
    <text class="card-title" x="955" y="464">EventBridge</text>
    <text class="card-title" x="955" y="484">KtorPluginConfig</text>
    <line class="divider" x1="835" y1="500" x2="1075" y2="500"/>
    <text class="method" x="854" y="524">+ injected client/ops</text>
    <text class="method" x="854" y="544">+ region / endpoint</text>
  </g>

  <g id="ktor-template">
    <rect id="card-ktor-template" class="card impl-card" x="1190" y="435" width="220" height="132"/>
    <text class="card-title" x="1300" y="464">EventBridge</text>
    <text class="card-title" x="1300" y="484">KtorTemplate</text>
    <line class="divider" x1="1190" y1="500" x2="1410" y2="500"/>
    <text class="method" x="1209" y="524">- async client</text>
    <text class="method" x="1209" y="544">+ await or future</text>
  </g>

  <g id="ktor-runtime">
    <rect id="card-ktor-runtime" class="card runtime-card" x="835" y="600" width="240" height="62"/>
    <text class="card-title" x="955" y="626">EventBridgeKtorRuntime</text>
    <line class="divider" x1="835" y1="640" x2="1075" y2="640"/>
    <text class="method" x="854" y="657">+ stop owned client</text>
  </g>

  <!-- Shared cards -->
  <g id="core-adapters">
    <rect id="card-core-adapters" class="card shared-card" x="600" y="790" width="300" height="58"/>
    <text class="card-title" x="750" y="814">EventBridge core adapters</text>
    <text class="note" x="620" y="836">request builders + coroutine/future wrappers</text>
  </g>

  <g id="aws-client">
    <rect id="card-aws-client" class="card aws-card" x="600" y="870" width="300" height="46"/>
    <text class="card-title" x="750" y="895">EventBridgeAsyncClient</text>
    <text class="note" x="662" y="912">AWS SDK Java v2 async client</text>
  </g>

  <!-- Spring relationships -->
  <path class="connector dashed blue" d="M 580 435 L 580 340"/>
  <polygon class="triangle" points="580,322 568,340 592,340" stroke="#2f80bd"/>
  <text class="note" x="598" y="384">implements</text>

  <path class="connector amber" d="M 225 435 L 225 322"/>
  <polyline class="arrow-open" points="217,336 225,322 233,336" stroke="#b87912"/>
  <text class="note" x="243" y="382">binds</text>

  <path class="connector amber" d="M 345 501 L 470 501"/>
  <polyline class="arrow-open" points="456,493 470,501 456,509" stroke="#b87912"/>
  <text class="note" x="395" y="488">creates</text>

  <!-- Ktor relationships -->
  <path class="connector dashed green" d="M 1300 435 L 1300 345"/>
  <polygon class="triangle" points="1300,327 1288,345 1312,345" stroke="#4f8b47"/>
  <text class="note" x="1318" y="384">implements</text>

  <path class="connector green" d="M 955 299 L 955 435"/>
  <polyline class="arrow-open" points="947,421 955,435 963,421" stroke="#4f8b47"/>
  <text class="note" x="973" y="370">configures</text>

  <path class="connector green" d="M 1075 501 L 1190 501"/>
  <polyline class="arrow-open" points="1176,493 1190,501 1176,509" stroke="#4f8b47"/>
  <text class="note" x="1120" y="488">creates</text>

  <path class="connector green" d="M 955 567 L 955 600"/>
  <polyline class="arrow-open" points="947,586 955,600 963,586" stroke="#4f8b47"/>
  <text class="note" x="973" y="589">owns lifecycle</text>

  <!-- Framework templates delegate to shared core through separate lower corridors. -->
  <path class="connector gray" d="M 580 567 L 580 690 Q 580 700 590 700 L 720 700 Q 730 700 730 710 L 730 790"/>
  <polyline class="arrow-open" points="722,776 730,790 738,776" stroke="#475569"/>
  <text class="note" x="600" y="686">delegates</text>

  <path class="connector gray" d="M 1300 567 L 1300 690 Q 1300 700 1290 700 L 780 700 Q 770 700 770 710 L 770 790"/>
  <polyline class="arrow-open" points="762,776 770,790 778,776" stroke="#475569"/>
  <text class="note" x="1212" y="686">delegates</text>

  <path class="connector gray" d="M 750 848 L 750 870"/>
  <polyline class="arrow-open" points="742,856 750,870 758,856" stroke="#475569"/>
  <text class="note" x="768" y="864">calls</text>

  <g id="legend">
    <rect class="legend-box" x="90" y="765" width="205" height="82"/>
    <text class="legend" x="110" y="790">Legend</text>
    <path class="connector dashed blue" d="M 110 806 L 158 806"/>
    <polygon class="triangle" points="173,806 158,798 158,814" stroke="#2f80bd"/>
    <text class="legend" x="188" y="810">implements</text>
    <path class="connector gray" d="M 110 830 L 166 830"/>
    <polyline class="arrow-open" points="152,822 166,830 152,838" stroke="#475569"/>
    <text class="legend" x="188" y="834">creates / delegates</text>
  </g>
</svg>
