<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1000" viewBox="0 0 980 1000" role="img" aria-label="aws-exposed database handle sequence">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="928" height="948" rx="14" class="frame"/>
<text class="title" x="54" y="72">aws-exposed database handle sequence</text>
<text class="subtitle" x="56" y="102">Registry creation resolves settings, creates pools, registers handles, and closes in reverse order.</text>
<rect x="837.5" y="54" width="78.5" height="24" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="chip" x="876.75" y="70" text-anchor="middle">Resolve</text>
<rect x="753.5" y="54" width="68" height="24" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="chip" x="787.5" y="70" text-anchor="middle">Pool</text>
<rect x="669.5" y="54" width="68" height="24" rx="12" fill="#FFF0E3" stroke="#F47B36"/>
<text class="chip" x="703.5" y="70" text-anchor="middle">Close</text>
<g><g><path class="edge" d="M490 218 L490 250 L490 250 L490 270" stroke="#66758A"/></g>
<g><path class="edge" d="M490 348 L490 380 L490 380 L490 400" stroke="#66758A"/></g>
<g><path class="edge" d="M490 478 L490 510 L490 510 L490 530" stroke="#66758A"/></g>
<g><path class="edge" d="M490 608 L490 640 L490 640 L490 660" stroke="#66758A"/></g>
<g><path class="edge" d="M490 738 L490 770 L490 770 L490 790" stroke="#66758A"/></g></g>
<g id="adapter">
  <rect class="card" x="330" y="140" width="320" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="490" y="176" text-anchor="middle">Framework adapter</text>
  <text class="detail" x="490" y="200" text-anchor="middle">Spring Boot or Ktor</text>
</g>
<g id="resolver">
  <rect class="card" x="330" y="270" width="320" height="78" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="490" y="306" text-anchor="middle">Settings resolver</text>
  <text class="detail" x="490" y="330" text-anchor="middle">optional AWS-backed lookup</text>
</g>
<g id="factory">
  <rect class="card" x="330" y="400" width="320" height="78" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="490" y="436" text-anchor="middle">AwsExposedDatabaseFactory</text>
  <text class="detail" x="490" y="460" text-anchor="middle">create default and named handles</text>
</g>
<g id="hikari">
  <rect class="card" x="330" y="530" width="320" height="78" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="490" y="566" text-anchor="middle">HikariDataSource</text>
  <text class="detail" x="490" y="590" text-anchor="middle">connect Exposed Database</text>
</g>
<g id="registry">
  <rect class="card" x="330" y="660" width="320" height="78" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="490" y="696" text-anchor="middle">Database registry</text>
  <text class="detail" x="490" y="720" text-anchor="middle">lookup default or named handle</text>
</g>
<g id="close">
  <rect class="card" x="330" y="790" width="320" height="78" rx="10" fill="#FFF0E3" stroke="#F47B36"/>
  <text class="card-title" x="490" y="826" text-anchor="middle">Close handles</text>
  <text class="detail" x="490" y="850" text-anchor="middle">named first, then default</text>
</g>
<rect class="footer" x="54" y="896" width="872" height="54" rx="8"/>
<text class="footer-title" x="72" y="915" dominant-baseline="middle">Sequence role</text>
<text class="footer-detail" x="72" y="933" dominant-baseline="middle">Ordered vertical steps show failure cleanup and normal registry lookup without horizontal crowding.</text>
</svg>