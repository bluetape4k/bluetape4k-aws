<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-label="Bluetape4k AWS module composition chart">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#f8fafc}
      .frame{fill:#ffffff;stroke:#8aa6cf;stroke-width:3;filter:url(#softShadow)}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#17233a}
      .subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
      .panel{stroke-width:2.2;filter:url(#softShadow)}
      .panelTitle{font-family:"Architects Daughter";font-size:27px;fill:#17233a}
      .panelNote{font-family:"Comic Mono";font-size:13px;fill:#64748b}
      .row{fill:#ffffff;stroke-width:2}
      .rowTitle{font-family:"Architects Daughter";font-size:23px;fill:#17233a}
      .rowText{font-family:"Comic Mono";font-size:12.5px;fill:#475569}
      .badge{fill:#ffffff;stroke-width:2}
      .badgeText{font-family:"Comic Mono";font-size:12px;fill:#334155}
      .footer{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
      .footerText{font-family:"Comic Mono";font-size:14px;fill:#475569}
    </style>
  </defs>

  <rect class="canvas" width="1500" height="920"/>
  <rect class="frame" x="48" y="38" width="1404" height="844" rx="24"/>
  <text class="title" x="750" y="98" text-anchor="middle">Bluetape4k AWS Module Composition</text>
  <text class="subtitle" x="750" y="134" text-anchor="middle">Published libraries stay separate from runnable examples; consumers pick the smallest module family that matches their runtime.</text>

  <g id="published-libraries">
    <rect class="panel" x="92" y="178" width="650" height="318" rx="22" fill="#eff6ff" stroke="#93b4e6"/>
    <text class="panelTitle" x="126" y="220">Published library modules</text>
    <text class="panelNote" x="126" y="248">Maven Central artifacts used by applications and libraries.</text>

    <rect class="row" x="124" y="278" width="274" height="58" rx="14" stroke="#2563eb"/>
    <text class="rowTitle" x="144" y="303">aws-java</text>
    <text class="rowText" x="144" y="323">Java SDK v2 sync, async, coroutine</text>

    <rect class="row" x="430" y="278" width="274" height="58" rx="14" stroke="#059669"/>
    <text class="rowTitle" x="450" y="303">aws-kotlin</text>
    <text class="rowText" x="450" y="323">native suspend SDK helpers</text>

    <rect class="row" x="124" y="354" width="274" height="58" rx="14" stroke="#d97706"/>
    <text class="rowTitle" x="144" y="379">aws-exposed</text>
    <text class="rowText" x="144" y="399">RDS IAM and AWS-backed DB config</text>

    <rect class="row" x="430" y="354" width="274" height="58" rx="14" stroke="#dc2626"/>
    <text class="rowTitle" x="450" y="379">aws-spring-boot</text>
    <text class="rowText" x="450" y="399">auto-config, templates, listeners</text>

    <rect class="row" x="124" y="430" width="274" height="46" rx="14" stroke="#7c3aed"/>
    <text class="rowTitle" x="144" y="452">aws-ktor</text>
    <text class="rowText" x="144" y="470">Ktor plugins and runtimes</text>

    <rect class="row" x="430" y="430" width="274" height="46" rx="14" stroke="#64748b"/>
    <text class="rowTitle" x="450" y="452">aws-bom</text>
    <text class="rowText" x="450" y="470">version alignment</text>
  </g>

  <g id="examples">
    <rect class="panel" x="790" y="178" width="618" height="318" rx="22" fill="#f5f3ff" stroke="#b59ce8"/>
    <text class="panelTitle" x="824" y="220">Runnable example modules</text>
    <text class="panelNote" x="824" y="248">Not published; they prove application wiring, AOT, and emulator behavior.</text>

    <rect class="row" x="824" y="278" width="256" height="58" rx="14" stroke="#7c3aed"/>
    <text class="rowTitle" x="844" y="303">Ktor DynamoDB</text>
    <text class="rowText" x="844" y="323">server repository plugin</text>

    <rect class="row" x="1112" y="278" width="256" height="58" rx="14" stroke="#7c3aed"/>
    <text class="rowTitle" x="1132" y="303">Ktor S3</text>
    <text class="rowText" x="1132" y="323">routes, presign, encryption</text>

    <rect class="row" x="824" y="354" width="256" height="58" rx="14" stroke="#7c3aed"/>
    <text class="rowTitle" x="844" y="379">Ktor SQS</text>
    <text class="rowText" x="844" y="399">consumer runtime and ack/nack</text>

    <rect class="row" x="1112" y="354" width="256" height="58" rx="14" stroke="#7c3aed"/>
    <text class="rowTitle" x="1132" y="379">Ktor Exposed</text>
    <text class="rowText" x="1132" y="399">route-level DB transactions</text>

    <rect class="row" x="824" y="430" width="256" height="46" rx="14" stroke="#dc2626"/>
    <text class="rowTitle" x="844" y="460">Spring examples</text>

    <rect class="row" x="1112" y="430" width="256" height="46" rx="14" stroke="#dc2626"/>
    <text class="rowTitle" x="1132" y="452">Spring coverage</text>
    <text class="rowText" x="1132" y="470">DynamoDB, S3, SQS, Exposed</text>
  </g>

  <g id="status-matrix">
    <rect class="panel" x="92" y="542" width="1316" height="226" rx="22" fill="#fff7ed" stroke="#e8c47b"/>
    <text class="panelTitle" x="126" y="584">Reader choice matrix</text>
    <text class="panelNote" x="126" y="612">The README contract is module responsibility and runtime proof, not a performance ranking.</text>

    <rect class="badge" x="138" y="646" width="274" height="70" rx="16" stroke="#2563eb"/>
    <text class="rowTitle" x="275" y="674" text-anchor="middle">direct SDK access</text>
    <text class="badgeText" x="275" y="699" text-anchor="middle">aws-java or aws-kotlin</text>

    <rect class="badge" x="446" y="646" width="274" height="70" rx="16" stroke="#d97706"/>
    <text class="rowTitle" x="583" y="674" text-anchor="middle">database config</text>
    <text class="badgeText" x="583" y="699" text-anchor="middle">aws-exposed with RDS IAM</text>

    <rect class="badge" x="754" y="646" width="274" height="70" rx="16" stroke="#dc2626"/>
    <text class="rowTitle" x="891" y="674" text-anchor="middle">managed framework</text>
    <text class="badgeText" x="891" y="699" text-anchor="middle">Spring Boot 4 operations</text>

    <rect class="badge" x="1062" y="646" width="274" height="70" rx="16" stroke="#7c3aed"/>
    <text class="rowTitle" x="1199" y="674" text-anchor="middle">HTTP runtime</text>
    <text class="badgeText" x="1199" y="699" text-anchor="middle">Ktor plugins and examples</text>
  </g>

  <rect class="footer" x="118" y="806" width="1264" height="44" rx="16"/>
  <text class="footerText" x="750" y="833" text-anchor="middle">Published modules define reusable AWS boundaries; example modules verify S3, SQS/SNS, DynamoDB, Exposed, AOT, and Floci-first flows.</text>
</svg>
