<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">AWS Exposed Module Architecture</title>
  <desc id="desc">Framework adapters resolve AWS configuration and pass final JDBC settings to the shared Exposed foundation, which creates Hikari-backed Exposed database handles.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="none"/>
    </marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .canvas { fill: #f8fafc; }
      .title { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 52px; fill: #17233a; }
      .subtitle { font-family: "Comic Mono", monospace; font-size: 22px; fill: #475569; }
      .layer-title { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 30px; fill: #475569; }
      .layer-note { font-family: "Comic Mono", monospace; font-size: 17px; fill: #475569; }
      .card-title { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 26px; fill: #17233a; }
      .card-text { font-family: "Comic Mono", monospace; font-size: 17px; fill: #475569; }
      .pill { font-family: "Comic Mono", monospace; font-size: 17px; fill: #334155; }
      .footer { font-family: "Comic Mono", monospace; font-size: 18px; fill: #475569; }
      .layer-a { fill: #f8fafc; stroke: #cbd5e1; }
      .layer-b { fill: #f8fafc; stroke: #cbd5e1; }
      .layer-c { fill: #f8fafc; stroke: #cbd5e1; }
      .layer-d { fill: #f8fafc; stroke: #cbd5e1; }
      .card-blue { fill: #ffffff; stroke: #2563eb; }
      .card-green { fill: #ffffff; stroke: #059669; }
      .card-gold { fill: #ffffff; stroke: #d97706; }
      .card-violet { fill: #ffffff; stroke: #7c3aed; }
      .connector { fill: none; stroke: #2563eb; stroke-width: 4.6; marker-end: url(#arrow); }
      .connector-soft { fill: none; stroke: #7c92a4; stroke-width: 3.2; stroke-dasharray: 9 8; marker-end: url(#arrow); }
      .boundary { fill: #fffef8; stroke: #d4be75; stroke-width: 2.4; stroke-dasharray: 10 8; }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1040"/>
  <rect x="34" y="30" width="1532" height="980" rx="28" fill="#ffffff" stroke="#8aa6cf" stroke-width="3"/>

  <text class="title" x="80" y="102">AWS Exposed Module Architecture</text>
  <text class="subtitle" x="82" y="140">Shared JDBC foundation: AWS-aware adapters supply resolved settings; this module creates Exposed database handles.</text>

  <rect class="layer-a" x="82" y="190" width="1436" height="178" rx="22" stroke-width="3"/>
  <text class="layer-title" x="112" y="236">Framework adapters and application config</text>
  <text class="layer-note" x="112" y="266">Secrets Manager, Parameter Store, profiles, and runtime config are resolved before entering this foundation.</text>

  <g filter="url(#shadow)">
    <rect class="card-blue" x="118" y="286" width="310" height="72" rx="14" stroke-width="2.5"/>
    <text class="card-title" x="142" y="316">Spring Boot adapter</text>
    <text class="card-text" x="142" y="342">binds props + AWS sources</text>

    <rect class="card-blue" x="464" y="286" width="310" height="72" rx="14" stroke-width="2.5"/>
    <text class="card-title" x="488" y="316">Ktor adapter</text>
    <text class="card-text" x="488" y="342">passes final JDBC settings</text>

    <rect class="card-blue" x="810" y="286" width="310" height="72" rx="14" stroke-width="2.5"/>
    <text class="card-title" x="834" y="316">Static app config</text>
    <text class="card-text" x="834" y="342">default and named maps</text>

    <rect class="boundary" x="1156" y="286" width="320" height="72" rx="16"/>
    <text class="card-title" x="1184" y="316">Module boundary</text>
    <text class="card-text" x="1184" y="342">no direct AWS value fetch</text>
  </g>

  <path class="connector" d="M 800 368 V 462"/>

  <rect class="layer-b" x="82" y="462" width="1436" height="226" rx="22" stroke-width="3"/>
  <text class="layer-title" x="112" y="508">AWS Exposed foundation</text>
  <text class="layer-note" x="112" y="538">Source-backed contracts validate database names, auth mode, driver class, and cleanup behavior.</text>

  <g filter="url(#shadow)">
    <rect class="card-green" x="118" y="558" width="300" height="104" rx="14" stroke-width="2.5"/>
    <text class="card-title" x="140" y="592">DB properties</text>
    <text class="card-text" x="140" y="620">AwsDatabaseProperties</text>
    <text class="card-text" x="140" y="646">default and named maps</text>

    <rect class="card-green" x="454" y="558" width="300" height="104" rx="14" stroke-width="2.5"/>
    <text class="card-title" x="476" y="592">Settings resolver</text>
    <text class="card-text" x="476" y="620">framework hook point</text>
    <text class="card-text" x="476" y="646">returns final JDBC props</text>

    <rect class="card-green" x="790" y="558" width="300" height="104" rx="14" stroke-width="2.5"/>
    <text class="card-title" x="812" y="592">Database factory</text>
    <text class="card-text" x="812" y="620">validates url and driver</text>
    <text class="card-text" x="812" y="646">creates DataSource and DB</text>

    <rect class="card-green" x="1126" y="558" width="300" height="104" rx="14" stroke-width="2.5"/>
    <text class="card-title" x="1148" y="592">Database registry</text>
    <text class="card-text" x="1148" y="620">default plus named handles</text>
    <text class="card-text" x="1148" y="646">reverse close on failure</text>
  </g>

  <path class="connector" d="M 800 688 V 775"/>

  <rect class="layer-c" x="82" y="775" width="1436" height="140" rx="22" stroke-width="3"/>
  <text class="layer-title" x="112" y="820">Authentication and JDBC boundary</text>

  <g filter="url(#shadow)">
    <rect class="card-gold" x="118" y="840" width="250" height="58" rx="16" stroke-width="2.5"/>
    <text class="pill" x="145" y="876">STATIC_PASSWORD</text>

    <rect class="card-gold" x="406" y="840" width="250" height="58" rx="16" stroke-width="2.5"/>
    <text class="pill" x="432" y="876">RDS_IAM token cache</text>

    <rect class="card-gold" x="694" y="840" width="250" height="58" rx="16" stroke-width="2.5"/>
    <text class="pill" x="724" y="876">AwsSecretString redaction</text>

    <rect class="card-gold" x="982" y="840" width="250" height="58" rx="16" stroke-width="2.5"/>
    <text class="pill" x="1016" y="876">Hikari DataSource</text>

    <rect class="card-gold" x="1270" y="840" width="206" height="58" rx="16" stroke-width="2.5"/>
    <text class="pill" x="1302" y="876">JDBC properties</text>
  </g>

  <path class="connector" d="M 800 915 V 967"/>

  <rect class="layer-d" x="82" y="967" width="1436" height="52" rx="18" stroke-width="3"/>
  <text class="footer" x="112" y="1000">Runtime output: Exposed Database handles connect to caller-selected JDBC drivers, RDS endpoints, H2 tests, or PostgreSQL Testcontainers.</text>

  <path class="connector-soft" d="M 268 662 C 286 720 514 744 531 840"/>
  <path class="connector-soft" d="M 940 662 C 958 720 1090 744 1107 840"/>
  <path class="connector-soft" d="M 1276 662 C 1294 720 1356 758 1373 840"/>
</svg>
