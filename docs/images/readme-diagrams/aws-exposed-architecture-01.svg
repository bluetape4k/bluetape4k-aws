<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="940" viewBox="0 0 1040 940" role="img" aria-label="aws-exposed architecture">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="988" height="888" rx="14" class="frame"/>
<text class="title" x="54" y="72">aws-exposed architecture</text>
<text class="subtitle" x="56" y="102">Framework adapters resolve AWS-backed settings, then the foundation creates Exposed database handles.</text>
<rect x="890" y="54" width="86" height="24" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="chip" x="933" y="70" text-anchor="middle">Resolver</text>
<rect x="787" y="54" width="71" height="24" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="chip" x="822.5" y="70" text-anchor="middle">Hikari</text>
<rect x="654" y="54" width="86" height="24" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="chip" x="697" y="70" text-anchor="middle">Registry</text>
<g><g><path class="edge" d="M330 181 L330 259 L430 259 L430 336" stroke="#66758A"/></g>
<g><path class="edge" d="M710 181 L710 259 L610 259 L610 336" stroke="#66758A"/></g>
<g><path class="edge" d="M430 336 L430 417 L330 417 L330 497" stroke="#66758A"/></g>
<g><path class="edge" d="M610 336 L610 417 L710 417 L710 497" stroke="#66758A"/></g>
<g><path class="edge" d="M520 542 L520 577 L520 577 L520 612" stroke="#66758A"/></g>
<g><path class="edge" d="M330 656 L330 707 L430 707 L430 757" stroke="#66758A"/></g>
<g><path class="edge" d="M430 757 L520 757 L520 757 L610 757" stroke="#66758A"/></g></g>
<g id="adapter">
  <rect class="card" x="330" y="140" width="380" height="82" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="520" y="178" text-anchor="middle">Spring Boot or Ktor adapter</text>
  <text class="detail" x="520" y="202" text-anchor="middle">resolves final database settings</text>
</g>
<g id="props">
  <rect class="card" x="100" y="292" width="330" height="88" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="265" y="333" text-anchor="middle">AwsDatabaseProperties</text>
  <text class="detail" x="265" y="357" text-anchor="middle">default + named database configs</text>
</g>
<g id="resolver">
  <rect class="card" x="610" y="292" width="330" height="88" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="775" y="333" text-anchor="middle">AwsDatabaseSettingsResolver</text>
  <text class="detail" x="775" y="357" text-anchor="middle">Secrets Manager / Parameter Store bridge</text>
</g>
<g id="factory">
  <rect class="card" x="330" y="452" width="380" height="90" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="520" y="494" text-anchor="middle">AwsExposedDatabaseFactory</text>
  <text class="detail" x="520" y="518" text-anchor="middle">resolve, validate, create Hikari pool</text>
</g>
<g id="registry">
  <rect class="card" x="330" y="612" width="380" height="88" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="520" y="653" text-anchor="middle">AwsExposedDatabaseRegistry</text>
  <text class="detail" x="520" y="677" text-anchor="middle">default and named handles</text>
</g>
<g id="repo">
  <rect class="card" x="100" y="718" width="330" height="78" rx="10" fill="#F4F7FA" stroke="#8CA0B3"/>
  <text class="card-title" x="265" y="754" text-anchor="middle">Repositories / Exposed DSL</text>
  <text class="detail" x="265" y="778" text-anchor="middle">transaction(handle.database)</text>
</g>
<g id="db">
  <path d="M610 738 C610 714,890 714,890 738 L890 776 C890 800,610 800,610 776 Z" fill="#FFF0E3" stroke="#F47B36" stroke-width="2"/>
  <ellipse cx="750" cy="738" rx="140" ry="20" fill="#FFF0E3" stroke="#F47B36" stroke-width="2"/>
  <text class="card-title" x="750" y="756.5" text-anchor="middle">JDBC database</text>
  <text class="detail" x="750" y="780.5" text-anchor="middle">PostgreSQL, RDS, H2 tests</text>
</g>
<rect class="footer" x="54" y="836" width="932" height="54" rx="8"/>
<text class="footer-title" x="72" y="865">Module role</text>
<text class="footer-detail" x="72" y="885">The foundation does not fetch AWS values itself; adapters pass final JDBC settings in.</text>
</svg>