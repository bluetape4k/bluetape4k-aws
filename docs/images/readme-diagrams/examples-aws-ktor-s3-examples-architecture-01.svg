<g id="route-table">
  <rect x="86" y="564" width="600" height="72" rx="10" fill="#FFFFFF" stroke="#D9E2EC" />
  <text class="card-title" x="110" y="596">Route surface</text>
  <text class="detail" x="294" y="594">objects</text>
  <text class="detail" x="402" y="594">config</text>
  <text class="detail" x="508" y="594">presign</text>
  <text class="detail" x="616" y="594">detect</text>
  <text class="tiny" x="110" y="620">Tailcard keys preserve slash-separated S3 object paths.</text>

  <rect x="724" y="564" width="630" height="72" rx="10" fill="#FFFFFF" stroke="#D9E2EC" />
  <text class="card-title" x="748" y="596">Verification</text>
