  <image data-bluetape4k-icon="framework.ktor" x="839" y="267" width="26" height="26" href="data:image/svg+xml;base64,PHN2ZyBmaWxsPSIjMDg3Q0ZBIiByb2xlPSJpbWciIHZpZXdCb3g9IjAgMCAyNCAyNCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48dGl0bGU+S3RvcjwvdGl0bGU+PHBhdGggZD0iTTggMCAwIDhsOCA4VjhoOHptOCA4djhIOGw4IDggOC04eiIvPjwvc3ZnPg==" preserveAspectRatio="xMidYMid meet" /><text class="card-title" x="945" y="258" text-anchor="middle">S3KtorClient</text>
  <text class="detail" x="945" y="286" text-anchor="middle">object bytes</text>
  <text class="detail" x="945" y="306" text-anchor="middle">stream, list, delete</text>

  <rect class="card" x="825" y="382" width="240" height="116" rx="9" fill="#F3FBFA" stroke="#63B8B3" />
  <image data-bluetape4k-icon="aws.s3" x="839" y="427" width="26" height="26" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet" /><text class="card-title" x="945" y="418" text-anchor="middle">S3 helpers</text>
  <text class="detail" x="945" y="446" text-anchor="middle">presign requests</text>
  <text class="detail" x="945" y="466" text-anchor="middle">config and crypto</text>

  <rect class="card" x="1160" y="260" width="180" height="128" rx="9" fill="#FFF7ED" stroke="#F97316" />
  <text class="card-title" x="1250" y="296" text-anchor="middle">object store</text>
  <text class="detail" x="1250" y="324" text-anchor="middle">demo-bucket</text>
