  <rect class="layer" x="405" y="142" width="355" height="392" rx="12" />
  <text class="layer-title" x="427" y="178">Example helpers</text>
  <text class="layer-detail" x="429" y="200">copyable client scenarios</text>

  <rect class="layer" x="795" y="142" width="300" height="392" rx="12" />
  <text class="layer-title" x="817" y="178">aws-ktor S3 API</text>
