<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" role="img" aria-label="Ktor S3 example">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="1068" height="808" rx="14" class="frame"/>
<text class="title" x="54" y="72">Ktor S3 example</text>
<text class="subtitle" x="56" y="102">Ktor S3 routes and helper scenarios use SigV4 REST calls against S3-compatible endpoints.</text>
<rect x="1000" y="54" width="68" height="24" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="chip" x="1034" y="70" text-anchor="middle">Ktor</text>
<rect x="897" y="54" width="68" height="24" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="chip" x="931" y="70" text-anchor="middle">S3</text>
<rect x="756.5" y="54" width="68" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="chip" x="790.5" y="70" text-anchor="middle">SigV4</text>
<g><g><path class="edge" d="M312 219 L351 219 L351 208 L390 208" stroke="#66758A"/></g>
<g><path class="edge" d="M312 219 L312 302 L390 302 L390 384" stroke="#66758A"/></g>
<g><path class="edge" d="M680 208 L680 348 L758 348 L758 488" stroke="#66758A"/></g>
<g><path class="edge" d="M680 384 L680 338 L758 338 L758 292" stroke="#66758A"/></g>
<g><path class="edge" d="M903 340 L903 391 L903 391 L903 442" stroke="#66758A"/></g>
<g><path class="edge" d="M903 534 L903 572 L903 572 L903 610" stroke="#66758A"/></g></g>
<g id="client">
  <rect class="card" x="72" y="176" width="240" height="86" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="192" y="216" text-anchor="middle">HTTP client / test</text>
  <text class="detail" x="192" y="240" text-anchor="middle">object and config routes</text>
</g>
<g id="routes">
  <rect class="card" x="390" y="156" width="290" height="104" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="535" y="196.5" text-anchor="middle">Ktor S3 routes</text>
  <text class="detail" x="535" y="220.5" text-anchor="middle">upload, download, stream</text>
<text class="detail" x="535" y="237.5" text-anchor="middle">list, delete, presign</text>
</g>
<g id="advanced">
  <rect class="card" x="390" y="332" width="290" height="104" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="535" y="372.5" text-anchor="middle">Advanced routes</text>
  <text class="detail" x="535" y="396.5" text-anchor="middle">content-type detection</text>
<text class="detail" x="535" y="413.5" text-anchor="middle">config data, encryption demo</text>
</g>
<g id="helpers">
  <rect class="card" x="758" y="244" width="290" height="96" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="903" y="280.5" text-anchor="middle">S3KtorExamples</text>
  <text class="detail" x="903" y="304.5" text-anchor="middle">local client</text>
<text class="detail" x="903" y="321.5" text-anchor="middle">scenario helpers</text>
</g>
<g id="s3client">
  <rect class="card" x="758" y="442" width="290" height="92" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="card-title" x="903" y="485" text-anchor="middle">S3KtorClient</text>
  <text class="detail" x="903" y="509" text-anchor="middle">SigV4 REST calls</text>
</g>
<g id="s3">
  <path d="M758 630 C758 606,1048 606,1048 630 L1048 668 C1048 692,758 692,758 668 Z" fill="#FFF0E3" stroke="#F47B36" stroke-width="2"/>
  <ellipse cx="903" cy="630" rx="145" ry="20" fill="#FFF0E3" stroke="#F47B36" stroke-width="2"/>
  <text class="card-title" x="903" y="648.5" text-anchor="middle">S3-compatible endpoint</text>
  <text class="detail" x="903" y="672.5" text-anchor="middle">AWS S3, LocalStack, Floci</text>
</g>
<rect class="footer" x="54" y="756" width="1012" height="54" rx="8"/>
<text class="footer-title" x="72" y="785">Example role</text>
<text class="footer-detail" x="72" y="805">Cover object routes, presigned URLs, config objects, content-type detection, and encryption demo paths.</text>
</svg>