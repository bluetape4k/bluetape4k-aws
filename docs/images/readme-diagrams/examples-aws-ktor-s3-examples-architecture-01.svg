  <rect class="card" x="435" y="382" width="295" height="116" rx="9" fill="#EEF9F1" stroke="#75B989" />
  <text class="card-title" x="582.5" y="418" text-anchor="middle">Advanced flows</text>
  <text class="detail" x="582.5" y="446" text-anchor="middle">detect content type</text>
