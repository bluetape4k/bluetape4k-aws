<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="812" viewBox="0 0 1440 812" role="img" aria-label="Java SDK v2 three-tier API">
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter";font-size:34px;fill:#102033}
  .seqTitle{font-family:"Architects Daughter";font-size:44px;fill:#102033}
  .seqSubtitle{font-family:"Comic Mono";font-size:16px;fill:#526274}
  .seqParticipantTitle{font-family:"Architects Daughter";font-size:24px;fill:#102033}
  .seqParticipantDetail{font-family:"Comic Mono";font-size:13px;fill:#526274}
  .subtitle,.detail,.tiny,.label{font-family:"Comic Mono";fill:#526274}
  .subtitle{font-size:14px}
  .label{font-size:12px;fill:#344456}
  .card-title{font-family:"Architects Daughter";font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .tiny{font-size:10px}
  .chip{font-family:"Comic Mono";font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .seq{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .seqReturn{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7}
  .labelPill{fill:#FFFFFF;stroke:#D6E3EF;stroke-width:1.4}
  .numberBadge{font-family:"Comic Mono";font-size:12px;fill:#FFFFFF}
  .altBox{fill:#FFFFFF;fill-opacity:.44;stroke:#D6A441;stroke-width:1.8;stroke-dasharray:8 8}
  .activation{stroke-width:1.4}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter";font-size:16px;fill:#FFFFFF}
  .footer-detail{font-family:"Comic Mono";font-size:11px;fill:#DDE7F2}
  .seq-line{stroke:#CBD5E1;stroke-width:1.6;stroke-dasharray:6 8}
  .bar-label{font-family:"Architects Daughter";font-size:17px;fill:#102033}
</style>

<defs>
  <marker id="arrow-blue" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2F6DE0"/></marker>
  <marker id="arrow-green" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2F8B57"/></marker>
  <marker id="arrow-teal" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#168E86"/></marker>
  <marker id="arrow-amber" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B98518"/></marker>
  <marker id="arrow-rose" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C74E68"/></marker>
  <marker id="arrow-violet" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#7255C7"/></marker>
  <marker id="arrow-orange" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#EA580C"/></marker>
  <marker id="arrow-slate" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#475569"/></marker>
</defs>
<rect x="26" y="26" width="1388" height="760" rx="14" class="frame"/>
<text class="title" x="54" y="72">Java SDK v2 three-tier API</text>
<text class="subtitle" x="56" y="104">Sync clients, CompletableFuture async clients, and suspend wrappers are separated for Kotlin coroutine callers.</text>
<g><rect x="975" y="58" width="126" height="24" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/><text class="chip" x="1038.0" y="70" text-anchor="middle" dominant-baseline="middle">public API</text></g>
<g><rect x="1120" y="58" width="126" height="24" rx="12" fill="#E9F7F6" stroke="#45A7A1"/><text class="chip" x="1183.0" y="70" text-anchor="middle" dominant-baseline="middle">adapter/config</text></g>
<g><rect x="1265" y="58" width="126" height="24" rx="12" fill="#FFF7ED" stroke="#F97316"/><text class="chip" x="1328.0" y="70" text-anchor="middle" dominant-baseline="middle">runtime</text></g>
<rect x="54" y="150" width="1332" height="152" rx="10" fill="#F8FBFF" stroke="#DBEAFE"/>
<text class="chip" x="74" y="175">SDK tiers</text>
<rect x="54" y="338" width="1332" height="152" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
<text class="chip" x="74" y="363">Kotlin facade</text>
<rect x="54" y="526" width="1332" height="152" rx="10" fill="#F8FBFF" stroke="#DBEAFE"/>
<text class="chip" x="74" y="551">Runtime targets</text>
<g id="routes">
<path class="edge" d="M 699.0 230.0 L 741.0 230.0" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
<path class="edge" d="M 805.5 276.0 L 805.5 372.0" stroke="#2F8B57" marker-end="url(#arrow-green)"/>
<path class="edge" d="M 720.0 464.0 L 720.0 560.0" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
</g>
<g id="sync">
  <rect class="card" x="399.0" y="184.0" width="300.0" height="92.0" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="549.0" y="218.0" text-anchor="middle" dominant-baseline="middle">Sync SDK clients</text>
  <text class="detail" x="549.0" y="242.0" text-anchor="middle" dominant-baseline="middle">blocking AWS SDK v2</text>
  <text class="detail" x="549.0" y="260.0" text-anchor="middle" dominant-baseline="middle">factories/support</text>
</g>
<g id="async">
  <rect class="card" x="741.0" y="184.0" width="300.0" height="92.0" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="891.0" y="218.0" text-anchor="middle" dominant-baseline="middle">Async SDK clients</text>
  <text class="detail" x="891.0" y="242.0" text-anchor="middle" dominant-baseline="middle">CompletableFuture</text>
  <text class="detail" x="891.0" y="260.0" text-anchor="middle" dominant-baseline="middle">Netty/CRT HTTP</text>
</g>
<g id="suspend">
  <rect class="card" x="570.0" y="372.0" width="300.0" height="92.0" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="720.0" y="406.0" text-anchor="middle" dominant-baseline="middle">Coroutine extensions</text>
  <text class="detail" x="720.0" y="430.0" text-anchor="middle" dominant-baseline="middle">await wrappers</text>
  <text class="detail" x="720.0" y="448.0" text-anchor="middle" dominant-baseline="middle">Flow adapters</text>
</g>
<g id="services">
  <rect class="card" x="570.0" y="560.0" width="300.0" height="92.0" rx="10" fill="#FFF7ED" stroke="#F97316"/>
  <text class="card-title" x="720.0" y="594.0" text-anchor="middle" dominant-baseline="middle">Service packages</text>
  <text class="detail" x="720.0" y="618.0" text-anchor="middle" dominant-baseline="middle">DynamoDB, S3, SQS</text>
  <text class="detail" x="720.0" y="636.0" text-anchor="middle" dominant-baseline="middle">KMS, CloudWatch, STS</text>
</g>
<rect class="footer" x="54" y="718" width="1332" height="54" rx="8"/>
<text class="footer-title" x="74" y="741" dominant-baseline="middle">Reader cue</text>
<text class="footer-detail" x="74" y="761" dominant-baseline="middle">Coroutine helpers wrap async APIs without blocking threads.</text>
</svg>