<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-label="DynamoDB Spring Boot coroutine repository components">
<defs>
  <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%">
    <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/>
  </filter>
  <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F6DE0"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F8B57"/>
  </marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#168E86"/>
  </marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#EA580C"/>
  </marker>
  <marker id="arrow-slate" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
  </marker>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter";font-size:38px;fill:#102033}
  .subtitle,.detail,.tiny,.chip{font-family:"Comic Mono";fill:#526274}
  .subtitle{font-size:16px}
  .layer-title{font-family:"Architects Daughter";font-size:24px;fill:#102033}
  .layer-detail{font-family:"Comic Mono";font-size:12px;fill:#526274}
  .card-title{font-family:"Architects Daughter";font-size:21px;fill:#102033}
  .detail{font-size:13px}
  .tiny{font-size:11px}
  .chip{font-size:11px;fill:#243447}
  .layer{fill:#F8FAFC;stroke:#D9E2EC;stroke-width:1.4}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
  .soft-edge{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter";font-size:17px;fill:#FFFFFF}
  .footer-detail{font-family:"Comic Mono";font-size:12px;fill:#DDE7F2}
</style>

<rect x="26" y="26" width="1388" height="708" rx="14" class="frame"/>
<text class="title" x="54" y="74">DynamoDB coroutine repository</text>
<text class="subtitle" x="56" y="106">Spring Boot wires the async clients and table resolver; application repositories own keys, schemas, and table lifecycle.</text>

<g>
  <rect x="936" y="57" width="122" height="25" rx="12.5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="chip" x="997" y="70.5" text-anchor="middle" dominant-baseline="middle">Config</text>
  <rect x="1074" y="57" width="122" height="25" rx="12.5" fill="#EAF7EF" stroke="#58A978"/>
  <text class="chip" x="1135" y="70.5" text-anchor="middle" dominant-baseline="middle">Repository</text>
  <rect x="1212" y="57" width="80" height="25" rx="12.5" fill="#FFF7ED" stroke="#F97316"/>
  <text class="chip" x="1252" y="70.5" text-anchor="middle" dominant-baseline="middle">AWS</text>
  <rect x="1308" y="57" width="62" height="25" rx="12.5" fill="#F1F5F9" stroke="#64748B"/>
  <text class="chip" x="1339" y="70.5" text-anchor="middle" dominant-baseline="middle">DAX</text>
</g>

<g id="layers">
  <rect class="layer" x="70" y="142" width="290" height="410" rx="12"/>
  <text class="layer-title" x="92" y="178">Activation</text>
  <text class="layer-detail" x="94" y="200">Properties and classpath gates</text>

  <rect class="layer" x="395" y="142" width="335" height="410" rx="12"/>
  <text class="layer-title" x="417" y="178">Client beans</text>
  <text class="layer-detail" x="419" y="200">Async client and enhanced client</text>

  <rect class="layer" x="765" y="142" width="305" height="410" rx="12"/>
  <text class="layer-title" x="787" y="178">Repository API</text>
  <text class="layer-detail" x="789" y="200">Coroutine facade over Enhanced Client</text>

  <rect class="layer" x="1105" y="142" width="265" height="410" rx="12"/>
  <text class="layer-title" x="1127" y="178">Runtime target</text>
  <text class="layer-detail" x="1129" y="200">DynamoDB, DAX, and table lifecycle</text>
</g>

<g id="cards">
  <rect class="card" x="100" y="230" width="230" height="104" rx="9" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="215" y="266" text-anchor="middle">DynamoDB config</text>
  <text class="detail" x="215" y="294" text-anchor="middle">enabled by default</text>
  <text class="detail" x="215" y="314" text-anchor="middle">region / endpoint</text>

  <rect class="card" x="100" y="388" width="230" height="104" rx="9" fill="#F1F5F9" stroke="#64748B"/>
  <text class="card-title" x="215" y="424" text-anchor="middle">DAX opt-in</text>
  <text class="detail" x="215" y="452" text-anchor="middle">runtime SDK + url</text>
  <text class="detail" x="215" y="472" text-anchor="middle">disabled by default</text>

  <rect class="card" x="425" y="220" width="275" height="104" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="562.5" y="256" text-anchor="middle">DynamoDbAsyncClient</text>
  <text class="detail" x="562.5" y="284" text-anchor="middle">default SDK client</text>
  <text class="detail" x="562.5" y="304" text-anchor="middle">backs off on custom bean</text>

  <rect class="card" x="425" y="378" width="275" height="104" rx="9" fill="#F3FBFA" stroke="#63B8B3"/>
  <text class="card-title" x="562.5" y="414" text-anchor="middle">EnhancedAsyncClient</text>
  <text class="detail" x="562.5" y="442" text-anchor="middle">repository entrypoint</text>
  <text class="detail" x="562.5" y="462" text-anchor="middle">wraps async client</text>

  <rect class="card" x="795" y="220" width="245" height="104" rx="9" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="917.5" y="256" text-anchor="middle">Table resolver</text>
  <text class="detail" x="917.5" y="284" text-anchor="middle">tablePrefix support</text>
  <text class="detail" x="917.5" y="304" text-anchor="middle">custom resolver allowed</text>

  <rect class="card" x="795" y="378" width="245" height="104" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="917.5" y="414" text-anchor="middle">Coroutine repository</text>
  <text class="detail" x="917.5" y="442" text-anchor="middle">save/find/update/delete</text>
  <text class="detail" x="917.5" y="462" text-anchor="middle">scan/query as Flow</text>

  <rect class="card" x="1138" y="220" width="200" height="104" rx="9" fill="#FFF7ED" stroke="#F97316"/>
  <text class="card-title" x="1238" y="256" text-anchor="middle">DynamoDB table</text>
  <text class="detail" x="1238" y="284" text-anchor="middle">created outside</text>
  <text class="detail" x="1238" y="304" text-anchor="middle">migration or setup</text>

  <rect class="card" x="1138" y="378" width="200" height="104" rx="9" fill="#F8FAFC" stroke="#64748B"/>
  <text class="card-title" x="1238" y="414" text-anchor="middle">DAX cluster</text>
  <text class="detail" x="1238" y="442" text-anchor="middle">real AWS only</text>
  <text class="detail" x="1238" y="462" text-anchor="middle">emulators excluded</text>
</g>

<g id="connections">
  <path class="edge" d="M 330 282 L 425 272" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M 562.5 324 L 562.5 378" stroke="#2F8B57" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M 700 430 L 795 430" stroke="#2F8B57" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M 917.5 324 L 917.5 378" stroke="#168E86" marker-end="url(#arrow-teal)"/>
  <path class="edge" d="M 1040 430 L 1138 272" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
  <path class="soft-edge" d="M 330 440 L 382 440 L 382 520 L 1238 520 L 1238 482" stroke="#475569" marker-end="url(#arrow-slate)"/>
  <path class="soft-edge" d="M 1238 482 L 1238 560 L 735 560 L 735 272 L 700 272" stroke="#475569" marker-end="url(#arrow-slate)"/>
</g>

<g id="contracts">
  <rect x="86" y="584" width="600" height="72" rx="10" fill="#FFFFFF" stroke="#D9E2EC"/>
  <text class="card-title" x="110" y="616">Repository contract</text>
  <text class="detail" x="370" y="614">keyFromId</text>
  <text class="detail" x="516" y="614">TableSchema</text>
  <text class="tiny" x="110" y="640">Application repositories own entity mapping, keys, and table naming decisions.</text>

  <rect x="724" y="584" width="630" height="72" rx="10" fill="#FFFFFF" stroke="#D9E2EC"/>
  <text class="card-title" x="748" y="616">Operational boundary</text>
  <text class="detail" x="1056" y="614">no table creation</text>
  <text class="detail" x="1214" y="614">DAX optional</text>
  <text class="tiny" x="748" y="640">DAX changes the backing async client, not the repository API surface.</text>
</g>

<rect class="footer" x="54" y="690" width="1332" height="34" rx="8"/>
<text class="footer-title" x="74" y="710" dominant-baseline="middle">Boundary</text>
<text class="footer-detail" x="178" y="710" dominant-baseline="middle">Auto-configuration supplies clients and naming; migrations or tests still create the DynamoDB tables.</text>
</svg>
