<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1260" viewBox="0 0 1700 1260" role="img" aria-labelledby="title desc">
  <title id="title">AWS Ktor Module Architecture</title>
  <desc id="desc">Architecture of bluetape4k AWS Ktor integration showing Ktor application entrypoints, shared defaults, client signing, server lifecycle plugins, and runtime service boundaries.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669"/></marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d97706"/></marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/></marker>
    <marker id="slateArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#f8fafc}
      .frame{fill:#ffffff;stroke:#8aa6cf;stroke-width:3;filter:url(#shadow)}
      .title{font-family:"Architects Daughter";font-size:50px;fill:#17233a}
      .subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
      .layer{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;stroke-dasharray:9 8}
      .layerTitle{font-family:"Comic Mono";font-size:18px;font-weight:700;fill:#475569}
      .card{fill:#ffffff;stroke-width:2.4;filter:url(#shadow)}
      .smallCard{fill:#ffffff;stroke-width:2.2;filter:url(#shadow)}
      .cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#17233a}
      .smallTitle{font-family:"Architects Daughter";font-size:20px;fill:#17233a}
      .cardText{font-family:"Comic Mono";font-size:14px;fill:#475569}
      .smallText{font-family:"Comic Mono";font-size:12px;fill:#475569}
      .pill{fill:#ffffff;stroke-width:2.2;filter:url(#shadow)}
      .pillText{font-family:"Comic Mono";font-size:13px;fill:#475569}
      .note{font-family:"Comic Mono";font-size:13px;fill:#64748b}
      .blue{stroke:#2563eb}
      .green{stroke:#059669}
      .orange{stroke:#d97706}
      .purple{stroke:#7c3aed}
      .red{stroke:#b86868}
      .cyan{stroke:#0891b2}
      .slate{stroke:#64748b}
      .blueLine{stroke:#2563eb;stroke-width:4;marker-end:url(#blueArrow);fill:none}
      .greenLine{stroke:#059669;stroke-width:4;marker-end:url(#greenArrow);fill:none}
      .orangeLine{stroke:#d97706;stroke-width:4;marker-end:url(#orangeArrow);fill:none}
      .purpleLine{stroke:#7c3aed;stroke-width:4;marker-end:url(#purpleArrow);fill:none}
      .slateLine{stroke:#64748b;stroke-width:3.5;marker-end:url(#slateArrow);fill:none}
      .label{font-family:"Comic Mono";font-size:14px;fill:#334155}
      .footer{font-family:"Comic Mono";font-size:14px;fill:#475569}
    </style>
  </defs>

  <rect class="canvas" width="1700" height="1260"/>
  <rect class="frame" x="42" y="36" width="1616" height="1188" rx="28"/>
  <text class="title" x="850" y="96" text-anchor="middle">AWS Ktor Module Architecture</text>
  <text class="subtitle" x="850" y="132" text-anchor="middle">Ktor 3 client and server integrations share AWS defaults while preserving app ownership of credentials, clients, and lifecycle scope.</text>

  <rect class="layer" x="95" y="174" width="1510" height="124" rx="18"/>
  <text class="layerTitle" x="122" y="212">KTOR APPLICATION</text>
  <rect class="pill blue" x="146" y="235" width="310" height="42" rx="14"/>
  <text class="pillText" x="301" y="261" text-anchor="middle">HttpClient callers</text>
  <rect class="pill green" x="516" y="235" width="310" height="42" rx="14"/>
  <text class="pillText" x="671" y="261" text-anchor="middle">Application plugins</text>
  <rect class="pill orange" x="886" y="235" width="310" height="42" rx="14"/>
  <text class="pillText" x="1041" y="261" text-anchor="middle">Route handlers</text>
  <rect class="pill purple" x="1256" y="235" width="310" height="42" rx="14"/>
  <text class="pillText" x="1411" y="261" text-anchor="middle">Injected SDK clients/config</text>

  <rect class="layer" x="95" y="360" width="1510" height="214" rx="18"/>
  <text class="layerTitle" x="122" y="398">SHARED DEFAULTS AND CLIENT DATA PATH</text>
  <rect class="card blue" x="130" y="432" width="330" height="94" rx="14"/>
  <text class="cardTitle" x="295" y="465" text-anchor="middle">S3KtorClient</text>
  <text class="cardText" x="295" y="492" text-anchor="middle">Ktor HttpClient REST facade</text>
  <text class="cardText" x="295" y="514" text-anchor="middle">objects, multipart, presign</text>
  <rect class="card green" x="500" y="432" width="330" height="94" rx="14"/>
  <text class="cardTitle" x="665" y="465" text-anchor="middle">AwsSigV4Plugin</text>
  <text class="cardText" x="665" y="492" text-anchor="middle">header/query signing</text>
  <text class="cardText" x="665" y="514" text-anchor="middle">replayable payload guard</text>
  <rect class="card orange" x="870" y="432" width="330" height="94" rx="14"/>
  <text class="cardTitle" x="1035" y="465" text-anchor="middle">AwsKtorCore</text>
  <text class="cardText" x="1035" y="492" text-anchor="middle">region, endpoint, credentials</text>
  <text class="cardText" x="1035" y="514" text-anchor="middle">used when local config omits them</text>
  <rect class="card purple" x="1240" y="432" width="330" height="94" rx="14"/>
  <text class="cardTitle" x="1405" y="465" text-anchor="middle">Observability hooks</text>
  <text class="cardText" x="1405" y="492" text-anchor="middle">Micrometer wrappers</text>
  <text class="cardText" x="1405" y="514" text-anchor="middle">no sensitive tags by default</text>

  <rect class="layer" x="95" y="632" width="1510" height="290" rx="18"/>
  <text class="layerTitle" x="122" y="670">SERVER PLUGINS AND LIFECYCLE RUNTIMES</text>
  <text class="note" x="295" y="728" text-anchor="middle">client-only</text>
  <text class="note" x="295" y="748" text-anchor="middle">S3 data path</text>
  <rect class="smallCard green" x="395" y="704" width="170" height="96" rx="14"/>
  <text class="smallTitle" x="480" y="735" text-anchor="middle">SQS</text>
  <text class="smallText" x="480" y="760" text-anchor="middle">pollers</text>
  <text class="smallText" x="480" y="780" text-anchor="middle">ack/nack, DLQ</text>
  <rect class="smallCard orange" x="580" y="704" width="170" height="96" rx="14"/>
  <text class="smallTitle" x="665" y="735" text-anchor="middle">DynamoDB</text>
  <text class="smallText" x="665" y="760" text-anchor="middle">repository</text>
  <text class="smallText" x="665" y="780" text-anchor="middle">explicit tables</text>
  <rect class="smallCard slate" x="765" y="704" width="170" height="96" rx="14"/>
  <text class="smallTitle" x="850" y="735" text-anchor="middle">Exposed</text>
  <text class="smallText" x="850" y="760" text-anchor="middle">JDBC registry</text>
  <text class="smallText" x="850" y="780" text-anchor="middle">suspend tx helper</text>
  <rect class="smallCard purple" x="950" y="704" width="170" height="96" rx="14"/>
  <text class="smallTitle" x="1035" y="735" text-anchor="middle">Access</text>
  <text class="smallText" x="1035" y="760" text-anchor="middle">S3 Grants</text>
  <text class="smallText" x="1035" y="780" text-anchor="middle">lazy operations</text>
  <rect class="smallCard blue" x="1135" y="704" width="170" height="96" rx="14"/>
  <text class="smallTitle" x="1220" y="735" text-anchor="middle">Vectors</text>
  <text class="smallText" x="1220" y="760" text-anchor="middle">S3 vector</text>
  <text class="smallText" x="1220" y="780" text-anchor="middle">operations</text>
  <rect class="smallCard cyan" x="1320" y="704" width="165" height="96" rx="14"/>
  <text class="smallTitle" x="1402" y="735" text-anchor="middle">Telemetry</text>
  <text class="smallText" x="1402" y="760" text-anchor="middle">metrics/logs</text>
  <text class="smallText" x="1402" y="780" text-anchor="middle">flush on stop</text>
  <rect class="smallCard red" x="1500" y="704" width="80" height="96" rx="14"/>
  <text class="smallTitle" x="1540" y="735" text-anchor="middle">IMDS</text>
  <text class="smallText" x="1540" y="760" text-anchor="middle">bounded</text>
  <text class="smallText" x="1540" y="780" text-anchor="middle">reads</text>

  <rect class="layer" x="95" y="980" width="1510" height="140" rx="18"/>
  <text class="layerTitle" x="122" y="1018">SERVICES</text>
  <rect class="pill blue" x="215" y="1054" width="160" height="42" rx="14"/>
  <text class="pillText" x="295" y="1080" text-anchor="middle">S3</text>
  <rect class="pill green" x="400" y="1054" width="160" height="42" rx="14"/>
  <text class="pillText" x="480" y="1080" text-anchor="middle">SQS</text>
  <rect class="pill orange" x="585" y="1054" width="160" height="42" rx="14"/>
  <text class="pillText" x="665" y="1080" text-anchor="middle">DynamoDB</text>
  <rect class="pill slate" x="770" y="1054" width="160" height="42" rx="14"/>
  <text class="pillText" x="850" y="1080" text-anchor="middle">JDBC DBs</text>
  <rect class="pill purple" x="955" y="1054" width="160" height="42" rx="14"/>
  <text class="pillText" x="1035" y="1080" text-anchor="middle">S3 Control</text>
  <rect class="pill blue" x="1140" y="1054" width="160" height="42" rx="14"/>
  <text class="pillText" x="1220" y="1080" text-anchor="middle">S3 Vectors</text>
  <rect class="pill cyan" x="1322" y="1054" width="160" height="42" rx="14"/>
  <text class="pillText" x="1402" y="1080" text-anchor="middle">CloudWatch</text>
  <rect class="pill red" x="1500" y="1054" width="80" height="42" rx="14"/>
  <text class="pillText" x="1540" y="1080" text-anchor="middle">IMDS</text>

  <path class="slateLine" d="M 850 298 V 348"/>
  <text class="label" x="872" y="328">install and call</text>
  <path class="slateLine" d="M 850 574 V 622"/>
  <text class="label" x="872" y="605">plugins inherit defaults only when local config is absent</text>
  <path class="blueLine" d="M 295 526 V 1042"/>
  <text class="label" x="315" y="930">signed S3 REST</text>
  <path class="greenLine" d="M 480 800 V 1042"/>
  <path class="orangeLine" d="M 665 800 V 1042"/>
  <path class="slateLine" d="M 850 800 V 1042"/>
  <path class="purpleLine" d="M 1035 800 V 1042"/>
  <path class="blueLine" d="M 1220 800 V 1042"/>
  <path class="purpleLine" d="M 1402 800 V 1042"/>
  <path class="orangeLine" d="M 1540 800 V 1042"/>

  <text class="footer" x="130" y="1170">Reader contract: aws-ktor supplies integration boundaries, not an application framework. Applications own credentials, app-scoped clients, route design, service dependencies, and lifecycle policy.</text>
</svg>
