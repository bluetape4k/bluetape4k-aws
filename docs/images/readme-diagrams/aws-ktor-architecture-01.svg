<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1000" viewBox="0 0 1420 1000" role="img" aria-label="AWS Ktor Architecture">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#64748b"/>
    </marker>
    <style>
      .canvas{fill:#f7f9fc}
      .frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:42px;fill:#102033}
      .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Neue",Arial,sans-serif;font-size:15px;fill:#536273}
      .bandLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:24px;fill:#102033}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:24px;fill:#102033}
      .cardText{font-family:"Comic Mono","Comic Sans MS","Comic Neue",Arial,sans-serif;font-size:14px;fill:#334155}
      .smallText{font-family:"Comic Mono","Comic Sans MS","Comic Neue",Arial,sans-serif;font-size:12px;fill:#536273}
      .card{filter:url(#shadow);stroke-width:2}
      .band{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1.4}
      .line{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}
      .lineGreen{fill:none;stroke:#4f8f68;stroke-width:2.2;marker-end:url(#arrow)}
      .lineAmber{fill:none;stroke:#b7791f;stroke-width:2.2;marker-end:url(#arrow)}
      .linePink{fill:none;stroke:#be5a70;stroke-width:2.2;marker-end:url(#arrow)}
      .lineTeal{fill:none;stroke:#318b8d;stroke-width:2.2;marker-end:url(#arrow)}
      .lineLavender{fill:none;stroke:#8b5cc2;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect class="canvas" width="1420" height="1000"/>
  <rect class="frame" x="30" y="24" width="1360" height="952" rx="26"/>

  <text class="title" x="72" y="82">AWS Ktor Architecture</text>
  <text class="subtitle" x="76" y="112">Shared defaults stay optional; service plugins keep their own override and lifecycle contracts.</text>

  <rect class="band" x="70" y="145" width="1280" height="110" rx="18"/>
  <text class="bandLabel" x="96" y="184">Application layer</text>
  <rect class="card" x="430" y="166" width="260" height="64" rx="16" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="560" y="193" text-anchor="middle">Ktor Application</text>
  <text class="cardText" x="560" y="215" text-anchor="middle">installs selected plugins</text>

  <rect class="band" x="70" y="286" width="1280" height="155" rx="18"/>
  <text class="bandLabel" x="96" y="326">Shared AWS core</text>
  <rect class="card" x="260" y="326" width="260" height="78" rx="16" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="390" y="354" text-anchor="middle">AwsKtorCore</text>
  <text class="cardText" x="390" y="376" text-anchor="middle">application defaults plugin</text>
  <text class="smallText" x="390" y="396" text-anchor="middle">opt-in attribute storage</text>

  <rect class="card" x="655" y="326" width="330" height="78" rx="16" fill="#F7FBEF" stroke="#80A857"/>
  <text class="cardTitle" x="820" y="354" text-anchor="middle">AwsKtorDefaults</text>
  <text class="cardText" x="820" y="376" text-anchor="middle">region endpoint credentials clock</text>
  <text class="smallText" x="820" y="396" text-anchor="middle">customizers: Ktor, SQS, DynamoDB</text>

  <rect class="band" x="70" y="474" width="1280" height="188" rx="18"/>
  <text class="bandLabel" x="96" y="514">Ktor integrations</text>
  <rect class="card" x="115" y="532" width="210" height="84" rx="16" fill="#EEF2FF" stroke="#8B7CF6"/>
  <text class="cardTitle" x="220" y="558" text-anchor="middle">AwsSigV4Plugin</text>
  <text class="cardText" x="220" y="580" text-anchor="middle">HttpClient signing</text>
  <text class="smallText" x="220" y="600" text-anchor="middle">header or query auth</text>

  <rect class="card" x="390" y="532" width="210" height="84" rx="16" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="495" y="558" text-anchor="middle">S3KtorClient</text>
  <text class="cardText" x="495" y="580" text-anchor="middle">REST operations</text>
  <text class="smallText" x="495" y="600" text-anchor="middle">presign and multipart</text>

  <rect class="card" x="665" y="532" width="210" height="84" rx="16" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="770" y="558" text-anchor="middle">SqsConsumer</text>
  <text class="cardText" x="770" y="580" text-anchor="middle">poll, publish, drain</text>
  <text class="smallText" x="770" y="600" text-anchor="middle">plugin-owned client optional</text>

  <rect class="card" x="940" y="532" width="210" height="84" rx="16" fill="#E8F7F6" stroke="#4CA6A8"/>
  <text class="cardTitle" x="1045" y="558" text-anchor="middle">DynamoDbKtor</text>
  <text class="cardText" x="1045" y="580" text-anchor="middle">AWS Kotlin SDK</text>
  <text class="smallText" x="1045" y="600" text-anchor="middle">table setup and repository</text>

  <rect class="card" x="1188" y="532" width="130" height="84" rx="16" fill="#F3E8FF" stroke="#A36AD6"/>
  <text class="cardTitle" x="1253" y="558" text-anchor="middle">Exposed</text>
  <text class="cardText" x="1253" y="580" text-anchor="middle">JDBC registry</text>
  <text class="smallText" x="1253" y="600" text-anchor="middle">AWS sources</text>

  <rect class="band" x="70" y="694" width="1280" height="206" rx="18"/>
  <text class="bandLabel" x="96" y="734">AWS runtime targets</text>
  <rect class="card" x="160" y="752" width="260" height="58" rx="16" fill="#F8FAFC" stroke="#94A3B8"/>
  <text class="cardText" x="290" y="786" text-anchor="middle">AWS SDK Java v2 clients</text>
  <rect class="card" x="505" y="752" width="260" height="58" rx="16" fill="#F8FAFC" stroke="#94A3B8"/>
  <text class="cardText" x="635" y="786" text-anchor="middle">AWS SDK for Kotlin clients</text>
  <rect class="card" x="850" y="752" width="260" height="58" rx="16" fill="#F8FAFC" stroke="#94A3B8"/>
  <text class="cardText" x="980" y="786" text-anchor="middle">AWS-backed Exposed registry</text>
  <path d="M1190 840 C1260 840 1305 853 1305 870 C1305 887 1260 900 1190 900 C1120 900 1075 887 1075 870 C1075 853 1120 840 1190 840 Z" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
  <path d="M1075 870 C1075 887 1120 900 1190 900 C1260 900 1305 887 1305 870" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text class="cardText" x="1190" y="875" text-anchor="middle">AWS / LocalStack</text>

  <path class="line" d="M560 230 L560 286 L390 286 L390 326"/>
  <path class="lineGreen" d="M520 365 L655 365"/>
  <path class="lineGreen" d="M820 404 L820 448 L220 448 L220 532"/>
  <path class="lineAmber" d="M820 404 L820 448 L495 448 L495 532"/>
  <path class="linePink" d="M820 404 L820 532"/>
  <path class="lineTeal" d="M820 404 L820 448 L1045 448 L1045 532"/>
  <path class="lineLavender" d="M820 404 L820 448 L1253 448 L1253 532"/>

  <path class="lineAmber" d="M390 574 L325 574"/>
  <path class="linePink" d="M770 616 L770 670 L290 670 L290 752"/>
  <path class="lineTeal" d="M1045 616 L1045 670 L635 670 L635 752"/>
  <path class="lineLavender" d="M1253 616 L1253 670 L980 670 L980 752"/>
  <path class="line" d="M220 616 L220 676 L1190 676 L1190 840"/>
  <path class="linePink" d="M290 810 L290 870 L1075 870"/>
  <path class="lineTeal" d="M635 810 L635 846 L1075 846"/>
  <path class="lineLavender" d="M980 810 L980 824 L1075 824 L1075 840"/>

  <text class="smallText" x="902" y="438">service settings override shared defaults</text>
</svg>
