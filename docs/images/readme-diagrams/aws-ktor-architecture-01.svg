<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="920" viewBox="0 0 1060 920" role="img" aria-label="aws-ktor architecture">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="1008" height="868" rx="14" class="frame"/>
<text class="title" x="54" y="72">aws-ktor architecture</text>
<text class="subtitle" x="56" y="102">Ktor plugins bind shared AWS defaults to SigV4, S3, SQS, DynamoDB, and Exposed runtime paths.</text>
<rect x="928" y="54" width="68" height="24" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="chip" x="962" y="70" text-anchor="middle">Ktor</text>
<rect x="833.5" y="54" width="78.5" height="24" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="chip" x="872.75" y="70" text-anchor="middle">Plugins</text>
<rect x="724" y="54" width="93.5" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="chip" x="770.75" y="70" text-anchor="middle">Local AWS</text>
<g><g><path class="edge" d="M530 218 L530 244 L530 244 L530 270" stroke="#66758A"/></g>
<g><path class="edge" d="M530 352 L530 377 L530 377 L530 402" stroke="#66758A"/></g>
<g><path class="edge" d="M530 492 L530 526 L210 526 L210 560" stroke="#66758A"/></g>
<g><path class="edge" d="M530 492 L530 526 L530 526 L530 560" stroke="#66758A"/></g>
<g><path class="edge" d="M530 492 L530 526 L850 526 L850 560" stroke="#66758A"/></g>
<g><path class="edge" d="M210 646 L210 675 L530 675 L530 704" stroke="#66758A"/></g>
<g><path class="edge" d="M530 646 L530 675 L530 675 L530 704" stroke="#66758A"/></g>
<g><path class="edge" d="M850 646 L850 675 L530 675 L530 704" stroke="#66758A"/></g></g>
<g id="app">
  <rect class="card" x="370" y="140" width="320" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="530" y="176" text-anchor="middle">Ktor application</text>
  <text class="detail" x="530" y="200" text-anchor="middle">routes, plugins, lifecycle</text>
</g>
<g id="core">
  <rect class="card" x="370" y="270" width="320" height="82" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="530" y="308" text-anchor="middle">AwsKtorCore</text>
  <text class="detail" x="530" y="332" text-anchor="middle">shared defaults</text>
</g>
<g id="defaults">
  <rect class="card" x="370" y="402" width="320" height="90" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="530" y="435.5" text-anchor="middle">AwsKtorDefaults</text>
  <text class="detail" x="530" y="459.5" text-anchor="middle">region, endpoint</text>
<text class="detail" x="530" y="476.5" text-anchor="middle">credentials, clock</text>
</g>
<g id="s3">
  <rect class="card" x="90" y="560" width="240" height="86" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="210" y="600" text-anchor="middle">S3KtorClient</text>
  <text class="detail" x="210" y="624" text-anchor="middle">object helpers</text>
</g>
<g id="sqs">
  <rect class="card" x="410" y="560" width="240" height="86" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="card-title" x="530" y="600" text-anchor="middle">SqsConsumer</text>
  <text class="detail" x="530" y="624" text-anchor="middle">polling runtime</text>
</g>
<g id="ddb">
  <rect class="card" x="730" y="560" width="240" height="86" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="850" y="600" text-anchor="middle">DynamoDbKtorPlugin</text>
  <text class="detail" x="850" y="624" text-anchor="middle">Kotlin SDK client</text>
</g>
<g id="aws">
  <rect class="card" x="370" y="704" width="320" height="82" rx="10" fill="#FFF0E3" stroke="#F47B36"/>
  <text class="card-title" x="530" y="742" text-anchor="middle">AWS / LocalStack</text>
  <text class="detail" x="530" y="766" text-anchor="middle">S3, SQS, DynamoDB, RDS</text>
</g>
<rect class="footer" x="54" y="816" width="952" height="54" rx="8"/>
<text class="footer-title" x="72" y="845">Module role</text>
<text class="footer-detail" x="72" y="865">Keep Ktor application code small while plugins own AWS client and local emulator wiring.</text>
</svg>