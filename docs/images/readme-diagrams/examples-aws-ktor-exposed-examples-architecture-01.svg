<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" role="img" aria-label="Ktor Exposed example">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="1068" height="808" rx="14" class="frame"/>
<text class="title" x="54" y="72">Ktor Exposed example</text>
<text class="subtitle" x="56" y="102">Ktor route transactions run Exposed repositories through AwsExposedPlugin.</text>
<rect x="1000" y="54" width="68" height="24" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="chip" x="1034" y="70" text-anchor="middle">Ktor</text>
<rect x="859.5" y="54" width="78.5" height="24" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="chip" x="898.75" y="70" text-anchor="middle">Exposed</text>
<rect x="719" y="54" width="101" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="chip" x="769.5" y="70" text-anchor="middle">PostgreSQL</text>
<g><g><path class="edge" d="M312 219 L351 219 L351 224 L390 224" stroke="#66758A"/></g>
<g><path class="edge" d="M535 272 L535 338 L535 338 L535 404" stroke="#66758A"/></g>
<g><path class="edge" d="M758 224 L758 338 L680 338 L680 452" stroke="#66758A"/><rect class="label-bg" x="674.8" y="324" width="88.4" height="22" rx="11"/>
<text class="edge-label" x="719" y="340" text-anchor="middle">database</text></g>
<g><path class="edge" d="M680 452 L719 452 L719 452 L758 452" stroke="#66758A"/></g>
<g><path class="edge" d="M758 452 L758 541 L848 541 L848 629" stroke="#66758A"/></g>
<g><path class="edge" d="M903 272 L903 431 L698 431 L698 590" stroke="#66758A" stroke-dasharray="8 8"/><rect class="label-bg" x="774.4" y="417" width="53.2" height="22" rx="11"/>
<text class="edge-label" x="801" y="433" text-anchor="middle">pool</text></g></g>
<g id="client">
  <rect class="card" x="72" y="176" width="240" height="86" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="192" y="216" text-anchor="middle">HTTP client / test</text>
  <text class="detail" x="192" y="240" text-anchor="middle">create, read, list</text>
</g>
<g id="routes">
  <rect class="card" x="390" y="176" width="290" height="96" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="535" y="212.5" text-anchor="middle">Ktor order routes</text>
  <text class="detail" x="535" y="236.5" text-anchor="middle">route handlers</text>
<text class="detail" x="535" y="253.5" text-anchor="middle">404 behavior</text>
</g>
<g id="tx">
  <rect class="card" x="390" y="404" width="290" height="96" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="535" y="440.5" text-anchor="middle">awsExposedTransaction</text>
  <text class="detail" x="535" y="464.5" text-anchor="middle">blocking JDBC</text>
<text class="detail" x="535" y="481.5" text-anchor="middle">Dispatchers.IO</text>
</g>
<g id="repo">
  <rect class="card" x="758" y="404" width="290" height="96" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="903" y="449" text-anchor="middle">OrderRepository</text>
  <text class="detail" x="903" y="473" text-anchor="middle">Exposed queries only</text>
</g>
<g id="plugin">
  <rect class="card" x="758" y="176" width="290" height="96" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="card-title" x="903" y="212.5" text-anchor="middle">AwsExposedPlugin</text>
  <text class="detail" x="903" y="236.5" text-anchor="middle">registry</text>
<text class="detail" x="903" y="253.5" text-anchor="middle">database lifecycle</text>
</g>
<g id="pg">
  <path d="M548 610 C548 586,848 586,848 610 L848 648 C848 672,548 672,548 648 Z" fill="#FFF0E3" stroke="#F47B36" stroke-width="2"/>
  <ellipse cx="698" cy="610" rx="150" ry="20" fill="#FFF0E3" stroke="#F47B36" stroke-width="2"/>
  <text class="card-title" x="698" y="628.5" text-anchor="middle">PostgreSQL database</text>
  <text class="detail" x="698" y="652.5" text-anchor="middle">Testcontainers or production</text>
</g>
<rect class="footer" x="54" y="756" width="1012" height="54" rx="8"/>
<text class="footer-title" x="72" y="785">Example role</text>
<text class="footer-detail" x="72" y="805">Keep HTTP routes, transaction dispatch, repository queries, and database lifecycle separate.</text>
</svg>