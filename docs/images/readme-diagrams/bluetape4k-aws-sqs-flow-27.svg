<rect class="card-blue" x="476" y="346" width="198" height="48" rx="8"/><text class="card-title" x="575" y="366" text-anchor="middle">Send helper</text><text class="card-text" x="575" y="385" text-anchor="middle">single or batch</text>
<rect class="card-teal" x="758" y="346" width="198" height="48" rx="8"/><g transform="translate(776 354) scale(0.72)"><path class="aws-icon" d="M37.449 22.261v3.96l-2.423-2.014 2.423-1.946zM37.81 29.121c.183.152.41.231.639.231.145 0 .289-.031.425-.095.35-.165.575-.517.575-.905v-8.176c0-.385-.221-.735-.567-.901-.347-.167-.759-.119-1.059.122l-5.004 4.017c-.234.188-.371.471-.374.771-.003.301.13.586.361.778l5.004 4.158zM10.527 22.307l2.424 2.015-2.424 1.945v-3.96zM9.095 29.253c.137.067.285.099.432.099.224 0 .445-.075.626-.22l5.005-4.017c.234-.188.371-.471.374-.771.003-.301-.13-.586-.361-.778l-5.005-4.159c-.298-.247-.713-.3-1.064-.136-.35.165-.575.517-.575.905v8.176c0 .385.221.735.568.901zM28.368 34.027h2v-19.28h-2v19.28zM23.121 34.027h2v-19.28h-2v19.28zM17.711 34.027h2v-19.28h-2v19.28zM3.999 35.773h39.978V13.001H3.999v22.772zM44.977 11H3c-.553 0-1 .448-1 1v24.773c0 .552.447 1 1 1h41.977c.553 0 1-.448 1-1V12c0-.552-.447-1-1-1z"/></g><text class="card-title" x="888" y="365" text-anchor="middle">SQS queue</text><text class="card-text" x="888" y="385" text-anchor="middle">stores message</text>
<rect class="card-orange" x="1040" y="346" width="198" height="48" rx="8"/><text class="card-title" x="1139" y="366" text-anchor="middle">Send result</text><text class="card-text" x="1139" y="385" text-anchor="middle">messageId / entries</text>
<path class="arrow-blue" d="M392 370 H476"/><path class="arrow-green" d="M674 370 H758"/><path class="arrow-teal" d="M956 370 H1040"/>

<rect class="lane" x="66" y="430" width="1268" height="118" rx="12"/><text class="lane-title" x="92" y="467">Receive from SQS and acknowledge</text><text class="lane-sub" x="92" y="483">SQS returns messages with receiptHandle; delete only after processing succeeds</text>
<rect class="card-teal" x="194" y="490" width="198" height="48" rx="8"/><g transform="translate(212 498) scale(0.72)"><path class="aws-icon" d="M37.449 22.261v3.96l-2.423-2.014 2.423-1.946zM37.81 29.121c.183.152.41.231.639.231.145 0 .289-.031.425-.095.35-.165.575-.517.575-.905v-8.176c0-.385-.221-.735-.567-.901-.347-.167-.759-.119-1.059.122l-5.004 4.017c-.234.188-.371.471-.374.771-.003.301.13.586.361.778l5.004 4.158zM10.527 22.307l2.424 2.015-2.424 1.945v-3.96zM9.095 29.253c.137.067.285.099.432.099.224 0 .445-.075.626-.22l5.005-4.017c.234-.188.371-.471.374-.771.003-.301-.13-.586-.361-.778l-5.005-4.159c-.298-.247-.713-.3-1.064-.136-.35.165-.575.517-.575.905v8.176c0 .385.221.735.568.901zM28.368 34.027h2v-19.28h-2v19.28zM23.121 34.027h2v-19.28h-2v19.28zM17.711 34.027h2v-19.28h-2v19.28zM3.999 35.773h39.978V13.001H3.999v22.772zM44.977 11H3c-.553 0-1 .448-1 1v24.773c0 .552.447 1 1 1h41.977c.553 0 1-.448 1-1V12c0-.552-.447-1-1-1z"/></g><text class="card-title" x="324" y="509" text-anchor="middle">SQS queue</text><text class="card-text" x="324" y="529" text-anchor="middle">visible messages</text>
<rect class="card-blue" x="476" y="490" width="198" height="48" rx="8"/><text class="card-title" x="575" y="510" text-anchor="middle">Receive helper</text><text class="card-text" x="575" y="529" text-anchor="middle">maxResults 1..10</text>
<rect class="card-green" x="758" y="490" width="198" height="48" rx="8"/><g transform="translate(780 499) scale(0.62)"><path class="aws-icon" d="M36.5 4h2V2h-2v2zM33 2h1.5v2H34v.5h-2V3c0-.552.447-1 1-1zM32 34.5h2v-3h-2v3zM32 40.5h2v-3h-2v3zM32 28.5h2v-3h-2v3zM32 10.5h2v-3h-2v3zM32 16.5h2v-3h-2v3zM32 22.5h2v-3h-2v3zM34 44h.5v2H33c-.553 0-1-.447-1-1v-1.5h2v.5zM36.5 46h2v-2h-2v2zM41 43.5h2V45c0 .553-.447 1-1 1h-1.5v-2h.5v-.5zM41 40.5h2v-3h-2v3zM41 34.5h2v-3h-2v3zM41 16.5h2v-3h-2v3zM41 10.5h2v-3h-2v3zM41 28.5h2v-3h-2v3zM41 22.5h2v-3h-2v3zM43 3v1.5h-2V4h-.5V2H42c.553 0 1 .448 1 1zM23.5 4h2V2h-2v2zM20 2h1.5v2H21v.5h-2V3c0-.552.447-1 1-1zM19 10.5h2v-3h-2v3zM19 34.5h2v-3h-2v3zM19 28.5h2v-3h-2v3zM19 22.5h2v-3h-2v3zM19 40.5h2v-3h-2v3zM19 16.5h2v-3h-2v3zM21 44h.5v2H20c-.553 0-1-.447-1-1v-1.5h2v.5zM23.5 46h2v-2h-2v2zM28 43.5h2V45c0 .553-.447 1-1 1h-1.5v-2h.5v-.5zM28 10.5h2v-3h-2v3zM28 16.5h2v-3h-2v3zM28 22.5h2v-3h-2v3zM28 40.5h2v-3h-2v3zM28 28.5h2v-3h-2v3zM28 34.5h2v-3h-2v3zM30 3v1.5h-2V4h-.5V2H29c.553 0 1 .448 1 1zM7 44h8V4H7v40zM16 2H6c-.553 0-1 .448-1 1v42c0 .553.447 1 1 1h10c.553 0 1-.447 1-1V3c0-.552-.447-1-1-1z"/></g><text class="card-title" x="880" y="509" text-anchor="middle">Message</text><text class="card-text" x="880" y="529" text-anchor="middle">body + handle</text>
<rect class="card-orange" x="1040" y="490" width="198" height="48" rx="8"/><text class="card-title" x="1139" y="510" text-anchor="middle">Visibility / delete</text><text class="card-text" x="1139" y="529" text-anchor="middle">extend or acknowledge</text>
<path class="arrow-blue" d="M392 514 H476"/><path class="arrow-green" d="M674 514 H758"/><path class="arrow-orange" d="M956 514 H1040"/>

<rect class="lane" x="66" y="574" width="1268" height="118" rx="12"/><text class="lane-title" x="92" y="611">Preflight validation</text><text class="lane-sub" x="92" y="627">invalid parameters fail locally before SQS receives a request</text>
<rect class="card-red" x="194" y="634" width="198" height="48" rx="8"/><text class="card-title" x="293" y="654" text-anchor="middle">Blank inputs</text><text class="card-text" x="293" y="673" text-anchor="middle">queue, body, id</text>
<rect class="card-red" x="476" y="634" width="198" height="48" rx="8"/><text class="card-title" x="575" y="654" text-anchor="middle">Receive range</text><text class="card-text" x="575" y="673" text-anchor="middle">1..10, wait 0..20</text>
<rect class="card-red" x="758" y="634" width="198" height="48" rx="8"/><text class="card-title" x="857" y="654" text-anchor="middle">Empty batch</text><text class="card-text" x="857" y="673" text-anchor="middle">send, visibility, delete</text>
<rect class="card-orange" x="1040" y="634" width="198" height="48" rx="8"/><text class="card-title" x="1139" y="654" text-anchor="middle">No network call</text><text class="card-text" x="1139" y="673" text-anchor="middle">IllegalArgumentException</text>
<path class="arrow-red" d="M392 658 H476"/><path class="arrow-red" d="M674 658 H758"/><path class="arrow-red" d="M956 658 H1040"/>

<rect class="note" x="98" y="720" width="580" height="44" rx="8"/><text class="note-title" x="122" y="746" dominant-baseline="middle">Acknowledge</text><text class="note-text" x="286" y="746" dominant-baseline="middle">Delete with the receiptHandle after processing succeeds.</text>
<rect class="note" x="722" y="720" width="580" height="44" rx="8"/><text class="note-title" x="746" y="746" dominant-baseline="middle">Batch</text><text class="note-text" x="850" y="746" dominant-baseline="middle">Batch responses can contain both successful and failed entries.</text>
<rect class="footer" x="54" y="796" width="1292" height="32" rx="8"/><text class="footer-title" x="74" y="812" dominant-baseline="middle">Outcome</text><text class="footer-detail" x="166" y="812" dominant-baseline="middle">Application code gets suspend SQS operations while queue URL, visibility, deletion, and validation boundaries stay explicit.</text>
</svg>
