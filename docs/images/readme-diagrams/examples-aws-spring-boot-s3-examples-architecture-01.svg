<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" role="img" aria-label="Spring Boot S3 example">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="1068" height="808" rx="14" class="frame"/>
<text class="title" x="54" y="72">Spring Boot S3 example</text>
<text class="subtitle" x="56" y="102">WebFlux routes use S3 operations and optional client-side encryption through KMS-backed metadata.</text>
<rect x="985" y="54" width="71" height="24" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="chip" x="1020.5" y="70" text-anchor="middle">Boot 4</text>
<rect x="901" y="54" width="68" height="24" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="chip" x="935" y="70" text-anchor="middle">S3</text>
<rect x="817" y="54" width="68" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="chip" x="851" y="70" text-anchor="middle">KMS</text>
<g><g><path class="edge" d="M312 219 L351 219 L351 208 L390 208" stroke="#66758A"/></g>
<g><path class="edge" d="M680 208 L719 208 L719 208 L758 208" stroke="#66758A"/></g>
<g><path class="edge" d="M535 260 L535 326 L535 326 L535 392" stroke="#66758A"/></g>
<g><path class="edge" d="M680 440 L719 440 L719 440 L758 440" stroke="#66758A"/></g>
<g><path class="edge" d="M903 260 L903 430 L735 430 L735 600" stroke="#66758A"/></g>
<g><path class="edge" d="M680 440 L680 540 L590 540 L590 639" stroke="#66758A"/></g></g>
<g id="client">
  <rect class="card" x="72" y="176" width="240" height="86" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="192" y="216" text-anchor="middle">HTTP client / test</text>
  <text class="detail" x="192" y="240" text-anchor="middle">document route calls</text>
</g>
<g id="controller">
  <rect class="card" x="390" y="156" width="290" height="104" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="535" y="196.5" text-anchor="middle">S3DocumentController</text>
  <text class="detail" x="535" y="220.5" text-anchor="middle">upload, download, list</text>
<text class="detail" x="535" y="237.5" text-anchor="middle">presigned URL, delete</text>
</g>
<g id="ops">
  <rect class="card" x="758" y="156" width="290" height="104" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="903" y="196.5" text-anchor="middle">S3Operations</text>
  <text class="detail" x="903" y="220.5" text-anchor="middle">S3CoroutinesTemplate</text>
<text class="detail" x="903" y="237.5" text-anchor="middle">transfer and presign</text>
</g>
<g id="encrypt">
  <rect class="card" x="390" y="392" width="290" height="96" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="535" y="428.5" text-anchor="middle">Encryption routes</text>
  <text class="detail" x="535" y="452.5" text-anchor="middle">client-side envelope</text>
<text class="detail" x="535" y="469.5" text-anchor="middle">tenant context</text>
</g>
<g id="kms">
  <rect class="card" x="758" y="392" width="290" height="96" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="card-title" x="903" y="437" text-anchor="middle">KmsOperations</text>
  <text class="detail" x="903" y="461" text-anchor="middle">data key metadata</text>
</g>
<g id="s3">
  <rect class="card" x="590" y="600" width="290" height="78" rx="10" fill="#FFF0E3" stroke="#F47B36"/>
  <text class="card-title" x="735" y="636" text-anchor="middle">S3 endpoint</text>
  <text class="detail" x="735" y="660" text-anchor="middle">LocalStack or AWS</text>
</g>
<rect class="footer" x="54" y="756" width="1012" height="54" rx="8"/>
<text class="footer-title" x="72" y="785">Example role</text>
<text class="footer-detail" x="72" y="805">Show upload/download APIs, presigned URLs, object listing, and envelope encryption extension points.</text>
</svg>