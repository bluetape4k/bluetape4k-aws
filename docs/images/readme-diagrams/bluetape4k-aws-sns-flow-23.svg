<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">SNS publish and HTTP endpoint flow</title>
<desc id="desc">SNS operations publish to topics or SMS, fan out to SQS when policies allow it, and parse HTTP endpoint messages before caller-owned signature verification.</desc>
<defs>
  <style>
    .canvas{fill:#FFFFFF}.frame{fill:#FFFFFF;stroke:#D9E3EF;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:17px;fill:#5A6B7F}
    .legend{font-family:"Comic Mono";font-size:12px;font-weight:700;fill:#334155}
    .lane{fill:#F8FAFC;stroke:#D8E2ED;stroke-width:1.6}.lane-title{font-family:"Architects Daughter";font-size:25px;fill:#102033}.lane-sub{font-family:"Comic Mono";font-size:13px;fill:#5A6B7F}
    .card-title{font-family:"Architects Daughter";font-size:23px;fill:#102033}.card-text{font-family:"Comic Mono";font-size:13px;fill:#5A6B7F}
    .card-blue{fill:#E8F2FF;stroke:#4F8AF7;stroke-width:2.2}.card-green{fill:#E9F7EF;stroke:#45A06B;stroke-width:2.2}.card-teal{fill:#EAF8F7;stroke:#47B8B1;stroke-width:2.2}.card-orange{fill:#FFF4E6;stroke:#F97316;stroke-width:2.2}.card-amber{fill:#FFF8E6;stroke:#F59E0B;stroke-width:2.2}
    .note{fill:#FFFFFF;stroke:#D8E2ED;stroke-width:1.4}.note-title{font-family:"Architects Daughter";font-size:20px;fill:#102033}.note-text{font-family:"Comic Mono";font-size:12px;fill:#5A6B7F}
    .footer{fill:#0E2238;stroke:#0E2238}.footer-title{font-family:"Architects Daughter";font-size:17px;fill:#FFFFFF}.footer-detail{font-family:"Comic Mono";font-size:12px;fill:#DDE7F2}
    .arrow-blue{stroke:#2563EB;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}.arrow-green{stroke:#15803D;stroke-width:3;fill:none;marker-end:url(#arrow-green)}.arrow-teal{stroke:#0F8E89;stroke-width:3;fill:none;marker-end:url(#arrow-teal)}.arrow-orange{stroke:#EA580C;stroke-width:3;fill:none;marker-end:url(#arrow-orange)}
  </style>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563EB"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#15803D"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#0F8E89"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#EA580C"/></marker>
</defs>
<rect class="canvas" x="0" y="0" width="1400" height="760"/><rect class="frame" x="24" y="24" width="1352" height="712" rx="14"/>
<text class="title" x="54" y="74">SNS publish and HTTP endpoint flow</text>
<text class="subtitle" x="54" y="108">Publishing is coroutine-first; HTTP endpoint messages still require caller-owned SNS signature verification.</text>
<rect class="card-blue" x="906" y="62" width="118" height="24" rx="12" opacity="0.24"/><text class="legend" x="965" y="78" text-anchor="middle">Publish</text>
<rect class="card-green" x="1042" y="62" width="118" height="24" rx="12" opacity="0.24"/><text class="legend" x="1101" y="78" text-anchor="middle">Fanout</text>
<rect class="card-orange" x="1178" y="62" width="136" height="24" rx="12" opacity="0.24"/><text class="legend" x="1246" y="78" text-anchor="middle">Endpoint</text>

<rect class="lane" x="66" y="146" width="1268" height="134" rx="12"/><text class="lane-title" x="92" y="184">Topic publish</text><text class="lane-sub" x="92" y="204">standard and FIFO topics use the same SnsPublishRequest value object</text>
<rect class="card-blue" x="182" y="212" width="206" height="58" rx="8"/><text class="card-title" x="285" y="235" text-anchor="middle">Build request</text><text class="card-text" x="285" y="257" text-anchor="middle">topic + message</text>
<rect class="card-teal" x="466" y="212" width="206" height="58" rx="8"/><text class="card-title" x="569" y="235" text-anchor="middle">Validate FIFO</text><text class="card-text" x="569" y="257" text-anchor="middle">group id required</text>
<rect class="card-orange" x="750" y="212" width="206" height="58" rx="8"/><text class="card-title" x="853" y="235" text-anchor="middle">SNS publish</text><text class="card-text" x="853" y="257" text-anchor="middle">SDK errors propagate</text>
<rect class="card-green" x="1034" y="212" width="206" height="58" rx="8"/><text class="card-title" x="1137" y="235" text-anchor="middle">Message id</text><text class="card-text" x="1137" y="257" text-anchor="middle">caller observes</text>
<path class="arrow-blue" d="M388 241 H466"/><path class="arrow-teal" d="M672 241 H750"/><path class="arrow-orange" d="M956 241 H1034"/>

<rect class="lane" x="66" y="310" width="1268" height="134" rx="12"/><text class="lane-title" x="92" y="348">Fanout and SMS</text><text class="lane-sub" x="92" y="368">SQS fanout depends on queue policy; SMS uses SNS message attributes</text>
<rect class="card-green" x="182" y="376" width="206" height="58" rx="8"/><text class="card-title" x="285" y="399" text-anchor="middle">Topic policy</text><text class="card-text" x="285" y="421" text-anchor="middle">allow sqs:SendMessage</text>
<rect class="card-green" x="466" y="376" width="206" height="58" rx="8"/><text class="card-title" x="569" y="399" text-anchor="middle">SQS fanout</text><text class="card-text" x="569" y="421" text-anchor="middle">queue receives copy</text>
<rect class="card-blue" x="750" y="376" width="206" height="58" rx="8"/><text class="card-title" x="853" y="399" text-anchor="middle">SMS request</text><text class="card-text" x="853" y="421" text-anchor="middle">type, sender, price</text>
<rect class="card-orange" x="1034" y="376" width="206" height="58" rx="8"/><text class="card-title" x="1137" y="399" text-anchor="middle">Direct SMS</text><text class="card-text" x="1137" y="421" text-anchor="middle">phoneNumber publish</text>
<path class="arrow-green" d="M388 405 H466"/><path class="arrow-orange" d="M956 405 H1034"/>

<rect class="lane" x="66" y="474" width="1268" height="134" rx="12"/><text class="lane-title" x="92" y="512">HTTP endpoint</text><text class="lane-sub" x="92" y="532">parser validates message shape and safe SigningCertURL, then caller verifies trust</text>
<rect class="card-orange" x="182" y="540" width="206" height="58" rx="8"/><text class="card-title" x="285" y="563" text-anchor="middle">Parse JSON</text><text class="card-text" x="285" y="585" text-anchor="middle">Type + header match</text>
<rect class="card-orange" x="466" y="540" width="206" height="58" rx="8"/><text class="card-title" x="569" y="563" text-anchor="middle">Check cert URL</text><text class="card-text" x="569" y="585" text-anchor="middle">HTTPS SNS host</text>
<rect class="card-amber" x="750" y="540" width="206" height="58" rx="8"/><text class="card-title" x="853" y="563" text-anchor="middle">Verify trust</text><text class="card-text" x="853" y="585" text-anchor="middle">caller responsibility</text>
<rect class="card-green" x="1034" y="540" width="206" height="58" rx="8"/><text class="card-title" x="1137" y="563" text-anchor="middle">Confirm/process</text><text class="card-text" x="1137" y="585" text-anchor="middle">token or message</text>
<path class="arrow-orange" d="M388 569 H466"/><path class="arrow-orange" d="M672 569 H750"/><path class="arrow-green" d="M956 569 H1034"/>

<rect class="note" x="98" y="636" width="580" height="44" rx="8"/><text class="note-title" x="122" y="662" dominant-baseline="middle">Subscription</text><text class="note-text" x="286" y="662" dominant-baseline="middle">Confirm only after signature, cert chain, and TopicArn checks.</text>
<rect class="note" x="722" y="636" width="580" height="44" rx="8"/><text class="note-title" x="746" y="662" dominant-baseline="middle">Boundary</text><text class="note-text" x="870" y="662" dominant-baseline="middle">The parser rejects malformed SNS shape, not forged signed messages.</text>
<rect class="footer" x="54" y="696" width="1292" height="32" rx="8"/><text class="footer-title" x="74" y="712" dominant-baseline="middle">Outcome</text><text class="footer-detail" x="166" y="712" dominant-baseline="middle">SNS operations publish and confirm; application code still owns endpoint trust and subscription policy decisions.</text>
</svg>
