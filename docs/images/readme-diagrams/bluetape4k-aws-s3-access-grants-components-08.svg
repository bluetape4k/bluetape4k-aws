<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-label="S3 Access Grants Spring Boot components">
<defs>
  <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%">
    <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/>
  </filter>
  <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F6DE0"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F8B57"/>
  </marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#168E86"/>
  </marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#EA580C"/>
  </marker>
  <marker id="arrow-slate" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
  </marker>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter";font-size:38px;fill:#102033}
  .subtitle,.detail,.tiny,.chip{font-family:"Comic Mono";fill:#526274}
  .subtitle{font-size:16px}
  .layer-title{font-family:"Architects Daughter";font-size:24px;fill:#102033}
  .layer-detail{font-family:"Comic Mono";font-size:12px;fill:#526274}
  .card-title{font-family:"Architects Daughter";font-size:21px;fill:#102033}
  .detail{font-size:13px}
  .tiny{font-size:11px}
  .chip{font-size:11px;fill:#243447}
  .layer{fill:#F8FAFC;stroke:#D9E2EC;stroke-width:1.4}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
  .soft-edge{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter";font-size:17px;fill:#FFFFFF}
  .footer-detail{font-family:"Comic Mono";font-size:12px;fill:#DDE7F2}
</style>

<rect x="26" y="26" width="1388" height="708" rx="14" class="frame"/>
<text class="title" x="54" y="74">S3 Access Grants components</text>
<text class="subtitle" x="56" y="106">Spring Boot registers S3 Control clients only when Access Grants is enabled and the optional SDK is present.</text>

<g>
  <rect x="972" y="57" width="132" height="25" rx="12.5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="chip" x="1038" y="70.5" text-anchor="middle" dominant-baseline="middle">Opt-in</text>
  <rect x="1118" y="57" width="132" height="25" rx="12.5" fill="#EAF7EF" stroke="#58A978"/>
  <text class="chip" x="1184" y="70.5" text-anchor="middle" dominant-baseline="middle">Coroutine</text>
  <rect x="1264" y="57" width="106" height="25" rx="12.5" fill="#FFF7ED" stroke="#F97316"/>
  <text class="chip" x="1317" y="70.5" text-anchor="middle" dominant-baseline="middle">S3Control</text>
</g>

<g id="layers">
  <rect class="layer" x="70" y="142" width="300" height="412" rx="12"/>
  <text class="layer-title" x="92" y="178">Activation</text>
  <text class="layer-detail" x="94" y="200">Classpath and property gates</text>

  <rect class="layer" x="405" y="142" width="330" height="412" rx="12"/>
  <text class="layer-title" x="427" y="178">Spring Boot beans</text>
  <text class="layer-detail" x="429" y="200">S3 Control clients and template</text>

  <rect class="layer" x="770" y="142" width="300" height="412" rx="12"/>
  <text class="layer-title" x="792" y="178">Application API</text>
  <text class="layer-detail" x="794" y="200">Read and data-access path</text>

  <rect class="layer" x="1105" y="142" width="265" height="412" rx="12"/>
  <text class="layer-title" x="1127" y="178">AWS boundary</text>
  <text class="layer-detail" x="1129" y="200">S3 Control and object client</text>
</g>

<g id="cards">
  <rect class="card" x="100" y="238" width="240" height="102" rx="9" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="220" y="274" text-anchor="middle">Runtime dependency</text>
  <text class="detail" x="220" y="302" text-anchor="middle">aws-sdk s3control</text>
  <text class="detail" x="220" y="322" text-anchor="middle">ConditionalOnClass</text>

  <rect class="card" x="100" y="390" width="240" height="102" rx="9" fill="#F0F6FF" stroke="#7AA3F5"/>
  <text class="card-title" x="220" y="426" text-anchor="middle">Opt-in property</text>
  <text class="detail" x="220" y="454" text-anchor="middle">access-grants.enabled</text>
  <text class="detail" x="220" y="474" text-anchor="middle">region/endpoint</text>

  <rect class="card" x="435" y="222" width="270" height="112" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="570" y="258" text-anchor="middle">Auto-configuration</text>
  <text class="detail" x="570" y="286" text-anchor="middle">after Aws/S3 config</text>
  <text class="detail" x="570" y="306" text-anchor="middle">global customizers</text>

  <rect class="card" x="435" y="382" width="270" height="112" rx="9" fill="#EEF9F1" stroke="#75B989"/>
  <text class="card-title" x="570" y="418" text-anchor="middle">S3 Control clients</text>
  <text class="detail" x="570" y="446" text-anchor="middle">sync and async</text>
  <text class="detail" x="570" y="466" text-anchor="middle">back off on custom bean</text>

  <rect class="card" x="800" y="222" width="240" height="112" rx="9" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="920" y="258" text-anchor="middle">AccessGrantsOps</text>
  <text class="detail" x="920" y="286" text-anchor="middle">getDataAccess</text>
  <text class="detail" x="920" y="306" text-anchor="middle">list read APIs</text>

  <rect class="card" x="800" y="382" width="240" height="112" rx="9" fill="#F3FBFA" stroke="#63B8B3"/>
  <text class="card-title" x="920" y="418" text-anchor="middle">Admin boundary</text>
  <text class="detail" x="920" y="446" text-anchor="middle">create/update/delete</text>
  <text class="detail" x="920" y="466" text-anchor="middle">raw S3Control beans</text>

  <rect class="card" x="1140" y="222" width="200" height="112" rx="9" fill="#FFF7ED" stroke="#F97316"/>
  <text class="card-title" x="1240" y="258" text-anchor="middle">S3 Control</text>
  <text class="detail" x="1240" y="286" text-anchor="middle">grant lookup</text>
  <text class="detail" x="1240" y="306" text-anchor="middle">data credentials</text>

  <rect class="card" x="1140" y="382" width="200" height="112" rx="9" fill="#FFF4E6" stroke="#F59E0B"/>
  <text class="card-title" x="1240" y="418" text-anchor="middle">S3 object I/O</text>
  <text class="detail" x="1240" y="446" text-anchor="middle">separate client</text>
  <text class="detail" x="1240" y="466" text-anchor="middle">scoped access</text>
</g>

<g id="connections">
  <path class="edge" d="M 340 289 L 435 278" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
  <path class="soft-edge" d="M 340 441 L 435 278" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M 570 334 L 570 382" stroke="#2F8B57" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M 705 438 L 800 278" stroke="#2F8B57" marker-end="url(#arrow-green)"/>
  <path class="soft-edge" d="M 705 438 L 800 438" stroke="#475569" marker-end="url(#arrow-slate)"/>
  <path class="edge" d="M 1040 278 L 1140 278" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
  <path class="soft-edge" d="M 1040 438 L 1140 278" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
  <path class="soft-edge" d="M 1040 438 L 1140 438" stroke="#168E86" marker-end="url(#arrow-teal)"/>
</g>

<g id="contracts">
  <rect x="86" y="584" width="600" height="72" rx="10" fill="#FFFFFF" stroke="#D9E2EC"/>
  <text class="card-title" x="110" y="616">Activation contract</text>
  <text class="detail" x="344" y="614">disabled by default</text>
  <text class="detail" x="546" y="614">S3 parent enabled</text>
  <text class="tiny" x="110" y="640">Endpoint override needs a region, either service-specific or shared AWS defaults.</text>

  <rect x="724" y="584" width="630" height="72" rx="10" fill="#FFFFFF" stroke="#D9E2EC"/>
  <text class="card-title" x="748" y="616">Reader cue</text>
  <text class="detail" x="936" y="614">read path</text>
  <text class="detail" x="1088" y="614">data access</text>
  <text class="detail" x="1232" y="614">raw admin</text>
  <text class="tiny" x="748" y="640">The operations facade does not hide administrative S3 Control calls.</text>
</g>

<rect class="footer" x="54" y="690" width="1332" height="34" rx="8"/>
<text class="footer-title" x="74" y="710" dominant-baseline="middle">Boundary</text>
<text class="footer-detail" x="178" y="710" dominant-baseline="middle">Access Grants resolves scoped credentials; normal S3 object transfer remains a separate client concern.</text>
</svg>
