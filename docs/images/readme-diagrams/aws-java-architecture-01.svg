<g><path class="edge" d="M1160 402 L1160 434 L680 434 L680 500" stroke="#66758A"/></g>
<g><path class="edge" d="M680 594 L680 609 L680 609 L680 624" stroke="#66758A"/></g></g>
<g id="app">
  <rect class="card" x="520" y="142" width="320" height="84" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="680" y="181" text-anchor="middle">Application code</text>
  <text class="detail" x="680" y="205" text-anchor="middle">blocking, async, or suspend call sites</text>
</g>
<g id="factories">
  <rect class="card" x="70" y="310" width="260" height="92" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="200" y="344.5" text-anchor="middle">Client factories</text>
  <text class="detail" x="200" y="368.5" text-anchor="middle">service-specific sync</text>
<text class="detail" x="200" y="385.5" text-anchor="middle">and async builders</text>
</g>
<g id="dsl">
  <rect class="card" x="390" y="310" width="260" height="92" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="520" y="344.5" text-anchor="middle">Request DSL helpers</text>
  <text class="detail" x="520" y="368.5" text-anchor="middle">model builders</text>
<text class="detail" x="520" y="385.5" text-anchor="middle">typed shortcuts</text>
</g>
<g id="coroutine">
  <rect class="card" x="710" y="310" width="260" height="92" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="840" y="344.5" text-anchor="middle">Coroutine adapters</text>
  <text class="detail" x="840" y="368.5" text-anchor="middle">CompletableFuture.await</text>
<text class="detail" x="840" y="385.5" text-anchor="middle">Flow bridges</text>
</g>
<g id="batch">
  <rect class="card" x="1030" y="310" width="260" height="92" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="card-title" x="1160" y="344.5" text-anchor="middle">DynamoDB helpers</text>
  <text class="detail" x="1160" y="368.5" text-anchor="middle">batch and repository</text>
<text class="detail" x="1160" y="385.5" text-anchor="middle">Enhanced Async tables</text>
</g>
<g id="sdk">
  <rect class="card" x="470" y="500" width="420" height="94" rx="10" fill="#F4F7FA" stroke="#8CA0B3"/>
  <text class="card-title" x="680" y="535.5" text-anchor="middle">AWS Java SDK v2 clients</text>
  <text class="detail" x="680" y="559.5" text-anchor="middle">S3, SQS, SNS, DynamoDB</text>
<text class="detail" x="680" y="576.5" text-anchor="middle">KMS, CloudWatch, Kinesis, STS</text>
</g>
<g id="aws">
  <rect class="card" x="540" y="624" width="280" height="78" rx="10" fill="#FFF0E3" stroke="#F47B36"/>
  <text class="card-title" x="680" y="660" text-anchor="middle">AWS services</text>
  <text class="detail" x="680" y="684" text-anchor="middle">or LocalStack / Floci</text>
</g>
<rect class="footer" x="54" y="736" width="1252" height="54" rx="8"/>
<text class="footer-title" x="72" y="755" dominant-baseline="middle">Module role</text>
<text class="footer-detail" x="72" y="773" dominant-baseline="middle">Expose Kotlin-friendly builders and suspend bridges while consumers choose concrete AWS SDK services.</text>
</svg>