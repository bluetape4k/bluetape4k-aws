<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="840" viewBox="0 0 1360 840" role="img" aria-label="aws-java architecture">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="1308" height="788" rx="14" class="frame"/>
<text class="title" x="54" y="72">aws-java architecture</text>
<text class="subtitle" x="56" y="102">Java SDK v2 clients stay underneath Kotlin builders, async futures, and coroutine adapters.</text>
<rect x="1187.5" y="54" width="108.5" height="24" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="chip" x="1241.75" y="70" text-anchor="middle">Java SDK v2</text>
<rect x="1070.5" y="54" width="101" height="24" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="chip" x="1121" y="70" text-anchor="middle">Coroutines</text>
<rect x="968.5" y="54" width="86" height="24" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="chip" x="1011.5" y="70" text-anchor="middle">DynamoDB</text>
<g><g><path class="edge" d="M680 226 L680 258 L200 258 L200 310" stroke="#66758A"/></g>
<g><path class="edge" d="M680 226 L680 258 L520 258 L520 310" stroke="#66758A"/></g>
<g><path class="edge" d="M680 226 L680 258 L840 258 L840 310" stroke="#66758A"/></g>
<g><path class="edge" d="M680 226 L680 258 L1160 258 L1160 310" stroke="#66758A"/></g>
<g><path class="edge" d="M200 402 L200 434 L680 434 L680 500" stroke="#66758A"/></g>
<g><path class="edge" d="M520 402 L520 434 L680 434 L680 500" stroke="#66758A"/></g>
