<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-label="SQS listener receive handle acknowledgement flow">
<defs>
  <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
  <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F6DE0"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F8B57"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#168E86"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#EA580C"/></marker>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter";font-size:38px;fill:#102033}
  .subtitle,.detail,.tiny,.chip{font-family:"Comic Mono";fill:#526274}
  .subtitle{font-size:16px}.detail{font-size:13px}.tiny{font-size:11px}.chip{font-size:11px;fill:#243447}
  .lane-title{font-family:"Architects Daughter";font-size:24px;fill:#102033}
  .lane-detail{font-family:"Comic Mono";font-size:12px;fill:#526274}
  .card-title{font-family:"Architects Daughter";font-size:21px;fill:#102033}
  .lane{fill:#F8FAFC;stroke:#D9E2EC;stroke-width:1.4}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter";font-size:17px;fill:#FFFFFF}
  .footer-detail{font-family:"Comic Mono";font-size:12px;fill:#DDE7F2}
</style>

<rect x="26" y="26" width="1388" height="708" rx="14" class="frame"/>
<text class="title" x="54" y="74">SQS listener flow</text>
<text class="subtitle" x="56" y="106">The listener receives batches, invokes one handler attempt at a time, and deletes only after acknowledgement.</text>

<g>
  <rect x="950" y="57" width="126" height="25" rx="12.5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="chip" x="1013" y="70.5" text-anchor="middle" dominant-baseline="middle">Receive</text>
  <rect x="1092" y="57" width="126" height="25" rx="12.5" fill="#EAF7EF" stroke="#58A978"/>
  <text class="chip" x="1155" y="70.5" text-anchor="middle" dominant-baseline="middle">Handle</text>
  <rect x="1234" y="57" width="136" height="25" rx="12.5" fill="#FFF7ED" stroke="#F97316"/>
  <text class="chip" x="1302" y="70.5" text-anchor="middle" dominant-baseline="middle">Failure path</text>
</g>

<g id="lanes">
  <rect class="lane" x="70" y="150" width="1300" height="145" rx="12"/>
  <text class="lane-title" x="96" y="188">Receive loop</text>
  <text class="lane-detail" x="98" y="210">SmartLifecycle starts polling coroutines; queue names resolve to configured URLs or GetQueueUrl</text>
  <rect class="lane" x="70" y="324" width="1300" height="145" rx="12"/>
  <text class="lane-title" x="96" y="362">Successful handler</text>
  <text class="lane-detail" x="98" y="384">The method invoker builds arguments, calls suspend or blocking handlers, then acknowledges when appropriate</text>
  <rect class="lane" x="70" y="498" width="1300" height="145" rx="12"/>
  <text class="lane-title" x="96" y="536">Retry and failure</text>
  <text class="lane-detail" x="98" y="558">Failures retry in-process before the container optionally changes message visibility</text>
</g>

<g id="cards">
  <rect class="card" x="150" y="218" width="210" height="56" rx="9" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="255" y="241" text-anchor="middle">Start container</text>
  <text class="detail" x="255" y="260" text-anchor="middle">concurrency jobs</text>
  <rect class="card" x="470" y="218" width="210" height="56" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="575" y="241" text-anchor="middle">Resolve queue</text>
  <text class="detail" x="575" y="260" text-anchor="middle">URL or GetQueueUrl</text>
  <rect class="card" x="790" y="218" width="210" height="56" rx="9" fill="#F3FBFA" stroke="#63B8B3"/>
  <text class="card-title" x="895" y="241" text-anchor="middle">Receive batch</text>
  <text class="detail" x="895" y="260" text-anchor="middle">max 1..10 messages</text>
  <rect class="card" x="1110" y="218" width="180" height="56" rx="9" fill="#FFF7ED" stroke="#F97316"/>
  <text class="card-title" x="1200" y="241" text-anchor="middle">Interceptors</text>
  <text class="detail" x="1200" y="260" text-anchor="middle">receive timing</text>

  <rect class="card" x="150" y="392" width="210" height="56" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="255" y="415" text-anchor="middle">Build args</text>
  <text class="detail" x="255" y="434" text-anchor="middle">body / JSON / ack</text>
  <rect class="card" x="470" y="392" width="210" height="56" rx="9" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="575" y="415" text-anchor="middle">Invoke handler</text>
  <text class="detail" x="575" y="434" text-anchor="middle">suspend or blocking</text>
  <rect class="card" x="790" y="392" width="210" height="56" rx="9" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="895" y="415" text-anchor="middle">Ack decision</text>
  <text class="detail" x="895" y="434" text-anchor="middle">auto unless manual</text>
  <rect class="card" x="1110" y="392" width="180" height="56" rx="9" fill="#FFF7ED" stroke="#F97316"/>
  <text class="card-title" x="1200" y="415" text-anchor="middle">Delete</text>
  <text class="detail" x="1200" y="434" text-anchor="middle">receipt handle</text>

  <rect class="card" x="230" y="566" width="230" height="56" rx="9" fill="#FFF4E6" stroke="#F59E0B"/>
  <text class="card-title" x="345" y="589" text-anchor="middle">Handler error</text>
  <text class="detail" x="345" y="608" text-anchor="middle">ack not completed</text>
  <rect class="card" x="570" y="566" width="230" height="56" rx="9" fill="#F3FBFA" stroke="#63B8B3"/>
  <text class="card-title" x="685" y="589" text-anchor="middle">Retry backoff</text>
  <text class="detail" x="685" y="608" text-anchor="middle">maxAttempts + jitter</text>
  <rect class="card" x="910" y="566" width="230" height="56" rx="9" fill="#FFF7ED" stroke="#F97316"/>
  <text class="card-title" x="1025" y="589" text-anchor="middle">Final failure</text>
  <text class="detail" x="1025" y="608" text-anchor="middle">change visibility</text>
</g>

<g id="connections">
  <path class="edge" d="M 360 246 L 470 246" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M 680 246 L 790 246" stroke="#2F8B57" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M 1000 246 L 1110 246" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
  <path class="edge" d="M 360 420 L 470 420" stroke="#2F8B57" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M 680 420 L 790 420" stroke="#168E86" marker-end="url(#arrow-teal)"/>
  <path class="edge" d="M 1000 420 L 1110 420" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M 460 594 L 570 594" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
  <path class="edge" d="M 800 594 L 910 594" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
</g>

<rect class="footer" x="54" y="704" width="1332" height="30" rx="8"/>
<text class="footer-title" x="74" y="721" dominant-baseline="middle">Outcome</text>
<text class="footer-detail" x="176" y="721" dominant-baseline="middle">Successful processing deletes the message; failed processing leaves SQS redelivery semantics intact.</text>
</svg>
