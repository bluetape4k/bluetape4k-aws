<g id="m10"><rect class="labelPill" x="1010" y="995" width="320" height="26" rx="7" stroke="#755BC6"/><circle cx="1029" cy="1008" r="12" fill="#755BC6"/><text class="badgeText" x="1029" y="1009" text-anchor="middle" dominant-baseline="middle">10</text><text class="msgText" x="1180" y="1009" text-anchor="middle" dominant-baseline="middle" fill="#755BC6">SDK 재시도 시 최신 세대 선택</text><path class="seqReturn" d="M 1345 1025 L 980 1025" stroke="#755BC6"/><polygon points="992,1018.4 980,1025 992,1031.6" fill="#755BC6" stroke="#755BC6" data-direct-solid-head="true"/></g>
<g id="m11"><rect class="labelPill" x="1000" y="1032" width="330" height="26" rx="7" stroke="#C96C4B"/><circle cx="1019" cy="1045" r="12" fill="#C96C4B"/><text class="badgeText" x="1019" y="1046" text-anchor="middle" dominant-baseline="middle">11</text><text class="msgText" x="1180" y="1046" text-anchor="middle" dominant-baseline="middle" fill="#C96C4B">이전 스트림 취소, 늦은 신호 폐기</text><path class="seq" d="M 980 1062 L 1345 1062" stroke="#C96C4B" marker-end="url(#arrow-coral)"/></g>
