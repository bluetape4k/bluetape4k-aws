<g id="m14"><rect class="labelPill" x="320" y="1138" width="225" height="26" rx="7" stroke="#2E8F89"/><circle cx="339" cy="1151" r="12" fill="#2E8F89"/><text class="badgeText" x="339" y="1152" text-anchor="middle" dominant-baseline="middle">14</text><text class="msgText" x="440" y="1152" text-anchor="middle" dominant-baseline="middle" fill="#2E8F89">종료 후 닫기</text><path class="seqReturn" d="M 610 1172 L 240 1172" stroke="#2E8F89"/><polygon points="252,1165.4 240,1172 252,1178.6" fill="#2E8F89" stroke="#2E8F89" data-direct-solid-head="true"/></g>

<g><rect x="120" y="1200" width="1720" height="56" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="footer" x="980" y="1222" text-anchor="middle">Flow를 다시 수집하면 과금되는 새 요청이 발생할 수 있습니다. Java는 request(1)로 요청량을 제한하며 원문 입출력을 기록하지 않습니다.</text><text class="footer" x="980" y="1244" text-anchor="middle">SDK 재시도는 의미가 같은 출력을 반복할 수 있고 정확히 한 번(exactly-once)을 보장하지 않습니다. 트랜잭션 작업에는 비스트리밍 Converse를 사용하세요.</text></g>
</svg>
