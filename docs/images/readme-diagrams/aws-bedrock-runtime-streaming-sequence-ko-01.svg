  <rect class="labelPill" x="205" y="1056" width="220" height="28" rx="7" stroke="#2E8F89"/><circle cx="224" cy="1070" r="12" fill="#2E8F89"/><text class="badgeText" x="224" y="1071" text-anchor="middle" dominant-baseline="middle">12</text><text class="detail" x="327" y="1070" text-anchor="middle" dominant-baseline="middle">else 정상 완료</text>
