<rect class="frame" x="32" y="28" width="1896" height="1264" rx="30"/>
<text class="title" x="68" y="84">Amazon Bedrock Runtime 스트리밍 시퀀스</text>
<text class="subtitle" x="72" y="116">클라이언트 범위 안에서 차가운 Flow를 수집하고, 종료 시 SDK 스트림을 함께 정리합니다.</text>

