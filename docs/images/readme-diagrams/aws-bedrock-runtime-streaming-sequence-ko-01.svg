<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1960" height="1320" viewBox="0 0 1960 1320" role="img" aria-labelledby="title desc">
<title id="title">범위가 지정된 Flow 수집으로 Amazon Bedrock Runtime 스트리밍 사용</title>
<desc id="desc">호출자가 범위 안에서 Bedrock Runtime 클라이언트를 열고, 차가운 ConverseStream Flow를 수집해 텍스트 델타를 추출하며, takeUntil로 중단한 뒤 SDK 스트림과 클라이언트를 순서대로 정리하는 흐름입니다.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow-blue" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F83BF" stroke="#4F83BF" stroke-dasharray="none"/></marker>
  <marker id="arrow-purple" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#755BC6" stroke="#755BC6" stroke-dasharray="none"/></marker>
  <marker id="arrow-green" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3E9868" stroke="#3E9868" stroke-dasharray="none"/></marker>
  <marker id="arrow-amber" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B9851B" stroke="#B9851B" stroke-dasharray="none"/></marker>
  <marker id="arrow-teal" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2E8F89" stroke="#2E8F89" stroke-dasharray="none"/></marker>
  <marker id="arrow-coral" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#C96C4B" stroke="#C96C4B" stroke-dasharray="none"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"goorm Sans";font-size:44px;font-weight:700;fill:#263238}.subtitle,.footer,.detail{font-family:"goorm Sans";font-size:17px;fill:#536476}.footer{font-size:14px;fill:#60727D}.detail{font-size:14px;fill:#42556B}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"goorm Sans";font-size:24px;font-weight:700;fill:#22344A}.role{font-family:"goorm Sans Code","goorm Sans";font-size:11px;fill:#546A73}
    .lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}.activation{stroke-width:1.5;rx:5}.seq{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.seqReturn{fill:none;stroke-width:2.5;stroke-dasharray:8 6;stroke-linecap:round;stroke-linejoin:round}
    .labelPill{fill:#FFF;stroke:#D7E0E4;stroke-width:1.3}.badgeText{font-family:"goorm Sans Code";font-size:12px;font-weight:700;fill:#FFF}.msgText{font-family:"goorm Sans Code","goorm Sans";font-size:15px;font-weight:700}.altBox{fill:#EEF7F0;fill-opacity:.18;stroke:#78909C;stroke-width:2.4;stroke-dasharray:12 7}.branchDivider{stroke:#78909C;stroke-width:2.4;stroke-dasharray:12 8}
