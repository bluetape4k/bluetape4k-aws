<g id="participant-bedrock"><rect class="card" x="1580" y="168" width="250" height="80" rx="10" fill="#E9F7F6" stroke="#45A7A1"/><image xlink:href="../../assets/aws-icons/official-04302026/Architecture-Service-Icons_04302026/Arch_Artificial-Intelligence/48/Arch_Amazon-Bedrock_48.svg" x="1588" y="184" width="48" height="48" preserveAspectRatio="xMidYMid meet"/><text class="cardTitle" x="1644" y="207">Amazon Bedrock</text><text class="role" x="1644" y="232">ConverseStream API</text><line class="lifeline" x1="1705" y1="248" x2="1705" y2="1155"/></g>

