<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-label="Secrets Manager and Parameter Store property key mapping flow">
<defs>
  <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
  <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F6DE0"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F8B57"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#168E86"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#EA580C"/></marker>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter";font-size:38px;fill:#102033}
  .subtitle,.detail,.tiny,.chip{font-family:"Comic Mono";fill:#526274}
  .subtitle{font-size:16px}.detail{font-size:13px}.tiny{font-size:11px}.chip{font-size:11px;fill:#243447}
  .lane-title{font-family:"Architects Daughter";font-size:24px;fill:#102033}
  .lane-detail{font-family:"Comic Mono";font-size:12px;fill:#526274}
  .card-title{font-family:"Architects Daughter";font-size:21px;fill:#102033}
  .lane{fill:#F8FAFC;stroke:#D9E2EC;stroke-width:1.4}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter";font-size:17px;fill:#FFFFFF}
  .footer-detail{font-family:"Comic Mono";font-size:12px;fill:#DDE7F2}
</style>

<rect x="26" y="26" width="1388" height="708" rx="14" class="frame"/>
<text class="title" x="54" y="74">Environment key mapping</text>
<text class="subtitle" x="56" y="106">Remote values become ordinary Spring property keys before @ConfigurationProperties reads them.</text>

<g>
  <rect x="956" y="57" width="126" height="25" rx="12.5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="chip" x="1019" y="70.5" text-anchor="middle" dominant-baseline="middle">Secret</text>
  <rect x="1098" y="57" width="126" height="25" rx="12.5" fill="#EAF7EF" stroke="#58A978"/>
  <text class="chip" x="1161" y="70.5" text-anchor="middle" dominant-baseline="middle">Parameter</text>
  <rect x="1240" y="57" width="130" height="25" rx="12.5" fill="#FFF7ED" stroke="#F97316"/>
  <text class="chip" x="1305" y="70.5" text-anchor="middle" dominant-baseline="middle">Binding</text>
</g>

<g id="lanes">
  <rect class="lane" x="70" y="150" width="1300" height="145" rx="12"/>
  <text class="lane-title" x="96" y="188">JSON secret</text>
  <text class="lane-detail" x="98" y="210">JSON object values are recursively flattened and joined with the configured prefix</text>
  <rect class="lane" x="70" y="324" width="1300" height="145" rx="12"/>
  <text class="lane-title" x="96" y="362">Parameter path</text>
  <text class="lane-detail" x="98" y="384">Parameter names lose the configured root path, then remaining path segments become dotted keys</text>
  <rect class="lane" x="70" y="498" width="1300" height="145" rx="12"/>
  <text class="lane-title" x="96" y="536">Environment binding</text>
  <text class="lane-detail" x="98" y="558">Spring sees the same property key no matter which AWS source supplied the value</text>
</g>

<g id="cards">
  <rect class="card" x="150" y="218" width="220" height="56" rx="9" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="260" y="241" text-anchor="middle">SecretString</text>
  <text class="detail" x="260" y="260" text-anchor="middle">{ db: { password } }</text>
  <rect class="card" x="480" y="218" width="220" height="56" rx="9" fill="#F3FBFA" stroke="#63B8B3"/>
  <text class="card-title" x="590" y="241" text-anchor="middle">Flatten JSON</text>
  <text class="detail" x="590" y="260" text-anchor="middle">db.password</text>
  <rect class="card" x="810" y="218" width="220" height="56" rx="9" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="920" y="241" text-anchor="middle">Join prefix</text>
  <text class="detail" x="920" y="260" text-anchor="middle">app + db.password</text>
  <rect class="card" x="1140" y="218" width="180" height="56" rx="9" fill="#FFF7ED" stroke="#F97316"/>
  <text class="card-title" x="1230" y="241" text-anchor="middle">Property</text>
  <text class="detail" x="1230" y="260" text-anchor="middle">app.db.password</text>

  <rect class="card" x="150" y="392" width="220" height="56" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="260" y="415" text-anchor="middle">SSM parameter</text>
  <text class="detail" x="260" y="434" text-anchor="middle">/config/app/db/password</text>
  <rect class="card" x="480" y="392" width="220" height="56" rx="9" fill="#F3FBFA" stroke="#63B8B3"/>
  <text class="card-title" x="590" y="415" text-anchor="middle">Trim root</text>
  <text class="detail" x="590" y="434" text-anchor="middle">db/password</text>
  <rect class="card" x="810" y="392" width="220" height="56" rx="9" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="920" y="415" text-anchor="middle">Path to dots</text>
  <text class="detail" x="920" y="434" text-anchor="middle">app.db.password</text>
  <rect class="card" x="1140" y="392" width="180" height="56" rx="9" fill="#FFF7ED" stroke="#F97316"/>
  <text class="card-title" x="1230" y="415" text-anchor="middle">Property</text>
  <text class="detail" x="1230" y="434" text-anchor="middle">app.db.password</text>

  <rect class="card" x="260" y="566" width="240" height="56" rx="9" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="380" y="589" text-anchor="middle">PropertySource</text>
  <text class="detail" x="380" y="608" text-anchor="middle">AWS values inserted</text>
  <rect class="card" x="610" y="566" width="240" height="56" rx="9" fill="#FFF7ED" stroke="#F97316"/>
  <text class="card-title" x="730" y="589" text-anchor="middle">Binder</text>
  <text class="detail" x="730" y="608" text-anchor="middle">@ConfigurationProperties</text>
  <rect class="card" x="960" y="566" width="240" height="56" rx="9" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="1080" y="589" text-anchor="middle">App settings</text>
  <text class="detail" x="1080" y="608" text-anchor="middle">username / password</text>
</g>

<g id="connections">
  <path class="edge" d="M 370 246 L 480 246" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M 700 246 L 810 246" stroke="#168E86" marker-end="url(#arrow-teal)"/>
  <path class="edge" d="M 1030 246 L 1140 246" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
  <path class="edge" d="M 370 420 L 480 420" stroke="#2F8B57" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M 700 420 L 810 420" stroke="#168E86" marker-end="url(#arrow-teal)"/>
  <path class="edge" d="M 1030 420 L 1140 420" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
  <path class="edge" d="M 500 594 L 610 594" stroke="#168E86" marker-end="url(#arrow-teal)"/>
  <path class="edge" d="M 850 594 L 960 594" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
</g>

<rect class="footer" x="54" y="704" width="1332" height="30" rx="8"/>
<text class="footer-title" x="74" y="721" dominant-baseline="middle">Outcome</text>
<text class="footer-detail" x="176" y="721" dominant-baseline="middle">Secrets and parameters converge into normal Spring keys before application configuration binds.</text>
</svg>
