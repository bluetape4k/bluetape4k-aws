<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-label="Spring Boot DynamoDB example architecture">
<defs>
  <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%">
    <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/>
  </filter>
  <marker id="arrow-blue" viewBox="0 0 6 6" markerWidth="6" markerHeight="6" refX="5.2" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0.6 0.8 L 5.2 3 L 0.6 5.2 Z" fill="#2F6DE0"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 6 6" markerWidth="6" markerHeight="6" refX="5.2" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0.6 0.8 L 5.2 3 L 0.6 5.2 Z" fill="#2F8B57"/>
  </marker>
  <marker id="arrow-teal" viewBox="0 0 6 6" markerWidth="6" markerHeight="6" refX="5.2" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0.6 0.8 L 5.2 3 L 0.6 5.2 Z" fill="#168E86"/>
  </marker>
  <marker id="arrow-orange" viewBox="0 0 6 6" markerWidth="6" markerHeight="6" refX="5.2" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0.6 0.8 L 5.2 3 L 0.6 5.2 Z" fill="#EA580C"/>
  </marker>
  <marker id="arrow-slate" viewBox="0 0 6 6" markerWidth="6" markerHeight="6" refX="5.2" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0.6 0.8 L 5.2 3 L 0.6 5.2 Z" fill="#475569"/>
  </marker>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter";font-size:38px;fill:#102033}
  .subtitle,.detail,.tiny,.chip{font-family:"Comic Mono";fill:#526274}
  .subtitle{font-size:16px}
  .layer-title{font-family:"Architects Daughter";font-size:24px;fill:#102033}
  .layer-detail{font-family:"Comic Mono";font-size:12px;fill:#526274}
  .card-title{font-family:"Architects Daughter";font-size:21px;fill:#102033}
  .detail{font-size:13px}
  .tiny{font-size:11px}
  .chip{font-size:11px;fill:#243447}
  .layer{fill:#F8FAFC;stroke:#D9E2EC;stroke-width:1.4}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
  .soft-edge{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter";font-size:17px;fill:#FFFFFF}
  .footer-detail{font-family:"Comic Mono";font-size:12px;fill:#DDE7F2}
</style>

<rect x="26" y="26" width="1388" height="668" rx="14" class="frame"/>
<text class="title" x="54" y="74">Spring Boot DynamoDB example</text>
<text class="subtitle" x="56" y="106">A WebFlux sample for DynamoDB auto-configuration, coroutine repositories, and emulator-backed controller tests.</text>

<g>
  <rect x="1008" y="57" width="112" height="25" rx="12.5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="chip" x="1064" y="70.5" text-anchor="middle" dominant-baseline="middle">WebFlux</text>
  <rect x="1134" y="57" width="128" height="25" rx="12.5" fill="#EAF7EF" stroke="#58A978"/>
  <text class="chip" x="1198" y="70.5" text-anchor="middle" dominant-baseline="middle">auto-config</text>
  <rect x="1276" y="57" width="94" height="25" rx="12.5" fill="#FFF7ED" stroke="#F97316"/>
  <text class="chip" x="1323" y="70.5" text-anchor="middle" dominant-baseline="middle">DynamoDB</text>
</g>

<g id="layers">
  <rect class="layer" x="70" y="142" width="300" height="392" rx="12"/>
  <text class="layer-title" x="92" y="178">HTTP API</text>
  <text class="layer-detail" x="94" y="200">Spring WebFlux controller</text>

  <rect class="layer" x="405" y="142" width="355" height="392" rx="12"/>
  <text class="layer-title" x="427" y="178">Spring Boot wiring</text>
  <text class="layer-detail" x="429" y="200">DynamoDbAutoConfiguration</text>

  <rect class="layer" x="795" y="142" width="300" height="392" rx="12"/>
  <text class="layer-title" x="817" y="178">Coroutine repository</text>
  <text class="layer-detail" x="819" y="200">Enhanced async client table API</text>

  <rect class="layer" x="1130" y="142" width="240" height="392" rx="12"/>
  <text class="layer-title" x="1152" y="178">DynamoDB target</text>
  <text class="layer-detail" x="1154" y="200">Floci or LocalStack</text>
</g>

<g id="cards">
  <rect class="card" x="100" y="238" width="240" height="102" rx="9" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="220" y="274" text-anchor="middle">OrderController</text>
  <text class="detail" x="220" y="302" text-anchor="middle">POST, GET, DELETE</text>
  <text class="detail" x="220" y="322" text-anchor="middle">Flow scan</text>

  <rect class="card" x="100" y="380" width="240" height="102" rx="9" fill="#F0F6FF" stroke="#7AA3F5"/>
  <text class="card-title" x="220" y="416" text-anchor="middle">WebTestClient</text>
  <text class="detail" x="220" y="444" text-anchor="middle">controller binding</text>
  <text class="detail" x="220" y="464" text-anchor="middle">201, 200, 404</text>

  <rect class="card" x="435" y="222" width="295" height="116" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="582.5" y="258" text-anchor="middle">DynamoDbAutoConfig</text>
  <text class="detail" x="582.5" y="286" text-anchor="middle">region and endpoint</text>
  <text class="detail" x="582.5" y="306" text-anchor="middle">enhanced async client</text>

  <rect class="card" x="435" y="382" width="295" height="116" rx="9" fill="#EEF9F1" stroke="#75B989"/>
  <text class="card-title" x="582.5" y="418" text-anchor="middle">Context runner</text>
  <text class="detail" x="582.5" y="446" text-anchor="middle">AWS credentials bean</text>
  <text class="detail" x="582.5" y="466" text-anchor="middle">emulator properties</text>

  <rect class="card" x="825" y="222" width="240" height="116" rx="9" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="945" y="258" text-anchor="middle">OrderRepository</text>
  <text class="detail" x="945" y="286" text-anchor="middle">coroutine CRUD</text>
  <text class="detail" x="945" y="306" text-anchor="middle">table name orders</text>

  <rect class="card" x="825" y="382" width="240" height="116" rx="9" fill="#F3FBFA" stroke="#63B8B3"/>
  <text class="card-title" x="945" y="418" text-anchor="middle">Enhanced mapping</text>
  <text class="detail" x="945" y="446" text-anchor="middle">DynamoDbBean Order</text>
  <text class="detail" x="945" y="466" text-anchor="middle">id partition key</text>

  <rect class="card" x="1160" y="260" width="180" height="128" rx="9" fill="#FFF7ED" stroke="#F97316"/>
  <text class="card-title" x="1250" y="296" text-anchor="middle">orders table</text>
  <text class="detail" x="1250" y="324" text-anchor="middle">PAY_PER_REQUEST</text>
  <text class="detail" x="1250" y="344" text-anchor="middle">String id key</text>
  <text class="detail" x="1250" y="364" text-anchor="middle">status, description</text>
</g>

<g id="connections">
  <path class="edge" d="M 340 289 L 435 289" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M 730 280 L 825 280" stroke="#2F8B57" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M 1065 280 L 1160 314" stroke="#EA580C" marker-end="url(#arrow-orange)"/>

  <path class="soft-edge" d="M 582.5 338 L 582.5 382" stroke="#475569" marker-end="url(#arrow-slate)"/>
  <path class="soft-edge" d="M 945 338 L 945 382" stroke="#475569" marker-end="url(#arrow-slate)"/>
  <path class="soft-edge" d="M 340 431 L 435 440" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
  <path class="soft-edge" d="M 730 440 L 825 440" stroke="#168E86" marker-end="url(#arrow-teal)"/>
  <path class="soft-edge" d="M 1065 440 L 1250 388" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
</g>

<g id="route-table">
  <rect x="86" y="564" width="600" height="72" rx="10" fill="#FFFFFF" stroke="#D9E2EC"/>
  <text class="card-title" x="110" y="596">API contract</text>
  <text class="detail" x="292" y="594">create UUID</text>
  <text class="detail" x="440" y="594">find by id</text>
  <text class="detail" x="572" y="594">delete</text>
  <text class="tiny" x="110" y="620">Missing orders return 404; list returns a Flow scan result.</text>

  <rect x="724" y="564" width="630" height="72" rx="10" fill="#FFFFFF" stroke="#D9E2EC"/>
  <text class="card-title" x="748" y="596">Verification</text>
  <text class="detail" x="920" y="594">repository CRUD</text>
  <text class="detail" x="1088" y="594">concurrent saves</text>
  <text class="detail" x="1250" y="594">HTTP layer</text>
  <text class="tiny" x="748" y="620">ApplicationContextRunner supplies emulator endpoint and credentials.</text>
</g>

<rect class="footer" x="54" y="652" width="1332" height="34" rx="8"/>
<text class="footer-title" x="74" y="672" dominant-baseline="middle">Reader cue</text>
<text class="footer-detail" x="190" y="672" dominant-baseline="middle">Use this example to copy Spring Boot DynamoDB auto-configuration into a coroutine WebFlux CRUD service.</text>
</svg>
