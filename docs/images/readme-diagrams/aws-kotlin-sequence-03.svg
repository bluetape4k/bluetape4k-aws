<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1010" viewBox="0 0 980 1010" role="img" aria-label="aws-kotlin client lifecycle">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="928" height="958" rx="14" class="frame"/>
<text class="title" x="54" y="72">aws-kotlin client lifecycle</text>
<text class="subtitle" x="56" y="102">Short-lived clients should be created for a suspend block and closed automatically after use.</text>
<rect x="845" y="54" width="71" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="chip" x="880.5" y="70" text-anchor="middle">Create</text>
<rect x="749.5" y="54" width="68" height="24" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="chip" x="783.5" y="70" text-anchor="middle">Use</text>
<rect x="616.5" y="54" width="68" height="24" rx="12" fill="#FFF0E3" stroke="#F47B36"/>
<text class="chip" x="650.5" y="70" text-anchor="middle">Close</text>
<g><g><path class="edge" d="M490 218 L490 244 L490 244 L490 270" stroke="#66758A"/></g>
<g><path class="edge" d="M490 348 L490 374 L490 374 L490 400" stroke="#66758A"/></g>
<g><path class="edge" d="M490 478 L490 504 L490 504 L490 530" stroke="#66758A"/></g>
<g><path class="edge" d="M490 608 L490 634 L490 634 L490 660" stroke="#66758A" stroke-dasharray="8 8"/></g>
<g><path class="edge" d="M490 738 L490 764 L490 764 L490 790" stroke="#66758A"/></g>
<g><path class="edge" d="M490 608 L490 699 L490 699 L490 790" stroke="#66758A"/></g></g>
<g id="caller">
  <rect class="card" x="330" y="140" width="320" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="490" y="176" text-anchor="middle">Coroutine caller</text>
  <text class="detail" x="490" y="200" text-anchor="middle">calls withS3Client / withKinesisClient</text>
</g>
<g id="factory">
  <rect class="card" x="330" y="270" width="320" height="78" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="490" y="306" text-anchor="middle">clientOf builder</text>
  <text class="detail" x="490" y="330" text-anchor="middle">endpoint, region, credentials, HTTP engine</text>
</g>
<g id="client">
  <rect class="card" x="330" y="400" width="320" height="78" rx="10" fill="#F4F7FA" stroke="#8CA0B3"/>
  <text class="card-title" x="490" y="436" text-anchor="middle">AWS Kotlin SDK client</text>
  <text class="detail" x="490" y="460" text-anchor="middle">connection pools and resources</text>
</g>
<g id="block">
  <rect class="card" x="330" y="530" width="320" height="78" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="490" y="566" text-anchor="middle">Suspend block</text>
  <text class="detail" x="490" y="590" text-anchor="middle">service operation calls</text>
</g>
<g id="flow">
  <rect class="card" x="330" y="660" width="320" height="78" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="490" y="696" text-anchor="middle">Optional Flow collection</text>
  <text class="detail" x="490" y="720" text-anchor="middle">recordFlow polls until completion</text>
</g>
<g id="close">
  <rect class="card" x="330" y="790" width="320" height="78" rx="10" fill="#FFF0E3" stroke="#F47B36"/>
  <text class="card-title" x="490" y="826" text-anchor="middle">useSafe closes client</text>
  <text class="detail" x="490" y="850" text-anchor="middle">success, failure, or cancellation</text>
</g>
<rect class="footer" x="54" y="906" width="872" height="54" rx="8"/>
<text class="footer-title" x="72" y="935">Lifecycle role</text>
<text class="footer-detail" x="72" y="955">AWS Kotlin SDK clients own resources; withXClient keeps short-lived usage scoped.</text>
</svg>