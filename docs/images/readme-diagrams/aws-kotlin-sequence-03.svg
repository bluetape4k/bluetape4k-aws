<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-label="AWS Kotlin client lifecycle sequence">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#d97706"/>
    </marker>
    <marker id="arrowReturn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#f8fafc}
      .frame{fill:#ffffff;stroke:#8aa6cf;stroke-width:3;filter:url(#softShadow)}
      .title{font-family:"Architects Daughter";font-size:48px;fill:#17233a}
      .subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
      .participant{fill:#ffffff;stroke-width:2.2;filter:url(#softShadow)}
      .participantTitle{font-family:"Architects Daughter";font-size:22px;fill:#17233a}
      .participantText{font-family:"Comic Mono";font-size:12px;fill:#475569}
      .lifeline{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:7 8}
      .activation{fill:#ffffff;stroke:#94a3b8;stroke-width:1.6}
      .message{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
      .return{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7}
      .msgText{font-family:"Comic Mono";font-size:13px;fill:#334155}
      .alt{fill:#f8fafc;fill-opacity:.72;stroke:#d97706;stroke-width:2;stroke-dasharray:9 8}
      .altTitle{font-family:"Comic Mono";font-size:14px;font-weight:700;fill:#92400e}
      .note{fill:#ffffff;stroke:#7c3aed;stroke-width:2}
      .noteText{font-family:"Comic Mono";font-size:13px;fill:#475569}
      .footerText{font-family:"Comic Mono";font-size:14px;fill:#475569}
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1080"/>
  <rect class="frame" x="42" y="36" width="1516" height="1004" rx="24"/>
  <text class="title" x="800" y="96" text-anchor="middle">AWS Kotlin Client Lifecycle Sequence</text>
  <text class="subtitle" x="800" y="132" text-anchor="middle">`withXxxClient` creates a native SDK client, runs suspend work, and closes the client through useSafe.</text>

  <g id="participants">
    <rect class="participant" x="120" y="186" width="230" height="72" rx="16" stroke="#2563eb"/>
    <text class="participantTitle" x="235" y="214" text-anchor="middle">Caller</text>
    <text class="participantText" x="235" y="238" text-anchor="middle">service coroutine</text>

    <rect class="participant" x="438" y="186" width="230" height="72" rx="16" stroke="#059669"/>
    <text class="participantTitle" x="553" y="214" text-anchor="middle">withSqsClient</text>
    <text class="participantText" x="553" y="238" text-anchor="middle">one-shot helper</text>

    <rect class="participant" x="756" y="186" width="230" height="72" rx="16" stroke="#d97706"/>
    <text class="participantTitle" x="871" y="214" text-anchor="middle">sqsClientOf</text>
    <text class="participantText" x="871" y="238" text-anchor="middle">factory DSL</text>

    <rect class="participant" x="1074" y="186" width="230" height="72" rx="16" stroke="#7c3aed"/>
    <text class="participantTitle" x="1189" y="214" text-anchor="middle">SqsClient</text>
    <text class="participantText" x="1189" y="238" text-anchor="middle">AWS Kotlin SDK</text>
  </g>

  <line class="lifeline" x1="235" y1="258" x2="235" y2="914"/>
  <line class="lifeline" x1="553" y1="258" x2="553" y2="914"/>
  <line class="lifeline" x1="871" y1="258" x2="871" y2="914"/>
  <line class="lifeline" x1="1189" y1="258" x2="1189" y2="914"/>

  <rect class="activation" x="545" y="324" width="16" height="486" rx="4"/>
  <rect class="activation" x="863" y="398" width="16" height="152" rx="4"/>
  <rect class="activation" x="1181" y="586" width="16" height="156" rx="4"/>

  <path class="message" d="M 235 332 L 545 332" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
  <text class="msgText" x="270" y="314">withSqsClient(endpoint, region, credentials) { block }</text>

  <path class="message" d="M 561 406 L 863 406" stroke="#059669" marker-end="url(#arrowGreen)"/>
  <text class="msgText" x="590" y="388">sqsClientOf(...)</text>

  <rect class="alt" x="792" y="438" width="474" height="120" rx="14"/>
  <text class="altTitle" x="814" y="464">factory configuration</text>
  <text class="noteText" x="814" y="490">endpoint host checked when provided</text>
  <text class="noteText" x="814" y="514">region, credentialsProvider, httpClient applied</text>
  <text class="noteText" x="814" y="538">default engine comes from HttpClientEngineProvider</text>

  <path class="return" d="M 863 566 L 561 566" stroke="#64748b" marker-end="url(#arrowReturn)"/>
  <text class="msgText" x="604" y="588">configured native SqsClient</text>

  <path class="message" d="M 561 642 L 1181 642" stroke="#7c3aed" marker-end="url(#arrowBlue)"/>
  <text class="msgText" x="632" y="624">execute caller suspend block with client</text>

  <path class="return" d="M 1181 704 L 561 704" stroke="#64748b" marker-end="url(#arrowReturn)"/>
  <text class="msgText" x="822" y="726">block result or thrown exception</text>

  <path class="message" d="M 561 780 L 1181 780" stroke="#d97706" marker-end="url(#arrowAmber)"/>
  <text class="msgText" x="700" y="762">finally: useSafe closes client</text>

  <path class="return" d="M 545 846 L 235 846" stroke="#64748b" marker-end="url(#arrowReturn)"/>
  <text class="msgText" x="276" y="868">return result after close completes</text>

  <rect class="note" x="298" y="914" width="1004" height="50" rx="16"/>
  <text class="noteText" x="800" y="945" text-anchor="middle">Long-lived `xxxClientOf` skips the helper; the application must call `close()` at shutdown.</text>

  <text class="footerText" x="800" y="992" text-anchor="middle">Reader contract: one-shot helpers own client cleanup; shared HTTP engines require explicit application-level ownership.</text>
</svg>
