<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="1044" viewBox="0 0 1754 1044" role="img" aria-label="Client Pattern Class Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="1044"/>
<rect class="frame" x="32" y="28" width="1690" height="988" rx="28"/>
<text class="title" x="66" y="82">Client Pattern Class Diagram</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M672 180 L672 112 L1082 112 L1082 397"/>
<path class="line" d="M672 180 L672 122 L1492 122 L1492 376"/>
<path class="line" d="M672 460 L672 515 L877 515 L877 586"/>
<path class="line" d="M672 180 L672 507 L262 507 L262 397"/>
<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="217" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">DynamoDbClient</text>
  <text class="mono" x="18" y="108">+getItem(block) GetItemResponse</text>
<text class="mono" x="18" y="129">+putItem(block) PutItemResponse</text>
<text class="mono" x="18" y="150">+scan(block) ScanResponse</text>
<text class="mono" x="18" y="171">+query(block) QueryResponse</text>
<text class="mono" x="18" y="192">+close()</text>
</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="280" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">AwsClientFactory</text>
  <text class="mono" x="18" y="108">+dynamoDbClientOf(endpointUrl, region)</text>
<text class="mono" x="18" y="129">DynamoDbClient</text>
<text class="mono" x="18" y="150">+withDynamoDbClient(block) T</text>
<text class="mono" x="18" y="171">+sqsClientOf(endpointUrl, region)</text>
<text class="mono" x="18" y="192">SqsClient</text>
<text class="mono" x="18" y="213">+withSqsClient(block) T</text>
<text class="mono" x="18" y="234">+s3ClientOf(region) S3Client</text>
<text class="mono" x="18" y="255">+withS3Client(block) T</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="217" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">CloudWatchClient</text>
  <text class="mono" x="18" y="108">+putMetricData(block)</text>
<text class="mono" x="18" y="129">PutMetricDataResponse</text>
<text class="mono" x="18" y="150">+getMetricData(block)</text>
<text class="mono" x="18" y="171">GetMetricDataResponse</text>
<text class="mono" x="18" y="192">+close()</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">S3Client</text>
  <text class="mono" x="18" y="108">+getObject(block) GetObjectResponse</text>
<text class="mono" x="18" y="129">+putObject(block) PutObjectResponse</text>
<text class="mono" x="18" y="150">+listObjects(block) ListObjectsResponse</text>
<text class="mono" x="18" y="171">+close()</text>
</g>
<g transform="translate(707,586)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">SqsClient</text>
  <text class="mono" x="18" y="108">+sendMessage(block) SendMessageResponse</text>
<text class="mono" x="18" y="129">+receiveMessage(block)</text>
<text class="mono" x="18" y="150">ReceiveMessageResponse</text>
<text class="mono" x="18" y="171">+deleteMessage(block)</text>
<text class="mono" x="18" y="192">DeleteMessageResponse</text>
<text class="mono" x="18" y="213">+close()</text>
</g>
</svg>
