<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" role="img" aria-labelledby="title desc">
<title id="title">AWS Java coroutine sequence</title>
<desc id="desc">Suspend extensions wrap AWS SDK v2 async clients with CompletableFuture.await() and keep cancellation/error behavior at the async boundary.</desc>
