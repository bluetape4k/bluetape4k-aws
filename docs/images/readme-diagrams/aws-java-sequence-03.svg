<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-label="AWS Java coroutine sequence">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#d97706"/>
    </marker>
    <marker id="arrowReturn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#f8fafc}
      .frame{fill:#ffffff;stroke:#8aa6cf;stroke-width:3;filter:url(#softShadow)}
      .title{font-family:"Architects Daughter";font-size:48px;fill:#17233a}
      .subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
      .participant{fill:#ffffff;stroke-width:2.2;filter:url(#softShadow)}
      .participantTitle{font-family:"Architects Daughter";font-size:22px;fill:#17233a}
      .participantText{font-family:"Comic Mono";font-size:12px;fill:#475569}
      .lifeline{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:7 8}
      .activation{fill:#ffffff;stroke:#94a3b8;stroke-width:1.6}
      .message{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
      .return{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7}
      .msgText{font-family:"Comic Mono";font-size:13px;fill:#334155}
      .alt{fill:#f8fafc;fill-opacity:.70;stroke:#d97706;stroke-width:2;stroke-dasharray:9 8}
      .altTitle{font-family:"Comic Mono";font-size:14px;font-weight:700;fill:#92400e}
      .note{fill:#ffffff;stroke:#7c3aed;stroke-width:2}
      .noteText{font-family:"Comic Mono";font-size:13px;fill:#475569}
      .footerText{font-family:"Comic Mono";font-size:14px;fill:#475569}
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1080"/>
  <rect class="frame" x="42" y="36" width="1516" height="1004" rx="24"/>
  <text class="title" x="800" y="96" text-anchor="middle">AWS Java Coroutine Sequence</text>
  <text class="subtitle" x="800" y="132" text-anchor="middle">Representative SQS send path: suspend extension delegates to future-backed async code and resumes after await().</text>

  <g id="participants">
    <rect class="participant" x="110" y="186" width="220" height="72" rx="16" stroke="#2563eb"/>
    <text class="participantTitle" x="220" y="214" text-anchor="middle">Caller</text>
    <text class="participantText" x="220" y="238" text-anchor="middle">service coroutine</text>

    <rect class="participant" x="388" y="186" width="220" height="72" rx="16" stroke="#059669"/>
    <text class="participantTitle" x="498" y="214" text-anchor="middle">suspend API</text>
    <text class="participantText" x="498" y="238" text-anchor="middle">SqsAsyncClient.send()</text>

    <rect class="participant" x="666" y="186" width="220" height="72" rx="16" stroke="#d97706"/>
    <text class="participantTitle" x="776" y="214" text-anchor="middle">async helper</text>
    <text class="participantText" x="776" y="238" text-anchor="middle">sendAsync()</text>

    <rect class="participant" x="944" y="186" width="220" height="72" rx="16" stroke="#7c3aed"/>
    <text class="participantTitle" x="1054" y="214" text-anchor="middle">request DSL</text>
    <text class="participantText" x="1054" y="238" text-anchor="middle">sendMessageRequestOf()</text>

    <rect class="participant" x="1222" y="186" width="220" height="72" rx="16" stroke="#0ea5e9"/>
    <text class="participantTitle" x="1332" y="214" text-anchor="middle">AWS SDK v2</text>
    <text class="participantText" x="1332" y="238" text-anchor="middle">SqsAsyncClient</text>
  </g>

  <line class="lifeline" x1="220" y1="258" x2="220" y2="902"/>
  <line class="lifeline" x1="498" y1="258" x2="498" y2="902"/>
  <line class="lifeline" x1="776" y1="258" x2="776" y2="902"/>
  <line class="lifeline" x1="1054" y1="258" x2="1054" y2="902"/>
  <line class="lifeline" x1="1332" y1="258" x2="1332" y2="902"/>

  <rect class="activation" x="490" y="316" width="16" height="458" rx="4"/>
  <rect class="activation" x="768" y="384" width="16" height="302" rx="4"/>
  <rect class="activation" x="1046" y="456" width="16" height="116" rx="4"/>
  <rect class="activation" x="1324" y="646" width="16" height="72" rx="4"/>

  <path class="message" d="M 220 324 L 490 324" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
  <text class="msgText" x="246" y="306">send(queueUrl, body, delaySeconds)</text>

  <path class="message" d="M 506 392 L 768 392" stroke="#059669" marker-end="url(#arrowGreen)"/>
  <text class="msgText" x="526" y="374">delegate to sendAsync(...).await()</text>

  <path class="message" d="M 784 464 L 1046 464" stroke="#d97706" marker-end="url(#arrowAmber)"/>
  <text class="msgText" x="804" y="446">build SendMessageRequest</text>

  <rect class="alt" x="690" y="500" width="428" height="114" rx="14"/>
  <text class="altTitle" x="712" y="526">preflight validation</text>
  <text class="noteText" x="712" y="552">queueUrl.requireNotBlank()</text>
  <text class="noteText" x="712" y="576">messageBody.requireNotBlank()</text>
  <path class="return" d="M 1046 596 L 784 596" stroke="#64748b" marker-end="url(#arrowReturn)"/>
  <text class="msgText" x="808" y="622">request object</text>

  <path class="message" d="M 784 668 L 1324 668" stroke="#0ea5e9" marker-end="url(#arrowBlue)"/>
  <text class="msgText" x="838" y="650">sendMessage(request)</text>

  <path class="return" d="M 1324 724 L 784 724" stroke="#64748b" marker-end="url(#arrowReturn)"/>
  <text class="msgText" x="1024" y="746">CompletableFuture&lt;SendMessageResponse&gt;</text>

  <path class="return" d="M 768 786 L 506 786" stroke="#64748b" marker-end="url(#arrowReturn)"/>
  <text class="msgText" x="548" y="808">future awaited without blocking caller thread</text>

  <path class="return" d="M 490 848 L 220 848" stroke="#64748b" marker-end="url(#arrowReturn)"/>
  <text class="msgText" x="252" y="870">resume with SendMessageResponse or exception</text>

  <rect class="note" x="302" y="904" width="996" height="52" rx="16"/>
  <text class="noteText" x="800" y="936" text-anchor="middle">Batch and receive paths keep the same shape; extra guards run before the AWS network call.</text>

  <text class="footerText" x="800" y="986" text-anchor="middle">Reader contract: suspend APIs are thin adapters over async helpers; validation happens before SDK futures are created.</text>
</svg>
