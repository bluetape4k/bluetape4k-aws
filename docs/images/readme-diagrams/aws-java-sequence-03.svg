<rect class="card-green" x="336" y="682" width="788" height="44" rx="8"/><text class="card-title" x="730" y="707" text-anchor="middle">Flow adapters stream paged async results without converting the AWS response model</text>
<rect class="footer" x="54" y="812" width="1392" height="36" rx="8"/><text class="footer-title" x="76" y="831" dominant-baseline="middle">Sequence</text><text class="footer-detail" x="170" y="831" dominant-baseline="middle">Coroutine extensions are thin: request helpers build SDK models, async clients return futures, and await resumes the caller.</text>
