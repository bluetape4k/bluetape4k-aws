<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1030" viewBox="0 0 980 1030" role="img" aria-label="aws-java coroutine sequence">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="928" height="978" rx="14" class="frame"/>
<text class="title" x="54" y="72">aws-java coroutine sequence</text>
<text class="subtitle" x="56" y="102">A suspend caller delegates through SDK async clients and resumes when the future completes.</text>
<rect x="837.5" y="54" width="78.5" height="24" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="chip" x="876.75" y="70" text-anchor="middle">Suspend</text>
<rect x="750.5" y="54" width="71" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="chip" x="786" y="70" text-anchor="middle">Future</text>
<rect x="663.5" y="54" width="71" height="24" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="chip" x="699" y="70" text-anchor="middle">SDK v2</text>
<g><g><path class="edge" d="M490 220 L490 252 L490 252 L490 272" stroke="#66758A"/><rect class="label-bg" x="428.2" y="232" width="123.60000000000001" height="22" rx="11"/>
<text class="edge-label" x="490" y="248" text-anchor="middle">suspend call</text></g>
<g><path class="edge" d="M490 350 L490 382 L490 382 L490 402" stroke="#66758A"/><rect class="label-bg" x="423.8" y="362" width="132.4" height="22" rx="11"/>
<text class="edge-label" x="490" y="378" text-anchor="middle">async request</text></g>
<g><path class="edge" d="M490 480 L490 512 L490 512 L490 532" stroke="#66758A"/></g>
<g><path class="edge" d="M490 610 L490 642 L490 642 L490 662" stroke="#66758A"/><rect class="label-bg" x="459" y="622" width="62" height="22" rx="11"/>
<text class="edge-label" x="490" y="638" text-anchor="middle">await</text></g>
<g><path class="edge" d="M490 740 L490 772 L490 772 L490 792" stroke="#66758A"/></g></g>
<g id="caller">
  <rect class="card" x="330" y="142" width="320" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="490" y="178" text-anchor="middle">Suspend caller</text>
  <text class="detail" x="490" y="202" text-anchor="middle">repository or service</text>
</g>
<g id="adapter">
  <rect class="card" x="330" y="272" width="320" height="78" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="490" y="308" text-anchor="middle">Coroutine extension</text>
  <text class="detail" x="490" y="332" text-anchor="middle">build request and call async client</text>
</g>
<g id="sdk">
  <rect class="card" x="330" y="402" width="320" height="78" rx="10" fill="#F4F7FA" stroke="#8CA0B3"/>
  <text class="card-title" x="490" y="438" text-anchor="middle">AWS async client</text>
  <text class="detail" x="490" y="462" text-anchor="middle">returns CompletableFuture</text>
</g>
<g id="future">
  <rect class="card" x="330" y="532" width="320" height="78" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="490" y="568" text-anchor="middle">Future completes</text>
  <text class="detail" x="490" y="592" text-anchor="middle">success or exception</text>
</g>
<g id="resume">
  <rect class="card" x="330" y="662" width="320" height="78" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="490" y="698" text-anchor="middle">Coroutine resumes</text>
  <text class="detail" x="490" y="722" text-anchor="middle">response, Flow item, or failure</text>
</g>
<g id="close">
  <rect class="card" x="330" y="792" width="320" height="78" rx="10" fill="#FFF0E3" stroke="#F47B36"/>
  <text class="card-title" x="490" y="828" text-anchor="middle">Caller owns client lifecycle</text>
  <text class="detail" x="490" y="852" text-anchor="middle">close application-scoped clients</text>
</g>
<rect class="footer" x="54" y="926" width="872" height="54" rx="8"/>
<text class="footer-title" x="72" y="945" dominant-baseline="middle">Sequence role</text>
<text class="footer-detail" x="72" y="963" dominant-baseline="middle">Show the coroutine boundary as an ordered lifecycle instead of a compressed horizontal strip.</text>
</svg>