<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-label="KMS Spring Boot components">
<defs>
  <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%">
    <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/>
  </filter>
  <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F6DE0"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F8B57"/>
  </marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#168E86"/>
  </marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#EA580C"/>
  </marker>
  <marker id="arrow-slate" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
  </marker>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter";font-size:38px;fill:#102033}
  .subtitle,.detail,.tiny,.chip{font-family:"Comic Mono";fill:#526274}
  .subtitle{font-size:16px}
  .layer-title{font-family:"Architects Daughter";font-size:24px;fill:#102033}
  .layer-detail{font-family:"Comic Mono";font-size:12px;fill:#526274}
  .card-title{font-family:"Architects Daughter";font-size:21px;fill:#102033}
  .detail{font-size:13px}
  .tiny{font-size:11px}
  .chip{font-size:11px;fill:#243447}
  .layer{fill:#F8FAFC;stroke:#D9E2EC;stroke-width:1.4}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
  .soft-edge{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter";font-size:17px;fill:#FFFFFF}
  .footer-detail{font-family:"Comic Mono";font-size:12px;fill:#DDE7F2}
</style>

<rect x="26" y="26" width="1388" height="708" rx="14" class="frame"/>
<text class="title" x="54" y="74">KMS Spring Boot components</text>
<text class="subtitle" x="56" y="106">Auto-configuration builds a coroutine KMS boundary, explicit field codecs, and bounded plaintext data-key caching.</text>

<g>
  <rect x="982" y="57" width="124" height="25" rx="12.5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="chip" x="1044" y="70.5" text-anchor="middle" dominant-baseline="middle">Config</text>
  <rect x="1120" y="57" width="124" height="25" rx="12.5" fill="#EAF7EF" stroke="#58A978"/>
  <text class="chip" x="1182" y="70.5" text-anchor="middle" dominant-baseline="middle">Beans</text>
  <rect x="1258" y="57" width="112" height="25" rx="12.5" fill="#FFF7ED" stroke="#F97316"/>
  <text class="chip" x="1314" y="70.5" text-anchor="middle" dominant-baseline="middle">KMS</text>
</g>

<g id="layers">
  <rect class="layer" x="70" y="142" width="300" height="412" rx="12"/>
  <text class="layer-title" x="92" y="178">Properties</text>
  <text class="layer-detail" x="94" y="200">Runtime configuration and defaults</text>

  <rect class="layer" x="405" y="142" width="330" height="412" rx="12"/>
  <text class="layer-title" x="427" y="178">Auto-config</text>
  <text class="layer-detail" x="429" y="200">Client, operations, and adapters</text>

  <rect class="layer" x="770" y="142" width="300" height="412" rx="12"/>
  <text class="layer-title" x="792" y="178">Application APIs</text>
  <text class="layer-detail" x="794" y="200">Small secrets and explicit fields</text>

  <rect class="layer" x="1105" y="142" width="265" height="412" rx="12"/>
  <text class="layer-title" x="1127" y="178">AWS boundary</text>
  <text class="layer-detail" x="1129" y="200">KMS service and envelope users</text>
</g>

<g id="cards">
  <rect class="card" x="100" y="240" width="240" height="102" rx="9" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="220" y="276" text-anchor="middle">KmsProperties</text>
  <text class="detail" x="220" y="304" text-anchor="middle">region, endpoint</text>
  <text class="detail" x="220" y="324" text-anchor="middle">key and context</text>

  <rect class="card" x="100" y="390" width="240" height="102" rx="9" fill="#F0F6FF" stroke="#7AA3F5"/>
  <text class="card-title" x="220" y="426" text-anchor="middle">Data-key options</text>
  <text class="detail" x="220" y="454" text-anchor="middle">TTL and max size</text>
  <text class="detail" x="220" y="474" text-anchor="middle">cache enabled flag</text>

  <rect class="card" x="435" y="222" width="270" height="112" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="570" y="258" text-anchor="middle">KmsAutoConfiguration</text>
  <text class="detail" x="570" y="286" text-anchor="middle">KmsAsyncClient</text>
  <text class="detail" x="570" y="306" text-anchor="middle">global customizers</text>

  <rect class="card" x="435" y="382" width="270" height="112" rx="9" fill="#EEF9F1" stroke="#75B989"/>
  <text class="card-title" x="570" y="418" text-anchor="middle">KmsCoroutinesEncryptor</text>
  <text class="detail" x="570" y="446" text-anchor="middle">encrypt, decrypt</text>
  <text class="detail" x="570" y="466" text-anchor="middle">generate data key</text>

  <rect class="card" x="800" y="222" width="240" height="112" rx="9" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="920" y="258" text-anchor="middle">KmsOperations</text>
  <text class="detail" x="920" y="286" text-anchor="middle">suspend contract</text>
  <text class="detail" x="920" y="306" text-anchor="middle">context merge</text>

  <rect class="card" x="800" y="382" width="240" height="112" rx="9" fill="#F3FBFA" stroke="#63B8B3"/>
  <text class="card-title" x="920" y="418" text-anchor="middle">Explicit adapters</text>
  <text class="detail" x="920" y="446" text-anchor="middle">@KmsEncrypted</text>
  <text class="detail" x="920" y="466" text-anchor="middle">TextEncryptor</text>

  <rect class="card" x="1140" y="222" width="200" height="112" rx="9" fill="#FFF7ED" stroke="#F97316"/>
  <text class="card-title" x="1240" y="258" text-anchor="middle">AWS KMS</text>
  <text class="detail" x="1240" y="286" text-anchor="middle">Encrypt</text>
  <text class="detail" x="1240" y="306" text-anchor="middle">Decrypt/DataKey</text>

  <rect class="card" x="1140" y="382" width="200" height="112" rx="9" fill="#FFF4E6" stroke="#F59E0B"/>
  <text class="card-title" x="1240" y="418" text-anchor="middle">Envelope users</text>
  <text class="detail" x="1240" y="446" text-anchor="middle">S3 client-side</text>
  <text class="detail" x="1240" y="466" text-anchor="middle">payload metadata</text>
</g>

<g id="connections">
  <path class="edge" d="M 340 291 L 435 278" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
  <path class="soft-edge" d="M 340 441 L 435 438" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M 705 278 L 800 278" stroke="#2F8B57" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M 705 438 L 800 278" stroke="#2F8B57" marker-end="url(#arrow-green)"/>
  <path class="soft-edge" d="M 705 438 L 800 438" stroke="#168E86" marker-end="url(#arrow-teal)"/>
  <path class="edge" d="M 1040 278 L 1140 278" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
  <path class="soft-edge" d="M 1040 438 L 1140 278" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
  <path class="soft-edge" d="M 1040 438 L 1140 438" stroke="#475569" marker-end="url(#arrow-slate)"/>
</g>

<g id="contracts">
  <rect x="86" y="584" width="600" height="72" rx="10" fill="#FFFFFF" stroke="#D9E2EC"/>
  <text class="card-title" x="110" y="616">Safety contract</text>
  <text class="detail" x="306" y="614">small secrets</text>
  <text class="detail" x="468" y="614">context-bound</text>
  <text class="detail" x="608" y="614">bounded cache</text>
  <text class="tiny" x="110" y="640">Plaintext data keys stay in memory only when the bounded cache is enabled.</text>

  <rect x="724" y="584" width="630" height="72" rx="10" fill="#FFFFFF" stroke="#D9E2EC"/>
  <text class="card-title" x="748" y="616">Reader cue</text>
  <text class="detail" x="910" y="614">direct encrypt</text>
  <text class="detail" x="1080" y="614">data keys</text>
  <text class="detail" x="1224" y="614">field codec</text>
  <text class="tiny" x="748" y="640">Use direct KMS for short values; use data keys for larger payload envelope encryption.</text>
</g>

<rect class="footer" x="54" y="690" width="1332" height="34" rx="8"/>
<text class="footer-title" x="74" y="710" dominant-baseline="middle">Boundary</text>
<text class="footer-detail" x="178" y="710" dominant-baseline="middle">KMS support is explicit: auto-config creates beans, application code decides where encryption belongs.</text>
</svg>
