<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1960" height="1320" viewBox="0 0 1960 1320" role="img" aria-labelledby="title desc">
<title id="title">Amazon Bedrock Runtime streaming with scoped Flow collection</title>
<desc id="desc">A caller opens a scoped Bedrock Runtime client, collects a cold ConverseStream Flow, extracts text deltas, applies takeUntil, cancels the SDK stream, and closes the client after collection terminates.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow-blue" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F83BF" stroke="#4F83BF" stroke-dasharray="none"/></marker>
  <marker id="arrow-purple" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#755BC6" stroke="#755BC6" stroke-dasharray="none"/></marker>
  <marker id="arrow-green" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3E9868" stroke="#3E9868" stroke-dasharray="none"/></marker>
  <marker id="arrow-amber" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B9851B" stroke="#B9851B" stroke-dasharray="none"/></marker>
  <marker id="arrow-teal" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2E8F89" stroke="#2E8F89" stroke-dasharray="none"/></marker>
  <marker id="arrow-coral" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#C96C4B" stroke="#C96C4B" stroke-dasharray="none"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#263238}.subtitle,.footer,.detail{font-family:"Comic Mono";font-size:16px;fill:#536476}.footer{font-size:13px;fill:#60727D}.detail{font-size:13px;fill:#42556B}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.role{font-family:"Comic Mono";font-size:11px;fill:#546A73}
    .lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}.activation{stroke-width:1.5;rx:5}.seq{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.seqReturn{fill:none;stroke-width:2.5;stroke-dasharray:8 6;stroke-linecap:round;stroke-linejoin:round}
    .labelPill{fill:#FFF;stroke:#D7E0E4;stroke-width:1.3}.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700;fill:#FFF}.msgText{font-family:"Comic Mono";font-size:14px;font-weight:700}.altBox{fill:#EEF7F0;fill-opacity:.18;stroke:#78909C;stroke-width:2.4;stroke-dasharray:12 7}.branchDivider{stroke:#78909C;stroke-width:2.4;stroke-dasharray:12 8}
  </style>
</defs>
<rect class="canvas" width="1960" height="1320"/>
<rect class="frame" x="32" y="28" width="1896" height="1264" rx="30"/>
<text class="title" x="68" y="84">Amazon Bedrock Runtime Streaming Sequence</text>
<text class="subtitle" x="72" y="116">Collect the cold Flow inside the client scope; terminal cancellation owns the SDK stream cleanup.</text>

<g id="participant-caller">
  <rect class="card" x="130" y="168" width="220" height="80" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="240" y="207" text-anchor="middle">Caller</text><text class="role" x="240" y="232" text-anchor="middle">Coroutine scope</text>
  <line class="lifeline" x1="240" y1="248" x2="240" y2="1155"/>
</g>
<g id="participant-client">
  <rect class="card" x="485" y="168" width="250" height="80" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="610" y="207" text-anchor="middle">Scoped client</text><text class="role" x="610" y="232" text-anchor="middle">withBedrockRuntimeClient / use</text>
  <line class="lifeline" x1="610" y1="248" x2="610" y2="1155"/>
</g>
<g id="participant-flow">
  <rect class="card" x="850" y="168" width="260" height="80" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="980" y="207" text-anchor="middle">Facade + bt4k Flow</text><text class="role" x="980" y="232" text-anchor="middle">textDeltaFlow / castNotNull / takeUntil</text>
  <line class="lifeline" x1="980" y1="248" x2="980" y2="1155"/>
</g>
<g id="participant-sdk">
  <rect class="card" x="1235" y="168" width="220" height="80" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="1345" y="207" text-anchor="middle">SDK stream</text><text class="role" x="1345" y="232" text-anchor="middle">Java SdkPublisher / Kotlin Flow</text>
  <line class="lifeline" x1="1345" y1="248" x2="1345" y2="1155"/>
</g>
<g id="participant-bedrock">
  <rect class="card" x="1580" y="168" width="250" height="80" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <image xlink:href="../../assets/aws-icons/official-04302026/Architecture-Service-Icons_04302026/Arch_Artificial-Intelligence/48/Arch_Amazon-Bedrock_48.svg" x="1588" y="184" width="48" height="48" preserveAspectRatio="xMidYMid meet"/>
  <text class="cardTitle" x="1644" y="207">Amazon Bedrock</text><text class="role" x="1644" y="232">ConverseStream API</text>
  <line class="lifeline" x1="1705" y1="248" x2="1705" y2="1155"/>
</g>

<rect class="activation" x="602" y="300" width="16" height="865" fill="#F1ECFF" stroke="#8A72D6"/>
<rect class="activation" x="972" y="450" width="16" height="680" fill="#EAF7EF" stroke="#58A978"/>
<rect class="activation" x="1337" y="535" width="16" height="600" fill="#FFF3D9" stroke="#D6A441"/>
<rect class="activation" x="1697" y="625" width="16" height="170" fill="#E9F7F6" stroke="#45A7A1"/>

<g id="m1"><rect class="labelPill" x="320" y="272" width="210" height="26" rx="7" stroke="#4F83BF"/><circle cx="339" cy="285" r="12" fill="#4F83BF"/><text class="badgeText" x="339" y="286" text-anchor="middle" dominant-baseline="middle">1</text><text class="msgText" x="430" y="286" text-anchor="middle" dominant-baseline="middle" fill="#4F83BF">open client scope</text><path class="seq" d="M 240 315 L 610 315" stroke="#4F83BF" marker-end="url(#arrow-blue)"/></g>
<g id="m2"><rect class="labelPill" x="680" y="352" width="230" height="26" rx="7" stroke="#755BC6"/><circle cx="699" cy="365" r="12" fill="#755BC6"/><text class="badgeText" x="699" y="366" text-anchor="middle" dominant-baseline="middle">2</text><text class="msgText" x="804" y="366" text-anchor="middle" dominant-baseline="middle" fill="#755BC6">build ConverseStream</text><path class="seq" d="M 610 395 L 980 395" stroke="#755BC6" marker-end="url(#arrow-purple)"/></g>
<g id="m3"><rect class="labelPill" x="322" y="432" width="286" height="26" rx="7" stroke="#3E9868"/><circle cx="341" cy="445" r="12" fill="#3E9868"/><text class="badgeText" x="341" y="446" text-anchor="middle" dominant-baseline="middle">3</text><text class="msgText" x="475" y="446" text-anchor="middle" dominant-baseline="middle" fill="#3E9868">collect cold text Flow</text><path class="seq" d="M 240 475 L 980 475" stroke="#3E9868" marker-end="url(#arrow-green)"/></g>
<g id="m4"><rect class="labelPill" x="1000" y="512" width="330" height="26" rx="7" stroke="#B9851B"/><circle cx="1019" cy="525" r="12" fill="#B9851B"/><text class="badgeText" x="1019" y="526" text-anchor="middle" dominant-baseline="middle">4</text><text class="msgText" x="1180" y="526" text-anchor="middle" dominant-baseline="middle" fill="#B9851B">Java request(1) / native collect</text><path class="seq" d="M 980 555 L 1345 555" stroke="#B9851B" marker-end="url(#arrow-amber)"/></g>
<g id="m5"><rect class="labelPill" x="1412" y="602" width="228" height="26" rx="7" stroke="#B9851B"/><circle cx="1431" cy="615" r="12" fill="#B9851B"/><text class="badgeText" x="1431" y="616" text-anchor="middle" dominant-baseline="middle">5</text><text class="msgText" x="1535" y="616" text-anchor="middle" dominant-baseline="middle" fill="#B9851B">send model request</text><path class="seq" d="M 1345 645 L 1705 645" stroke="#B9851B" marker-end="url(#arrow-amber)"/></g>
<g id="m6"><rect class="labelPill" x="1410" y="682" width="232" height="26" rx="7" stroke="#2E8F89"/><circle cx="1429" cy="695" r="12" fill="#2E8F89"/><text class="badgeText" x="1429" y="696" text-anchor="middle" dominant-baseline="middle">6</text><text class="msgText" x="1535" y="696" text-anchor="middle" dominant-baseline="middle" fill="#2E8F89">stream native event</text><path class="seqReturn" d="M 1705 725 L 1345 725" stroke="#2E8F89"/><polygon points="1357,718.4 1345,725 1357,731.6" fill="#2E8F89" stroke="#2E8F89" data-direct-solid-head="true"/></g>
<g id="m7"><rect class="labelPill" x="1058" y="762" width="210" height="26" rx="7" stroke="#3E9868"/><circle cx="1077" cy="775" r="12" fill="#3E9868"/><text class="badgeText" x="1077" y="776" text-anchor="middle" dominant-baseline="middle">7</text><text class="msgText" x="1172" y="776" text-anchor="middle" dominant-baseline="middle" fill="#3E9868">emit text delta</text><path class="seqReturn" d="M 1345 805 L 980 805" stroke="#3E9868"/><polygon points="992,798.4 980,805 992,811.6" fill="#3E9868" stroke="#3E9868" data-direct-solid-head="true"/></g>

<g id="terminal-region">
  <rect class="altBox" x="180" y="835" width="1210" height="310" rx="18"/>
  <rect class="labelPill" x="205" y="821" width="255" height="28" rx="7"/><text class="detail" x="332" y="835" text-anchor="middle" dominant-baseline="middle">alt cooperative stopSignal</text>
  <line class="branchDivider" x1="180" y1="910" x2="1390" y2="910"/>
  <rect class="labelPill" x="205" y="896" width="310" height="28" rx="7"/><text class="detail" x="360" y="910" text-anchor="middle" dominant-baseline="middle">else hard deadline / collector cancel</text>
  <line class="branchDivider" x1="180" y1="980" x2="1390" y2="980"/>
  <rect class="labelPill" x="205" y="966" width="360" height="28" rx="7"/><text class="detail" x="385" y="980" text-anchor="middle" dominant-baseline="middle">else AWS SDK retry callback (Java adapter)</text>
  <line class="branchDivider" x1="180" y1="1070" x2="1390" y2="1070"/>
  <rect class="labelPill" x="205" y="1056" width="240" height="28" rx="7" stroke="#2E8F89"/><circle cx="224" cy="1070" r="12" fill="#2E8F89"/><text class="badgeText" x="224" y="1071" text-anchor="middle" dominant-baseline="middle">12</text><text class="detail" x="337" y="1070" text-anchor="middle" dominant-baseline="middle">else normal completion</text>
  <line class="branchDivider" x1="180" y1="1110" x2="1390" y2="1110"/>
  <rect class="labelPill" x="205" y="1096" width="205" height="28" rx="7" stroke="#C96C4B"/><circle cx="224" cy="1110" r="12" fill="#C96C4B"/><text class="badgeText" x="224" y="1111" text-anchor="middle" dominant-baseline="middle">13</text><text class="detail" x="317" y="1110" text-anchor="middle" dominant-baseline="middle">else native error</text>
</g>
<g id="m8"><rect class="labelPill" x="300" y="852" width="330" height="26" rx="7" stroke="#4F83BF"/><circle cx="319" cy="865" r="12" fill="#4F83BF"/><text class="badgeText" x="319" y="866" text-anchor="middle" dominant-baseline="middle">8</text><text class="msgText" x="475" y="866" text-anchor="middle" dominant-baseline="middle" fill="#4F83BF">takeUntil waits for next event</text><path class="seqReturn" d="M 980 885 L 240 885" stroke="#4F83BF"/><polygon points="252,878.4 240,885 252,891.6" fill="#4F83BF" stroke="#4F83BF" data-direct-solid-head="true"/></g>
<g id="m9"><rect class="labelPill" x="470" y="928" width="360" height="26" rx="7" stroke="#C96C4B"/><circle cx="489" cy="941" r="12" fill="#C96C4B"/><text class="badgeText" x="489" y="942" text-anchor="middle" dominant-baseline="middle">9</text><text class="msgText" x="665" y="942" text-anchor="middle" dominant-baseline="middle" fill="#C96C4B">withTimeout cancels immediately</text><path class="seq" d="M 240 965 L 980 965" stroke="#C96C4B" marker-end="url(#arrow-coral)"/></g>
<g id="m10"><rect class="labelPill" x="1010" y="995" width="320" height="26" rx="7" stroke="#755BC6"/><circle cx="1029" cy="1008" r="12" fill="#755BC6"/><text class="badgeText" x="1029" y="1009" text-anchor="middle" dominant-baseline="middle">10</text><text class="msgText" x="1180" y="1009" text-anchor="middle" dominant-baseline="middle" fill="#755BC6">on SDK retry: newest generation</text><path class="seqReturn" d="M 1345 1025 L 980 1025" stroke="#755BC6"/><polygon points="992,1018.4 980,1025 992,1031.6" fill="#755BC6" stroke="#755BC6" data-direct-solid-head="true"/></g>
<g id="m11"><rect class="labelPill" x="1000" y="1032" width="330" height="26" rx="7" stroke="#C96C4B"/><circle cx="1019" cy="1045" r="12" fill="#C96C4B"/><text class="badgeText" x="1019" y="1046" text-anchor="middle" dominant-baseline="middle">11</text><text class="msgText" x="1180" y="1046" text-anchor="middle" dominant-baseline="middle" fill="#C96C4B">cancel old; discard late signals</text><path class="seq" d="M 980 1062 L 1345 1062" stroke="#C96C4B" marker-end="url(#arrow-coral)"/></g>
<g id="normal-terminal"><path class="seqReturn" d="M 1345 1092 L 980 1092" stroke="#2E8F89"/><polygon points="992,1085.4 980,1092 992,1098.6" fill="#2E8F89" stroke="#2E8F89" data-direct-solid-head="true"/></g>
<g id="error-terminal"><path class="seqReturn" d="M 1345 1130 L 980 1130" stroke="#C96C4B"/><polygon points="992,1123.4 980,1130 992,1136.6" fill="#C96C4B" stroke="#C96C4B" data-direct-solid-head="true"/></g>
<g id="m14"><rect class="labelPill" x="320" y="1138" width="225" height="26" rx="7" stroke="#2E8F89"/><circle cx="339" cy="1151" r="12" fill="#2E8F89"/><text class="badgeText" x="339" y="1152" text-anchor="middle" dominant-baseline="middle">14</text><text class="msgText" x="440" y="1152" text-anchor="middle" dominant-baseline="middle" fill="#2E8F89">close after terminal</text><path class="seqReturn" d="M 610 1172 L 240 1172" stroke="#2E8F89"/><polygon points="252,1165.4 240,1172 252,1178.6" fill="#2E8F89" stroke="#2E8F89" data-direct-solid-head="true"/></g>

<g><rect x="120" y="1200" width="1720" height="56" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="footer" x="980" y="1222" text-anchor="middle">Each collection can incur a new billable request. Java bounds demand to request(1); do not log raw prompts or output.</text><text class="footer" x="980" y="1244" text-anchor="middle">SDK retries may repeat semantic output; no exactly-once guarantee. Prefer non-streaming Converse for transactional work.</text></g>
</svg>
