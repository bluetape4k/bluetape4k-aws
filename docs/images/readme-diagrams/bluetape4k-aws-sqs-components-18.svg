<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-label="SQS Spring Boot operations and listener components">
<defs>
  <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
  <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F6DE0"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F8B57"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#168E86"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#EA580C"/></marker>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter";font-size:38px;fill:#102033}
  .subtitle,.detail,.tiny,.chip{font-family:"Comic Mono";fill:#526274}
  .subtitle{font-size:16px}.detail{font-size:13px}.tiny{font-size:11px}.chip{font-size:11px;fill:#243447}
  .layer-title{font-family:"Architects Daughter";font-size:24px;fill:#102033}
  .layer-detail{font-family:"Comic Mono";font-size:12px;fill:#526274}
  .card-title{font-family:"Architects Daughter";font-size:21px;fill:#102033}
  .layer{fill:#F8FAFC;stroke:#D9E2EC;stroke-width:1.4}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter";font-size:17px;fill:#FFFFFF}
  .footer-detail{font-family:"Comic Mono";font-size:12px;fill:#DDE7F2}
</style>

<rect x="26" y="26" width="1388" height="708" rx="14" class="frame"/>
<text class="title" x="54" y="74">SQS Spring Boot runtime</text>
<text class="subtitle" x="56" y="106">SQS auto-configuration creates coroutine operations and optional listener containers with converter and interceptor hooks.</text>

<g>
  <rect x="944" y="57" width="124" height="25" rx="12.5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="chip" x="1006" y="70.5" text-anchor="middle" dominant-baseline="middle">Operations</text>
  <rect x="1084" y="57" width="124" height="25" rx="12.5" fill="#EAF7EF" stroke="#58A978"/>
  <text class="chip" x="1146" y="70.5" text-anchor="middle" dominant-baseline="middle">Listener</text>
  <rect x="1224" y="57" width="146" height="25" rx="12.5" fill="#FFF7ED" stroke="#F97316"/>
  <text class="chip" x="1297" y="70.5" text-anchor="middle" dominant-baseline="middle">Observability</text>
</g>

<g id="layers">
  <rect class="layer" x="70" y="142" width="280" height="410" rx="12"/>
  <text class="layer-title" x="92" y="178">Auto-config</text>
  <text class="layer-detail" x="94" y="200">client, properties, listener scanner</text>
  <rect class="layer" x="390" y="142" width="300" height="410" rx="12"/>
  <text class="layer-title" x="412" y="178">Operations API</text>
  <text class="layer-detail" x="414" y="200">send, receive, delete, visibility</text>
  <rect class="layer" x="730" y="142" width="310" height="410" rx="12"/>
  <text class="layer-title" x="752" y="178">Listener runtime</text>
  <text class="layer-detail" x="754" y="200">annotation endpoint and invocation</text>
  <rect class="layer" x="1080" y="142" width="290" height="410" rx="12"/>
  <text class="layer-title" x="1102" y="178">Extension points</text>
  <text class="layer-detail" x="1104" y="200">payload conversion and metrics</text>
</g>

<g id="cards">
  <rect class="card" x="100" y="224" width="220" height="92" rx="9" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="210" y="258" text-anchor="middle">SQS client</text>
  <text class="detail" x="210" y="284" text-anchor="middle">region + endpoint</text>
  <text class="detail" x="210" y="304" text-anchor="middle">customizers apply</text>
  <rect class="card" x="100" y="382" width="220" height="92" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="210" y="416" text-anchor="middle">Listener scanner</text>
  <text class="detail" x="210" y="442" text-anchor="middle">@SqsListener methods</text>
  <text class="detail" x="210" y="462" text-anchor="middle">placeholder only</text>

  <rect class="card" x="420" y="224" width="240" height="92" rx="9" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="540" y="258" text-anchor="middle">SqsOperations</text>
  <text class="detail" x="540" y="284" text-anchor="middle">coroutine template</text>
  <text class="detail" x="540" y="304" text-anchor="middle">FIFO fields supported</text>
  <rect class="card" x="420" y="382" width="240" height="92" rx="9" fill="#F3FBFA" stroke="#63B8B3"/>
  <text class="card-title" x="540" y="416" text-anchor="middle">Queue settings</text>
  <text class="detail" x="540" y="442" text-anchor="middle">named queue URL</text>
  <text class="detail" x="540" y="462" text-anchor="middle">redrive policy</text>

  <rect class="card" x="760" y="224" width="250" height="92" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="885" y="258" text-anchor="middle">Listener container</text>
  <text class="detail" x="885" y="284" text-anchor="middle">polling coroutines</text>
  <text class="detail" x="885" y="304" text-anchor="middle">concurrency + lifecycle</text>
  <rect class="card" x="760" y="382" width="250" height="92" rx="9" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="885" y="416" text-anchor="middle">Method invoker</text>
  <text class="detail" x="885" y="442" text-anchor="middle">body / message / JSON</text>
  <text class="detail" x="885" y="462" text-anchor="middle">manual ack opt-in</text>

  <rect class="card" x="1110" y="224" width="230" height="92" rx="9" fill="#FFF7ED" stroke="#F97316"/>
  <text class="card-title" x="1225" y="258" text-anchor="middle">Message converter</text>
  <text class="detail" x="1225" y="284" text-anchor="middle">Jackson 3 bean</text>
  <text class="detail" x="1225" y="304" text-anchor="middle">typed payloads</text>
  <rect class="card" x="1110" y="382" width="230" height="92" rx="9" fill="#FFF4E6" stroke="#F59E0B"/>
  <text class="card-title" x="1225" y="416" text-anchor="middle">Interceptors</text>
  <text class="detail" x="1225" y="442" text-anchor="middle">receive / handle / ack</text>
  <text class="detail" x="1225" y="462" text-anchor="middle">Micrometer optional</text>
</g>

<g id="connections">
  <path class="edge" d="M 320 270 L 420 270" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M 320 428 L 420 428" stroke="#2F8B57" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M 660 270 L 760 270" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M 660 428 L 760 428" stroke="#2F8B57" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M 1010 270 L 1110 270" stroke="#168E86" marker-end="url(#arrow-teal)"/>
  <path class="edge" d="M 1010 428 L 1110 428" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
</g>

<g id="contracts">
  <rect x="86" y="584" width="600" height="72" rx="10" fill="#FFFFFF" stroke="#D9E2EC"/>
  <text class="card-title" x="110" y="616">Signature contract</text>
  <text class="detail" x="404" y="614">one payload</text>
  <text class="detail" x="552" y="614">optional ack</text>
  <text class="tiny" x="110" y="640">Listeners accept one payload-like argument plus at most one SqsAcknowledgement.</text>
  <rect x="724" y="584" width="630" height="72" rx="10" fill="#FFFFFF" stroke="#D9E2EC"/>
  <text class="card-title" x="748" y="616">Failure boundary</text>
  <text class="detail" x="990" y="614">retry in process</text>
  <text class="detail" x="1176" y="614">visibility on final fail</text>
  <text class="tiny" x="748" y="640">Failed messages are not deleted automatically; handlers should stay idempotent.</text>
</g>

<rect class="footer" x="54" y="690" width="1332" height="34" rx="8"/>
<text class="footer-title" x="74" y="710" dominant-baseline="middle">Boundary</text>
<text class="footer-detail" x="178" y="710" dominant-baseline="middle">SQS listeners wrap coroutine receive loops; deletion happens only after default or explicit acknowledgement.</text>
</svg>
