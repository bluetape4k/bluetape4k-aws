  <text class="detail" x="1050.0" y="636.0" text-anchor="middle" dominant-baseline="middle">DSL helpers</text>
</g>
<g id="sdkdeps">
  <rect class="card" x="570.0" y="748.0" width="300.0" height="92.0" rx="10" fill="#FFF7ED" stroke="#F97316"/>
