</g>
<g id="aws">
  <rect class="card" x="405.0" y="936.0" width="300.0" height="92.0" rx="10" fill="#FFF7ED" stroke="#F97316"/>
  <text class="card-title" x="555.0" y="970.0" text-anchor="middle" dominant-baseline="middle">AWS or emulator</text>
  <text class="detail" x="555.0" y="994.0" text-anchor="middle" dominant-baseline="middle">S3, SQS, DynamoDB</text>
  <text class="detail" x="555.0" y="1012.0" text-anchor="middle" dominant-baseline="middle">KMS, CloudWatch, STS</text>
</g>
<g id="jdbc">
  <rect class="card" x="735.0" y="936.0" width="300.0" height="92.0" rx="10" fill="#F8FAFC" stroke="#64748B"/>
  <text class="card-title" x="885.0" y="970.0" text-anchor="middle" dominant-baseline="middle">JDBC stores</text>
  <text class="detail" x="885.0" y="994.0" text-anchor="middle" dominant-baseline="middle">PostgreSQL/H2</text>
  <text class="detail" x="885.0" y="1012.0" text-anchor="middle" dominant-baseline="middle">Secrets/Parameter</text>
</g>
<rect class="footer" x="54" y="1094" width="1332" height="54" rx="8"/>
<text class="footer-title" x="74" y="1117" dominant-baseline="middle">Reader cue</text>
<text class="footer-detail" x="74" y="1137" dominant-baseline="middle">AWS service SDKs remain consumer-provided compileOnly dependencies; examples verify the same paths against Floci/LocalStack/MiniStack.</text>
</svg>