<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-label="Bluetape4k AWS architecture overview">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#d97706"/>
    </marker>
    <marker id="arrowViolet" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#7c3aed"/>
    </marker>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#f8fafc}
      .frame{fill:#ffffff;stroke:#8aa6cf;stroke-width:3;filter:url(#softShadow)}
      .title{font-family:"Architects Daughter";font-size:48px;fill:#17233a}
      .subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
      .band{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;stroke-dasharray:9 8}
      .bandTitle{font-family:"Comic Mono";font-size:18px;font-weight:700;fill:#475569}
      .card{fill:#ffffff;stroke-width:2.2;filter:url(#softShadow)}
      .cardTitle{font-family:"Architects Daughter";font-size:25px;fill:#17233a}
      .cardText{font-family:"Comic Mono";font-size:13px;fill:#475569}
      .small{fill:#ffffff;stroke-width:2}
      .smallTitle{font-family:"Architects Daughter";font-size:20px;fill:#17233a}
      .smallText{font-family:"Comic Mono";font-size:12px;fill:#64748b}
      .route{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .routeText{font-family:"Comic Mono";font-size:13px;fill:#334155}
      .pill{fill:#ffffff;stroke-width:2}
      .pillText{font-family:"Comic Mono";font-size:13px;fill:#334155}
      .footerText{font-family:"Comic Mono";font-size:14px;fill:#475569}
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1080"/>
  <rect class="frame" x="42" y="36" width="1516" height="1004" rx="24"/>
  <text class="title" x="800" y="96" text-anchor="middle">Bluetape4k AWS Architecture</text>
  <text class="subtitle" x="800" y="132" text-anchor="middle">Application entry points choose a wrapper or adapter; AWS service SDKs stay consumer-provided runtime dependencies.</text>

  <g id="application-entry">
    <rect class="band" x="92" y="178" width="1416" height="154" rx="18"/>
    <text class="bandTitle" x="118" y="216">APP ENTRY POINTS</text>
    <rect class="card" x="164" y="238" width="330" height="72" rx="14" stroke="#2563eb"/>
    <text class="cardTitle" x="329" y="266" text-anchor="middle">plain Kotlin services</text>
    <text class="cardText" x="329" y="292" text-anchor="middle">coroutines or Java SDK async callers</text>
    <rect class="card" x="636" y="238" width="330" height="72" rx="14" stroke="#059669"/>
    <text class="cardTitle" x="801" y="266" text-anchor="middle">Spring Boot 4 apps</text>
    <text class="cardText" x="801" y="292" text-anchor="middle">auto-config, templates, listeners</text>
    <rect class="card" x="1108" y="238" width="330" height="72" rx="14" stroke="#7c3aed"/>
    <text class="cardTitle" x="1273" y="266" text-anchor="middle">Ktor 3 services</text>
    <text class="cardText" x="1273" y="292" text-anchor="middle">client signing, plugins, server runtimes</text>
  </g>

  <g id="module-surfaces">
    <rect class="band" x="92" y="370" width="1416" height="244" rx="18"/>
    <text class="bandTitle" x="118" y="408">PUBLISHED MODULE SURFACES</text>
    <rect class="card" x="142" y="448" width="244" height="92" rx="16" stroke="#2563eb"/>
    <text class="cardTitle" x="264" y="480" text-anchor="middle">aws-java</text>
    <text class="cardText" x="264" y="506" text-anchor="middle">sync, async, await</text>
    <text class="cardText" x="264" y="526" text-anchor="middle">Java SDK v2 services</text>
    <rect class="card" x="410" y="448" width="244" height="92" rx="16" stroke="#059669"/>
    <text class="cardTitle" x="532" y="480" text-anchor="middle">aws-kotlin</text>
    <text class="cardText" x="532" y="506" text-anchor="middle">native suspend helpers</text>
    <text class="cardText" x="532" y="526" text-anchor="middle">DSL and model helpers</text>
    <rect class="card" x="678" y="448" width="244" height="92" rx="16" stroke="#d97706"/>
    <text class="cardTitle" x="800" y="480" text-anchor="middle">aws-exposed</text>
    <text class="cardText" x="800" y="506" text-anchor="middle">RDS IAM and Hikari</text>
    <text class="cardText" x="800" y="526" text-anchor="middle">Secrets / Parameter sources</text>
    <rect class="card" x="946" y="448" width="244" height="92" rx="16" stroke="#dc2626"/>
    <text class="cardTitle" x="1068" y="480" text-anchor="middle">aws-spring-boot</text>
    <text class="cardText" x="1068" y="506" text-anchor="middle">auto-config operations</text>
    <text class="cardText" x="1068" y="526" text-anchor="middle">templates and listeners</text>
    <rect class="card" x="1214" y="448" width="244" height="92" rx="16" stroke="#7c3aed"/>
    <text class="cardTitle" x="1336" y="480" text-anchor="middle">aws-ktor</text>
    <text class="cardText" x="1336" y="506" text-anchor="middle">SigV4, S3 REST, SQS</text>
    <text class="cardText" x="1336" y="526" text-anchor="middle">DynamoDB server plugin</text>
  </g>

  <g id="dependency-boundary">
    <rect class="band" x="92" y="652" width="1416" height="154" rx="18"/>
    <text class="bandTitle" x="118" y="690">CONSUMER DEPENDENCY BOUNDARY</text>
    <rect class="card" x="240" y="722" width="430" height="54" rx="16" stroke="#0ea5e9"/>
    <text class="cardTitle" x="455" y="754" text-anchor="middle">compileOnly AWS service SDKs</text>
    <rect class="card" x="930" y="722" width="430" height="54" rx="16" stroke="#0ea5e9"/>
    <text class="cardTitle" x="1145" y="754" text-anchor="middle">application adds only used services</text>
  </g>

  <g id="runtime-targets">
    <rect class="band" x="92" y="844" width="1416" height="124" rx="18"/>
    <text class="bandTitle" x="118" y="882">AWS, DATABASE, AND LOCAL VERIFICATION TARGETS</text>
    <rect class="pill" x="168" y="908" width="170" height="36" rx="13" stroke="#2563eb"/>
    <text class="pillText" x="253" y="931" text-anchor="middle">S3 / S3 Vectors</text>
    <rect class="pill" x="362" y="908" width="150" height="36" rx="13" stroke="#2563eb"/>
    <text class="pillText" x="437" y="931" text-anchor="middle">SQS / SNS</text>
    <rect class="pill" x="536" y="908" width="148" height="36" rx="13" stroke="#2563eb"/>
    <text class="pillText" x="610" y="931" text-anchor="middle">DynamoDB</text>
    <rect class="pill" x="708" y="908" width="178" height="36" rx="13" stroke="#059669"/>
    <text class="pillText" x="797" y="931" text-anchor="middle">KMS / STS / IMDS</text>
    <rect class="pill" x="910" y="908" width="180" height="36" rx="13" stroke="#059669"/>
    <text class="pillText" x="1000" y="931" text-anchor="middle">CloudWatch Logs</text>
    <rect class="pill" x="1114" y="908" width="178" height="36" rx="13" stroke="#d97706"/>
    <text class="pillText" x="1203" y="931" text-anchor="middle">RDS / Secrets / SSM</text>
    <rect class="pill" x="1316" y="908" width="132" height="36" rx="13" stroke="#7c3aed"/>
    <text class="pillText" x="1382" y="931" text-anchor="middle">Floci tests</text>
  </g>

  <path class="route" d="M 329 310 L 264 448" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
  <path class="route" d="M 329 310 C 430 360 492 390 532 448" stroke="#059669" marker-end="url(#arrowGreen)"/>
  <path class="route" d="M 801 310 L 1068 448" stroke="#d97706" marker-end="url(#arrowAmber)"/>
  <path class="route" d="M 1273 310 L 1336 448" stroke="#7c3aed" marker-end="url(#arrowViolet)"/>
  <text class="routeText" x="800" y="354" text-anchor="middle">choose the smallest surface that matches the application runtime</text>

  <path class="route" d="M 800 614 L 800 652" stroke="#059669" marker-end="url(#arrowGreen)"/>
  <text class="routeText" x="858" y="638">library modules do not force every AWS service SDK onto consumers</text>

  <path class="route" d="M 800 806 L 800 844" stroke="#059669" marker-end="url(#arrowGreen)"/>
  <text class="routeText" x="858" y="832">runtime verification targets</text>

  <text class="footerText" x="800" y="1002" text-anchor="middle">BOM stays outside the runtime path; correctness is proven in Ktor and Spring examples against Floci-first emulators.</text>
</svg>
