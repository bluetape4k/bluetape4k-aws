  <text class="detail" x="940.0" y="430.0" text-anchor="middle" dominant-baseline="middle">SigV4 plugin</text>
  <text class="detail" x="940.0" y="448.0" text-anchor="middle" dominant-baseline="middle">server runtimes</text>
</g>
<g id="java">
  <rect class="card" x="240.0" y="560.0" width="300.0" height="92.0" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
