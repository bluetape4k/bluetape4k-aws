  <text class="detail" x="390.0" y="618.0" text-anchor="middle" dominant-baseline="middle">Java SDK v2</text>
  <text class="detail" x="390.0" y="636.0" text-anchor="middle" dominant-baseline="middle">future.await wrappers</text>
</g>
<g id="exposed">
  <rect class="card" x="570.0" y="560.0" width="300.0" height="92.0" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="card-title" x="720.0" y="594.0" text-anchor="middle" dominant-baseline="middle">aws-exposed</text>
  <text class="detail" x="720.0" y="618.0" text-anchor="middle" dominant-baseline="middle">database registry</text>
  <text class="detail" x="720.0" y="636.0" text-anchor="middle" dominant-baseline="middle">RDS IAM + config</text>
</g>
<g id="kotlin">
  <rect class="card" x="900.0" y="560.0" width="300.0" height="92.0" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="1050.0" y="594.0" text-anchor="middle" dominant-baseline="middle">aws-kotlin</text>
