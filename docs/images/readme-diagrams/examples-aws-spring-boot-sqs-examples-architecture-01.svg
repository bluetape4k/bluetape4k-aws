<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-label="Spring Boot SQS and SNS example architecture">
<defs>
  <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%">
    <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/>
  </filter>
  <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F6DE0"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F8B57"/>
  </marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#168E86"/>
  </marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#EA580C"/>
  </marker>
  <marker id="arrow-slate" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
  </marker>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter";font-size:38px;fill:#102033}
  .subtitle,.detail,.tiny,.chip{font-family:"Comic Mono";fill:#526274}
  .subtitle{font-size:16px}
  .layer-title{font-family:"Architects Daughter";font-size:24px;fill:#102033}
  .layer-detail{font-family:"Comic Mono";font-size:12px;fill:#526274}
  .card-title{font-family:"Architects Daughter";font-size:21px;fill:#102033}
  .detail{font-size:13px}
  .tiny{font-size:11px}
  .chip{font-size:11px;fill:#243447}
  .layer{fill:#F8FAFC;stroke:#D9E2EC;stroke-width:1.4}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
  .soft-edge{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter";font-size:17px;fill:#FFFFFF}
  .footer-detail{font-family:"Comic Mono";font-size:12px;fill:#DDE7F2}
</style>

<rect x="26" y="26" width="1388" height="668" rx="14" class="frame"/>
<text class="title" x="54" y="74">Spring Boot SQS/SNS example</text>
<text class="subtitle" x="56" y="106">A WebFlux sample for queue REST APIs, annotated listeners, SNS fanout, DLQ redrive, retry, and listener events.</text>

<g>
  <rect x="984" y="57" width="106" height="25" rx="12.5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="chip" x="1037" y="70.5" text-anchor="middle" dominant-baseline="middle">REST</text>
  <rect x="1104" y="57" width="126" height="25" rx="12.5" fill="#EAF7EF" stroke="#58A978"/>
  <text class="chip" x="1167" y="70.5" text-anchor="middle" dominant-baseline="middle">Listeners</text>
  <rect x="1244" y="57" width="126" height="25" rx="12.5" fill="#FFF7ED" stroke="#F97316"/>
  <text class="chip" x="1307" y="70.5" text-anchor="middle" dominant-baseline="middle">SNS/SQS</text>
</g>

<g id="layers">
  <rect class="layer" x="70" y="142" width="300" height="392" rx="12"/>
  <text class="layer-title" x="92" y="178">HTTP and probes</text>
  <text class="layer-detail" x="94" y="200">Controller endpoints and read models</text>

  <rect class="layer" x="405" y="142" width="355" height="392" rx="12"/>
  <text class="layer-title" x="427" y="178">Example service</text>
  <text class="layer-detail" x="429" y="200">Queue, topic, policy, and redrive setup</text>

  <rect class="layer" x="795" y="142" width="300" height="392" rx="12"/>
  <text class="layer-title" x="817" y="178">Spring listeners</text>
  <text class="layer-detail" x="819" y="200">Payload conversion, ack, retry, events</text>

  <rect class="layer" x="1130" y="142" width="240" height="392" rx="12"/>
  <text class="layer-title" x="1152" y="178">AWS emulator</text>
  <text class="layer-detail" x="1154" y="200">Floci by default, LocalStack fallback</text>
</g>

<g id="cards">
  <rect class="card" x="100" y="238" width="240" height="102" rx="9" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="220" y="274" text-anchor="middle">SqsSnsController</text>
  <text class="detail" x="220" y="302" text-anchor="middle">queues, messages</text>
  <text class="detail" x="220" y="322" text-anchor="middle">fanout and DLQ</text>

  <rect class="card" x="100" y="380" width="240" height="102" rx="9" fill="#F0F6FF" stroke="#7AA3F5"/>
  <text class="card-title" x="220" y="416" text-anchor="middle">Read endpoints</text>
  <text class="detail" x="220" y="444" text-anchor="middle">handled messages</text>
  <text class="detail" x="220" y="464" text-anchor="middle">orders and events</text>

  <rect class="card" x="435" y="222" width="295" height="116" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="582.5" y="258" text-anchor="middle">SqsSnsService</text>
  <text class="detail" x="582.5" y="286" text-anchor="middle">SqsOperations</text>
  <text class="detail" x="582.5" y="306" text-anchor="middle">SnsOperations</text>

  <rect class="card" x="435" y="382" width="295" height="116" rx="9" fill="#EEF9F1" stroke="#75B989"/>
  <text class="card-title" x="582.5" y="418" text-anchor="middle">AWS clients</text>
  <text class="detail" x="582.5" y="446" text-anchor="middle">QueueArn lookup</text>
  <text class="detail" x="582.5" y="466" text-anchor="middle">policy and subscribe</text>

  <rect class="card" x="825" y="222" width="240" height="116" rx="9" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="945" y="258" text-anchor="middle">Order listeners</text>
  <text class="detail" x="945" y="286" text-anchor="middle">String and JSON</text>
  <text class="detail" x="945" y="306" text-anchor="middle">manual ack</text>

  <rect class="card" x="825" y="382" width="240" height="116" rx="9" fill="#F3FBFA" stroke="#63B8B3"/>
  <text class="card-title" x="945" y="418" text-anchor="middle">Listener store</text>
  <text class="detail" x="945" y="446" text-anchor="middle">retry attempts</text>
  <text class="detail" x="945" y="466" text-anchor="middle">ack events</text>

  <rect class="card" x="1160" y="236" width="180" height="116" rx="9" fill="#FFF7ED" stroke="#F97316"/>
  <text class="card-title" x="1250" y="272" text-anchor="middle">SQS queues</text>
  <text class="detail" x="1250" y="300" text-anchor="middle">orders</text>
  <text class="detail" x="1250" y="320" text-anchor="middle">typed and retry</text>

  <rect class="card" x="1160" y="394" width="180" height="116" rx="9" fill="#FFF4E6" stroke="#F59E0B"/>
  <text class="card-title" x="1250" y="430" text-anchor="middle">SNS and DLQ</text>
  <text class="detail" x="1250" y="458" text-anchor="middle">topic fanout</text>
  <text class="detail" x="1250" y="478" text-anchor="middle">redrive policy</text>
</g>

<g id="connections">
  <path class="edge" d="M 340 289 L 435 289" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M 730 280 L 825 280" stroke="#2F8B57" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M 1065 280 L 1160 292" stroke="#EA580C" marker-end="url(#arrow-orange)"/>

  <path class="soft-edge" d="M 340 431 L 380 520 L 780 520 L 825 452" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
  <path class="soft-edge" d="M 945 338 L 945 382" stroke="#168E86" marker-end="url(#arrow-teal)"/>
  <path class="soft-edge" d="M 730 440 L 780 535 L 1110 535 L 1160 452" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
  <path class="soft-edge" d="M 1250 394 L 1250 352" stroke="#475569" marker-end="url(#arrow-slate)"/>
</g>

<g id="contracts">
  <rect x="86" y="564" width="600" height="72" rx="10" fill="#FFFFFF" stroke="#D9E2EC"/>
  <text class="card-title" x="110" y="596">Runtime contract</text>
  <text class="detail" x="300" y="594">send/receive</text>
  <text class="detail" x="440" y="594">fanout</text>
  <text class="detail" x="550" y="594">DLQ</text>
  <text class="tiny" x="110" y="620">The service resolves queue URLs, creates policies, subscribes queues, and sets redrive attributes.</text>

  <rect x="724" y="564" width="630" height="72" rx="10" fill="#FFFFFF" stroke="#D9E2EC"/>
  <text class="card-title" x="748" y="596">Verification</text>
  <text class="detail" x="914" y="594">listener poll</text>
  <text class="detail" x="1068" y="594">retry succeeds</text>
  <text class="detail" x="1232" y="594">fanout delivery</text>
  <text class="tiny" x="748" y="620">ApplicationContextRunner wires SQS, SNS, Jackson conversion, credentials, and emulator endpoints.</text>
</g>

<rect class="footer" x="54" y="652" width="1332" height="34" rx="8"/>
<text class="footer-title" x="74" y="672" dominant-baseline="middle">Reader cue</text>
<text class="footer-detail" x="190" y="672" dominant-baseline="middle">Use this example to copy queue REST APIs, annotated listener behavior, SNS fanout, and DLQ redrive setup into a Spring Boot app.</text>
</svg>
