<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" viewBox="0 0 1320 520" role="img" aria-label="Ktor DynamoDB Orders Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono",monospace;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter",cursive;font-size:21px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono",monospace;font-size:13px;font-weight:400;fill:#536273}
    .mono{font-family:"Comic Mono",monospace;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="1320" height="520"/>
<rect class="frame" x="32" y="28" width="1256" height="464" rx="28"/>
<text class="title" x="66" y="82">Ktor DynamoDB Orders Flow</text>
<text class="subtitle" x="70" y="118">Source-verified routes install DynamoDbKtorPlugin and use the orders table repository</text>
<path class="line" d="M316 252 C346 252 366 252 396 252"/>
<path class="line" d="M612 252 C642 252 662 252 692 252"/>
<path class="line" d="M908 252 C938 252 958 252 988 252"/>
<g transform="translate(72,178)">
  <rect class="card" x="0" y="0" width="244" height="148" rx="16" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="122" y="44" text-anchor="middle">Ktor Client</text>
  <text class="small" x="122" y="76" text-anchor="middle">POST /dynamodb/orders</text>
  <text class="small" x="122" y="100" text-anchor="middle">GET /dynamodb/orders/{id}</text>
  <text class="small" x="122" y="124" text-anchor="middle">DELETE /dynamodb/orders/{id}</text>
</g>
<g transform="translate(396,178)">
  <rect class="card" x="0" y="0" width="216" height="148" rx="16" fill="#EAF7ED" stroke="#67A878"/>
  <text class="smallLabel" x="108" y="44" text-anchor="middle">Ktor Routes</text>
  <text class="small" x="108" y="78" text-anchor="middle">ContentNegotiation</text>
  <text class="small" x="108" y="104" text-anchor="middle">Order validation</text>
</g>
<g transform="translate(692,178)">
  <rect class="card" x="0" y="0" width="216" height="148" rx="16" fill="#FFF4DE" stroke="#D99A33"/>
  <text class="smallLabel" x="108" y="44" text-anchor="middle">DynamoDb Plugin</text>
  <text class="small" x="108" y="78" text-anchor="middle">autoCreateTables</text>
  <text class="small" x="108" y="104" text-anchor="middle">repository(...)</text>
</g>
<g transform="translate(988,178)">
  <rect class="card" x="0" y="0" width="244" height="148" rx="16" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="122" y="44" text-anchor="middle">DynamoDB</text>
  <text class="small" x="122" y="78" text-anchor="middle">orders table</text>
  <text class="small" x="122" y="104" text-anchor="middle">id partition key</text>
</g>
<g transform="translate(246,382)">
  <rect class="card" x="0" y="0" width="828" height="60" rx="14" fill="#EEF2FF" stroke="#8B8FD8"/>
  <text class="mono" x="414" y="37" text-anchor="middle">Order(id, status, description) mapped by DynamoItemMapper and DynamoItemReader</text>
</g>
</svg>
