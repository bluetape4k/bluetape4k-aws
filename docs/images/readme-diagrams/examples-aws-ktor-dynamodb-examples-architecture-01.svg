<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" role="img" aria-label="Ktor DynamoDB example">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="1068" height="808" rx="14" class="frame"/>
<text class="title" x="54" y="72">Ktor DynamoDB example</text>
<text class="subtitle" x="56" y="102">Ktor routes use the DynamoDB plugin and coroutine repository against LocalStack.</text>
<rect x="988" y="54" width="68" height="24" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="chip" x="1022" y="70" text-anchor="middle">Ktor</text>
<rect x="886" y="54" width="86" height="24" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="chip" x="929" y="70" text-anchor="middle">DynamoDB</text>
<rect x="769" y="54" width="101" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="chip" x="819.5" y="70" text-anchor="middle">LocalStack</text>
<g><g><path class="edge" d="M312 219 L344 219 L344 224 L390 224" stroke="#66758A"/></g>
<g><path class="edge" d="M680 224 L712 224 L712 224 L758 224" stroke="#66758A"/></g>
<g><path class="edge" d="M535 272 L535 304 L535 304 L535 404" stroke="#66758A"/></g>
<g><path class="edge" d="M903 272 L903 304 L903 304 L903 404" stroke="#66758A"/></g>
<g><path class="edge" d="M680 452 L712 452 L712 452 L758 452" stroke="#66758A"/></g></g>
<g id="client">
  <rect class="card" x="72" y="176" width="240" height="86" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="192" y="216" text-anchor="middle">HTTP client / test</text>
  <text class="detail" x="192" y="240" text-anchor="middle">CRUD route calls</text>
</g>
<g id="routes">
  <rect class="card" x="390" y="176" width="290" height="96" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="535" y="212.5" text-anchor="middle">Ktor order routes</text>
  <text class="detail" x="535" y="236.5" text-anchor="middle">POST, GET, DELETE</text>
<text class="detail" x="535" y="253.5" text-anchor="middle">scan all orders</text>
</g>
<g id="plugin">
  <rect class="card" x="758" y="176" width="290" height="96" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="903" y="212.5" text-anchor="middle">DynamoDbKtorPlugin</text>
  <text class="detail" x="903" y="236.5" text-anchor="middle">client config</text>
<text class="detail" x="903" y="253.5" text-anchor="middle">auto-create orders table</text>
</g>
<g id="repo">
  <rect class="card" x="390" y="404" width="290" height="96" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="535" y="440.5" text-anchor="middle">Coroutine repository</text>
  <text class="detail" x="535" y="464.5" text-anchor="middle">Order mapper</text>
<text class="detail" x="535" y="481.5" text-anchor="middle">DynamoDB enhanced calls</text>
</g>
<g id="ddb">
  <rect class="card" x="758" y="404" width="290" height="96" rx="10" fill="#FFF0E3" stroke="#F47B36"/>
  <text class="card-title" x="903" y="449" text-anchor="middle">DynamoDB endpoint</text>
  <text class="detail" x="903" y="473" text-anchor="middle">LocalStack or AWS</text>
</g>
<rect class="footer" x="54" y="756" width="1012" height="54" rx="8"/>
<text class="footer-title" x="72" y="775" dominant-baseline="middle">Example role</text>
<text class="footer-detail" x="72" y="793" dominant-baseline="middle">Show CRUD routes, table creation, model mapping, and coroutine repository behavior in one runnable app.</text>
</svg>