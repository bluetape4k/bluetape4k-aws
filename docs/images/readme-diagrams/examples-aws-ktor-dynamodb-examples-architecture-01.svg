<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-label="Ktor DynamoDB example architecture">
<defs>
  <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%">
    <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20" />
  </filter>
  <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F6DE0" />
  </marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#168E86" />
  </marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#EA580C" />
  </marker>
  <marker id="arrow-slate" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569" />
  </marker>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter";font-size:38px;fill:#102033}
  .subtitle,.detail,.tiny,.label,.chip{font-family:"Comic Mono";fill:#526274}
  .subtitle{font-size:16px}
  .layer-title{font-family:"Architects Daughter";font-size:24px;fill:#102033}
  .layer-detail{font-family:"Comic Mono";font-size:12px;fill:#526274}
  .card-title{font-family:"Architects Daughter";font-size:21px;fill:#102033}
  .detail{font-size:13px}
  .tiny{font-size:11px}
  .chip{font-size:11px;fill:#243447}
  .layer{fill:#F8FAFC;stroke:#D9E2EC;stroke-width:1.4}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
  .soft-edge{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7}
  .label-pill{fill:#FFFFFF;stroke:#D6E3EF;stroke-width:1.4}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter";font-size:17px;fill:#FFFFFF}
  .footer-detail{font-family:"Comic Mono";font-size:12px;fill:#DDE7F2}
</style>

<rect x="26" y="26" width="1388" height="668" rx="14" class="frame" />
<text class="title" x="54" y="74">Ktor DynamoDB example</text>
<text class="subtitle" x="56" y="106">A runnable Ktor 3 sample that wires DynamoDbKtorPlugin, typed item mapping, CRUD routes, and emulator-backed tests.</text>

<g>
  <rect x="1010" y="57" width="112" height="25" rx="12.5" fill="#E8F3FF" stroke="#5B8DEF" />
  <text class="chip" x="1066" y="70.5" text-anchor="middle" dominant-baseline="middle">Ktor app</text>
  <rect x="1136" y="57" width="126" height="25" rx="12.5" fill="#EAF7EF" stroke="#58A978" />
  <text class="chip" x="1199" y="70.5" text-anchor="middle" dominant-baseline="middle">plugin API</text>
  <rect x="1276" y="57" width="92" height="25" rx="12.5" fill="#FFF7ED" stroke="#F97316" />
  <text class="chip" x="1322" y="70.5" text-anchor="middle" dominant-baseline="middle">AWS target</text>
</g>

<g id="layers">
  <rect class="layer" x="70" y="142" width="300" height="392" rx="12" />
  <text class="layer-title" x="92" y="178">HTTP routes</text>
  <text class="layer-detail" x="94" y="200">POST, GET, DELETE, scan</text>

  <rect class="layer" x="405" y="142" width="355" height="392" rx="12" />
  <image data-bluetape4k-icon="framework.ktor" x="427" y="158" width="24" height="24" href="data:image/svg+xml;base64,PHN2ZyBmaWxsPSIjMDg3Q0ZBIiByb2xlPSJpbWciIHZpZXdCb3g9IjAgMCAyNCAyNCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48dGl0bGU+S3RvcjwvdGl0bGU+PHBhdGggZD0iTTggMCAwIDhsOCA4VjhoOHptOCA4djhIOGw4IDggOC04eiIvPjwvc3ZnPg==" />
  <text class="layer-title" x="459" y="178">Ktor module</text>
  <text class="layer-detail" x="461" y="200">ContentNegotiation + DynamoDbKtorPlugin</text>

  <rect class="layer" x="795" y="142" width="300" height="392" rx="12" />
  <text class="layer-title" x="817" y="178">DynamoDB access</text>
  <text class="layer-detail" x="819" y="200">repository plus typed mappers</text>

  <rect class="layer" x="1130" y="142" width="240" height="392" rx="12" />
  <text class="layer-title" x="1152" y="178">Local AWS</text>
  <text class="layer-detail" x="1154" y="200">Floci or LocalStack</text>
</g>

<g id="cards">
  <rect class="card" x="100" y="238" width="240" height="102" rx="9" fill="#E8F3FF" stroke="#5B8DEF" />
  <text class="card-title" x="220" y="274" text-anchor="middle">Route handlers</text>
  <text class="detail" x="220" y="302" text-anchor="middle">/dynamodb/orders</text>
  <text class="detail" x="220" y="322" text-anchor="middle">validate id and status</text>

  <rect class="card" x="100" y="380" width="240" height="102" rx="9" fill="#F0F6FF" stroke="#7AA3F5" />
  <image data-bluetape4k-icon="framework.ktor" x="114" y="418" width="26" height="26" href="data:image/svg+xml;base64,PHN2ZyBmaWxsPSIjMDg3Q0ZBIiByb2xlPSJpbWciIHZpZXdCb3g9IjAgMCAyNCAyNCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48dGl0bGU+S3RvcjwvdGl0bGU+PHBhdGggZD0iTTggMCAwIDhsOCA4VjhoOHptOCA4djhIOGw4IDggOC04eiIvPjwvc3ZnPg==" preserveAspectRatio="xMidYMid meet" /><text class="card-title" x="220" y="416" text-anchor="middle">Ktor testing</text>
  <text class="detail" x="220" y="444" text-anchor="middle">JSON client requests</text>
  <text class="detail" x="220" y="464" text-anchor="middle">status assertions</text>

  <rect class="card" x="435" y="222" width="295" height="116" rx="9" fill="#EAF7EF" stroke="#58A978" />
  <text class="card-title" x="582.5" y="258" text-anchor="middle">dynamoDbExampleModule</text>
  <text class="detail" x="582.5" y="286" text-anchor="middle">installs DynamoDbKtorPlugin</text>
  <text class="detail" x="582.5" y="306" text-anchor="middle">auto-creates orders table</text>

  <rect class="card" x="435" y="382" width="295" height="116" rx="9" fill="#EEF9F1" stroke="#75B989" />
  <text class="card-title" x="582.5" y="418" text-anchor="middle">Plugin configuration</text>
  <text class="detail" x="582.5" y="446" text-anchor="middle">endpoint, region, credentials</text>
  <text class="detail" x="582.5" y="466" text-anchor="middle">BillingMode.PayPerRequest</text>

  <rect class="card" x="825" y="222" width="240" height="116" rx="9" fill="#E9F7F6" stroke="#45A7A1" />
  <text class="card-title" x="945" y="258" text-anchor="middle">Repository calls</text>
  <text class="detail" x="945" y="286" text-anchor="middle">save, findById, deleteById</text>
  <text class="detail" x="945" y="306" text-anchor="middle">scan as coroutine Flow</text>

  <rect class="card" x="825" y="382" width="240" height="116" rx="9" fill="#F3FBFA" stroke="#63B8B3" />
  <text class="card-title" x="945" y="418" text-anchor="middle">Order mapping</text>
  <text class="detail" x="945" y="446" text-anchor="middle">DynamoItemMapper</text>
  <text class="detail" x="945" y="466" text-anchor="middle">DynamoItemReader</text>

  <rect class="card" x="1160" y="260" width="180" height="128" rx="9" fill="#FFF7ED" stroke="#F97316" />
  <text class="card-title" x="1250" y="296" text-anchor="middle">orders table</text>
  <text class="detail" x="1250" y="324" text-anchor="middle">partition key id</text>
  <text class="detail" x="1250" y="344" text-anchor="middle">status</text>
  <text class="detail" x="1250" y="364" text-anchor="middle">description</text>
</g>

<g id="connections">
  <path class="edge" d="M 340 289 L 435 289" stroke="#2F6DE0" marker-end="url(#arrow-blue)" />
  <path class="edge" d="M 730 280 L 825 280" stroke="#168E86" marker-end="url(#arrow-teal)" />
  <path class="edge" d="M 1065 280 H 1120 Q 1132 280 1132 292 V 314 Q 1132 326 1144 326 H 1160" stroke="#EA580C" marker-end="url(#arrow-orange)" />

  <path class="soft-edge" d="M 582.5 338 L 582.5 382" stroke="#475569" marker-end="url(#arrow-slate)" />
  <path class="soft-edge" d="M 945 338 L 945 382" stroke="#475569" marker-end="url(#arrow-slate)" />
  <path class="soft-edge" d="M 340 431 H 435" stroke="#2F6DE0" marker-end="url(#arrow-blue)" />
  <path class="soft-edge" d="M 730 440 L 825 440" stroke="#168E86" marker-end="url(#arrow-teal)" />
  <path class="soft-edge" d="M 1065 440 H 1124 Q 1136 440 1136 428 V 388 Q 1136 376 1148 376 H 1160" stroke="#EA580C" marker-end="url(#arrow-orange)" />
</g>

<g id="labels">
  <rect class="label-pill" x="354" y="258" width="66" height="24" rx="12" />
  <text class="tiny" x="387" y="271.5" text-anchor="middle" dominant-baseline="middle">receive</text>
  <rect class="label-pill" x="746" y="249" width="64" height="24" rx="12" />
  <text class="tiny" x="778" y="262.5" text-anchor="middle" dominant-baseline="middle">repo()</text>
  <rect class="label-pill" x="1080" y="288" width="64" height="24" rx="12" />
  <text class="tiny" x="1112" y="301.5" text-anchor="middle" dominant-baseline="middle">AWS SDK</text>
  <rect class="label-pill" x="356" y="428" width="64" height="24" rx="12" />
  <text class="tiny" x="388" y="441.5" text-anchor="middle" dominant-baseline="middle">tests</text>
  <rect class="label-pill" x="746" y="428" width="64" height="24" rx="12" />
  <text class="tiny" x="778" y="441.5" text-anchor="middle" dominant-baseline="middle">config</text>
</g>

<g id="route-table">
  <rect x="86" y="564" width="600" height="72" rx="10" fill="#FFFFFF" stroke="#D9E2EC" />
  <text class="card-title" x="110" y="596">CRUD surface</text>
  <text class="detail" x="278" y="594">POST create</text>
  <text class="detail" x="400" y="594">GET by id</text>
  <text class="detail" x="520" y="594">GET scan</text>
  <text class="detail" x="620" y="594">DELETE</text>
  <text class="tiny" x="110" y="620">Blank id/status returns 400; missing order returns 404.</text>

  <rect x="724" y="564" width="630" height="72" rx="10" fill="#FFFFFF" stroke="#D9E2EC" />
  <text class="card-title" x="748" y="596">Verification</text>
  <text class="detail" x="902" y="594">CRUD integration</text>
  <text class="detail" x="1058" y="594">concurrent saves</text>
  <text class="detail" x="1218" y="594">Floci / LocalStack</text>
  <text class="tiny" x="748" y="620">Tests pass emulator endpoint, region, and StaticCredentialsProvider into the same module.</text>
</g>

<rect class="footer" x="54" y="652" width="1332" height="34" rx="8" />
<text class="footer-title" x="74" y="672" dominant-baseline="middle">Reader cue</text>
<text class="footer-detail" x="190" y="672" dominant-baseline="middle">This example is a runnable contract for the aws-ktor DynamoDB plugin, not a published artifact.</text>
</svg>
