<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1260" viewBox="0 0 1700 1260" role="img" aria-labelledby="title desc">
  <title id="title">AWS Spring Boot SQS Listener Sequence</title>
  <desc id="desc">Sequence showing SqsListener discovery, container startup, polling, handler invocation, acknowledgement, retry, visibility timeout, and shutdown behavior.</desc>
  <defs>
    <marker id="callArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c"/></marker>
    <marker id="workArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f"/></marker>
    <marker id="returnArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b7d54"/></marker>
    <marker id="failArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b86868"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#f8fafc}
      .frame{fill:#ffffff;stroke:#8aa6cf;stroke-width:3;filter:url(#shadow)}
      .title{font-family:"Architects Daughter";font-size:48px;fill:#17233a}
      .subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
      .participantTitle{font-family:"Architects Daughter";font-size:22px;fill:#17233a}
      .participantText{font-family:"Comic Mono";font-size:14px;fill:#475569}
      .pCall{fill:#eaf4f8;stroke:#3f7d9c;stroke-width:2.4}
      .pWork{fill:#eef7f0;stroke:#6e8f4f;stroke-width:2.4}
      .pConfig{fill:#e8f0fe;stroke:#2563eb;stroke-width:2.4}
      .pFail{fill:#fff5f5;stroke:#b86868;stroke-width:2.4}
      .lifeline{stroke:#94a3b8;stroke-width:2.2;stroke-dasharray:8 9}
      .activation{fill:#eef7f0;stroke:#6e8f4f;stroke-width:1.8}
      .call{stroke:#3f7d9c;stroke-width:3.3;marker-end:url(#callArrow);fill:none}
      .work{stroke:#6e8f4f;stroke-width:3.3;marker-end:url(#workArrow);fill:none}
      .ret{stroke:#9b7d54;stroke-width:2.8;stroke-dasharray:8 7;marker-end:url(#returnArrow);fill:none}
      .fail{stroke:#b86868;stroke-width:3.3;marker-end:url(#failArrow);fill:none}
      .label{font-family:"Comic Mono";font-size:15px;fill:#334155}
      .labelBox{fill:#ffffff;stroke:#d7e0e4;stroke-width:1.4}
      .regionOk{fill:#eef7f0;stroke:#6e8f4f;stroke-width:2.2;stroke-dasharray:12 8}
      .regionFail{fill:#fff5f5;stroke:#b86868;stroke-width:2.2;stroke-dasharray:12 8}
      .regionTitle{font-family:"Architects Daughter";font-size:24px;fill:#263f58}
      .regionText{font-family:"Comic Mono";font-size:15px;fill:#475569}
      .footer{font-family:"Comic Mono";font-size:15px;fill:#475569}
    </style>
  </defs>

  <rect class="canvas" width="1700" height="1260"/>
  <rect class="frame" x="34" y="30" width="1632" height="1198" rx="28"/>
  <text class="title" x="80" y="96">AWS Spring Boot SQS Listener Sequence</text>
  <text class="subtitle" x="82" y="130">`@SqsListener` becomes a SmartLifecycle container with coroutine pollers, retry, acknowledgement, and failure visibility control.</text>

  <g filter="url(#shadow)">
    <rect class="pConfig" x="80" y="188" width="190" height="82" rx="14"/>
    <text class="participantTitle" x="112" y="222">Spring beans</text>
    <text class="participantText" x="112" y="248">@SqsListener method</text>
    <rect class="pConfig" x="350" y="188" width="210" height="82" rx="14"/>
    <text class="participantTitle" x="382" y="222">BeanPostProcessor</text>
    <text class="participantText" x="382" y="248">discovers endpoint</text>
    <rect class="pWork" x="640" y="188" width="190" height="82" rx="14"/>
    <text class="participantTitle" x="672" y="222">Container</text>
    <text class="participantText" x="672" y="248">SmartLifecycle</text>
    <rect class="pCall" x="895" y="188" width="220" height="82" rx="14"/>
    <text class="participantTitle" x="942" y="222">SqsOperations</text>
    <text class="participantText" x="925" y="248">receive/delete/visibility</text>
    <rect class="pWork" x="1180" y="188" width="190" height="82" rx="14"/>
    <text class="participantTitle" x="1212" y="222">Invoker</text>
    <text class="participantText" x="1212" y="248">handler + converter</text>
    <rect class="pFail" x="1438" y="188" width="214" height="82" rx="14"/>
    <text class="participantTitle" x="1482" y="222">Interceptors</text>
    <text class="participantText" x="1472" y="248">metrics + tracing hooks</text>
  </g>

  <line class="lifeline" x1="175" y1="270" x2="175" y2="1110"/>
  <line class="lifeline" x1="455" y1="270" x2="455" y2="1110"/>
  <line class="lifeline" x1="735" y1="270" x2="735" y2="1110"/>
  <line class="lifeline" x1="1005" y1="270" x2="1005" y2="1110"/>
  <line class="lifeline" x1="1275" y1="270" x2="1275" y2="1110"/>
  <line class="lifeline" x1="1545" y1="270" x2="1545" y2="1110"/>
  <rect class="activation" x="727" y="372" width="16" height="636" rx="8"/>
  <rect class="activation" x="997" y="492" width="16" height="120" rx="8"/>
  <rect class="activation" x="1267" y="658" width="16" height="146" rx="8"/>

  <path class="call" d="M 175 326 H 443"/>
  <rect class="labelBox" x="232" y="284" width="166" height="28" rx="9"/>
  <text class="label" x="242" y="304">postProcessAfterInitialization</text>

  <path class="call" d="M 455 384 H 723"/>
  <rect class="labelBox" x="510" y="342" width="190" height="28" rx="9"/>
  <text class="label" x="520" y="362">register listener container</text>

  <path class="work" d="M 735 446 C 672 446 672 414 735 414"/>
  <rect class="labelBox" x="764" y="394" width="188" height="28" rx="9"/>
  <text class="label" x="774" y="414">start coroutine pollers</text>

  <rect class="regionOk" x="630" y="474" width="960" height="418" rx="16"/>
  <text class="regionTitle" x="660" y="512">loop while running</text>
  <text class="regionText" x="660" y="540">Each poller resolves the queue URL once, receives messages, then handles messages one by one.</text>
  <path class="call" d="M 743 612 H 993"/>
  <rect class="labelBox" x="794" y="570" width="154" height="28" rx="9"/>
  <text class="label" x="804" y="590">receive(maxMessages)</text>
  <path class="ret" d="M 997 668 H 747"/>
  <rect class="labelBox" x="820" y="682" width="126" height="28" rx="9"/>
  <text class="label" x="830" y="702">messages</text>
  <path class="work" d="M 743 746 H 1263"/>
  <rect class="labelBox" x="872" y="704" width="190" height="28" rx="9"/>
  <text class="label" x="882" y="724">invoke handler attempt N</text>
  <path class="work" d="M 1283 824 H 1533"/>
  <rect class="labelBox" x="1336" y="782" width="142" height="28" rx="9"/>
  <text class="label" x="1346" y="802">afterHandle(null)</text>
  <path class="call" d="M 743 864 H 993"/>
  <rect class="labelBox" x="800" y="822" width="132" height="28" rx="9"/>
  <text class="label" x="810" y="842">delete on success</text>

  <rect class="regionFail" x="630" y="924" width="960" height="168" rx="16"/>
  <text class="regionTitle" x="660" y="962">else handler failure</text>
  <text class="regionText" x="660" y="990">Retry waits use configured backoff and jitter. Final failure keeps the message unless visibility timeout is changed.</text>
  <path class="fail" d="M 1283 1016 H 1533"/>
  <rect class="labelBox" x="1328" y="1028" width="168" height="28" rx="9"/>
  <text class="label" x="1338" y="1048">afterHandle(error)</text>
  <path class="fail" d="M 743 1058 H 993"/>
  <rect class="labelBox" x="790" y="1016" width="204" height="28" rx="9"/>
  <text class="label" x="800" y="1036">changeVisibility(error timeout)</text>

  <path class="ret" d="M 735 1130 H 175"/>
  <rect class="labelBox" x="350" y="1088" width="242" height="28" rx="9"/>
  <text class="label" x="360" y="1108">stop cancels pollers; join bounded</text>
  <text class="footer" x="82" y="1186">Reader contract: cancellation is rethrown; successful automatic acknowledgement deletes the message only after the listener method returns normally.</text>
</svg>
