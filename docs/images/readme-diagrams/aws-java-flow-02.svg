<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
<title id="title">AWS Java operation flow</title>
<desc id="desc">The call path stays SDK-native: request helpers prepare models, extensions call the selected client, and coroutine APIs await the async boundary.</desc>
<defs>
  <style>
    .canvas{fill:#FFFFFF}.frame{fill:#FFFFFF;stroke:#D9E3EF;stroke-width:2}.layer{fill:#F8FAFC;stroke:#D8E2ED;stroke-width:1.6}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:17px;fill:#5A6B7F}.band-title{font-family:"Architects Daughter";font-size:24px;fill:#102033}.band-sub{font-family:"Comic Mono";font-size:13px;fill:#5A6B7F}
    .card-title{font-family:"Architects Daughter";font-size:21px;fill:#102033}.card-text{font-family:"Comic Mono";font-size:12px;fill:#5A6B7F}
    .card-blue{fill:#E8F2FF;stroke:#4F8AF7;stroke-width:2.2}.card-green{fill:#E9F7EF;stroke:#45A06B;stroke-width:2.2}.card-teal{fill:#EAF8F7;stroke:#47B8B1;stroke-width:2.2}.card-pink{fill:#FFF0F8;stroke:#E7157B;stroke-width:2.2}.card-orange{fill:#FFF4E6;stroke:#F97316;stroke-width:2.2}.card-service{fill:#FFFFFF;stroke:#8997A8;stroke-width:2.1}
    .arrow-blue{stroke:#2563EB;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}.arrow-green{stroke:#15803D;stroke-width:3;fill:none;marker-end:url(#arrow-green)}.arrow-teal{stroke:#0F8E89;stroke-width:3;fill:none;marker-end:url(#arrow-teal)}.arrow-pink{stroke:#E7157B;stroke-width:3;fill:none;marker-end:url(#arrow-pink)}.arrow-orange{stroke:#EA580C;stroke-width:3;fill:none;marker-end:url(#arrow-orange)}.arrow-gray{stroke:#64748B;stroke-width:2.8;fill:none;marker-end:url(#arrow-gray)}
    .footer{fill:#0E2238;stroke:#0E2238}.footer-title{font-family:"Architects Daughter";font-size:17px;fill:#FFFFFF}.footer-detail{font-family:"Comic Mono";font-size:12px;fill:#DDE7F2}
  </style>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563EB"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#15803D"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#0F8E89"/></marker>
  <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#E7157B"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#EA580C"/></marker>
  <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748B"/></marker>
</defs>
<rect class="canvas" x="0" y="0" width="1500" height="980"/>
<rect class="frame" x="24" y="24" width="1452" height="932" rx="14"/>
<text class="title" x="54" y="74">AWS Java operation flow</text>
<text class="subtitle" x="54" y="108">The call path stays SDK-native: helpers prepare requests, extensions call clients, and coroutine APIs await async boundaries.</text>
<rect class="layer" x="54" y="148" width="1392" height="144" rx="12"/><text class="band-title" x="82" y="186">1. Choose API tier</text><text class="band-sub" x="82" y="206">sync support, async support, suspend extensions, or higher-level facades</text>
<rect class="card-blue" x="130" y="218" width="230" height="60" rx="8"/>
<text class="card-title" x="245" y="248" text-anchor="middle">Sync support</text>
<text class="card-text" x="245" y="274" text-anchor="middle">blocking SDK client</text>
<rect class="card-pink" x="466" y="218" width="230" height="60" rx="8"/>
<text class="card-title" x="581" y="248" text-anchor="middle">Async support</text>
<text class="card-text" x="581" y="274" text-anchor="middle">CompletableFuture client</text>
<rect class="card-orange" x="802" y="218" width="230" height="60" rx="8"/>
<text class="card-title" x="917" y="248" text-anchor="middle">Coroutine API</text>
<text class="card-text" x="917" y="274" text-anchor="middle">suspend functions and Flow</text>
<rect class="card-green" x="1138" y="218" width="230" height="60" rx="8"/>
<text class="card-title" x="1253" y="248" text-anchor="middle">Template/Repository</text>
<text class="card-text" x="1253" y="274" text-anchor="middle">DynamoDB and S3 Vectors</text>
<rect class="layer" x="54" y="328" width="1392" height="144" rx="12"/><text class="band-title" x="82" y="366">2. Build SDK request</text><text class="band-sub" x="82" y="386">short helper DSLs still produce AWS SDK request objects</text>
<rect class="card-teal" x="130" y="398" width="230" height="60" rx="8"/>
<text class="card-title" x="245" y="428" text-anchor="middle">model DSL</text>
<text class="card-text" x="245" y="454" text-anchor="middle">PutObject, SendMessage</text>
<rect class="card-teal" x="466" y="398" width="230" height="60" rx="8"/>
<text class="card-title" x="581" y="428" text-anchor="middle">validation guards</text>
<text class="card-text" x="581" y="454" text-anchor="middle">blank names and limits</text>
<rect class="card-teal" x="802" y="398" width="230" height="60" rx="8"/>
<text class="card-title" x="917" y="428" text-anchor="middle">SDK request object</text>
<text class="card-text" x="917" y="454" text-anchor="middle">builder().build()</text>
<rect class="card-teal" x="1138" y="398" width="230" height="60" rx="8"/>
<text class="card-title" x="1253" y="428" text-anchor="middle">override config</text>
<text class="card-text" x="1253" y="454" text-anchor="middle">timeouts and retries</text>
<rect class="layer" x="54" y="508" width="1392" height="144" rx="12"/><text class="band-title" x="82" y="546">3. Execute selected client</text><text class="band-sub" x="82" y="566">sync wrappers move to IO; async wrappers await SDK futures</text>
<rect class="card-blue" x="130" y="578" width="230" height="60" rx="8"/>
<text class="card-title" x="245" y="608" text-anchor="middle">suspendCommand</text>
<text class="card-text" x="245" y="634" text-anchor="middle">sync call on IO</text>
<rect class="card-pink" x="466" y="578" width="230" height="60" rx="8"/>
<text class="card-title" x="581" y="608" text-anchor="middle">future.await()</text>
<text class="card-text" x="581" y="634" text-anchor="middle">async bridge</text>
<rect class="card-orange" x="802" y="578" width="230" height="60" rx="8"/>
<text class="card-title" x="917" y="608" text-anchor="middle">Flow adapters</text>
<text class="card-text" x="917" y="634" text-anchor="middle">paged items</text>
<rect class="card-green" x="1138" y="578" width="230" height="60" rx="8"/>
<text class="card-title" x="1253" y="608" text-anchor="middle">batch/template calls</text>
<text class="card-text" x="1253" y="634" text-anchor="middle">facade reuse</text>
<rect class="layer" x="54" y="688" width="1392" height="144" rx="12"/><text class="band-title" x="82" y="726">4. Return SDK result</text><text class="band-sub" x="82" y="746">responses remain AWS SDK-native model types</text>
<rect class="card-service" x="214" y="758" width="260" height="60" rx="8"/>
<text class="card-title" x="344" y="788" text-anchor="middle">AWS service</text>
<text class="card-text" x="344" y="814" text-anchor="middle">selected runtime dependency</text>
<rect class="card-green" x="620" y="758" width="260" height="60" rx="8"/>
<text class="card-title" x="750" y="788" text-anchor="middle">SDK response</text>
<text class="card-text" x="750" y="814" text-anchor="middle">native response type</text>
<rect class="card-orange" x="1026" y="758" width="260" height="60" rx="8"/>
<text class="card-title" x="1156" y="788" text-anchor="middle">Suspend result / Flow</text>
<text class="card-text" x="1156" y="814" text-anchor="middle">caller consumes normally</text>
<path class="arrow-blue" d="M360 248 H466"/><path class="arrow-pink" d="M696 248 H802"/><path class="arrow-orange" d="M1032 248 H1138"/>
<path class="arrow-blue" d="M245 278 V398"/><path class="arrow-pink" d="M581 278 V398"/><path class="arrow-orange" d="M917 278 V398"/><path class="arrow-green" d="M1253 278 V398"/>
<path class="arrow-teal" d="M360 428 H466"/><path class="arrow-teal" d="M696 428 H802"/><path class="arrow-teal" d="M1032 428 H1138"/>
<path class="arrow-blue" d="M245 458 V578"/><path class="arrow-pink" d="M581 458 V578"/><path class="arrow-orange" d="M917 458 V578"/><path class="arrow-green" d="M1253 458 V578"/>
<path class="arrow-blue" d="M245 638 V672 H344 V758"/><path class="arrow-pink" d="M581 638 V672 H344 V758"/><path class="arrow-orange" d="M917 638 V672 H344 V758"/><path class="arrow-green" d="M1253 638 V672 H344 V758"/>
<path class="arrow-gray" d="M474 788 H620"/><path class="arrow-gray" d="M880 788 H1026"/>
<rect class="footer" x="54" y="906" width="1392" height="36" rx="8"/><text class="footer-title" x="76" y="925" dominant-baseline="middle">Flow</text><text class="footer-detail" x="146" y="925" dominant-baseline="middle">No custom service abstraction is hidden: helpers produce SDK requests, call SDK clients, and return SDK responses.</text>
</svg>
