<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="370" viewBox="0 0 1460 370" role="img" aria-label="AWS Java operation flow">
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter";font-size:34px;fill:#102033}
  .seqTitle{font-family:"Architects Daughter";font-size:44px;fill:#102033}
  .seqSubtitle{font-family:"Comic Mono";font-size:16px;fill:#526274}
  .seqParticipantTitle{font-family:"Architects Daughter";font-size:24px;fill:#102033}
  .seqParticipantDetail{font-family:"Comic Mono";font-size:13px;fill:#526274}
  .subtitle,.detail,.tiny,.label{font-family:"Comic Mono";fill:#526274}
  .subtitle{font-size:14px}
  .label{font-size:12px;fill:#344456}
  .card-title{font-family:"Architects Daughter";font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .tiny{font-size:10px}
  .chip{font-family:"Comic Mono";font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .seq{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .seqReturn{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7}
  .labelPill{fill:#FFFFFF;stroke:#D6E3EF;stroke-width:1.4}
  .numberBadge{font-family:"Comic Mono";font-size:12px;fill:#FFFFFF}
  .altBox{fill:#FFFFFF;fill-opacity:.44;stroke:#D6A441;stroke-width:1.8;stroke-dasharray:8 8}
  .activation{stroke-width:1.4}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter";font-size:16px;fill:#FFFFFF}
  .footer-detail{font-family:"Comic Mono";font-size:11px;fill:#DDE7F2}
  .seq-line{stroke:#CBD5E1;stroke-width:1.6;stroke-dasharray:6 8}
  .bar-label{font-family:"Architects Daughter";font-size:17px;fill:#102033}
</style>

<defs>
  <marker id="arrow-blue" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2F6DE0"/></marker>
  <marker id="arrow-green" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2F8B57"/></marker>
  <marker id="arrow-teal" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#168E86"/></marker>
  <marker id="arrow-amber" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B98518"/></marker>
  <marker id="arrow-rose" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C74E68"/></marker>
  <marker id="arrow-violet" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#7255C7"/></marker>
  <marker id="arrow-orange" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#EA580C"/></marker>
  <marker id="arrow-slate" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#475569"/></marker>
</defs>
<rect x="26" y="26" width="1408" height="318" rx="14" class="frame"/>
<text class="title" x="54" y="72">AWS Java operation flow</text>
<text class="subtitle" x="56" y="104">A coroutine call builds a request, delegates to an async SDK client, awaits completion, and returns typed results.</text>
<g id="routes">
<path class="edge" d="M 294.0 198.0 L 332.0 198.0" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
<path class="edge" d="M 572.0 198.0 L 610.0 198.0" stroke="#2F8B57" marker-end="url(#arrow-green)"/>
<path class="edge" d="M 850.0 198.0 L 888.0 198.0" stroke="#168E86" marker-end="url(#arrow-teal)"/>
<path class="edge" d="M 1128.0 198.0 L 1166.0 198.0" stroke="#7255C7" marker-end="url(#arrow-violet)"/>
</g>
<g id="call">
  <rect class="card" x="54.0" y="150.0" width="240.0" height="96.0" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="174.0" y="186.0" text-anchor="middle" dominant-baseline="middle">Suspend extension</text>
  <text class="detail" x="174.0" y="210.0" text-anchor="middle" dominant-baseline="middle">service helper</text>
  <text class="detail" x="174.0" y="228.0" text-anchor="middle" dominant-baseline="middle">Kotlin caller</text>
</g>
<g id="request">
  <rect class="card" x="332.0" y="150.0" width="240.0" height="96.0" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="452.0" y="186.0" text-anchor="middle" dominant-baseline="middle">Request DSL</text>
  <text class="detail" x="452.0" y="210.0" text-anchor="middle" dominant-baseline="middle">typed builder</text>
  <text class="detail" x="452.0" y="228.0" text-anchor="middle" dominant-baseline="middle">override config</text>
</g>
<g id="async">
  <rect class="card" x="610.0" y="150.0" width="240.0" height="96.0" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="730.0" y="186.0" text-anchor="middle" dominant-baseline="middle">Async SDK call</text>
  <text class="detail" x="730.0" y="210.0" text-anchor="middle" dominant-baseline="middle">CompletableFuture</text>
  <text class="detail" x="730.0" y="228.0" text-anchor="middle" dominant-baseline="middle">non-blocking</text>
</g>
<g id="await">
  <rect class="card" x="888.0" y="150.0" width="240.0" height="96.0" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="1008.0" y="186.0" text-anchor="middle" dominant-baseline="middle">await()</text>
  <text class="detail" x="1008.0" y="210.0" text-anchor="middle" dominant-baseline="middle">resume coroutine</text>
  <text class="detail" x="1008.0" y="228.0" text-anchor="middle" dominant-baseline="middle">map result</text>
</g>
<g id="result">
  <rect class="card" x="1166.0" y="150.0" width="240.0" height="96.0" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="1286.0" y="186.0" text-anchor="middle" dominant-baseline="middle">Typed result</text>
  <text class="detail" x="1286.0" y="210.0" text-anchor="middle" dominant-baseline="middle">model/Flow</text>
  <text class="detail" x="1286.0" y="228.0" text-anchor="middle" dominant-baseline="middle">caller-owned</text>
</g>
<rect class="footer" x="54" y="276" width="1352" height="54" rx="8"/>
<text class="footer-title" x="74" y="299" dominant-baseline="middle">Outcome</text>
<text class="footer-detail" x="74" y="319" dominant-baseline="middle">The coroutine layer does not block worker threads.</text>
</svg>