<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-label="AWS Java operation flow">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#d97706"/>
    </marker>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#f8fafc}
      .frame{fill:#ffffff;stroke:#8aa6cf;stroke-width:3;filter:url(#softShadow)}
      .title{font-family:"Architects Daughter";font-size:48px;fill:#17233a}
      .subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
      .lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;stroke-dasharray:9 8}
      .laneTitle{font-family:"Comic Mono";font-size:18px;font-weight:700;fill:#475569}
      .step{fill:#ffffff;stroke-width:2.2;filter:url(#softShadow)}
      .stepTitle{font-family:"Architects Daughter";font-size:24px;fill:#17233a}
      .stepText{font-family:"Comic Mono";font-size:13px;fill:#475569}
      .note{fill:#ffffff;stroke-width:2}
      .noteTitle{font-family:"Comic Mono";font-size:15px;font-weight:700;fill:#334155}
      .noteText{font-family:"Comic Mono";font-size:12px;fill:#475569}
      .route{fill:none;stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round}
      .routeSmall{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
      .routeText{font-family:"Comic Mono";font-size:13px;fill:#334155}
      .footerText{font-family:"Comic Mono";font-size:14px;fill:#475569}
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1040"/>
  <rect class="frame" x="42" y="36" width="1516" height="964" rx="24"/>
  <text class="title" x="800" y="96" text-anchor="middle">AWS Java Operation Flow</text>
  <text class="subtitle" x="800" y="132" text-anchor="middle">The module keeps AWS SDK calls async, then exposes suspend and Flow contracts around the futures.</text>

  <g id="primary">
    <rect class="lane" x="92" y="178" width="1416" height="260" rx="18"/>
    <text class="laneTitle" x="118" y="216">SINGLE REQUEST PATH</text>
    <rect class="step" x="130" y="254" width="250" height="94" rx="16" stroke="#2563eb"/>
    <text class="stepTitle" x="255" y="286" text-anchor="middle">caller input</text>
    <text class="stepText" x="255" y="312" text-anchor="middle">bucket, key, entity</text>
    <text class="stepText" x="255" y="332" text-anchor="middle">or service request</text>

    <rect class="step" x="452" y="254" width="250" height="94" rx="16" stroke="#059669"/>
    <text class="stepTitle" x="577" y="286" text-anchor="middle">validate and build</text>
    <text class="stepText" x="577" y="312" text-anchor="middle">requireNotBlank</text>
    <text class="stepText" x="577" y="332" text-anchor="middle">typed request DSL</text>

    <rect class="step" x="774" y="254" width="250" height="94" rx="16" stroke="#d97706"/>
    <text class="stepTitle" x="899" y="286" text-anchor="middle">AWS async client</text>
    <text class="stepText" x="899" y="312" text-anchor="middle">S3AsyncClient</text>
    <text class="stepText" x="899" y="332" text-anchor="middle">DynamoDbAsyncTable</text>

    <rect class="step" x="1096" y="254" width="250" height="94" rx="16" stroke="#7c3aed"/>
    <text class="stepTitle" x="1221" y="286" text-anchor="middle">coroutine result</text>
    <text class="stepText" x="1221" y="312" text-anchor="middle">CompletableFuture.await()</text>
    <text class="stepText" x="1221" y="332" text-anchor="middle">suspend response</text>

    <path class="route" d="M 380 301 L 452 301" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
    <path class="route" d="M 702 301 L 774 301" stroke="#059669" marker-end="url(#arrowGreen)"/>
    <path class="route" d="M 1024 301 L 1096 301" stroke="#d97706" marker-end="url(#arrowAmber)"/>
  </g>

  <g id="streaming">
    <rect class="lane" x="92" y="492" width="1416" height="214" rx="18"/>
    <text class="laneTitle" x="118" y="530">PAGINATED AND STREAMING PATHS</text>
    <rect class="step" x="170" y="574" width="310" height="72" rx="16" stroke="#2563eb"/>
    <text class="stepTitle" x="325" y="604" text-anchor="middle">start cold Flow</text>
    <text class="stepText" x="325" y="628" text-anchor="middle">listAllObjects(), queryAll(), scanAll()</text>

    <rect class="step" x="646" y="574" width="310" height="72" rx="16" stroke="#059669"/>
    <text class="stepTitle" x="801" y="604" text-anchor="middle">collect pages lazily</text>
    <text class="stepText" x="801" y="628" text-anchor="middle">continuation token or reactive publisher</text>

    <rect class="step" x="1122" y="574" width="310" height="72" rx="16" stroke="#d97706"/>
    <text class="stepTitle" x="1277" y="604" text-anchor="middle">emit domain values</text>
    <text class="stepText" x="1277" y="628" text-anchor="middle">S3Object, DynamoDB items, batch results</text>

    <path class="route" d="M 480 610 L 646 610" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
    <path class="route" d="M 956 610 L 1122 610" stroke="#059669" marker-end="url(#arrowGreen)"/>
  </g>

  <g id="safety">
    <rect class="lane" x="92" y="760" width="1416" height="140" rx="18"/>
    <text class="laneTitle" x="118" y="798">S3 MOVE SAFETY PATH</text>
    <rect class="note" x="210" y="826" width="294" height="44" rx="14" stroke="#2563eb"/>
    <text class="noteTitle" x="357" y="854" text-anchor="middle">copy succeeds</text>
    <rect class="note" x="654" y="826" width="294" height="44" rx="14" stroke="#d97706"/>
    <text class="noteTitle" x="801" y="854" text-anchor="middle">delete source may fail</text>
    <rect class="note" x="1098" y="826" width="294" height="44" rx="14" stroke="#059669"/>
    <text class="noteTitle" x="1245" y="854" text-anchor="middle">atomic variant cleans up copy</text>
    <path class="routeSmall" d="M 504 848 L 654 848" stroke="#d97706" marker-end="url(#arrowAmber)"/>
    <path class="routeSmall" d="M 948 848 L 1098 848" stroke="#059669" marker-end="url(#arrowGreen)"/>
  </g>

  <path class="routeSmall" d="M 800 438 L 800 492" stroke="#059669" marker-end="url(#arrowGreen)"/>
  <text class="routeText" x="846" y="469">multi-item calls switch from single suspend result to Flow</text>

  <path class="routeSmall" d="M 800 706 L 800 760" stroke="#d97706" marker-end="url(#arrowAmber)"/>
  <text class="routeText" x="846" y="737">operations with partial success expose explicit recovery behavior</text>

  <text class="footerText" x="800" y="946" text-anchor="middle">Reader contract: futures stay non-blocking, suspend wrappers await them, and Flow helpers model lazy multi-page reads.</text>
</svg>
