<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-label="aws-kotlin architecture">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="1228" height="788" rx="14" class="frame"/>
<text class="title" x="54" y="72">aws-kotlin architecture</text>
<text class="subtitle" x="56" y="102">Native suspend AWS Kotlin SDK clients sit behind builders, with-client helpers, and Flow utilities.</text>
<rect x="1085" y="54" width="131" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="chip" x="1150.5" y="70" text-anchor="middle">Native suspend</text>
<rect x="1042" y="54" width="68" height="24" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="chip" x="1076" y="70" text-anchor="middle">Flow</text>
<rect x="886.5" y="54" width="93.5" height="24" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="chip" x="933.25" y="70" text-anchor="middle">Lifecycle</text>
<g><g><path class="edge" d="M480 183 L480 269 L390 269 L390 355" stroke="#66758A"/></g>
<g><path class="edge" d="M640 224 L640 267 L600 267 L600 310" stroke="#66758A"/></g>
<g><path class="edge" d="M800 183 L800 269 L810 269 L810 355" stroke="#66758A"/></g>
<g><path class="edge" d="M390 355 L390 451 L420 451 L420 547" stroke="#66758A"/></g>
<g><path class="edge" d="M600 400 L600 450 L640 450 L640 500" stroke="#66758A"/></g>
<g><path class="edge" d="M810 355 L810 451 L860 451 L860 547" stroke="#66758A"/></g>
<g><path class="edge" d="M640 594 L640 609 L640 609 L640 624" stroke="#66758A"/></g></g>
<g id="app">
  <rect class="card" x="480" y="142" width="320" height="82" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="640" y="180" text-anchor="middle">Coroutine application</text>
  <text class="detail" x="640" y="204" text-anchor="middle">service code with suspend calls</text>
</g>
<g id="builders">
  <rect class="card" x="130" y="310" width="260" height="90" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="260" y="343.5" text-anchor="middle">DSL builders</text>
  <text class="detail" x="260" y="367.5" text-anchor="middle">requests, models</text>
<text class="detail" x="260" y="384.5" text-anchor="middle">wait helpers</text>
</g>
<g id="with">
  <rect class="card" x="470" y="310" width="260" height="90" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="600" y="352" text-anchor="middle">withXClient helpers</text>
  <text class="detail" x="600" y="376" text-anchor="middle">create, use, close</text>
</g>
<g id="flows">
  <rect class="card" x="810" y="310" width="260" height="90" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="940" y="343.5" text-anchor="middle">Flow helpers</text>
  <text class="detail" x="940" y="367.5" text-anchor="middle">Kinesis recordFlow</text>
<text class="detail" x="940" y="384.5" text-anchor="middle">paged reads</text>
</g>
<g id="clients">
  <rect class="card" x="420" y="500" width="440" height="94" rx="10" fill="#F4F7FA" stroke="#8CA0B3"/>
  <text class="card-title" x="640" y="535.5" text-anchor="middle">AWS SDK for Kotlin clients</text>
  <text class="detail" x="640" y="559.5" text-anchor="middle">DynamoDB, S3, SQS, SNS</text>
<text class="detail" x="640" y="576.5" text-anchor="middle">KMS, CloudWatch, Kinesis, STS</text>
</g>
<g id="aws">
  <path d="M500 644 C500 620,780 620,780 644 L780 682 C780 706,500 706,500 682 Z" fill="#FFF0E3" stroke="#F47B36" stroke-width="2"/>
  <ellipse cx="640" cy="644" rx="140" ry="20" fill="#FFF0E3" stroke="#F47B36" stroke-width="2"/>
  <text class="card-title" x="640" y="662.5" text-anchor="middle">AWS services</text>
  <text class="detail" x="640" y="686.5" text-anchor="middle">or LocalStack / Floci</text>
</g>
<rect class="footer" x="54" y="736" width="1172" height="54" rx="8"/>
<text class="footer-title" x="72" y="765">Module role</text>
<text class="footer-detail" x="72" y="785">Prefer native suspend APIs and explicit client lifecycle while keeping request DSLs concise.</text>
</svg>