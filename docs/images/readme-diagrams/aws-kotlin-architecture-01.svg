<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-label="AWS Kotlin module architecture">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#d97706"/>
    </marker>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#f8fafc}
      .frame{fill:#ffffff;stroke:#8aa6cf;stroke-width:3;filter:url(#softShadow)}
      .title{font-family:"Architects Daughter";font-size:48px;fill:#17233a}
      .subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
      .band{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;stroke-dasharray:9 8}
      .bandTitle{font-family:"Comic Mono";font-size:18px;font-weight:700;fill:#475569}
      .card{fill:#ffffff;stroke-width:2.2;filter:url(#softShadow)}
      .cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#17233a}
      .cardText{font-family:"Comic Mono";font-size:13px;fill:#475569}
      .pill{fill:#ffffff;stroke-width:2}
      .pillText{font-family:"Comic Mono";font-size:13px;fill:#334155}
      .route{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .routeText{font-family:"Comic Mono";font-size:13px;fill:#334155}
      .footerText{font-family:"Comic Mono";font-size:14px;fill:#475569}
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1120"/>
  <rect class="frame" x="42" y="36" width="1516" height="1044" rx="24"/>
  <text class="title" x="800" y="96" text-anchor="middle">AWS Kotlin Module Architecture</text>
  <text class="subtitle" x="800" y="132" text-anchor="middle">Native AWS Kotlin SDK integration: suspend APIs, DSL builders, managed client lifecycle, and cold Flow helpers.</text>

  <g id="consumer">
    <rect class="band" x="92" y="178" width="1416" height="132" rx="18"/>
    <text class="bandTitle" x="118" y="216">KOTLIN COROUTINE APPLICATION</text>
    <rect class="card" x="156" y="238" width="368" height="52" rx="14" stroke="#2563eb"/>
    <text class="cardTitle" x="340" y="270" text-anchor="middle">native suspend calls</text>
    <rect class="card" x="616" y="238" width="368" height="52" rx="14" stroke="#059669"/>
    <text class="cardTitle" x="800" y="270" text-anchor="middle">DSL request builders</text>
    <rect class="card" x="1076" y="238" width="368" height="52" rx="14" stroke="#d97706"/>
    <text class="cardTitle" x="1260" y="270" text-anchor="middle">explicit client ownership</text>
  </g>

  <g id="module">
    <rect class="band" x="92" y="354" width="1416" height="332" rx="18"/>
    <text class="bandTitle" x="118" y="392">BLUETAPE4K AWS KOTLIN MODULE</text>
    <rect class="card" x="142" y="430" width="300" height="92" rx="16" stroke="#2563eb"/>
    <text class="cardTitle" x="292" y="462" text-anchor="middle">client factories</text>
    <text class="cardText" x="292" y="488" text-anchor="middle">xxxClientOf()</text>
    <text class="cardText" x="292" y="508" text-anchor="middle">withXxxClient { useSafe }</text>

    <rect class="card" x="478" y="430" width="300" height="92" rx="16" stroke="#059669"/>
    <text class="cardTitle" x="628" y="462" text-anchor="middle">HTTP engine policy</text>
    <text class="cardText" x="628" y="488" text-anchor="middle">CRT default singleton</text>
    <text class="cardText" x="628" y="508" text-anchor="middle">OkHttp optional engine</text>

    <rect class="card" x="814" y="430" width="300" height="92" rx="16" stroke="#d97706"/>
    <text class="cardTitle" x="964" y="462" text-anchor="middle">model DSLs</text>
    <text class="cardText" x="964" y="488" text-anchor="middle">DynamoDB, S3, SNS, KMS</text>
    <text class="cardText" x="964" y="508" text-anchor="middle">CloudWatch, Kinesis, STS</text>

    <rect class="card" x="1150" y="430" width="300" height="92" rx="16" stroke="#7c3aed"/>
    <text class="cardTitle" x="1300" y="462" text-anchor="middle">stream helpers</text>
    <text class="cardText" x="1300" y="488" text-anchor="middle">Kinesis recordFlow()</text>
    <text class="cardText" x="1300" y="508" text-anchor="middle">retry, checkpoint, backoff</text>

    <rect class="pill" x="154" y="570" width="160" height="38" rx="13" stroke="#2563eb"/>
    <text class="pillText" x="234" y="594" text-anchor="middle">DynamoDB</text>
    <rect class="pill" x="338" y="570" width="116" height="38" rx="13" stroke="#2563eb"/>
    <text class="pillText" x="396" y="594" text-anchor="middle">S3</text>
    <rect class="pill" x="478" y="570" width="142" height="38" rx="13" stroke="#059669"/>
    <text class="pillText" x="549" y="594" text-anchor="middle">SES / SESv2</text>
    <rect class="pill" x="644" y="570" width="136" height="38" rx="13" stroke="#059669"/>
    <text class="pillText" x="712" y="594" text-anchor="middle">SQS / SNS</text>
    <rect class="pill" x="804" y="570" width="132" height="38" rx="13" stroke="#d97706"/>
    <text class="pillText" x="870" y="594" text-anchor="middle">KMS / STS</text>
    <rect class="pill" x="960" y="570" width="190" height="38" rx="13" stroke="#d97706"/>
    <text class="pillText" x="1055" y="594" text-anchor="middle">CloudWatch Logs</text>
    <rect class="pill" x="1174" y="570" width="160" height="38" rx="13" stroke="#7c3aed"/>
    <text class="pillText" x="1254" y="594" text-anchor="middle">Kinesis Flow</text>
    <rect class="pill" x="1358" y="570" width="94" height="38" rx="13" stroke="#7c3aed"/>
    <text class="pillText" x="1405" y="594" text-anchor="middle">STS</text>
  </g>

  <g id="contract">
    <rect class="band" x="92" y="730" width="1416" height="132" rx="18"/>
    <text class="bandTitle" x="118" y="768">API CONTRACT</text>
    <rect class="card" x="188" y="790" width="324" height="52" rx="14" stroke="#2563eb"/>
    <text class="cardTitle" x="350" y="822" text-anchor="middle">no await conversion</text>
    <rect class="card" x="638" y="790" width="324" height="52" rx="14" stroke="#059669"/>
    <text class="cardTitle" x="800" y="822" text-anchor="middle">close clients explicitly</text>
    <rect class="card" x="1088" y="790" width="324" height="52" rx="14" stroke="#d97706"/>
    <text class="cardTitle" x="1250" y="822" text-anchor="middle">cancel and retry correctly</text>
  </g>

  <g id="boundary">
    <rect class="band" x="92" y="906" width="1416" height="116" rx="18"/>
    <text class="bandTitle" x="118" y="944">DEPENDENCY AND VERIFICATION BOUNDARY</text>
    <rect class="pill" x="176" y="966" width="320" height="38" rx="13" stroke="#0ea5e9"/>
    <text class="pillText" x="336" y="990" text-anchor="middle">AWS Kotlin services are compileOnly</text>
    <rect class="pill" x="532" y="966" width="264" height="38" rx="13" stroke="#0ea5e9"/>
    <text class="pillText" x="664" y="990" text-anchor="middle">consumer adds used SDKs</text>
    <rect class="pill" x="832" y="966" width="234" height="38" rx="13" stroke="#7c3aed"/>
    <text class="pillText" x="949" y="990" text-anchor="middle">Floci-first tests</text>
    <rect class="pill" x="1102" y="966" width="322" height="38" rx="13" stroke="#7c3aed"/>
    <text class="pillText" x="1263" y="990" text-anchor="middle">LocalStack fallback for gaps</text>
  </g>

  <path class="route" d="M 800 310 L 800 354" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
  <text class="routeText" x="846" y="338">native suspend APIs enter the Kotlin module directly</text>
  <path class="route" d="M 800 686 L 800 730" stroke="#059669" marker-end="url(#arrowGreen)"/>
  <text class="routeText" x="846" y="714">module helpers define lifecycle, DSL, and stream semantics</text>
  <path class="route" d="M 800 862 L 800 906" stroke="#d97706" marker-end="url(#arrowAmber)"/>
  <text class="routeText" x="846" y="890">runtime service artifacts remain an application choice</text>

  <text class="footerText" x="800" y="1050" text-anchor="middle">Reader contract: bluetape4k-aws-kotlin adds Kotlin-first ergonomics without bundling every AWS Kotlin service runtime.</text>
</svg>
