  <rect class="card" x="260.0" y="312.0" width="300.0" height="64.0" rx="9" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="410.0" y="334.0" text-anchor="middle" dominant-baseline="middle">S3AccessGrantsKtorOperations</text>
<text class="detail" x="410.0" y="354.0" text-anchor="middle" dominant-baseline="middle">suspend API</text>
</g>
<g id="template">
  <rect class="card" x="650.0" y="312.0" width="280.0" height="64.0" rx="9" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="790.0" y="334.0" text-anchor="middle" dominant-baseline="middle">S3AccessGrantsKtorTemplate</text>
<text class="detail" x="790.0" y="354.0" text-anchor="middle" dominant-baseline="middle">awaits SDK futures</text>
</g>
<g id="client">
  <rect class="card" x="1040.0" y="312.0" width="260.0" height="64.0" rx="9" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="1170.0" y="334.0" text-anchor="middle" dominant-baseline="middle">S3ControlAsyncClient</text>
<text class="detail" x="1170.0" y="354.0" text-anchor="middle" dominant-baseline="middle">optional SDK runtime</text>
</g>
<g id="data">
  <rect class="card" x="240.0" y="464.0" width="260.0" height="64.0" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="370.0" y="486.0" text-anchor="middle" dominant-baseline="middle">Data access credentials</text>
<text class="detail" x="370.0" y="506.0" text-anchor="middle" dominant-baseline="middle">getDataAccess</text>
</g>
<g id="lists">
  <rect class="card" x="580.0" y="464.0" width="260.0" height="64.0" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="710.0" y="486.0" text-anchor="middle" dominant-baseline="middle">Grant discovery</text>
<text class="detail" x="710.0" y="506.0" text-anchor="middle" dominant-baseline="middle">list* operations</text>
</g>
<g id="admin">
