<text class="detail" x="1070.0" y="506.0" text-anchor="middle" dominant-baseline="middle">create/update/delete</text>
</g>
<g id="control">
  <rect class="card" x="550.0" y="610.0" width="340.0" height="58.0" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="720.0" y="629.0" text-anchor="middle" dominant-baseline="middle">S3 Access Grants</text>
<text class="detail" x="720.0" y="649.0" text-anchor="middle" dominant-baseline="middle">instances, grants, locations</text>
</g>
<g>
  <text class="legend-title" x="940" y="718">Semantic routes</text>
  <path class="edge" d="M940 740 L1000 740" stroke="#66758A" marker-end="url(#arrow-setup)"/><text class="legend-text" x="1012" y="740" dominant-baseline="middle">setup/defaults</text>
  <path class="edge" d="M940 764 L1000 764" stroke="#2F9E62" marker-end="url(#arrow-read)"/><text class="legend-text" x="1012" y="764" dominant-baseline="middle">credential request</text>
  <path class="edge" d="M1148 740 L1208 740" stroke="#4C7FD9" marker-end="url(#arrow-list)"/><text class="legend-text" x="1220" y="740" dominant-baseline="middle">list/discover</text>
  <path class="edge" d="M1148 764 L1208 764" stroke="#D79528" stroke-dasharray="8 7" marker-end="url(#arrow-admin)"/><text class="legend-text" x="1220" y="764" dominant-baseline="middle">admin escape</text>
</g>
<rect class="footer" x="62" y="730" width="820" height="54" rx="8"/>
<text class="footer-title" x="84" y="749" dominant-baseline="middle">Boundary</text>
<text class="footer-detail" x="84" y="767" dominant-baseline="middle">Access Grants uses S3 Control; S3KtorClient stays focused on object REST operations.</text>
</svg>