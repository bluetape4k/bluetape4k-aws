<g id="route-defaults"><path class="edge" d="M1040.0 209.0 L985.0 209.0 L985.0 209.0 L930.0 209.0" stroke="#66758A" marker-end="url(#arrow-setup)"/><rect class="label-bg" x="947.0" y="177.0" width="76.0" height="24" rx="12"/><text class="edge-label" x="985.0" y="190.0" text-anchor="middle" dominant-baseline="middle" fill="#66758A">inherit</text></g>
<g id="route-publish"><path class="edge" d="M790.0 238.0 L790.0 260.0 L410.0 260.0 L410.0 312.0" stroke="#66758A" marker-end="url(#arrow-setup)"/><rect class="label-bg" x="561.2" y="247.0" width="77.6" height="24" rx="12"/><text class="edge-label" x="600.0" y="260.0" text-anchor="middle" dominant-baseline="middle" fill="#66758A">register</text></g>
<g id="route-ops-template"><path class="edge" d="M560.0 344.0 L605.0 344.0 L605.0 344.0 L650.0 344.0" stroke="#2F9E62" marker-end="url(#arrow-read)"/><rect class="label-bg" x="566.2" y="311.0" width="77.6" height="24" rx="12"/><text class="edge-label" x="605.0" y="324.0" text-anchor="middle" dominant-baseline="middle" fill="#2F9E62">delegate</text></g>
<g id="route-template-client"><path class="edge" d="M930.0 344.0 L985.0 344.0 L985.0 344.0 L1040.0 344.0" stroke="#2F9E62" marker-end="url(#arrow-read)"/><rect class="label-bg" x="947.0" y="311.0" width="76.0" height="24" rx="12"/><text class="edge-label" x="985.0" y="324.0" text-anchor="middle" dominant-baseline="middle" fill="#2F9E62">await</text></g>
<g id="route-data"><path class="edge" d="M1170.0 376.0 L1170.0 414.0 L370.0 414.0 L370.0 464.0" stroke="#2F9E62" marker-end="url(#arrow-read)"/><rect class="label-bg" x="703.2" y="401.0" width="113.6" height="24" rx="12"/><text class="edge-label" x="760.0" y="414.0" text-anchor="middle" dominant-baseline="middle" fill="#2F9E62">getDataAccess</text></g>
<g id="route-list"><path class="edge" d="M1170.0 376.0 L1170.0 438.0 L710.0 438.0 L710.0 464.0" stroke="#4C7FD9" marker-end="url(#arrow-list)"/><rect class="label-bg" x="882.0" y="425.0" width="76.0" height="24" rx="12"/><text class="edge-label" x="920.0" y="438.0" text-anchor="middle" dominant-baseline="middle" fill="#4C7FD9">list*</text></g>
<g id="route-admin"><path class="edge" d="M1170.0 376.0 L1170.0 464.0" stroke="#D79528" marker-end="url(#arrow-admin)" stroke-dasharray="8 7"/><rect class="label-bg" x="1164.0" y="407.0" width="76.0" height="24" rx="12"/><text class="edge-label" x="1202.0" y="420.0" text-anchor="middle" dominant-baseline="middle" fill="#D79528">raw SDK</text></g>
<g id="route-data-control"><path class="edge" d="M370.0 528.0 L370.0 568.0 L640.0 568.0 L640.0 610.0" stroke="#2F9E62" marker-end="url(#arrow-read)"/></g>
<g id="route-list-control"><path class="edge" d="M710.0 528.0 L710.0 610.0" stroke="#4C7FD9" marker-end="url(#arrow-list)"/></g>
<g id="route-admin-control"><path class="edge" d="M1070.0 528.0 L1070.0 568.0 L800.0 568.0 L800.0 610.0" stroke="#D79528" marker-end="url(#arrow-admin)" stroke-dasharray="8 7"/></g>
<g id="app">
