<text class="detail" x="790.0" y="219.0" text-anchor="middle" dominant-baseline="middle">stores operations</text>
</g>
<g id="defaults">
  <rect class="card" x="1040.0" y="180.0" width="230.0" height="58.0" rx="9" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="1155.0" y="199.0" text-anchor="middle" dominant-baseline="middle">AwsKtorCore</text>
<text class="detail" x="1155.0" y="219.0" text-anchor="middle" dominant-baseline="middle">defaults/customizers</text>
</g>
