<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-label="KMS direct and envelope encryption flow">
<defs>
  <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%">
    <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/>
  </filter>
  <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F6DE0"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F8B57"/>
  </marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#168E86"/>
  </marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#EA580C"/>
  </marker>
  <marker id="arrow-slate" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
  </marker>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter";font-size:38px;fill:#102033}
  .subtitle,.detail,.tiny,.chip{font-family:"Comic Mono";fill:#526274}
  .subtitle{font-size:16px}
  .lane-title{font-family:"Architects Daughter";font-size:24px;fill:#102033}
  .lane-detail{font-family:"Comic Mono";font-size:12px;fill:#526274}
  .card-title{font-family:"Architects Daughter";font-size:21px;fill:#102033}
  .detail{font-size:13px}
  .tiny{font-size:11px}
  .chip{font-size:11px;fill:#243447}
  .lane{fill:#F8FAFC;stroke:#D9E2EC;stroke-width:1.4}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
  .soft-edge{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter";font-size:17px;fill:#FFFFFF}
  .footer-detail{font-family:"Comic Mono";font-size:12px;fill:#DDE7F2}
</style>

<rect x="26" y="26" width="1388" height="708" rx="14" class="frame"/>
<text class="title" x="54" y="74">KMS encrypt / decrypt flow</text>
<text class="subtitle" x="56" y="106">Short values go through KMS directly; larger payloads use generated data keys and store encrypted key metadata.</text>

<g>
  <rect x="1030" y="57" width="118" height="25" rx="12.5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="chip" x="1089" y="70.5" text-anchor="middle" dominant-baseline="middle">Direct</text>
  <rect x="1162" y="57" width="118" height="25" rx="12.5" fill="#EAF7EF" stroke="#58A978"/>
  <text class="chip" x="1221" y="70.5" text-anchor="middle" dominant-baseline="middle">Envelope</text>
  <rect x="1294" y="57" width="76" height="25" rx="12.5" fill="#FFF7ED" stroke="#F97316"/>
  <text class="chip" x="1332" y="70.5" text-anchor="middle" dominant-baseline="middle">KMS</text>
</g>

<g id="lanes">
  <rect class="lane" x="70" y="150" width="1300" height="178" rx="12"/>
  <text class="lane-title" x="96" y="188">Direct secret encryption</text>
  <text class="lane-detail" x="98" y="210">Small token, credential, or configuration secret</text>

  <rect class="lane" x="70" y="370" width="1300" height="236" rx="12"/>
  <text class="lane-title" x="96" y="408">Envelope payload encryption</text>
  <text class="lane-detail" x="98" y="430">Larger payload with local encryption and encrypted data-key metadata</text>
</g>

<g id="direct-cards">
  <rect class="card" x="118" y="232" width="210" height="76" rx="9" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="223" y="262" text-anchor="middle">Plain secret</text>
  <text class="detail" x="223" y="286" text-anchor="middle">ByteArray value</text>

  <rect class="card" x="386" y="232" width="236" height="76" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="504" y="262" text-anchor="middle">KmsOperations.encrypt</text>
  <text class="detail" x="504" y="286" text-anchor="middle">key + context</text>

  <rect class="card" x="680" y="232" width="210" height="76" rx="9" fill="#FFF7ED" stroke="#F97316"/>
  <text class="card-title" x="785" y="262" text-anchor="middle">AWS KMS</text>
  <text class="detail" x="785" y="286" text-anchor="middle">ciphertext blob</text>

  <rect class="card" x="948" y="232" width="210" height="76" rx="9" fill="#F3FBFA" stroke="#63B8B3"/>
  <text class="card-title" x="1053" y="262" text-anchor="middle">Persist value</text>
  <text class="detail" x="1053" y="286" text-anchor="middle">store ciphertext</text>

  <rect class="card" x="1216" y="232" width="118" height="76" rx="9" fill="#F0F6FF" stroke="#7AA3F5"/>
  <text class="card-title" x="1275" y="262" text-anchor="middle">Decrypt</text>
  <text class="detail" x="1275" y="286" text-anchor="middle">same context</text>
</g>

<g id="envelope-cards">
  <rect class="card" x="118" y="466" width="206" height="84" rx="9" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="221" y="498" text-anchor="middle">Large payload</text>
  <text class="detail" x="221" y="524" text-anchor="middle">local cipher target</text>

  <rect class="card" x="374" y="466" width="214" height="84" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="481" y="498" text-anchor="middle">generateDataKey</text>
  <text class="detail" x="481" y="524" text-anchor="middle">KmsDataKey pair</text>

  <rect class="card" x="638" y="466" width="214" height="84" rx="9" fill="#FFF7ED" stroke="#F97316"/>
  <text class="card-title" x="745" y="498" text-anchor="middle">AWS KMS</text>
  <text class="detail" x="745" y="524" text-anchor="middle">plaintext + encrypted</text>

  <rect class="card" x="902" y="466" width="214" height="84" rx="9" fill="#F3FBFA" stroke="#63B8B3"/>
  <text class="card-title" x="1009" y="498" text-anchor="middle">Local encrypt</text>
  <text class="detail" x="1009" y="524" text-anchor="middle">payload + plaintext key</text>

  <rect class="card" x="1166" y="466" width="168" height="84" rx="9" fill="#FFF4E6" stroke="#F59E0B"/>
  <text class="card-title" x="1250" y="498" text-anchor="middle">Metadata</text>
  <text class="detail" x="1250" y="524" text-anchor="middle">encrypted key</text>
</g>

<g id="connections">
  <path class="edge" d="M 328 270 L 386 270" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M 622 270 L 680 270" stroke="#2F8B57" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M 890 270 L 948 270" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
  <path class="soft-edge" d="M 1158 270 L 1216 270" stroke="#475569" marker-end="url(#arrow-slate)"/>

  <path class="edge" d="M 324 508 L 374 508" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M 588 508 L 638 508" stroke="#2F8B57" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M 852 508 L 902 508" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
  <path class="edge" d="M 1116 508 L 1166 508" stroke="#168E86" marker-end="url(#arrow-teal)"/>
  <path class="soft-edge" d="M 481 466 L 481 438 L 745 438 L 745 466" stroke="#475569" marker-end="url(#arrow-slate)"/>
</g>

<g id="contracts">
  <rect x="86" y="630" width="600" height="64" rx="10" fill="#FFFFFF" stroke="#D9E2EC"/>
  <text class="card-title" x="110" y="660">Context contract</text>
  <text class="detail" x="314" y="658">same context</text>
  <text class="detail" x="478" y="658">same key</text>
  <text class="tiny" x="110" y="682">Method context overrides default entries from KmsProperties.</text>

  <rect x="724" y="630" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D9E2EC"/>
  <text class="card-title" x="748" y="660">Cache caution</text>
  <text class="detail" x="940" y="658">optional reuse</text>
  <text class="detail" x="1108" y="658">TTL bounded</text>
  <text class="tiny" x="748" y="682">Plaintext data keys are sensitive in-memory material; keep retention small.</text>
</g>

<rect class="footer" x="54" y="700" width="1332" height="34" rx="8"/>
<text class="footer-title" x="74" y="720" dominant-baseline="middle">Outcome</text>
<text class="footer-detail" x="176" y="720" dominant-baseline="middle">Decrypt succeeds only when the ciphertext, key choice, and encryption context match the original operation.</text>
</svg>
