<rect x="26" y="26" width="1408" height="318" rx="14" class="frame"/>
<text class="title" x="54" y="72">AWS Kotlin operation flow</text>
<text class="subtitle" x="56" y="104">A suspend caller configures a Kotlin SDK client, runs a native suspend operation, and closes owned resources.</text>
<g id="routes">
<path class="edge" d="M 294.0 198.0 L 332.0 198.0" stroke="#2F6DE0" marker-end="url(#arrow-blue)"/>
<path class="edge" d="M 572.0 198.0 L 610.0 198.0" stroke="#2F8B57" marker-end="url(#arrow-green)"/>
<path class="edge" d="M 850.0 198.0 L 888.0 198.0" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
<path class="edge" d="M 1128.0 198.0 L 1166.0 198.0" stroke="#C74E68" marker-end="url(#arrow-rose)"/>
</g>
<g id="scope">
  <rect class="card" x="54.0" y="150.0" width="240.0" height="96.0" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="174.0" y="195.0" text-anchor="middle" dominant-baseline="middle">Coroutine scope</text>
  <text class="detail" x="174.0" y="219.0" text-anchor="middle" dominant-baseline="middle">caller owns job</text>
</g>
<g id="client">
  <rect class="card" x="332.0" y="150.0" width="240.0" height="96.0" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="452.0" y="195.0" text-anchor="middle" dominant-baseline="middle">withXxxClient</text>
  <text class="detail" x="452.0" y="219.0" text-anchor="middle" dominant-baseline="middle">create/configure</text>
</g>
<g id="request">
  <rect class="card" x="610.0" y="150.0" width="240.0" height="96.0" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="730.0" y="195.0" text-anchor="middle" dominant-baseline="middle">DSL request</text>
  <text class="detail" x="730.0" y="219.0" text-anchor="middle" dominant-baseline="middle">typed model</text>
</g>
<g id="service">
  <rect class="card" x="888.0" y="150.0" width="240.0" height="96.0" rx="10" fill="#FFF7ED" stroke="#F97316"/>
  <text class="card-title" x="1008.0" y="195.0" text-anchor="middle" dominant-baseline="middle">AWS call</text>
  <text class="detail" x="1008.0" y="219.0" text-anchor="middle" dominant-baseline="middle">native suspend</text>
</g>
<g id="close">
  <rect class="card" x="1166.0" y="150.0" width="240.0" height="96.0" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="card-title" x="1286.0" y="195.0" text-anchor="middle" dominant-baseline="middle">Close client</text>
  <text class="detail" x="1286.0" y="219.0" text-anchor="middle" dominant-baseline="middle">release pools</text>
</g>
<rect class="footer" x="54" y="276" width="1352" height="54" rx="8"/>
<text class="footer-title" x="74" y="299" dominant-baseline="middle">Outcome</text>
<text class="footer-detail" x="74" y="319" dominant-baseline="middle">Connection pools and threads must be released.</text>
