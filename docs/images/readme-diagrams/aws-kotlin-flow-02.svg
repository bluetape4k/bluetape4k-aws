<svg xmlns="http://www.w3.org/2000/svg" width="940" height="930" viewBox="0 0 940 930" role="img" aria-label="aws-kotlin operation flow">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="888" height="878" rx="14" class="frame"/>
<text class="title" x="54" y="72">aws-kotlin operation flow</text>
<text class="subtitle" x="56" y="102">Native suspend operations use SDK Kotlin clients directly, with Flow helpers for streaming reads.</text>
<rect x="808" y="54" width="68" height="24" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="chip" x="842" y="70" text-anchor="middle">Build</text>
<rect x="713.5" y="54" width="78.5" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="chip" x="752.75" y="70" text-anchor="middle">Suspend</text>
<rect x="629.5" y="54" width="68" height="24" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="chip" x="663.5" y="70" text-anchor="middle">Flow</text>
<g><g><path class="edge" d="M470 220 L470 245 L470 245 L470 270" stroke="#66758A"/></g>
<g><path class="edge" d="M470 352 L470 377 L470 377 L470 402" stroke="#66758A"/></g>
<g><path class="edge" d="M470 484 L470 509 L470 509 L470 534" stroke="#66758A"/></g>
<g><path class="edge" d="M470 616 L470 641 L470 641 L470 666" stroke="#66758A"/></g></g>
<g id="caller">
  <rect class="card" x="310" y="140" width="320" height="80" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="470" y="177" text-anchor="middle">Coroutine caller</text>
  <text class="detail" x="470" y="201" text-anchor="middle">service or repository</text>
</g>
<g id="client">
  <rect class="card" x="310" y="270" width="320" height="82" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="470" y="308" text-anchor="middle">withXClient / clientOf</text>
  <text class="detail" x="470" y="332" text-anchor="middle">configure endpoint, region, credentials</text>
</g>
<g id="request">
  <rect class="card" x="310" y="402" width="320" height="82" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="470" y="440" text-anchor="middle">Kotlin request DSL</text>
  <text class="detail" x="470" y="464" text-anchor="middle">typed suspend SDK model</text>
</g>
<g id="operation">
  <rect class="card" x="310" y="534" width="320" height="82" rx="10" fill="#F4F7FA" stroke="#8CA0B3"/>
  <text class="card-title" x="470" y="572" text-anchor="middle">Native suspend operation</text>
  <text class="detail" x="470" y="596" text-anchor="middle">put, get, list, receive</text>
</g>
<g id="stream">
  <rect class="card" x="310" y="666" width="320" height="82" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="470" y="704" text-anchor="middle">Flow / paged results</text>
  <text class="detail" x="470" y="728" text-anchor="middle">recordFlow, list, receive</text>
</g>
<rect class="footer" x="54" y="826" width="832" height="54" rx="8"/>
<text class="footer-title" x="72" y="855">Flow role</text>
<text class="footer-detail" x="72" y="875">The vertical form separates client creation, request DSL, suspend call, and stream emission.</text>
</svg>