<svg xmlns="http://www.w3.org/2000/svg" width="940" height="900" viewBox="0 0 940 900" role="img" aria-label="bluetape4k-aws BOM flow">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="888" height="848" rx="14" class="frame"/>
<text class="title" x="54" y="72">bluetape4k-aws BOM flow</text>
<text class="subtitle" x="56" y="102">Consumers import one platform that aligns published AWS modules without runtime classes.</text>
<rect x="790" y="54" width="86" height="24" rx="12" fill="#F4F7FA" stroke="#8CA0B3"/>
<text class="chip" x="833" y="70" text-anchor="middle">Platform</text>
<rect x="649.5" y="54" width="108.5" height="24" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="chip" x="703.75" y="70" text-anchor="middle">Constraints</text>
<rect x="546.5" y="54" width="93.5" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="chip" x="593.25" y="70" text-anchor="middle">Consumers</text>
<g><g><path class="edge" d="M470 218 L470 242 L470 242 L470 266" stroke="#66758A"/></g>
<g><path class="edge" d="M470 352 L470 376 L470 376 L470 400" stroke="#66758A"/></g>
<g><path class="edge" d="M470 482 L470 506 L470 506 L470 530" stroke="#66758A"/></g>
<g><path class="edge" d="M470 612 L470 636 L470 636 L470 660" stroke="#66758A"/></g></g>
<g id="source">
  <rect class="card" x="300" y="136" width="340" height="82" rx="10" fill="#F4F7FA" stroke="#8CA0B3"/>
  <text class="card-title" x="470" y="174" text-anchor="middle">bluetape4k-aws-bom</text>
  <text class="detail" x="470" y="198" text-anchor="middle">Gradle java-platform</text>
</g>
<g id="constraints">
  <rect class="card" x="300" y="266" width="340" height="86" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="470" y="297.5" text-anchor="middle">Dependency constraints</text>
  <text class="detail" x="470" y="321.5" text-anchor="middle">aws-java, aws-kotlin</text>
<text class="detail" x="470" y="338.5" text-anchor="middle">aws-spring-boot, aws-ktor</text>
</g>
<g id="publish">
  <rect class="card" x="300" y="400" width="340" height="82" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="470" y="438" text-anchor="middle">Published Maven BOM</text>
  <text class="detail" x="470" y="462" text-anchor="middle">dependencyManagement only</text>
</g>
<g id="import">
  <rect class="card" x="300" y="530" width="340" height="82" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="470" y="568" text-anchor="middle">Consumer import</text>
  <text class="detail" x="470" y="592" text-anchor="middle">Gradle platform() or Maven import</text>
</g>
<g id="modules">
  <rect class="card" x="300" y="660" width="340" height="86" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="470" y="691.5" text-anchor="middle">Versionless dependencies</text>
  <text class="detail" x="470" y="715.5" text-anchor="middle">choose runtime modules</text>
<text class="detail" x="470" y="732.5" text-anchor="middle">versions stay aligned</text>
</g>
<rect class="footer" x="54" y="796" width="832" height="54" rx="8"/>
<text class="footer-title" x="72" y="825">BOM role</text>
<text class="footer-detail" x="72" y="845">A java-platform publishes dependency constraints only; applications still choose the modules they use.</text>
</svg>