<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-label="bluetape4k AWS BOM managed artifact catalog">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#059669"/>
    </marker>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#f8fafc}
      .frame{fill:#ffffff;stroke:#8aa6cf;stroke-width:3;filter:url(#softShadow)}
      .title{font-family:"Architects Daughter";font-size:48px;fill:#17233a}
      .subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
      .band{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;stroke-dasharray:9 8}
      .bandTitle{font-family:"Comic Mono";font-size:18px;font-weight:700;fill:#475569}
      .card{fill:#ffffff;stroke-width:2.2;filter:url(#softShadow)}
      .cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#17233a}
      .artifact{font-family:"Comic Mono";font-size:15px;fill:#1f2937}
      .cardText{font-family:"Comic Mono";font-size:13px;fill:#475569}
      .route{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .routeText{font-family:"Comic Mono";font-size:13px;fill:#334155}
      .pill{fill:#ffffff;stroke-width:2}
      .pillText{font-family:"Comic Mono";font-size:13px;fill:#334155}
      .footerText{font-family:"Comic Mono";font-size:14px;fill:#475569}
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1040"/>
  <rect class="frame" x="42" y="36" width="1516" height="964" rx="24"/>
  <text class="title" x="800" y="96" text-anchor="middle">bluetape4k-aws-bom Artifact Catalog</text>
  <text class="subtitle" x="800" y="132" text-anchor="middle">Import one BOM, then declare supported AWS artifacts without repeating module versions.</text>

  <g id="import">
    <rect class="band" x="92" y="178" width="1416" height="150" rx="18"/>
    <text class="bandTitle" x="118" y="216">DEVELOPER IMPORT</text>
    <rect class="card" x="204" y="242" width="526" height="58" rx="16" stroke="#2563eb"/>
    <text class="artifact" x="467" y="277" text-anchor="middle">io.github.bluetape4k.aws:bluetape4k-aws-bom</text>
    <rect class="card" x="870" y="242" width="526" height="58" rx="16" stroke="#059669"/>
    <text class="cardTitle" x="1133" y="277" text-anchor="middle">Gradle platform() or Maven import</text>
  </g>

  <g id="managed">
    <rect class="band" x="92" y="382" width="1416" height="360" rx="18"/>
    <text class="bandTitle" x="118" y="420">SUPPORTED ARTIFACT IDS MANAGED BY THE BOM</text>

    <rect class="card" x="146" y="466" width="396" height="78" rx="16" stroke="#2563eb"/>
    <text class="artifact" x="344" y="496" text-anchor="middle">bluetape4k-aws-java</text>
    <text class="cardText" x="344" y="522" text-anchor="middle">AWS Java SDK v2 wrappers and coroutine helpers</text>

    <rect class="card" x="602" y="466" width="396" height="78" rx="16" stroke="#059669"/>
    <text class="artifact" x="800" y="496" text-anchor="middle">bluetape4k-aws-kotlin</text>
    <text class="cardText" x="800" y="522" text-anchor="middle">AWS Kotlin SDK suspend APIs and DSL builders</text>

    <rect class="card" x="1058" y="466" width="396" height="78" rx="16" stroke="#d97706"/>
    <text class="artifact" x="1256" y="496" text-anchor="middle">bluetape4k-aws-exposed</text>
    <text class="cardText" x="1256" y="522" text-anchor="middle">RDS IAM, Secrets, Parameter Store, Hikari config</text>

    <rect class="card" x="374" y="596" width="396" height="78" rx="16" stroke="#dc2626"/>
    <text class="artifact" x="572" y="626" text-anchor="middle">bluetape4k-aws-spring-boot</text>
    <text class="cardText" x="572" y="652" text-anchor="middle">Spring Boot 4 auto-configuration and templates</text>

    <rect class="card" x="830" y="596" width="396" height="78" rx="16" stroke="#7c3aed"/>
    <text class="artifact" x="1028" y="626" text-anchor="middle">bluetape4k-aws-ktor</text>
    <text class="cardText" x="1028" y="652" text-anchor="middle">Ktor 3 SigV4, S3, SQS, DynamoDB helpers</text>
  </g>

  <g id="excluded">
    <rect class="band" x="92" y="796" width="1416" height="112" rx="18"/>
    <text class="bandTitle" x="118" y="834">NOT MANAGED AS CONSUMER ARTIFACTS</text>
    <rect class="pill" x="210" y="856" width="300" height="36" rx="13" stroke="#64748b"/>
    <text class="pillText" x="360" y="879" text-anchor="middle">examples/*</text>
    <rect class="pill" x="552" y="856" width="300" height="36" rx="13" stroke="#64748b"/>
    <text class="pillText" x="702" y="879" text-anchor="middle">benchmark/*</text>
    <rect class="pill" x="894" y="856" width="300" height="36" rx="13" stroke="#64748b"/>
    <text class="pillText" x="1044" y="879" text-anchor="middle">demo / benchmark modules</text>
  </g>

  <path class="route" d="M 800 328 L 800 382" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
  <text class="routeText" x="846" y="361">java-platform constraints align versions only</text>

  <path class="route" d="M 800 742 L 800 796" stroke="#059669" marker-end="url(#arrowGreen)"/>
  <text class="routeText" x="846" y="775">published libraries are included; examples stay outside</text>

  <text class="footerText" x="800" y="946" text-anchor="middle">Reader contract: the BOM is dependency management only, but its README is the artifactId catalog for consumers.</text>
</svg>
