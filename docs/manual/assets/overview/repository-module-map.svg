<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Bluetape4k AWS 0.4 repository and module map</title>
  <desc id="desc">A dark architecture map showing the central dependency platform, six published AWS modules, Spring Boot and Ktor integration boundaries, and eight released example projects.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="58%" stop-color="#172334"/>
      <stop offset="100%" stop-color="#223047"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
    <filter id="glow" x="-20" y="-20" width="1640" height="1140" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#67e8f9" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#9ed8ff" stroke="#9ed8ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#5eead4" stroke="#5eead4"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#c4b5fd" stroke="#c4b5fd"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#f6c96b" stroke="#f6c96b"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="url(#canvas)"/>
  <rect x="42" y="36" width="1516" height="1028" rx="34" fill="url(#panel)" stroke="#536377" stroke-width="4" filter="url(#shadow)"/>

  <text x="800" y="98" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="50" fill="#f8fafc">Start with the Boundary, Then Pick the Integration</text>
  <text x="800" y="140" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="19" fill="#b6c4d6">AWS 0.4 / 6 published modules / 8 released learning examples</text>

  <rect x="92" y="350" width="1416" height="240" rx="26" fill="#121c2d" stroke="#43536a" stroke-width="2.5" stroke-dasharray="10 8"/>

  <g id="connectors" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" filter="url(#glow)">
    <path id="version-to-bom" d="M 800 270 V 315 Q 800 330 785 330 H 292 Q 277 330 277 345 V 405" stroke="#9ed8ff" marker-end="url(#arrow-cyan)"/>
    <path id="java-to-runtime" d="M 600 560 V 625" stroke="#5eead4" marker-end="url(#arrow-green)"/>
    <path id="kotlin-to-runtime" d="M 950 560 V 625" stroke="#5eead4" marker-end="url(#arrow-green)"/>
    <path id="exposed-to-runtime" d="M 1275 560 V 590 Q 1275 605 1260 605 H 1080 Q 1065 605 1065 615 V 625" stroke="#c4b5fd" marker-end="url(#arrow-purple)"/>
    <path id="runtime-to-spring" d="M 680 675 V 700 Q 680 715 665 715 H 475 Q 460 715 460 725 V 735" stroke="#f6c96b" marker-end="url(#arrow-amber)"/>
    <path id="runtime-to-ktor" d="M 920 675 V 700 Q 920 715 935 715 H 1125 Q 1140 715 1140 725 V 735" stroke="#f6c96b" marker-end="url(#arrow-amber)"/>
    <path id="spring-to-examples" d="M 460 855 V 900" stroke="#9ed8ff" marker-end="url(#arrow-cyan)"/>
    <path id="ktor-to-examples" d="M 1140 855 V 900" stroke="#9ed8ff" marker-end="url(#arrow-cyan)"/>
  </g>

  <g id="version-contract" filter="url(#shadow)">
    <rect id="version-card" x="350" y="175" width="900" height="95" rx="24" fill="#172033" stroke="#8b6bd6" stroke-width="4"/>
    <text x="800" y="214" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="31" fill="#c4b5fd">bluetape4k-dependencies</text>
    <text x="800" y="246" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#d5dfeb">the only version the application selects</text>
  </g>

  <text x="1470" y="383" text-anchor="end" font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#9fb0c4">STABLE 0.4 LIBRARY BOUNDARY</text>

  <g id="library-cards" filter="url(#shadow)">
    <rect id="bom-card" x="130" y="405" width="295" height="155" rx="22" fill="#172033" stroke="#4c8cc8" stroke-width="4"/>
    <rect id="java-card" x="460" y="405" width="280" height="155" rx="22" fill="#172033" stroke="#159c92" stroke-width="4"/>
    <rect id="kotlin-card" x="810" y="405" width="280" height="155" rx="22" fill="#172033" stroke="#159c92" stroke-width="4"/>
    <rect id="exposed-card" x="1140" y="405" width="270" height="155" rx="22" fill="#172033" stroke="#8b6bd6" stroke-width="4"/>
  </g>
  <g text-anchor="middle">
    <text x="277" y="452" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#9ed8ff">AWS BOM</text>
    <text x="277" y="488" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">aligns the 5 runtime libraries</text>
    <text x="277" y="520" font-family="Comic Mono, ui-monospace, monospace" font-size="14" fill="#9fb0c4">internal detail for consumers</text>

    <text x="600" y="452" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#5eead4">aws-java</text>
    <text x="600" y="488" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">sync / future / coroutine</text>
    <text x="600" y="520" font-family="Comic Mono, ui-monospace, monospace" font-size="14" fill="#9fb0c4">AWS SDK for Java v2</text>

    <text x="950" y="452" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#5eead4">aws-kotlin</text>
    <text x="950" y="488" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">native suspend / request DSL</text>
    <text x="950" y="520" font-family="Comic Mono, ui-monospace, monospace" font-size="14" fill="#9fb0c4">AWS SDK for Kotlin</text>

    <text x="1275" y="452" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#c4b5fd">aws-exposed</text>
    <text x="1275" y="488" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">AWS config / RDS IAM</text>
    <text x="1275" y="520" font-family="Comic Mono, ui-monospace, monospace" font-size="14" fill="#9fb0c4">Hikari to Exposed Database</text>
  </g>

  <g id="runtime-bus">
    <rect id="runtime-bus-card" x="360" y="625" width="880" height="50" rx="18" fill="#201923" stroke="#d19a3b" stroke-width="3"/>
    <text x="800" y="657" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#f6c96b">selected SDK clients + optional database integration</text>
  </g>

  <g id="framework-cards" filter="url(#shadow)">
    <rect id="spring-card" x="250" y="735" width="420" height="120" rx="24" fill="#172033" stroke="#4c8cc8" stroke-width="4"/>
    <rect id="ktor-card" x="930" y="735" width="420" height="120" rx="24" fill="#172033" stroke="#c58b2a" stroke-width="4"/>
  </g>
  <text x="460" y="783" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="30" fill="#9ed8ff">aws-spring-boot</text>
  <text x="460" y="819" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">auto-configuration / templates / listeners</text>
  <text x="1140" y="783" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="30" fill="#f6c96b">aws-ktor</text>
  <text x="1140" y="819" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">SigV4 / clients / server runtimes</text>

  <g id="example-cards" filter="url(#shadow)">
    <rect id="spring-examples-card" x="110" y="900" width="660" height="105" rx="22" fill="#151f31" stroke="#4c8cc8" stroke-width="3"/>
    <rect id="ktor-examples-card" x="830" y="900" width="660" height="105" rx="22" fill="#151f31" stroke="#c58b2a" stroke-width="3"/>
  </g>
  <text x="460" y="938" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="25" fill="#9ed8ff">Spring learning track</text>
  <text x="460" y="974" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d5dfeb">S3 / DynamoDB / SQS-SNS / Exposed</text>
  <text x="1140" y="938" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="25" fill="#f6c96b">Ktor learning track</text>
  <text x="1140" y="974" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d5dfeb">S3 / DynamoDB / SQS / Exposed</text>

  <g id="legend" font-family="Comic Mono, ui-monospace, monospace" font-size="13" fill="#b6c4d6">
    <line x1="445" y1="1035" x2="490" y2="1035" stroke="#5eead4" stroke-width="4"/><text x="502" y="1040">SDK capability</text>
    <line x1="660" y1="1035" x2="705" y2="1035" stroke="#c4b5fd" stroke-width="4"/><text x="717" y="1040">database integration</text>
    <line x1="925" y1="1035" x2="970" y2="1035" stroke="#f6c96b" stroke-width="4"/><text x="982" y="1040">framework boundary</text>
  </g>
</svg>
