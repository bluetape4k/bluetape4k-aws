<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AWS SDK extension decision map</title>
  <desc id="desc">A dark decision map comparing Java SDK v2 sync, future, and coroutine extensions with AWS Kotlin SDK native suspend extensions.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#101827"/><stop offset="58%" stop-color="#172334"/><stop offset="100%" stop-color="#223047"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f2937"/><stop offset="100%" stop-color="#111827"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#020617" flood-opacity="0.34"/></filter>
    <filter id="glow" x="-20" y="-20" width="1640" height="1040" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#67e8f9" flood-opacity="0.25"/></filter>
    <marker id="arrow-blue" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#9ed8ff"/></marker>
    <marker id="arrow-green" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#5eead4"/></marker>
    <marker id="arrow-amber" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#f6c96b"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#canvas)"/>
  <rect x="42" y="36" width="1516" height="928" rx="34" fill="url(#panel)" stroke="#536377" stroke-width="4" filter="url(#shadow)"/>

  <text x="800" y="105" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="52" fill="#f8fafc">Choose the SDK Contract You Already Own</text>
  <text x="800" y="148" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="19" fill="#b6c4d6">Both paths are coroutine-friendly; the underlying SDK and lifecycle contract are different.</text>

  <g id="connectors" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" filter="url(#glow)">
    <path id="decision-to-java" d="M 700 330 V 365 Q 700 380 685 380 H 420 Q 405 380 405 395 V 430" stroke="#9ed8ff" marker-end="url(#arrow-blue)"/>
    <path id="decision-to-kotlin" d="M 900 330 V 365 Q 900 380 915 380 H 1180 Q 1195 380 1195 395 V 430" stroke="#5eead4" marker-end="url(#arrow-green)"/>
    <path id="java-to-contract" d="M 405 720 V 760 Q 405 775 420 775 H 685 Q 700 775 700 790 V 815" stroke="#f6c96b" marker-end="url(#arrow-amber)"/>
    <path id="kotlin-to-contract" d="M 1195 720 V 760 Q 1195 775 1180 775 H 915 Q 900 775 900 790 V 815" stroke="#f6c96b" marker-end="url(#arrow-amber)"/>
  </g>

  <g filter="url(#shadow)">
    <rect id="decision-card" x="350" y="205" width="900" height="125" rx="28" fill="#172033" stroke="#8b6bd6" stroke-width="4"/>
    <text x="800" y="258" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="34" fill="#c4b5fd">Which SDK ecosystem owns the application?</text>
    <text x="800" y="298" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#d5dfeb">existing Java v2 clients and libraries / native Kotlin suspend model</text>
  </g>

  <g id="choice-cards" filter="url(#shadow)">
    <rect id="java-choice-card" x="105" y="430" width="600" height="290" rx="28" fill="#172033" stroke="#4c8cc8" stroke-width="4"/>
    <rect id="kotlin-choice-card" x="895" y="430" width="600" height="290" rx="28" fill="#172033" stroke="#159c92" stroke-width="4"/>
  </g>
  <text x="405" y="485" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="34" fill="#9ed8ff">bluetape4k-aws-java</text>
  <text x="1195" y="485" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="34" fill="#5eead4">bluetape4k-aws-kotlin</text>

  <g font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#d5dfeb">
    <text x="155" y="540">Choose when Java SDK v2 types are the boundary.</text>
    <text x="155" y="588" fill="#9ed8ff">sync</text><text x="245" y="588">direct blocking client extensions</text>
    <text x="155" y="630" fill="#9ed8ff">future</text><text x="245" y="630">CompletableFuture async extensions</text>
    <text x="155" y="672" fill="#9ed8ff">suspend</text><text x="245" y="672">coroutine adapters over async clients</text>

    <text x="945" y="540">Choose when native suspend is the SDK boundary.</text>
    <text x="945" y="588" fill="#5eead4">suspend</text><text x="1055" y="588">AWS Kotlin SDK operations</text>
    <text x="945" y="630" fill="#5eead4">DSL</text><text x="1055" y="630">Kotlin request and model builders</text>
    <text x="945" y="672" fill="#5eead4">Flow</text><text x="1055" y="672">pagination and streaming helpers</text>
  </g>

  <g filter="url(#shadow)">
    <rect id="shared-contract-card" x="280" y="815" width="1040" height="95" rx="24" fill="#201923" stroke="#c58b2a" stroke-width="4"/>
    <text x="800" y="853" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#f6c96b">The application still owns clients and runtime service SDKs</text>
    <text x="800" y="885" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">reuse long-lived clients / close owned clients / add only the AWS services you execute</text>
  </g>
</svg>
