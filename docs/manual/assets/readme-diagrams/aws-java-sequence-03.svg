<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1340" viewBox="0 0 1960 1340" role="img" aria-labelledby="title desc">
<title id="title">AWS Java Coroutine Adapter Sequence</title>
<desc id="desc">Thin suspend and Flow adapters bridge CompletableFuture based SDK v2 clients without owning client lifecycle.</desc>
