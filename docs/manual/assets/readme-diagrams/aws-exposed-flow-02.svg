<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1060" viewBox="0 0 1780 1060" role="img" aria-labelledby="title desc">
  <title id="title">AWS Exposed Configuration Flow</title>
  <desc id="desc">Configuration flow from application properties through resolver, validation, authentication, Hikari datasource creation, Exposed database handle creation, and registry cleanup behavior.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12.5" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563eb" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="none" />
    </marker>
    <marker id="soft-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-width="1.2" stroke-dasharray="none" />
    </marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
    <style>
      .canvas { fill: #f8fafc; }
      .title { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 52px; fill: #17233a; }
      .subtitle { font-family: "Comic Mono", monospace; font-size: 22px; fill: #475569; }
      .step-title { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 27px; fill: #17233a; }
      .step-text { font-family: "Comic Mono", monospace; font-size: 17px; fill: #475569; }
      .lane-title { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 31px; fill: #475569; }
      .lane-note { font-family: "Comic Mono", monospace; font-size: 17px; fill: #5a6c7a; }
      .tag { font-family: "Comic Mono", monospace; font-size: 17px; fill: #29465f; }
      .footer { font-family: "Comic Mono", monospace; font-size: 18px; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 3; }
      .lane-auth { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 3; }
      .lane-output { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 3; }
      .step { fill: #ffffff; stroke: #2563eb; stroke-width: 2.6; }
      .step-strong { fill: #ffffff; stroke: #059669; stroke-width: 2.8; }
      .branch { fill: #ffffff; stroke: #d97706; stroke-width: 2.8; }
      .danger { fill: #fffefa; stroke: #d97706; stroke-width: 2.6; stroke-dasharray: 10 8; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .flow-plain { fill: none; stroke: #2563eb; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .junction { fill: #2563eb; stroke: #ffffff; stroke-width: 3; }
      .soft { fill: none; stroke: #64748b; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 7; marker-end: url(#soft-arrow); }
    </style>
  </defs>

  <rect class="canvas" width="1780" height="1060" />
  <rect x="34" y="30" width="1712" height="996" rx="28" fill="#ffffff" stroke="#8aa6cf" stroke-width="3" />

  <text class="title" x="80" y="102">AWS Exposed Configuration Flow</text>
  <text class="subtitle" x="82" y="140">A resolved database definition becomes a Hikari-backed Exposed handle; auth mode decides how the JDBC password is supplied.</text>

  <rect class="lane" x="82" y="188" width="1616" height="288" rx="22" />
  <text class="lane-title" x="112" y="235">Configuration pipeline</text>
  <text class="lane-note" x="112" y="266">The foundation receives final settings and validates them before opening an Exposed boundary.</text>

  <g filter="url(#shadow)">
    <rect class="step" x="122" y="306" width="240" height="116" rx="16" />
    <text class="step-title" x="148" y="343">1. Supply config</text>
    <text class="step-text" x="148" y="374">defaultDatabase</text>
    <text class="step-text" x="148" y="400">namedDatabases</text>

    <rect class="step" x="456" y="306" width="240" height="116" rx="16" />
    <text class="step-title" x="482" y="343">2. Resolve</text>
    <text class="step-text" x="482" y="374">resolver hook</text>
    <text class="step-text" x="482" y="400">databaseName scoped</text>

    <rect class="step-strong" x="790" y="306" width="240" height="116" rx="16" />
    <text class="step-title" x="816" y="343">3. Validate</text>
    <text class="step-text" x="816" y="374">url and driver class</text>
    <text class="step-text" x="816" y="400">auth mode invariants</text>

    <rect class="step" x="1124" y="306" width="280" height="116" rx="16" />
    <image data-bluetape4k-icon="generic.database" x="1140" y="352" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet" /><text class="step-title" x="1180" y="343">4. Build data</text>
    <text class="step-text" x="1180" y="374">Hikari config</text>
    <text class="step-text" x="1180" y="400">JDBC properties</text>

    <rect class="step" x="1470" y="306" width="220" height="116" rx="16" />
    <image data-bluetape4k-icon="library.exposed" x="1486" y="352" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet" /><text class="step-title" x="1530" y="343">5. Connect</text>
    <text class="step-text" x="1530" y="374">Exposed</text>
    <text class="step-text" x="1530" y="400">Database</text>
  </g>

  <path class="flow" d="M 362 364 H 444" />
  <path class="flow" d="M 696 364 H 778" />
  <path class="flow" d="M 1030 364 H 1112" />
  <path class="flow" d="M 1404 364 H 1458" />


  <rect class="lane-auth" x="82" y="530" width="1616" height="302" rx="22" />
  <text class="lane-title" x="112" y="577">Authentication branch</text>
  <text class="lane-note" x="112" y="608">`STATIC_PASSWORD` and `RDS_IAM` are mutually exclusive in `AwsDatabaseConnectionProperties`.</text>

  <g filter="url(#shadow)">
    <rect class="branch" x="156" y="652" width="480" height="118" rx="16" />
    <image data-bluetape4k-icon="generic.database" x="176" y="699" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet" /><text class="step-title" x="206" y="690">STATIC_PASSWORD</text>
    <text class="step-text" x="206" y="722">uses `AwsSecretString.reveal()` only</text>
    <text class="step-text" x="206" y="748">at the JDBC boundary</text>

    <rect class="branch" x="696" y="652" width="500" height="118" rx="16" />
    <image data-bluetape4k-icon="aws.rds" x="716" y="699" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet" /><text class="step-title" x="746" y="690">RDS_IAM</text>
    <text class="step-text" x="746" y="722">requires region, real RDS hostname,</text>
    <text class="step-text" x="746" y="748">port, effective username, SDK RDS runtime</text>

    <rect class="branch" x="1276" y="652" width="360" height="118" rx="16" />
    <text class="step-title" x="1310" y="690">Token cache</text>
    <text class="step-text" x="1310" y="722">refreshes before expiry</text>
    <text class="step-text" x="1310" y="748">wraps generator failures</text>
  </g>

  <path class="flow-plain" d="M 910 422 V 612" />
  <path class="flow" d="M 910 612 Q 910 628 894 628 H 408 Q 396 628 396 640 V 652" />
  <path class="flow" d="M 910 612 Q 910 628 926 628 H 948 Q 960 628 960 640 V 652" />
  <path class="flow" d="M 1196 710 H 1264" />

  <path class="flow" d="M 396 770 V 818 Q 396 830 408 830 H 868 Q 880 830 880 842 V 892" />
  <path class="flow" d="M 1456 770 V 818 Q 1456 830 1444 830 H 1052 Q 1040 830 1040 842 V 892" />

  <rect class="lane-output" x="82" y="892" width="1616" height="86" rx="22" />
  <text class="lane-title" x="112" y="944">Registry output</text>
  <text class="footer" x="500" y="930">`createRegistry()` builds the default handle first, then named handles.</text>
  <text class="footer" x="500" y="956">Any creation failure closes already-created handles in reverse order.</text>

<path class="soft" d="M 1456 570 V 652" />
  <rect class="danger" x="1241" y="488" width="430" height="82" rx="14" />
  <text class="tag" x="1271" y="514">RDS IAM token generation</text>
  <text class="tag" x="1271" y="538">uses RdsUtilities; credentials</text>
  <text class="tag" x="1271" y="562">may come from the SDK chain.</text>
</svg>
