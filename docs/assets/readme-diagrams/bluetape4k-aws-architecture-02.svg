</style>
<rect x="26" y="26" width="1348" height="848" rx="14" class="frame"/>
<text class="title" x="54" y="72">Java SDK v2 architecture</text>
<text class="subtitle" x="56" y="104">aws-java wraps Java SDK v2 with builders, coroutine bridges, factories, and transfer helpers.</text>
