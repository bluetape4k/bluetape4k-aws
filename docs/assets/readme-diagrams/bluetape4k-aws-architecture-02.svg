<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-label="Three-tier Java SDK API">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="1228" height="598" rx="14" class="frame"/>
<text class="title" x="54" y="72">Three-tier Java SDK API</text>
<text class="subtitle" x="56" y="102">The Java SDK module exposes sync builders, async futures, and suspend wrappers over SDK v2 clients.</text>
<g>
  <rect x="1108" y="54" width="116" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="chip" x="1166" y="70" text-anchor="middle">Java SDK v2</text>
</g>
<g>
  <rect x="928" y="54" width="164" height="24" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="chip" x="1010" y="70" text-anchor="middle">CompletableFuture</text>
</g>
<g>
  <rect x="804" y="54" width="108" height="24" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="chip" x="858" y="70" text-anchor="middle">Coroutines</text>
</g>
<g><g><path class="edge" d="M306 289 L306 240 L384 240 L384 191" stroke="#66758A"/></g>
<g><path class="edge" d="M306 289 L345 289 L345 317 L384 317" stroke="#66758A"/></g>
<g><path class="edge" d="M306 289 L306 366 L384 366 L384 443" stroke="#66758A"/></g>
<g><path class="edge" d="M634 191 L634 250 L738 250 L738 308" stroke="#66758A"/></g>
<g><path class="edge" d="M634 317 L686 317 L686 308 L738 308" stroke="#66758A"/></g>
<g><path class="edge" d="M634 443 L634 376 L738 376 L738 308" stroke="#66758A"/></g>
<g><path class="edge" d="M893 358 L939 358 L939 438 L985 438" stroke="#66758A"/></g></g>
<g id="app">
  <rect class="card" x="76" y="246" width="230" height="86" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="191" y="286" text-anchor="middle">Application code</text>
  <text class="detail" x="191" y="309" text-anchor="middle">blocking, async, suspend</text>
</g>
<g id="sync">
  <rect class="card" x="384" y="150" width="250" height="82" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="509" y="188" text-anchor="middle">Sync extensions</text>
  <text class="detail" x="509" y="211" text-anchor="middle">request builders and helpers</text>
</g>
<g id="async">
  <rect class="card" x="384" y="276" width="250" height="82" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="509" y="314" text-anchor="middle">Async extensions</text>
  <text class="detail" x="509" y="337" text-anchor="middle">CompletableFuture helpers</text>
</g>
<g id="suspend">
  <rect class="card" x="384" y="402" width="250" height="82" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="509" y="440" text-anchor="middle">Coroutine extensions</text>
  <text class="detail" x="509" y="463" text-anchor="middle">suspend wrappers</text>
</g>
<g id="clients">
  <rect class="card" x="738" y="258" width="310" height="100" rx="10" fill="#F4F7FA" stroke="#8CA0B3"/>
  <text class="card-title" x="893" y="296.5" text-anchor="middle">AWS Java SDK v2 clients</text>
  <text class="detail" x="893" y="319.5" text-anchor="middle">S3AsyncClient, SqsAsyncClient</text>
<text class="detail" x="893" y="336.5" text-anchor="middle">DynamoDbEnhancedAsyncClient</text>
</g>
<g id="aws">
  <rect class="card" x="850" y="438" width="270" height="84" rx="10" fill="#FFF0E3" stroke="#F47B36"/>
  <text class="card-title" x="985" y="477" text-anchor="middle">AWS services</text>
  <text class="detail" x="985" y="500" text-anchor="middle">or LocalStack / Floci</text>
</g>
<rect class="footer" x="54" y="546" width="1172" height="54" rx="8"/>
<text class="footer-title" x="72" y="575">API role</text>
<text class="footer-detail" x="72" y="595">Keep consumer code Kotlin-first while letting applications choose sync, async, or suspend entry points.</text>
</svg>