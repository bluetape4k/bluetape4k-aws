<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="660" viewBox="0 0 1300 660" role="img" aria-label="KMS Spring Boot components">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="1248" height="608" rx="14" class="frame"/>
<text class="title" x="54" y="72">KMS Spring Boot components</text>
<text class="subtitle" x="56" y="102">Auto-configuration wires key management, operations, cache policy, and encryption clients.</text>
<g>
  <rect x="1172" y="54" width="72" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="chip" x="1208" y="70" text-anchor="middle">KMS</text>
</g>
<g>
  <rect x="1080" y="54" width="76" height="24" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="chip" x="1118" y="70" text-anchor="middle">Boot 4</text>
</g>
<g>
  <rect x="972" y="54" width="92" height="24" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="chip" x="1018" y="70" text-anchor="middle">Envelope</text>
</g>
<g><g><path class="edge" d="M319 226 L353 226 L353 226 L386 226" stroke="#66758A"/></g>
<g><path class="edge" d="M656 226 L690 226 L690 226 L724 226" stroke="#66758A"/></g>
<g><path class="edge" d="M724 226 L579 226 L579 430 L433 430" stroke="#66758A"/></g>
<g><path class="edge" d="M846.5 272 L745 272 L745 384 L642.5 384" stroke="#66758A"/></g>
<g><path class="edge" d="M765 430 L809 430 L809 430 L852 430" stroke="#66758A"/></g></g>
<g id="props">
  <rect class="card" x="74" y="180" width="245" height="92" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="196.5" y="214.5" text-anchor="middle">KmsProperties</text>
  <text class="detail" x="196.5" y="237.5" text-anchor="middle">key id, endpoint</text>
<text class="detail" x="196.5" y="254.5" text-anchor="middle">cache and region</text>
</g>
<g id="auto">
  <rect class="card" x="386" y="180" width="270" height="92" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="521" y="214.5" text-anchor="middle">KmsAutoConfiguration</text>
  <text class="detail" x="521" y="237.5" text-anchor="middle">conditional clients</text>
<text class="detail" x="521" y="254.5" text-anchor="middle">operations bean</text>
</g>
<g id="ops">
  <rect class="card" x="724" y="180" width="245" height="92" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="846.5" y="214.5" text-anchor="middle">KmsOperations</text>
  <text class="detail" x="846.5" y="237.5" text-anchor="middle">encrypt, decrypt</text>
<text class="detail" x="846.5" y="254.5" text-anchor="middle">generate data key</text>
</g>
<g id="cache">
  <rect class="card" x="188" y="384" width="245" height="92" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="card-title" x="310.5" y="418.5" text-anchor="middle">DataKeyCache</text>
  <text class="detail" x="310.5" y="441.5" text-anchor="middle">short TTL plaintext keys</text>
<text class="detail" x="310.5" y="458.5" text-anchor="middle">bounded cache size</text>
</g>
<g id="client">
  <rect class="card" x="520" y="384" width="245" height="92" rx="10" fill="#F4F7FA" stroke="#8CA0B3"/>
  <text class="card-title" x="642.5" y="418.5" text-anchor="middle">KmsClient</text>
  <text class="detail" x="642.5" y="441.5" text-anchor="middle">AWS SDK v2 client</text>
<text class="detail" x="642.5" y="458.5" text-anchor="middle">LocalStack endpoint</text>
</g>
<g id="aws">
  <rect class="card" x="852" y="384" width="270" height="92" rx="10" fill="#FFF0E3" stroke="#F47B36"/>
  <text class="card-title" x="987" y="427" text-anchor="middle">AWS KMS</text>
  <text class="detail" x="987" y="450" text-anchor="middle">or LocalStack KMS</text>
</g>
<rect class="footer" x="54" y="556" width="1192" height="54" rx="8"/>
<text class="footer-title" x="72" y="585">KMS role</text>
<text class="footer-detail" x="72" y="605">Direct encrypt handles small secrets; data keys support local envelope encryption for payloads.</text>
</svg>