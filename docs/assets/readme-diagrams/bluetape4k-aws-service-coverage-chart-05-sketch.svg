<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-label="AWS service coverage sketch">
<defs>
<marker id="arrow-0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail,.layer-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title,.layer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;fill:#102033}
  .card-title{font-size:19px}
  .layer-title{font-size:22px}
  .detail{font-size:12px}
  .tiny{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#526274}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .layer{stroke-width:1.5;fill:#FFFFFF}
  .edge{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="20" y="20" width="1460" height="740" rx="10" class="frame"/>
<text class="title" x="48" y="70">AWS service coverage sketch</text>
<g id="row0">
<rect class="card" x="0.0" y="0.0" width="1.0" height="1.0" rx="8" fill="#FFFFFF" stroke="#000000"/>
<text class="card-title" x="0.5" y="31.0" text-anchor="middle">aws-java</text>
<text class="detail" x="0.5" y="55.0" text-anchor="middle">Core Java SDK v2 helpers</text>
</g>
<g id="row1">
<rect class="card" x="0.0" y="0.0" width="1.0" height="1.0" rx="8" fill="#FFFFFF" stroke="#000000"/>
<text class="card-title" x="0.5" y="31.0" text-anchor="middle">aws-kotlin</text>
<text class="detail" x="0.5" y="55.0" text-anchor="middle">Native suspend SDK helpers</text>
</g>
<g id="row2">
<rect class="card" x="0.0" y="0.0" width="1.0" height="1.0" rx="8" fill="#FFFFFF" stroke="#000000"/>
<text class="card-title" x="0.5" y="31.0" text-anchor="middle">aws-exposed</text>
<text class="detail" x="0.5" y="55.0" text-anchor="middle">Database config and RDS IAM</text>
</g>
<g id="row3">
<rect class="card" x="0.0" y="0.0" width="1.0" height="1.0" rx="8" fill="#FFFFFF" stroke="#000000"/>
<text class="card-title" x="0.5" y="31.0" text-anchor="middle">aws-spring-boot</text>
<text class="detail" x="0.5" y="55.0" text-anchor="middle">Auto-config templates and property sources</text>
</g>
<g id="row4">
<rect class="card" x="0.0" y="0.0" width="1.0" height="1.0" rx="8" fill="#FFFFFF" stroke="#000000"/>
<text class="card-title" x="0.5" y="31.0" text-anchor="middle">aws-ktor</text>
<text class="detail" x="0.5" y="55.0" text-anchor="middle">Plugins, SigV4, S3/SQS/DynamoDB runtimes</text>
</g>
<g id="row5">
<rect class="card" x="0.0" y="0.0" width="1.0" height="1.0" rx="8" fill="#FFFFFF" stroke="#000000"/>
<text class="card-title" x="0.5" y="31.0" text-anchor="middle">examples</text>
<text class="detail" x="0.5" y="55.0" text-anchor="middle">Runnable Spring Boot and Ktor scenarios</text>
</g>
</svg>
