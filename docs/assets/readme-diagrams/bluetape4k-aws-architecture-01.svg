<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="800" viewBox="0 0 1180 800" role="img" aria-label="Runtime architecture">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="1128" height="748" rx="14" class="frame"/>
<text class="title" x="54" y="72">Runtime architecture</text>
<text class="subtitle" x="56" y="102">Application code enters bluetape4k AWS APIs, delegates to SDK clients, and targets AWS or emulators.</text>
<g>
  <rect x="1026" y="54" width="92" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="chip" x="1072" y="70" text-anchor="middle">Adapters</text>
</g>
<g>
  <rect x="942" y="54" width="72" height="24" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="chip" x="978" y="70" text-anchor="middle">SDKs</text>
</g>
<g>
  <rect x="786" y="54" width="100" height="24" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="chip" x="836" y="70" text-anchor="middle">Emulators</text>
</g>
<g><g><path class="edge" d="M390 213 L390 289 L355 289 L355 364" stroke="#66758A"/></g>
<g><path class="edge" d="M760 213 L760 289 L825 289 L825 364" stroke="#66758A"/><rect class="label-bg" x="748.8" y="275" width="88.4" height="22" rx="11"/><text class="edge-label" x="793" y="291" text-anchor="middle">exercise</text></g>
<g><path class="edge" d="M590 408 L590 439 L590 439 L590 470" stroke="#66758A"/></g>
<g><path class="edge" d="M590 550 L590 571 L590 571 L590 592" stroke="#66758A"/></g>
<g><path class="edge" d="M915 256 L915 424 L590 424 L590 592" stroke="#66758A" stroke-dasharray="8 8"/><rect class="label-bg" x="713.2" y="410" width="79.60000000000001" height="22" rx="11"/><text class="edge-label" x="753" y="426" text-anchor="middle">emulate</text></g></g>
<g id="apps">
  <rect class="card" x="80" y="170" width="310" height="86" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="235" y="201.5" text-anchor="middle">Application code</text>
  <text class="detail" x="235" y="224.5" text-anchor="middle">Kotlin service, Ktor app</text>
<text class="detail" x="235" y="241.5" text-anchor="middle">Spring Boot app</text>
</g>
<g id="tests">
  <rect class="card" x="760" y="170" width="310" height="86" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="915" y="201.5" text-anchor="middle">Verification examples</text>
  <text class="detail" x="915" y="224.5" text-anchor="middle">LocalStack, Floci</text>
<text class="detail" x="915" y="241.5" text-anchor="middle">PostgreSQL Testcontainers</text>
</g>
<g id="api">
  <rect class="card" x="355" y="320" width="470" height="88" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="590" y="361" text-anchor="middle">bluetape4k AWS APIs</text>
  <text class="detail" x="590" y="384" text-anchor="middle">coroutine adapters, templates, plugins, registries</text>
</g>
<g id="sdk">
  <rect class="card" x="405" y="470" width="370" height="80" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="590" y="507" text-anchor="middle">AWS SDKs</text>
  <text class="detail" x="590" y="530" text-anchor="middle">Java SDK v2 and AWS SDK for Kotlin</text>
</g>
<g id="aws">
  <path d="M340 612 C340 588,840 588,840 612 L840 658 C840 682,340 682,340 658 Z" fill="#FFF0E3" stroke="#F47B36" stroke-width="2"/>
  <ellipse cx="590" cy="612" rx="250" ry="20" fill="#FFF0E3" stroke="#F47B36" stroke-width="2"/>
  <text class="card-title" x="590" y="627" text-anchor="middle">AWS services or local emulators</text>
  <text class="detail" x="590" y="650" text-anchor="middle">S3, SQS, SNS, DynamoDB, KMS, SES</text>
<text class="detail" x="590" y="667" text-anchor="middle">CloudWatch, Kinesis, STS, JDBC databases</text>
</g>
<rect class="footer" x="54" y="696" width="1072" height="54" rx="8"/>
<text class="footer-title" x="72" y="725">Architecture role</text>
<text class="footer-detail" x="72" y="745">The same API shape supports production AWS and local integration verification.</text>
</svg>