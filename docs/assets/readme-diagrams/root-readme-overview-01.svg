<text class="detail" x="303" y="623.5" text-anchor="middle">Ktor SigV4, S3, SQS, DynamoDB</text>
</g>
<g id="examples">
  <rect class="card" x="612" y="540" width="410" height="110" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="817" y="583.5" text-anchor="middle">Runnable examples</text>
  <text class="detail" x="817" y="606.5" text-anchor="middle">Ktor and Spring Boot samples</text>
<text class="detail" x="817" y="623.5" text-anchor="middle">LocalStack, Floci, PostgreSQL</text>
</g>
<g id="verification">
  <rect class="card" x="210" y="710" width="280" height="88" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="350" y="751" text-anchor="middle">Local verification</text>
  <text class="detail" x="350" y="774" text-anchor="middle">emulators + Testcontainers</text>
</g>
<g id="services">
  <rect class="card" x="630" y="710" width="300" height="88" rx="10" fill="#FFF0E3" stroke="#F47B36"/>
  <text class="card-title" x="780" y="742.5" text-anchor="middle">AWS service surface</text>
