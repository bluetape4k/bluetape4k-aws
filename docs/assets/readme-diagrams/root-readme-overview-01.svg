</g>
<g>
  <rect x="840" y="54" width="132" height="24" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="chip" x="906" y="70" text-anchor="middle">Spring Boot 4</text>
</g>
<g>
  <rect x="748" y="54" width="76" height="24" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="chip" x="786" y="70" text-anchor="middle">Ktor 3</text>
</g>
