<g id="apps">
  <rect class="card" x="350" y="138" width="420" height="82" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="560" y="176" text-anchor="middle">Kotlin application surfaces</text>
  <text class="detail" x="560" y="199" text-anchor="middle">plain services, Spring Boot 4, Ktor 3</text>
</g>
<g id="bom">
  <rect class="card" x="430" y="268" width="260" height="74" rx="10" fill="#F4F7FA" stroke="#8CA0B3"/>
  <text class="card-title" x="560" y="302" text-anchor="middle">BOM</text>
  <text class="detail" x="560" y="325" text-anchor="middle">version alignment</text>
</g>
<g id="modules">
  <rect class="card" x="310" y="390" width="500" height="92" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="560" y="424.5" text-anchor="middle">Runtime modules</text>
  <text class="detail" x="560" y="447.5" text-anchor="middle">aws-java, aws-kotlin, aws-exposed</text>
<text class="detail" x="560" y="464.5" text-anchor="middle">aws-spring-boot, aws-ktor</text>
</g>
<g id="integrations">
