<text class="detail" x="780" y="782.5" text-anchor="middle">KMS, SES, CloudWatch, Kinesis, STS</text>
</g>
<rect class="footer" x="54" y="876" width="1012" height="54" rx="8"/>
<text class="footer-title" x="72" y="895" dominant-baseline="middle">Repository role</text>
<text class="footer-detail" x="72" y="913" dominant-baseline="middle">One AWS integration stack with local emulator verification and published BOM alignment.</text>
