<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-label="S3 Access Grants flow">
<defs>
  <marker id="arrow-setup" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#66758A"/></marker>
  <marker id="arrow-read" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#2F9E62"/></marker>
  <marker id="arrow-list" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#4C7FD9"/></marker>
  <marker id="arrow-admin" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#D79528"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.18"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail,.layer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .layer{stroke-width:1.4;opacity:0.95}
  .layer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#102033}
  .layer-detail{font-size:11px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:12px}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;font-weight:700}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1}
  .legend-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:14px;fill:#102033}
  .legend-text{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#526274}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="1448" height="878" rx="14" class="frame"/>
<text class="title" x="54" y="72">S3 Access Grants flow</text>
<text class="subtitle" x="56" y="102">Distinct setup, read, list, and admin paths keep the Spring API boundary explicit.</text>
<g>
  <rect class="layer" x="62.0" y="164.0" width="1376.0" height="92.0" rx="10" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text class="layer-title" x="84.0" y="200.0" dominant-baseline="middle">Opt-in setup</text>
  <text class="layer-detail" x="84.0" y="224.0" dominant-baseline="middle">property gate</text>
</g>
<g>
  <rect class="layer" x="62.0" y="280.0" width="1376.0" height="154.0" rx="10" fill="#F4FBF6" stroke="#CDEDD7"/>
  <text class="layer-title" x="84.0" y="347.0" dominant-baseline="middle">Read/data access</text>
  <text class="layer-detail" x="84.0" y="371.0" dominant-baseline="middle">temporary credentials</text>
</g>
<g>
  <rect class="layer" x="62.0" y="458.0" width="1376.0" height="138.0" rx="10" fill="#F6FAFF" stroke="#D7E8FF"/>
  <text class="layer-title" x="84.0" y="517.0" dominant-baseline="middle">List/discover</text>
  <text class="layer-detail" x="84.0" y="541.0" dominant-baseline="middle">grant/location queries</text>
</g>
<g>
  <rect class="layer" x="62.0" y="620.0" width="1376.0" height="108.0" rx="10" fill="#FFF9EA" stroke="#F1D99B"/>
  <text class="layer-title" x="84.0" y="664.0" dominant-baseline="middle">Admin escape hatch</text>
  <text class="layer-detail" x="84.0" y="688.0" dominant-baseline="middle">raw S3 Control clients</text>
</g>
<g id="route-setup1"><path class="edge" d="M550.0 208.0 L600.0 208.0 L600.0 208.0 L650.0 208.0" stroke="#66758A" marker-end="url(#arrow-setup)"/><rect class="label-bg" x="563.0" y="176.0" width="74.0" height="24" rx="12"/><text class="edge-label" x="600.0" y="189.0" text-anchor="middle" dominant-baseline="middle" fill="#66758A">bind</text></g>
<g id="route-setup2"><path class="edge" d="M930.0 208.0 L980.0 208.0 L980.0 208.0 L1030.0 208.0" stroke="#66758A" marker-end="url(#arrow-setup)"/><rect class="label-bg" x="943.0" y="176.0" width="74.0" height="24" rx="12"/><text class="edge-label" x="980.0" y="189.0" text-anchor="middle" dominant-baseline="middle" fill="#66758A">create</text></g>
<g id="route-read1"><path class="edge" d="M550.0 358.0 L600.0 358.0 L600.0 358.0 L650.0 358.0" stroke="#2F9E62" marker-end="url(#arrow-read)"/><rect class="label-bg" x="563.0" y="325.0" width="74.0" height="24" rx="12"/><text class="edge-label" x="600.0" y="338.0" text-anchor="middle" dominant-baseline="middle" fill="#2F9E62">request</text></g>
<g id="route-read2"><path class="edge" d="M930.0 358.0 L980.0 358.0 L980.0 358.0 L1030.0 358.0" stroke="#2F9E62" marker-end="url(#arrow-read)"/><rect class="label-bg" x="923.2" y="325.0" width="113.6" height="24" rx="12"/><text class="edge-label" x="980.0" y="338.0" text-anchor="middle" dominant-baseline="middle" fill="#2F9E62">getDataAccess</text></g>
<g id="route-list1"><path class="edge" d="M550.0 528.0 L600.0 528.0 L600.0 528.0 L650.0 528.0" stroke="#4C7FD9" marker-end="url(#arrow-list)"/><rect class="label-bg" x="563.0" y="496.0" width="74.0" height="24" rx="12"/><text class="edge-label" x="600.0" y="509.0" text-anchor="middle" dominant-baseline="middle" fill="#4C7FD9">query</text></g>
<g id="route-list2"><path class="edge" d="M930.0 528.0 L980.0 528.0 L980.0 528.0 L1030.0 528.0" stroke="#4C7FD9" marker-end="url(#arrow-list)"/><rect class="label-bg" x="943.0" y="496.0" width="74.0" height="24" rx="12"/><text class="edge-label" x="980.0" y="509.0" text-anchor="middle" dominant-baseline="middle" fill="#4C7FD9">list*</text></g>
<g id="route-admin1"><path class="edge" d="M550.0 674.0 L600.0 674.0 L600.0 674.0 L650.0 674.0" stroke="#D79528" marker-end="url(#arrow-admin)" stroke-dasharray="8 7"/><rect class="label-bg" x="563.0" y="642.0" width="74.0" height="24" rx="12"/><text class="edge-label" x="600.0" y="655.0" text-anchor="middle" dominant-baseline="middle" fill="#D79528">raw SDK</text></g>
<g id="route-admin2"><path class="edge" d="M930.0 674.0 L980.0 674.0 L980.0 674.0 L1030.0 674.0" stroke="#D79528" marker-end="url(#arrow-admin)" stroke-dasharray="8 7"/><rect class="label-bg" x="934.0" y="642.0" width="92.0" height="24" rx="12"/><text class="edge-label" x="980.0" y="655.0" text-anchor="middle" dominant-baseline="middle" fill="#D79528">admin APIs</text></g>
<g id="route-client-read"><path class="edge" d="M1170.0 238.0 L1170.0 276.0 L1170.0 276.0 L1170.0 324.0" stroke="#66758A" marker-end="url(#arrow-setup)"/></g>
<g id="route-client-list"><path class="edge" d="M1170.0 392.0 L1170.0 442.0 L1170.0 442.0 L1170.0 496.0" stroke="#4C7FD9" marker-end="url(#arrow-list)"/></g>
<g id="props">
  <rect class="card" x="300.0" y="178.0" width="250.0" height="60.0" rx="9" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="425.0" y="198.0" text-anchor="middle" dominant-baseline="middle">access-grants.enabled</text>
<text class="detail" x="425.0" y="218.0" text-anchor="middle" dominant-baseline="middle">true</text>
</g>
<g id="auto">
  <rect class="card" x="650.0" y="178.0" width="280.0" height="60.0" rx="9" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="790.0" y="198.0" text-anchor="middle" dominant-baseline="middle">Auto-configuration</text>
<text class="detail" x="790.0" y="218.0" text-anchor="middle" dominant-baseline="middle">S3 Control beans</text>
</g>
<g id="clients">
  <rect class="card" x="1030.0" y="178.0" width="280.0" height="60.0" rx="9" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="1170.0" y="198.0" text-anchor="middle" dominant-baseline="middle">S3 Control clients</text>
<text class="detail" x="1170.0" y="218.0" text-anchor="middle" dominant-baseline="middle">sync + async</text>
</g>
<g id="service">
  <rect class="card" x="300.0" y="324.0" width="250.0" height="68.0" rx="9" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="425.0" y="348.0" text-anchor="middle" dominant-baseline="middle">Application service</text>
<text class="detail" x="425.0" y="368.0" text-anchor="middle" dominant-baseline="middle">needs S3 access</text>
</g>
<g id="ops">
  <rect class="card" x="650.0" y="324.0" width="280.0" height="68.0" rx="9" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="790.0" y="348.0" text-anchor="middle" dominant-baseline="middle">Operations</text>
<text class="detail" x="790.0" y="368.0" text-anchor="middle" dominant-baseline="middle">getDataAccess</text>
</g>
<g id="grant">
  <rect class="card" x="1030.0" y="324.0" width="280.0" height="68.0" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="1170.0" y="348.0" text-anchor="middle" dominant-baseline="middle">Access Grants</text>
<text class="detail" x="1170.0" y="368.0" text-anchor="middle" dominant-baseline="middle">returns credentials</text>
</g>
<g id="query">
  <rect class="card" x="300.0" y="496.0" width="250.0" height="64.0" rx="9" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="425.0" y="518.0" text-anchor="middle" dominant-baseline="middle">List request</text>
<text class="detail" x="425.0" y="538.0" text-anchor="middle" dominant-baseline="middle">caller/grants/locations</text>
</g>
<g id="listops">
  <rect class="card" x="650.0" y="496.0" width="280.0" height="64.0" rx="9" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="790.0" y="518.0" text-anchor="middle" dominant-baseline="middle">Operations</text>
<text class="detail" x="790.0" y="538.0" text-anchor="middle" dominant-baseline="middle">list* methods</text>
</g>
<g id="results">
  <rect class="card" x="1030.0" y="496.0" width="280.0" height="64.0" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="1170.0" y="518.0" text-anchor="middle" dominant-baseline="middle">S3 Control results</text>
<text class="detail" x="1170.0" y="538.0" text-anchor="middle" dominant-baseline="middle">grants and locations</text>
</g>
<g id="adminsvc">
  <rect class="card" x="300.0" y="644.0" width="250.0" height="60.0" rx="9" fill="#FFF0E3" stroke="#F47B36"/>
  <text class="card-title" x="425.0" y="664.0" text-anchor="middle" dominant-baseline="middle">Admin service</text>
<text class="detail" x="425.0" y="684.0" text-anchor="middle" dominant-baseline="middle">create/update/delete</text>
</g>
<g id="raw">
  <rect class="card" x="650.0" y="644.0" width="280.0" height="60.0" rx="9" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="790.0" y="664.0" text-anchor="middle" dominant-baseline="middle">Raw clients</text>
<text class="detail" x="790.0" y="684.0" text-anchor="middle" dominant-baseline="middle">not wrapped by ops</text>
</g>
<g id="control">
  <rect class="card" x="1030.0" y="644.0" width="280.0" height="60.0" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="1170.0" y="664.0" text-anchor="middle" dominant-baseline="middle">AWS control plane</text>
<text class="detail" x="1170.0" y="684.0" text-anchor="middle" dominant-baseline="middle">account management</text>
</g>
<g>
  <text class="legend-title" x="130" y="766">Semantic routes</text>
  <path class="edge" d="M130 788 L190 788" stroke="#66758A" marker-end="url(#arrow-setup)"/><text class="legend-text" x="202" y="788" dominant-baseline="middle">setup / bean creation</text>
  <path class="edge" d="M420 788 L480 788" stroke="#2F9E62" marker-end="url(#arrow-read)"/><text class="legend-text" x="492" y="788" dominant-baseline="middle">credential request</text>
  <path class="edge" d="M710 788 L770 788" stroke="#4C7FD9" marker-end="url(#arrow-list)"/><text class="legend-text" x="782" y="788" dominant-baseline="middle">list/discover</text>
  <path class="edge" d="M970 788 L1030 788" stroke="#D79528" stroke-dasharray="8 7" marker-end="url(#arrow-admin)"/><text class="legend-text" x="1042" y="788" dominant-baseline="middle">admin escape hatch</text>
</g>
<rect class="footer" x="62" y="830" width="1376" height="54" rx="8"/>
<text class="footer-title" x="84" y="849" dominant-baseline="middle">Flow boundary</text>
<text class="footer-detail" x="84" y="867" dominant-baseline="middle">The wrapped operations stay read/data-access focused; account administration stays on the raw S3 Control clients.</text>
</svg>