<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-label="AWS component map">
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail,.tiny{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .tiny{font-size:10px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>

<defs>
  <marker id="arrow-core" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#3B82F6"/></marker>
  <marker id="arrow-config" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#14B8A6"/></marker>
  <marker id="arrow-verify" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#D6A441"/></marker>
  <marker id="arrow-runtime" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#F97316"/></marker>
</defs>
<rect x="26" y="26" width="1548" height="888" rx="14" class="frame"/>
<text class="title" x="54" y="72">AWS component map</text>
<text class="subtitle" x="56" y="104">Layered view from application entrypoints through framework adapters, shared foundations, and runtime targets.</text>
<g><rect x="1100" y="54" width="120" height="24" rx="12" fill="#E8F3FF" stroke="#3B82F6"/><text class="chip" x="1160.0" y="66" text-anchor="middle" dominant-baseline="middle">core flow</text></g>
<g><rect x="1235" y="54" width="116" height="24" rx="12" fill="#E9F7F6" stroke="#14B8A6"/><text class="chip" x="1293.0" y="66" text-anchor="middle" dominant-baseline="middle">config</text></g>
<g><rect x="1365" y="54" width="86" height="24" rx="12" fill="#FFF3D9" stroke="#D6A441"/><text class="chip" x="1408.0" y="66" text-anchor="middle" dominant-baseline="middle">verify</text></g>
<g><rect x="1465" y="54" width="86" height="24" rx="12" fill="#FFF7ED" stroke="#F97316"/><text class="chip" x="1508.0" y="66" text-anchor="middle" dominant-baseline="middle">runtime</text></g>
<rect x="54" y="135" width="1492" height="135" rx="10" fill="#F8FBFF" stroke="#DBEAFE"/>
<text class="chip" x="74" y="160">Application and examples</text>
<rect x="54" y="300" width="1492" height="165" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
<text class="chip" x="74" y="325">Framework adapters</text>
<rect x="54" y="510" width="1492" height="170" rx="10" fill="#F0FDF4" stroke="#BBF7D0"/>
<text class="chip" x="74" y="535">Shared foundations</text>
<rect x="54" y="730" width="1492" height="160" rx="10" fill="#FFF7ED" stroke="#FED7AA"/>
<text class="chip" x="74" y="755">Runtime targets</text>
<g id="routes">
<path class="edge" d="M 310.0 248.0 L 310.0 335.0" stroke="#3B82F6" marker-end="url(#arrow-core)"/>
<path class="edge" d="M 510.0 230.0 L 620.0 360.0" stroke="#3B82F6" marker-end="url(#arrow-core)"/>
<path class="edge" d="M 330.0 443.0 L 330.0 545.0" stroke="#3B82F6" marker-end="url(#arrow-core)"/>
<path class="edge" d="M 620.0 405.0 L 500.0 575.0" stroke="#3B82F6" marker-end="url(#arrow-core)"/>
<path class="edge" d="M 790.0 443.0 L 790.0 545.0" stroke="#3B82F6" marker-end="url(#arrow-core)"/>
<path class="edge" d="M 1080.0 405.0 L 960.0 575.0" stroke="#3B82F6" marker-end="url(#arrow-core)"/>
<path class="edge" d="M 1250.0 443.0 L 1250.0 545.0" stroke="#14B8A6" marker-end="url(#arrow-config)"/>
<path class="edge" d="M 500.0 350.0 L 1040.0 205.0" stroke="#D6A441" marker-end="url(#arrow-verify)"/>
<path class="edge" d="M 1120.0 335.0 L 1120.0 248.0" stroke="#D6A441" marker-end="url(#arrow-verify)"/>
<path class="edge" d="M 340.0 657.0 L 340.0 765.0" stroke="#F97316" marker-end="url(#arrow-runtime)"/>
<path class="edge" d="M 790.0 657.0 L 720.0 765.0" stroke="#F97316" marker-end="url(#arrow-runtime)"/>
<path class="edge" d="M 1250.0 657.0 L 1250.0 765.0" stroke="#F97316" marker-end="url(#arrow-runtime)"/>
</g>
<g id="app">
  <rect class="card" x="180" y="160" width="330" height="88" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="345.0" y="192.0" text-anchor="middle" dominant-baseline="middle">Application code</text>
  <text class="detail" x="345.0" y="216.0" text-anchor="middle" dominant-baseline="middle">Kotlin services and Ktor routes</text>
  <text class="detail" x="345.0" y="234.0" text-anchor="middle" dominant-baseline="middle">Spring components</text>
</g>
<g id="examples">
  <rect class="card" x="1040" y="160" width="360" height="88" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="card-title" x="1220.0" y="192.0" text-anchor="middle" dominant-baseline="middle">examples</text>
  <text class="detail" x="1220.0" y="216.0" text-anchor="middle" dominant-baseline="middle">Ktor + Spring Boot</text>
  <text class="detail" x="1220.0" y="234.0" text-anchor="middle" dominant-baseline="middle">Floci, LocalStack, PostgreSQL</text>
</g>
<g id="spring">
  <rect class="card" x="160" y="335" width="340" height="108" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="330.0" y="368.0" text-anchor="middle" dominant-baseline="middle">aws-spring-boot</text>
  <text class="detail" x="330.0" y="392.0" text-anchor="middle" dominant-baseline="middle">auto-configuration</text>
  <text class="detail" x="330.0" y="410.0" text-anchor="middle" dominant-baseline="middle">S3 Vectors, SQS/SNS/KMS</text>
  <text class="detail" x="330.0" y="428.0" text-anchor="middle" dominant-baseline="middle">property sources</text>
</g>
<g id="ktor">
  <rect class="card" x="1080" y="335" width="340" height="108" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="1250.0" y="368.0" text-anchor="middle" dominant-baseline="middle">aws-ktor</text>
  <text class="detail" x="1250.0" y="392.0" text-anchor="middle" dominant-baseline="middle">SigV4 plugin</text>
  <text class="detail" x="1250.0" y="410.0" text-anchor="middle" dominant-baseline="middle">S3 Vectors and SQS runtimes</text>
  <text class="detail" x="1250.0" y="428.0" text-anchor="middle" dominant-baseline="middle">DynamoDB and Exposed adapters</text>
</g>
<g id="sigv4">
  <rect class="card" x="620" y="335" width="340" height="108" rx="10" fill="#FFF7ED" stroke="#F97316"/>
  <text class="card-title" x="790.0" y="368.0" text-anchor="middle" dominant-baseline="middle">SigV4 and defaults</text>
  <text class="detail" x="790.0" y="392.0" text-anchor="middle" dominant-baseline="middle">AwsKtorCore</text>
  <text class="detail" x="790.0" y="410.0" text-anchor="middle" dominant-baseline="middle">client factories</text>
  <text class="detail" x="790.0" y="428.0" text-anchor="middle" dominant-baseline="middle">customizers</text>
</g>
<g id="java">
  <rect class="card" x="160" y="545" width="340" height="112" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="330.0" y="580.0" text-anchor="middle" dominant-baseline="middle">aws-java</text>
  <text class="detail" x="330.0" y="604.0" text-anchor="middle" dominant-baseline="middle">Java SDK v2 wrappers</text>
  <text class="detail" x="330.0" y="622.0" text-anchor="middle" dominant-baseline="middle">CompletableFuture.await</text>
  <text class="detail" x="330.0" y="640.0" text-anchor="middle" dominant-baseline="middle">S3 Vectors opt-in</text>
</g>
<g id="kotlin">
  <rect class="card" x="620" y="545" width="340" height="112" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="790.0" y="589.0" text-anchor="middle" dominant-baseline="middle">aws-kotlin</text>
  <text class="detail" x="790.0" y="613.0" text-anchor="middle" dominant-baseline="middle">native suspend clients</text>
  <text class="detail" x="790.0" y="631.0" text-anchor="middle" dominant-baseline="middle">DSL helpers</text>
</g>
<g id="exposed">
  <rect class="card" x="1080" y="545" width="340" height="112" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="1250.0" y="580.0" text-anchor="middle" dominant-baseline="middle">aws-exposed</text>
  <text class="detail" x="1250.0" y="604.0" text-anchor="middle" dominant-baseline="middle">database registry</text>
  <text class="detail" x="1250.0" y="622.0" text-anchor="middle" dominant-baseline="middle">RDS IAM auth</text>
  <text class="detail" x="1250.0" y="640.0" text-anchor="middle" dominant-baseline="middle">Secrets and Parameter paths</text>
</g>
<g id="services">
  <rect class="card" x="150" y="765" width="760" height="104" rx="10" fill="#FFF7ED" stroke="#F97316"/>
  <text class="card-title" x="530.0" y="796.0" text-anchor="middle" dominant-baseline="middle">AWS or emulator services</text>
  <text class="detail" x="530.0" y="820.0" text-anchor="middle" dominant-baseline="middle">S3, S3 Vectors, SQS/SNS</text>
  <text class="detail" x="530.0" y="838.0" text-anchor="middle" dominant-baseline="middle">DynamoDB, KMS, SES</text>
  <text class="detail" x="530.0" y="856.0" text-anchor="middle" dominant-baseline="middle">CloudWatch, Kinesis, STS</text>
</g>
<g id="stores">
  <rect class="card" x="1030" y="765" width="390" height="104" rx="10" fill="#F8FAFC" stroke="#64748B"/>
  <text class="card-title" x="1225.0" y="805.0" text-anchor="middle" dominant-baseline="middle">JDBC stores and config</text>
  <text class="detail" x="1225.0" y="829.0" text-anchor="middle" dominant-baseline="middle">RDS IAM, Secrets Manager</text>
  <text class="detail" x="1225.0" y="847.0" text-anchor="middle" dominant-baseline="middle">Parameter Store, PostgreSQL</text>
</g>
</svg>