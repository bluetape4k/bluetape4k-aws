<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="790" viewBox="0 0 1500 790" role="img" aria-label="AWS component map">
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail,.tiny{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .tiny{font-size:10px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>

<defs>
  <marker id="arrow-core" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#3B82F6"/></marker>
  <marker id="arrow-config" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#14B8A6"/></marker>
  <marker id="arrow-verify" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#D6A441"/></marker>
</defs>
<rect x="26" y="26" width="1448" height="738" rx="14" class="frame"/>
<text class="title" x="54" y="72">AWS component map</text>
<text class="subtitle" x="56" y="104">Core SDK wrappers feed framework modules and examples without forcing one application stack.</text>
<g><rect x="1095" y="54" width="120" height="24" rx="12" fill="#E8F3FF" stroke="#3B82F6"/><text class="chip" x="1155.0" y="66" text-anchor="middle" dominant-baseline="middle">core flow</text></g>
<g><rect x="1230" y="54" width="116" height="24" rx="12" fill="#E9F7F6" stroke="#14B8A6"/><text class="chip" x="1288.0" y="66" text-anchor="middle" dominant-baseline="middle">config</text></g>
<g><rect x="1360" y="54" width="86" height="24" rx="12" fill="#FFF3D9" stroke="#D6A441"/><text class="chip" x="1403.0" y="66" text-anchor="middle" dominant-baseline="middle">verify</text></g>
<g id="routes">
<path class="edge" d="M 370.0 244.0 L 485.0 244.0 L 485.0 306.0 L 590.0 306.0" stroke="#3B82F6" marker-end="url(#arrow-core)"/>
<path class="edge" d="M 370.0 267.0 L 455.0 267.0 L 455.0 505.0 L 560.0 505.0" stroke="#3B82F6" marker-end="url(#arrow-core)"/>
<path class="edge" d="M 415.0 396.0 L 515.0 396.0 L 515.0 340.0 L 590.0 340.0" stroke="#3B82F6" marker-end="url(#arrow-core)"/>
<path class="edge" d="M 415.0 427.0 L 505.0 427.0 L 505.0 540.0 L 560.0 540.0" stroke="#3B82F6" marker-end="url(#arrow-core)"/>
<path class="edge" d="M 415.0 548.0 L 480.0 548.0 L 480.0 355.0 L 590.0 355.0" stroke="#14B8A6" marker-end="url(#arrow-config)"/>
<path class="edge" d="M 415.0 590.0 L 515.0 590.0 L 515.0 570.0 L 560.0 570.0" stroke="#14B8A6" marker-end="url(#arrow-config)"/>
<path class="edge" d="M 940.0 306.0 L 1020.0 306.0 L 1020.0 410.0 L 1085.0 410.0" stroke="#D6A441" marker-end="url(#arrow-verify)"/>
<path class="edge" d="M 910.0 540.0 L 1020.0 540.0 L 1020.0 455.0 L 1085.0 455.0" stroke="#D6A441" marker-end="url(#arrow-verify)"/>
</g>
<g id="java">
  <rect class="card" x="80" y="185" width="290" height="118" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="225.0" y="223.0" text-anchor="middle" dominant-baseline="middle">aws-java</text>
  <text class="detail" x="225.0" y="247.0" text-anchor="middle" dominant-baseline="middle">Java SDK v2 wrappers</text>
  <text class="detail" x="225.0" y="265.0" text-anchor="middle" dominant-baseline="middle">CompletableFuture.await</text>
  <text class="detail" x="225.0" y="283.0" text-anchor="middle" dominant-baseline="middle">S3 Vectors opt-in</text>
</g>
<g id="kotlin">
  <rect class="card" x="125" y="350" width="290" height="118" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="270.0" y="397.0" text-anchor="middle" dominant-baseline="middle">aws-kotlin</text>
  <text class="detail" x="270.0" y="421.0" text-anchor="middle" dominant-baseline="middle">native suspend clients</text>
  <text class="detail" x="270.0" y="439.0" text-anchor="middle" dominant-baseline="middle">DSL helpers</text>
</g>
<g id="exposed">
  <rect class="card" x="80" y="515" width="335" height="118" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="247.5" y="553.0" text-anchor="middle" dominant-baseline="middle">aws-exposed</text>
  <text class="detail" x="247.5" y="577.0" text-anchor="middle" dominant-baseline="middle">database registry</text>
  <text class="detail" x="247.5" y="595.0" text-anchor="middle" dominant-baseline="middle">RDS IAM auth</text>
  <text class="detail" x="247.5" y="613.0" text-anchor="middle" dominant-baseline="middle">Secrets and Parameter paths</text>
</g>
<g id="spring">
  <rect class="card" x="590" y="240" width="350" height="132" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="765.0" y="285.0" text-anchor="middle" dominant-baseline="middle">aws-spring-boot</text>
  <text class="detail" x="765.0" y="309.0" text-anchor="middle" dominant-baseline="middle">auto-configuration</text>
  <text class="detail" x="765.0" y="327.0" text-anchor="middle" dominant-baseline="middle">S3 Vectors, SQS/SNS/KMS</text>
  <text class="detail" x="765.0" y="345.0" text-anchor="middle" dominant-baseline="middle">property sources</text>
</g>
<g id="ktor">
  <rect class="card" x="560" y="455" width="350" height="132" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="735.0" y="500.0" text-anchor="middle" dominant-baseline="middle">aws-ktor</text>
  <text class="detail" x="735.0" y="524.0" text-anchor="middle" dominant-baseline="middle">SigV4 plugin</text>
  <text class="detail" x="735.0" y="542.0" text-anchor="middle" dominant-baseline="middle">S3 Vectors and SQS runtimes</text>
  <text class="detail" x="735.0" y="560.0" text-anchor="middle" dominant-baseline="middle">DynamoDB and Exposed adapters</text>
</g>
<g id="examples">
  <rect class="card" x="1085" y="350" width="335" height="132" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="card-title" x="1252.5" y="395.0" text-anchor="middle" dominant-baseline="middle">examples</text>
  <text class="detail" x="1252.5" y="419.0" text-anchor="middle" dominant-baseline="middle">Ktor + Spring Boot</text>
  <text class="detail" x="1252.5" y="437.0" text-anchor="middle" dominant-baseline="middle">Floci, LocalStack, PostgreSQL</text>
  <text class="detail" x="1252.5" y="455.0" text-anchor="middle" dominant-baseline="middle">consumer scenario checks</text>
</g>
<rect class="footer" x="54" y="690" width="1392" height="54" rx="8"/>
<text class="footer-title" x="72" y="713" dominant-baseline="middle">Component role</text>
<text class="footer-detail" x="72" y="733" dominant-baseline="middle">Keep SDK wrappers small, place framework behavior in framework modules, verify with examples and emulator-backed scenarios.</text>
</svg>