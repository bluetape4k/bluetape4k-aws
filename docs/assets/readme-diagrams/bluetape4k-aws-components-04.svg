<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="710" viewBox="0 0 1280 710" role="img" aria-label="AWS component map">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="1228" height="658" rx="14" class="frame"/>
<text class="title" x="54" y="72">AWS component map</text>
<text class="subtitle" x="56" y="102">Core SDK wrappers feed framework modules and examples without forcing one application stack.</text>
<g>
  <rect x="1152" y="54" width="72" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="chip" x="1188" y="70" text-anchor="middle">Core</text>
</g>
<g>
  <rect x="1028" y="54" width="108" height="24" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="chip" x="1082" y="70" text-anchor="middle">Frameworks</text>
</g>
<g>
  <rect x="920" y="54" width="92" height="24" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="chip" x="966" y="70" text-anchor="middle">Examples</text>
</g>
<g><g><path class="edge" d="M183.5 280 L266 280 L266 380 L348 380" stroke="#66758A"/></g>
<g><path class="edge" d="M487.5 280 L584 280 L584 380 L680 380" stroke="#66758A"/></g>
<g><path class="edge" d="M674 230 L674 333 L478 333 L478 436" stroke="#66758A"/></g>
<g><path class="edge" d="M791.5 280 L736 280 L736 380 L680 380" stroke="#66758A"/></g>
<g><path class="edge" d="M478 436 L680 436 L680 436 L882 436" stroke="#66758A"/></g>
<g><path class="edge" d="M810 436 L846 436 L846 436 L882 436" stroke="#66758A"/></g></g>
<g id="java">
  <rect class="card" x="66" y="180" width="235" height="100" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="183.5" y="218.5" text-anchor="middle">aws-java</text>
  <text class="detail" x="183.5" y="241.5" text-anchor="middle">Java SDK v2 builders</text>
<text class="detail" x="183.5" y="258.5" text-anchor="middle">CompletableFuture.await</text>
</g>
<g id="kotlin">
  <rect class="card" x="370" y="180" width="235" height="100" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="487.5" y="218.5" text-anchor="middle">aws-kotlin</text>
  <text class="detail" x="487.5" y="241.5" text-anchor="middle">native suspend clients</text>
<text class="detail" x="487.5" y="258.5" text-anchor="middle">DSL helpers</text>
</g>
<g id="exposed">
  <rect class="card" x="674" y="180" width="235" height="100" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="791.5" y="218.5" text-anchor="middle">aws-exposed</text>
  <text class="detail" x="791.5" y="241.5" text-anchor="middle">database registry</text>
<text class="detail" x="791.5" y="258.5" text-anchor="middle">settings resolver</text>
</g>
<g id="spring">
  <rect class="card" x="218" y="380" width="260" height="112" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="348" y="424.5" text-anchor="middle">aws-spring-boot</text>
  <text class="detail" x="348" y="447.5" text-anchor="middle">S3/SQS/SNS/KMS ops</text>
<text class="detail" x="348" y="464.5" text-anchor="middle">auto-configuration</text>
</g>
<g id="ktor">
  <rect class="card" x="550" y="380" width="260" height="112" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="680" y="424.5" text-anchor="middle">aws-ktor</text>
  <text class="detail" x="680" y="447.5" text-anchor="middle">SigV4 plugin</text>
<text class="detail" x="680" y="464.5" text-anchor="middle">S3/SQS/DynamoDB runtime</text>
</g>
<g id="examples">
  <rect class="card" x="882" y="380" width="300" height="112" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="card-title" x="1032" y="424.5" text-anchor="middle">examples</text>
  <text class="detail" x="1032" y="447.5" text-anchor="middle">Ktor + Spring Boot</text>
<text class="detail" x="1032" y="464.5" text-anchor="middle">LocalStack, Floci, PostgreSQL</text>
</g>
<rect class="footer" x="54" y="606" width="1172" height="54" rx="8"/>
<text class="footer-title" x="72" y="635">Component role</text>
<text class="footer-detail" x="72" y="655">Keep SDK wrappers small, place framework behavior in framework modules, verify with examples.</text>
</svg>