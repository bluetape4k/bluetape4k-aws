<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="920" viewBox="0 0 1120 920" role="img" aria-label="KMS encrypt / decrypt flow">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="1068" height="868" rx="14" class="frame"/>
<text class="title" x="54" y="72">KMS encrypt / decrypt flow</text>
<text class="subtitle" x="56" y="102">Small secrets use direct KMS encrypt; larger payloads use generated data keys and local crypto.</text>
<g>
  <rect x="988" y="54" width="76" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="chip" x="1026" y="70" text-anchor="middle">Direct</text>
</g>
<g>
  <rect x="880" y="54" width="92" height="24" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="chip" x="926" y="70" text-anchor="middle">Envelope</text>
</g>
<g>
  <rect x="792" y="54" width="72" height="24" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="chip" x="828" y="70" text-anchor="middle">Cache</text>
</g>
<g><g><path class="edge" d="M410 193 L442 193 L442 193 L710 193" stroke="#66758A"/></g>
<g><path class="edge" d="M410 369 L442 369 L442 369 L710 369" stroke="#66758A"/></g>
<g><path class="edge" d="M870 412 L870 444 L560 444 L560 502" stroke="#66758A"/></g>
<g><path class="edge" d="M250 412 L250 444 L560 444 L560 502" stroke="#66758A"/></g>
<g><path class="edge" d="M560 588 L560 620 L560 620 L560 678" stroke="#66758A"/></g>
<g><path class="edge" d="M1030 193 L1062 193 L1062 724 L720 724" stroke="#66758A" stroke-dasharray="8 8"/><rect class="label-bg" x="773.2" y="710" width="123.60000000000001" height="22" rx="11"/><text class="edge-label" x="835" y="726" text-anchor="middle">small values</text></g></g>
<g id="secret">
  <rect class="card" x="90" y="150" width="320" height="86" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="250" y="190" text-anchor="middle">Small secret</text>
  <text class="detail" x="250" y="213" text-anchor="middle">token, credential, config value</text>
</g>
<g id="direct">
  <rect class="card" x="710" y="150" width="320" height="86" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="870" y="190" text-anchor="middle">KMS encrypt/decrypt</text>
  <text class="detail" x="870" y="213" text-anchor="middle">direct AWS KMS operation</text>
</g>
<g id="payload">
  <rect class="card" x="90" y="326" width="320" height="86" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="250" y="366" text-anchor="middle">Large payload</text>
  <text class="detail" x="250" y="389" text-anchor="middle">object body or document</text>
</g>
<g id="dataKey">
  <rect class="card" x="710" y="326" width="320" height="86" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="870" y="366" text-anchor="middle">Generate data key</text>
  <text class="detail" x="870" y="389" text-anchor="middle">plaintext + encrypted key</text>
</g>
<g id="local">
  <rect class="card" x="400" y="502" width="320" height="86" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="560" y="542" text-anchor="middle">Local envelope crypto</text>
  <text class="detail" x="560" y="565" text-anchor="middle">encrypt payload outside KMS</text>
</g>
<g id="store">
  <rect class="card" x="400" y="678" width="320" height="92" rx="10" fill="#FFF0E3" stroke="#F47B36"/>
  <text class="card-title" x="560" y="712.5" text-anchor="middle">Stored artifact</text>
  <text class="detail" x="560" y="735.5" text-anchor="middle">ciphertext payload</text>
<text class="detail" x="560" y="752.5" text-anchor="middle">encrypted data key metadata</text>
</g>
<rect class="footer" x="54" y="816" width="1012" height="54" rx="8"/>
<text class="footer-title" x="72" y="835" dominant-baseline="middle">Flow role</text>
<text class="footer-detail" x="72" y="853" dominant-baseline="middle">Keep plaintext key material short-lived and store only encrypted data keys with payload metadata.</text>
</svg>