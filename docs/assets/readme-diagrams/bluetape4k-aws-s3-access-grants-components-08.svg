<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="850" viewBox="0 0 1540 850" role="img" aria-label="S3 Access Grants components">
<defs>
  <marker id="arrow-setup" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#66758A"/></marker>
  <marker id="arrow-read" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#2F9E62"/></marker>
  <marker id="arrow-list" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#4C7FD9"/></marker>
  <marker id="arrow-admin" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#D79528"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.18"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail,.layer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .layer{stroke-width:1.4;opacity:0.95}
  .layer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#102033}
  .layer-detail{font-size:11px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:12px}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;font-weight:700}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1}
  .legend-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:14px;fill:#102033}
  .legend-text{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#526274}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="1488" height="798" rx="14" class="frame"/>
<text class="title" x="54" y="72">S3 Access Grants components</text>
<text class="subtitle" x="56" y="102">Layered Spring Boot integration around the optional AWS SDK v2 S3 Control client.</text>
<g>
  <rect class="layer" x="62.0" y="164.0" width="1416.0" height="112.0" rx="10" fill="#F6FAFF" stroke="#D7E8FF"/>
  <text class="layer-title" x="84.0" y="210.0" dominant-baseline="middle">Application layer</text>
  <text class="layer-detail" x="84.0" y="234.0" dominant-baseline="middle">injects operations</text>
</g>
<g>
  <rect class="layer" x="62.0" y="296.0" width="1416.0" height="128.0" rx="10" fill="#FFF9EA" stroke="#F1D99B"/>
  <text class="layer-title" x="84.0" y="350.0" dominant-baseline="middle">Spring Boot layer</text>
  <text class="layer-detail" x="84.0" y="374.0" dominant-baseline="middle">configures templates</text>
</g>
<g>
  <rect class="layer" x="62.0" y="444.0" width="1416.0" height="106.0" rx="10" fill="#F6F1FF" stroke="#DDCEF7"/>
  <text class="layer-title" x="84.0" y="487.0" dominant-baseline="middle">AWS SDK v2 layer</text>
  <text class="layer-detail" x="84.0" y="511.0" dominant-baseline="middle">S3 Control clients</text>
</g>
<g>
  <rect class="layer" x="62.0" y="570.0" width="1416.0" height="122.0" rx="10" fill="#F4FBF6" stroke="#CDEDD7"/>
  <text class="layer-title" x="84.0" y="621.0" dominant-baseline="middle">AWS control plane</text>
  <text class="layer-detail" x="84.0" y="645.0" dominant-baseline="middle">grants and credentials</text>
</g>
<g id="route-inject"><path class="edge" d="M600.0 221.0 L720.0 221.0 L720.0 221.0 L842.0 221.0" stroke="#2F9E62" marker-end="url(#arrow-read)"/><rect class="label-bg" x="683.0" y="189.0" width="74.0" height="24" rx="12"/><text class="edge-label" x="720.0" y="202.0" text-anchor="middle" dominant-baseline="middle" fill="#2F9E62">inject</text></g>
<g id="route-ops-template"><path class="edge" d="M997.0 256.0 L997.0 292.0 L940.0 292.0 L940.0 328.0" stroke="#2F9E62" marker-end="url(#arrow-read)"/></g>
<g id="route-auto-sync"><path class="edge" d="M505.0 404.0 L505.0 436.0 L545.0 436.0 L545.0 466.0" stroke="#66758A" marker-end="url(#arrow-setup)"/><rect class="label-bg" x="509.0" y="423.0" width="74.0" height="24" rx="12"/><text class="edge-label" x="546.0" y="436.0" text-anchor="middle" dominant-baseline="middle" fill="#66758A">beans</text></g>
<g id="route-auto-async"><path class="edge" d="M690.0 366.0 L735.0 366.0 L735.0 498.0 L860.0 498.0" stroke="#66758A" marker-end="url(#arrow-setup)"/></g>
<g id="route-props-auto"><path class="edge" d="M1190.0 366.0 L1162.0 366.0 L1162.0 310.0 L505.0 310.0 L505.0 328.0" stroke="#66758A" marker-end="url(#arrow-setup)"/><rect class="label-bg" x="803.0" y="297.0" width="74.0" height="24" rx="12"/><text class="edge-label" x="840.0" y="310.0" text-anchor="middle" dominant-baseline="middle" fill="#66758A">binds</text></g>
<g id="route-template-async"><path class="edge" d="M940.0 404.0 L940.0 436.0 L995.0 436.0 L995.0 466.0" stroke="#2F9E62" marker-end="url(#arrow-read)"/><rect class="label-bg" x="933.0" y="423.0" width="74.0" height="24" rx="12"/><text class="edge-label" x="970.0" y="436.0" text-anchor="middle" dominant-baseline="middle" fill="#2F9E62">await</text></g>
<g id="route-sync-instance"><path class="edge" d="M545.0 530.0 L545.0 562.0 L450.0 562.0 L450.0 604.0" stroke="#D79528" marker-end="url(#arrow-admin)" stroke-dasharray="8 7"/><rect class="label-bg" x="473.0" y="548.0" width="74.0" height="24" rx="12"/><text class="edge-label" x="510.0" y="561.0" text-anchor="middle" dominant-baseline="middle" fill="#D79528">admin</text></g>
<g id="route-async-grants"><path class="edge" d="M995.0 530.0 L995.0 562.0 L790.0 562.0 L790.0 604.0" stroke="#4C7FD9" marker-end="url(#arrow-list)"/><rect class="label-bg" x="863.0" y="548.0" width="74.0" height="24" rx="12"/><text class="edge-label" x="900.0" y="561.0" text-anchor="middle" dominant-baseline="middle" fill="#4C7FD9">list*</text></g>
<g id="route-async-creds"><path class="edge" d="M1130.0 498.0 L1205.0 498.0 L1205.0 570.0 L1205.0 604.0" stroke="#2F9E62" marker-end="url(#arrow-read)"/><rect class="label-bg" x="1159.2" y="521.0" width="113.6" height="24" rx="12"/><text class="edge-label" x="1216.0" y="534.0" text-anchor="middle" dominant-baseline="middle" fill="#2F9E62">getDataAccess</text></g>
<g id="app">
  <rect class="card" x="330.0" y="186.0" width="270.0" height="70.0" rx="9" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="465.0" y="201.0" text-anchor="middle" dominant-baseline="middle">Application service</text>
<text class="detail" x="465.0" y="221.0" text-anchor="middle" dominant-baseline="middle">requests access</text>
<text class="detail" x="465.0" y="241.0" text-anchor="middle" dominant-baseline="middle">lists grants</text>
</g>
<g id="ops">
  <rect class="card" x="842.0" y="186.0" width="310.0" height="70.0" rx="9" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="997.0" y="201.0" text-anchor="middle" dominant-baseline="middle">S3AccessGrantsOperations</text>
<text class="detail" x="997.0" y="221.0" text-anchor="middle" dominant-baseline="middle">coroutine API</text>
<text class="detail" x="997.0" y="241.0" text-anchor="middle" dominant-baseline="middle">no CompletableFuture leak</text>
</g>
<g id="auto">
  <rect class="card" x="320.0" y="328.0" width="370.0" height="76.0" rx="9" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="505.0" y="346.0" text-anchor="middle" dominant-baseline="middle">S3AccessGrantsAutoConfiguration</text>
<text class="detail" x="505.0" y="366.0" text-anchor="middle" dominant-baseline="middle">enabled property gate</text>
<text class="detail" x="505.0" y="386.0" text-anchor="middle" dominant-baseline="middle">client beans</text>
</g>
<g id="template">
  <rect class="card" x="770.0" y="328.0" width="340.0" height="76.0" rx="9" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="940.0" y="346.0" text-anchor="middle" dominant-baseline="middle">S3AccessGrantsCoroutinesTemplate</text>
<text class="detail" x="940.0" y="366.0" text-anchor="middle" dominant-baseline="middle">awaits async client</text>
<text class="detail" x="940.0" y="386.0" text-anchor="middle" dominant-baseline="middle">read/data-access path</text>
</g>
<g id="props">
  <rect class="card" x="1190.0" y="328.0" width="210.0" height="76.0" rx="9" fill="#FFF0E3" stroke="#F47B36"/>
  <text class="card-title" x="1295.0" y="346.0" text-anchor="middle" dominant-baseline="middle">Properties</text>
<text class="detail" x="1295.0" y="366.0" text-anchor="middle" dominant-baseline="middle">region</text>
<text class="detail" x="1295.0" y="386.0" text-anchor="middle" dominant-baseline="middle">endpoint override</text>
</g>
<g id="sync">
  <rect class="card" x="420.0" y="466.0" width="250.0" height="64.0" rx="9" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="545.0" y="488.0" text-anchor="middle" dominant-baseline="middle">S3ControlClient</text>
<text class="detail" x="545.0" y="508.0" text-anchor="middle" dominant-baseline="middle">raw admin escape hatch</text>
</g>
<g id="async">
  <rect class="card" x="860.0" y="466.0" width="270.0" height="64.0" rx="9" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="card-title" x="995.0" y="488.0" text-anchor="middle" dominant-baseline="middle">S3ControlAsyncClient</text>
<text class="detail" x="995.0" y="508.0" text-anchor="middle" dominant-baseline="middle">async S3 Control calls</text>
</g>
<g id="instance">
  <rect class="card" x="320.0" y="604.0" width="260.0" height="70.0" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="450.0" y="629.0" text-anchor="middle" dominant-baseline="middle">Access Grants instance</text>
<text class="detail" x="450.0" y="649.0" text-anchor="middle" dominant-baseline="middle">account-level boundary</text>
</g>
<g id="grants">
  <rect class="card" x="660.0" y="604.0" width="260.0" height="70.0" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="790.0" y="629.0" text-anchor="middle" dominant-baseline="middle">Grants and locations</text>
<text class="detail" x="790.0" y="649.0" text-anchor="middle" dominant-baseline="middle">list/discover scope</text>
</g>
<g id="credentials">
  <rect class="card" x="1060.0" y="604.0" width="290.0" height="70.0" rx="9" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="1205.0" y="629.0" text-anchor="middle" dominant-baseline="middle">Data access credentials</text>
<text class="detail" x="1205.0" y="649.0" text-anchor="middle" dominant-baseline="middle">temporary S3 access</text>
</g>
<g>
  <text class="legend-title" x="1120" y="724">Route colors</text>
  <path class="edge" d="M1120 746 L1180 746" stroke="#2F9E62" marker-end="url(#arrow-read)"/><text class="legend-text" x="1192" y="746" dominant-baseline="middle">read/data access</text>
  <path class="edge" d="M1120 770 L1180 770" stroke="#4C7FD9" marker-end="url(#arrow-list)"/><text class="legend-text" x="1192" y="770" dominant-baseline="middle">list/discover</text>
  <path class="edge" d="M1120 794 L1180 794" stroke="#D79528" stroke-dasharray="8 7" marker-end="url(#arrow-admin)"/><text class="legend-text" x="1192" y="794" dominant-baseline="middle">admin escape</text>
</g>
<rect class="footer" x="62" y="722" width="980" height="58" rx="8"/>
<text class="footer-title" x="84" y="742" dominant-baseline="middle">Runtime boundary</text>
<text class="footer-detail" x="84" y="762" dominant-baseline="middle">Consumers add the optional s3control runtime dependency before enabling Access Grants.</text>
</svg>