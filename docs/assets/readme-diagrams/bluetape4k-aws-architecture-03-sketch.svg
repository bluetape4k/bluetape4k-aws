<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-label="Kotlin SDK architecture sketch">
<defs>
<marker id="arrow-0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail,.layer-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title,.layer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;fill:#102033}
  .card-title{font-size:19px}
  .layer-title{font-size:22px}
  .detail{font-size:12px}
  .tiny{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#526274}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .layer{stroke-width:1.5;fill:#FFFFFF}
  .edge{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="20" y="20" width="1360" height="860" rx="10" class="frame"/>
<text class="title" x="48" y="70">Kotlin SDK architecture sketch</text>
<g><path class="edge" d="M460.0 244.0 L460.0 292.0 L410.0 292.0 L410.0 340.0" stroke="#5B8DEF" marker-end="url(#arrow-0)"/></g>
<g><path class="edge" d="M460.0 244.0 L460.0 300.0 L670.0 300.0 L670.0 340.0" stroke="#58A978" marker-end="url(#arrow-1)"/></g>
<g><path class="edge" d="M795.0 244.0 L795.0 292.0 L670.0 292.0 L670.0 340.0" stroke="#5B8DEF" marker-end="url(#arrow-0)"/></g>
<g><path class="edge" d="M795.0 244.0 L795.0 300.0 L1190.0 300.0 L1190.0 340.0" stroke="#8A72D6" marker-end="url(#arrow-2)"/></g>
<g><path class="edge" d="M1130.0 244.0 L1130.0 292.0 L930.0 292.0 L930.0 340.0" stroke="#8A72D6" marker-end="url(#arrow-2)"/></g>
<g><path class="edge" d="M410.0 426.0 L410.0 482.0 L520.0 482.0 L520.0 526.0" stroke="#D6A441" marker-end="url(#arrow-3)"/></g>
<g><path class="edge" d="M670.0 426.0 L670.0 482.0 L520.0 482.0 L520.0 526.0" stroke="#58A978" marker-end="url(#arrow-1)"/></g>
<g><path class="edge" d="M930.0 426.0 L930.0 482.0 L990.0 482.0 L990.0 526.0" stroke="#58A978" marker-end="url(#arrow-1)"/></g>
<g><path class="edge" d="M1190.0 426.0 L1190.0 482.0 L990.0 482.0 L990.0 526.0" stroke="#8A72D6" marker-end="url(#arrow-2)"/></g>
<g><path class="edge" d="M520.0 612.0 L520.0 654.0 L540.0 654.0 L540.0 696.0" stroke="#8CA0B3" marker-end="url(#arrow-4)"/></g>
<g><path class="edge" d="M990.0 612.0 L990.0 654.0 L1010.0 654.0 L1010.0 696.0" stroke="#8CA0B3" marker-end="url(#arrow-4)"/></g>
<g id="coroutine_app">
<rect class="card" x="330.0" y="162.0" width="260.0" height="82.0" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="card-title" x="460.0" y="193.0" text-anchor="middle">Coroutine application</text>
<text class="detail" x="460.0" y="217.0" text-anchor="middle">structured concurrency</text>
<text class="detail" x="460.0" y="234.0" text-anchor="middle">suspend workflows</text>
</g>
<g id="ktor_runtime">
<rect class="card" x="665.0" y="162.0" width="260.0" height="82.0" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="card-title" x="795.0" y="193.0" text-anchor="middle">Ktor runtime</text>
<text class="detail" x="795.0" y="217.0" text-anchor="middle">S3 REST</text>
<text class="detail" x="795.0" y="234.0" text-anchor="middle">SQS consumer, DynamoDB</text>
</g>
<g id="examples">
<rect class="card" x="1000.0" y="162.0" width="260.0" height="82.0" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="card-title" x="1130.0" y="193.0" text-anchor="middle">Examples</text>
<text class="detail" x="1130.0" y="217.0" text-anchor="middle">DynamoDB, S3, SQS</text>
<text class="detail" x="1130.0" y="234.0" text-anchor="middle">Exposed scenarios</text>
</g>
<g id="dsl">
<rect class="card" x="300.0" y="340.0" width="220.0" height="86.0" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
<text class="card-title" x="410.0" y="371.0" text-anchor="middle">Suspend request DSL</text>
<text class="detail" x="410.0" y="395.0" text-anchor="middle">typed builders</text>
<text class="detail" x="410.0" y="412.0" text-anchor="middle">attribute mappers</text>
</g>
<g id="clients">
<rect class="card" x="560.0" y="340.0" width="220.0" height="86.0" rx="8" fill="#EAF7EF" stroke="#58A978"/>
<text class="card-title" x="670.0" y="371.0" text-anchor="middle">Client helpers</text>
<text class="detail" x="670.0" y="395.0" text-anchor="middle">DynamoDB, S3, SQS</text>
<text class="detail" x="670.0" y="412.0" text-anchor="middle">SNS, SES/v2, KMS</text>
</g>
<g id="flows">
<rect class="card" x="820.0" y="340.0" width="220.0" height="86.0" rx="8" fill="#EAF7EF" stroke="#58A978"/>
<text class="card-title" x="930.0" y="371.0" text-anchor="middle">Flow adapters</text>
<text class="detail" x="930.0" y="395.0" text-anchor="middle">Kinesis records</text>
<text class="detail" x="930.0" y="412.0" text-anchor="middle">S3 listings</text>
</g>
<g id="engines">
<rect class="card" x="1080.0" y="340.0" width="220.0" height="86.0" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="card-title" x="1190.0" y="371.0" text-anchor="middle">HTTP engines</text>
<text class="detail" x="1190.0" y="395.0" text-anchor="middle">CRT</text>
<text class="detail" x="1190.0" y="412.0" text-anchor="middle">OkHttp</text>
</g>
<g id="smithy">
<rect class="card" x="360.0" y="526.0" width="320.0" height="86.0" rx="8" fill="#F4F7FA" stroke="#8CA0B3"/>
<text class="card-title" x="520.0" y="557.0" text-anchor="middle">AWS SDK for Kotlin</text>
<text class="detail" x="520.0" y="581.0" text-anchor="middle">native suspend clients</text>
<text class="detail" x="520.0" y="598.0" text-anchor="middle">Smithy runtime</text>
</g>
<g id="java_bridge">
<rect class="card" x="830.0" y="526.0" width="320.0" height="86.0" rx="8" fill="#F4F7FA" stroke="#8CA0B3"/>
<text class="card-title" x="990.0" y="557.0" text-anchor="middle">Java SDK bridge</text>
<text class="detail" x="990.0" y="581.0" text-anchor="middle">Ktor SigV4</text>
<text class="detail" x="990.0" y="598.0" text-anchor="middle">S3 CSE and support</text>
</g>
<g id="services">
<rect class="card" x="360.0" y="696.0" width="360.0" height="76.0" rx="8" fill="#FFF0E3" stroke="#F47B36"/>
<text class="card-title" x="540.0" y="727.0" text-anchor="middle">Data services</text>
<text class="detail" x="540.0" y="751.0" text-anchor="middle">DynamoDB, S3, SQS, SNS, SES</text>
</g>
<g id="ops">
<rect class="card" x="830.0" y="696.0" width="360.0" height="76.0" rx="8" fill="#FFF0E3" stroke="#F47B36"/>
<text class="card-title" x="1010.0" y="727.0" text-anchor="middle">Ops services</text>
<text class="detail" x="1010.0" y="751.0" text-anchor="middle">KMS, CloudWatch, Kinesis, STS</text>
</g>
</svg>
