<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-label="Native suspend Kotlin API">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#66758A"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#AAB7C6" flood-opacity="0.20"/></filter>
</defs>
<style>
  svg{background:#F5F7FA}
  .frame{fill:#FFFFFF;stroke:#D9E2EC;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
  .subtitle,.detail,.footer-detail{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#526274}
  .subtitle{font-size:14px}
  .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
  .detail{font-size:13px}
  .chip{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:10px;fill:#243447}
  .card{stroke-width:2;filter:url(#shadow)}
  .edge{fill:none;stroke-width:2.2;marker-end:url(#arrow)}
  .edge-label{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;font-size:11px;fill:#344456}
  .label-bg{fill:#FFFFFF;stroke:#D9E2EC}
  .footer{fill:#0E2238;stroke:#0E2238}
  .footer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#FFFFFF}
  .footer-detail{font-size:11px;fill:#DDE7F2}
</style>
<rect x="26" y="26" width="1228" height="598" rx="14" class="frame"/>
<text class="title" x="54" y="72">Native suspend Kotlin API</text>
<text class="subtitle" x="56" y="102">The Kotlin SDK module keeps suspend clients, DSL builders, and HTTP engines in one coroutine-friendly path.</text>
<g>
  <rect x="1084" y="54" width="140" height="24" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="chip" x="1154" y="70" text-anchor="middle">AWS Kotlin SDK</text>
</g>
<g>
  <rect x="984" y="54" width="84" height="24" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="chip" x="1026" y="70" text-anchor="middle">Suspend</text>
</g>
<g>
  <rect x="896" y="54" width="72" height="24" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="chip" x="932" y="70" text-anchor="middle">DSL</text>
</g>
<g><g><path class="edge" d="M328 281 L360 281 L360 191 L410 191" stroke="#66758A"/></g>
<g><path class="edge" d="M328 281 L360 281 L360 333 L410 333" stroke="#66758A"/></g>
<g><path class="edge" d="M540 232 L540 245 L925 245 L925 258" stroke="#66758A"/></g>
<g><path class="edge" d="M670 333 L702 333 L702 308 L760 308" stroke="#66758A"/></g>
<g><path class="edge" d="M540 434 L540 402 L925 402 L925 358" stroke="#66758A"/></g>
<g><path class="edge" d="M925 358 L925 390 L991 390 L991 438" stroke="#66758A"/></g></g>
<g id="app">
  <rect class="card" x="78" y="238" width="250" height="86" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="203" y="278" text-anchor="middle">Coroutine application</text>
  <text class="detail" x="203" y="301" text-anchor="middle">service code with suspend calls</text>
</g>
<g id="builders">
  <rect class="card" x="410" y="150" width="260" height="82" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="540" y="188" text-anchor="middle">DSL builders</text>
  <text class="detail" x="540" y="211" text-anchor="middle">requests, models, wait helpers</text>
</g>
<g id="suspend">
  <rect class="card" x="410" y="292" width="260" height="82" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="540" y="330" text-anchor="middle">Native suspend calls</text>
  <text class="detail" x="540" y="353" text-anchor="middle">withXClient and service helpers</text>
</g>
<g id="http">
  <rect class="card" x="410" y="434" width="260" height="82" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="540" y="472" text-anchor="middle">HTTP engine support</text>
  <text class="detail" x="540" y="495" text-anchor="middle">CRT or OkHttp where needed</text>
</g>
<g id="clients">
  <rect class="card" x="760" y="258" width="330" height="100" rx="10" fill="#F4F7FA" stroke="#8CA0B3"/>
  <text class="card-title" x="925" y="296.5" text-anchor="middle">AWS SDK for Kotlin clients</text>
  <text class="detail" x="925" y="319.5" text-anchor="middle">DynamoDB, S3, SQS, SNS</text>
<text class="detail" x="925" y="336.5" text-anchor="middle">KMS, CloudWatch, Kinesis, STS</text>
</g>
<g id="aws">
  <rect class="card" x="856" y="438" width="270" height="84" rx="10" fill="#FFF0E3" stroke="#F47B36"/>
  <text class="card-title" x="991" y="477" text-anchor="middle">AWS services</text>
  <text class="detail" x="991" y="500" text-anchor="middle">or LocalStack / Floci</text>
</g>
<rect class="footer" x="54" y="546" width="1172" height="54" rx="8"/>
<text class="footer-title" x="72" y="565" dominant-baseline="middle">API role</text>
<text class="footer-detail" x="72" y="583" dominant-baseline="middle">Native suspend clients avoid Java future bridging for Kotlin-first service integrations.</text>
</svg>