title = "bluetape4k-leader gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allowlisted paths and patterns"

paths = [
    '''.idea/''',
    '''build/''',
    '''.gradle/''',
    '''gradle/wrapper/''',
    '''src/test/resources/''',
    '''docs/''',
    '''README\.md''',
    '''README\.ko\.md''',
    '''.bluetape/''',
    '''.worktrees/''',
]

regexes = [
    '''YOUR_.*_HERE''',
    '''example[-_]key''',
    '''test[-_]api[-_]key''',
    # Kinesis conformance manifest의 고정 SHA-256 redaction test vector입니다.
    '''03f99ad2bb8f470ab4a6b65d''',
]
