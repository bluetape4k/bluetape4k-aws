name: CI

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
  packages: read

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitleaks.toml'
      - '.editorconfig'
      - 'WIP.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitleaks.toml'
      - '.editorconfig'
      - 'WIP.md'
      - 'CHANGELOG.md'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  GITLEAKS_VERSION: '8.30.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BLUETAPE4K_DEPENDENCIES_CATALOG_REF: '91f9ea9336b5ea991f5675323a1cf25ccfd6f5ed'
  # Retry once only for classified emulator/infra failures; preserve first-failure evidence.
  BLUETAPE4K_RETRY_MAX_ATTEMPTS: '2'
  BLUETAPE4K_RETRY_DELAY_SECONDS: '15'

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail

          GITLEAKS_ASSET_URL=$(
            curl -sSfL "https://api.github.com/repos/gitleaks/gitleaks/releases/tags/v${GITLEAKS_VERSION}" \
              | jq -r '.assets[] | select(.name | test("linux_x64\\.tar\\.gz$")) | .browser_download_url' \
              | head -n 1
          )
          test -n "${GITLEAKS_ASSET_URL}"
          test "${GITLEAKS_ASSET_URL}" != "null"

          curl -sSfL "${GITLEAKS_ASSET_URL}" | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-git --config .gitleaks.toml

  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6.3.0

  validate-disabled-annotations:
    name: Validate @Disabled annotation format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v7
      - name: Check @Disabled annotations follow '#NNN — <reason>' format
        run: |
          python3 - <<'PYEOF'
          import sys, re
          from pathlib import Path

          # Required format: @Disabled("#NNN — <one-sentence reason>")
          pattern = re.compile(r'@Disabled\("#[0-9]+ — .+"\)')
          failed = []

          for kt in Path('.').rglob('*.kt'):
              for i, line in enumerate(kt.read_text(errors='replace').splitlines(), 1):
                  if '@Disabled' not in line:
                      continue
                  if line.strip().startswith('//'):
                      continue
                  if not pattern.search(line):
                      failed.append(f'{kt}:{i}: {line.strip()}')

          if failed:
              print('ERROR: @Disabled annotations missing required format:')
              for entry in failed:
                  print(f'  {entry}')
              print()
              print('Required: @Disabled("#NNN — <one-sentence reason>")')
              print('See docs/disabled-tests.md for the annotation convention.')
              sys.exit(1)

          count = sum(1 for _ in Path('.').rglob('*.kt'))
          print(f'OK: {count} Kotlin files checked — all @Disabled annotations properly formatted.')
          PYEOF

  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validate-wrapper
    outputs:
      aws: ${{ steps.filter.outputs.aws }}
      aws-kotlin: ${{ steps.filter.outputs.aws-kotlin }}
      aws-exposed: ${{ steps.filter.outputs.aws-exposed }}
      aws-spring-boot: ${{ steps.filter.outputs.aws-spring-boot }}
      aws-ktor: ${{ steps.filter.outputs.aws-ktor }}
      aws-spring-boot-s3-examples: ${{ steps.filter.outputs.aws-spring-boot-s3-examples }}
      aws-spring-boot-exposed-examples: ${{ steps.filter.outputs.aws-spring-boot-exposed-examples }}
      aws-spring-boot-sqs-examples: ${{ steps.filter.outputs.aws-spring-boot-sqs-examples }}
      aws-spring-boot-dynamodb-examples: ${{ steps.filter.outputs.aws-spring-boot-dynamodb-examples }}
      aws-ktor-s3-examples: ${{ steps.filter.outputs.aws-ktor-s3-examples }}
      aws-ktor-sqs-examples: ${{ steps.filter.outputs.aws-ktor-sqs-examples }}
      aws-ktor-dynamodb-examples: ${{ steps.filter.outputs.aws-ktor-dynamodb-examples }}
      aws-ktor-exposed-examples: ${{ steps.filter.outputs.aws-ktor-exposed-examples }}
      aws-ktor-service-coverage-examples: ${{ steps.filter.outputs.aws-ktor-service-coverage-examples }}
    steps:
      - uses: actions/checkout@v7
      - name: Test classified retry helper
        run: python3 .github/scripts/run_gradle_with_classified_retry_test.py
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            aws:
              - 'aws-java/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            aws-kotlin:
              - 'aws-kotlin/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            aws-exposed:
              - 'aws-exposed/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            aws-spring-boot:
              - 'aws-spring-boot/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            aws-ktor:
              - 'aws-ktor/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            aws-spring-boot-s3-examples:
              - 'examples/aws-spring-boot-s3-examples/**'
              - 'aws-spring-boot/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            aws-spring-boot-exposed-examples:
              - 'examples/aws-spring-boot-exposed-examples/**'
              - 'aws-exposed/**'
              - 'aws-spring-boot/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            aws-spring-boot-sqs-examples:
              - 'examples/aws-spring-boot-sqs-examples/**'
              - 'aws-spring-boot/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            aws-spring-boot-dynamodb-examples:
              - 'examples/aws-spring-boot-dynamodb-examples/**'
              - 'aws-spring-boot/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            aws-ktor-s3-examples:
              - 'examples/aws-ktor-s3-examples/**'
              - 'aws-ktor/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            aws-ktor-sqs-examples:
              - 'examples/aws-ktor-sqs-examples/**'
              - 'aws-ktor/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            aws-ktor-dynamodb-examples:
              - 'examples/aws-ktor-dynamodb-examples/**'
              - 'aws-ktor/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            aws-ktor-exposed-examples:
              - 'examples/aws-ktor-exposed-examples/**'
              - 'aws-exposed/**'
              - 'aws-ktor/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            aws-ktor-service-coverage-examples:
              - 'examples/aws-ktor-service-coverage-examples/**'
              - 'aws-ktor/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'

  catalog-governance:
    name: Central Catalog Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: bluetape4k/bluetape4k-dependencies
          ref: ${{ env.BLUETAPE4K_DEPENDENCIES_CATALOG_REF }}
          path: .catalog/bluetape4k-dependencies
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify immutable catalog checkout
        run: test "$(git -C .catalog/bluetape4k-dependencies rev-parse HEAD)" = "$BLUETAPE4K_DEPENDENCIES_CATALOG_REF"
      - name: Check central catalog adoption
        run: |
          python3 .catalog/bluetape4k-dependencies/scripts/sync-shared-versions.py \
            --workspace "$(dirname "$GITHUB_WORKSPACE")" \
            --repo "${GITHUB_REPOSITORY#*/}" \
            --check \
            --summary
      - name: Resolve Gradle catalog from checked-out source
        env:
          BLUETAPE4K_DEPENDENCIES_CATALOG_PATH: ${{ github.workspace }}/.catalog/bluetape4k-dependencies/gradle/libs.versions.toml
        run: ./gradlew help --no-daemon

  build:
    name: Build (compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate-wrapper, changes, catalog-governance]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build (compile only)
        run: .github/scripts/run-gradle-with-classified-retry.sh -- ./gradlew build -x test --parallel --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          BLUETAPE4K_RETRY_JOB: build
          BLUETAPE4K_RETRY_ARTIFACT_DIR: ci-retry-artifacts/build

      - name: Validate publication POMs
        run: |
          ruby scripts/publication/publication_pom_audit_test.rb
          ruby scripts/publication/publication_pom_integration_test.rb
          ./gradlew generatePomFileForBluetapeAwsPublication -PsnapshotVersion=-SNAPSHOT \
            --no-daemon --no-configuration-cache --no-build-cache
          ruby scripts/publication/validate_poms.rb

      - name: Upload retry evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retry-evidence-build
          path: ci-retry-artifacts/build/
          retention-days: 7

  test-aws:
    name: Test / aws
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['aws'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-provider: basic
          cache-read-only: true
      - name: Test aws
        run: .github/scripts/run-gradle-with-classified-retry.sh -- ./gradlew :bluetape4k-aws-java:test --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"
          BLUETAPE4K_RETRY_JOB: aws
          BLUETAPE4K_RETRY_ARTIFACT_DIR: ci-retry-artifacts/aws
      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :bluetape4k-aws-java:koverXmlReport -x test --no-daemon
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-aws
          path: '**/build/reports/kover/'
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-aws
          path: |
            **/build/test-results/test/*.xml
            ci-retry-artifacts/aws/**
          retention-days: 7

