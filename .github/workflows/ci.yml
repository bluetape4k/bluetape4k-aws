            ci-retry-artifacts/aws-spring-boot-exposed-examples/**
          retention-days: 7

  test-aws-spring-boot-emulator-examples:
    name: Test / aws-spring-boot emulator examples
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build, changes]
    if: >-
      ${{
        needs.changes.outputs['aws-spring-boot-s3-examples'] == 'true' ||
        needs.changes.outputs['aws-spring-boot-sqs-examples'] == 'true' ||
        needs.changes.outputs['aws-spring-boot-dynamodb-examples'] == 'true' ||
        github.event_name == 'workflow_dispatch'
      }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-provider: basic
          cache-read-only: true
      - name: Test Spring Boot emulator examples
        run: |
          set -euo pipefail

          modules=(
            aws-spring-boot-s3-examples
            aws-spring-boot-sqs-examples
            aws-spring-boot-dynamodb-examples
          )

          for module in "${modules[@]}"; do
            export BLUETAPE4K_RETRY_JOB="${module}"
            export BLUETAPE4K_RETRY_ARTIFACT_DIR="ci-retry-artifacts/${module}"
            .github/scripts/run-gradle-with-classified-retry.sh \
              --fallback-emulator localstack -- \
              ./gradlew ":${module}:test" -Dbluetape4k.aws.emulator=floci --no-daemon
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-aws-spring-boot-emulator-examples
          path: |
            **/build/test-results/test/*.xml
            ci-retry-artifacts/aws-spring-boot-s3-examples/**
            ci-retry-artifacts/aws-spring-boot-sqs-examples/**
            ci-retry-artifacts/aws-spring-boot-dynamodb-examples/**
          retention-days: 7

  test-aws-ktor-exposed-examples:
    name: Test / aws-ktor-exposed-examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, changes]
    if: ${{ needs.changes.outputs['aws-ktor-exposed-examples'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-provider: basic
          cache-read-only: true
      - name: Test aws-ktor-exposed-examples
        run: .github/scripts/run-gradle-with-classified-retry.sh -- ./gradlew :aws-ktor-exposed-examples:test --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"
          BLUETAPE4K_RETRY_JOB: aws-ktor-exposed-examples
          BLUETAPE4K_RETRY_ARTIFACT_DIR: ci-retry-artifacts/aws-ktor-exposed-examples
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-aws-ktor-exposed-examples
          path: |
            **/build/test-results/test/*.xml
            ci-retry-artifacts/aws-ktor-exposed-examples/**
          retention-days: 7

  test-aws-ktor-service-coverage-examples:
    name: Test / aws-ktor-service-coverage-examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['aws-ktor-service-coverage-examples'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-provider: basic
          cache-read-only: true
      - name: Test aws-ktor-service-coverage-examples
        run: .github/scripts/run-gradle-with-classified-retry.sh -- ./gradlew :aws-ktor-service-coverage-examples:test --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"
          BLUETAPE4K_RETRY_JOB: aws-ktor-service-coverage-examples
          BLUETAPE4K_RETRY_ARTIFACT_DIR: ci-retry-artifacts/aws-ktor-service-coverage-examples
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-aws-ktor-service-coverage-examples
          path: |
            **/build/test-results/test/*.xml
            ci-retry-artifacts/aws-ktor-service-coverage-examples/**
          retention-days: 7

  test-aws-ktor-emulator-examples:
    name: Test / aws-ktor emulator examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, changes]
    if: >-
      ${{
        needs.changes.outputs['aws-ktor-s3-examples'] == 'true' ||
        needs.changes.outputs['aws-ktor-sqs-examples'] == 'true' ||
        needs.changes.outputs['aws-ktor-dynamodb-examples'] == 'true' ||
        github.event_name == 'workflow_dispatch'
      }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-provider: basic
          cache-read-only: true
      - name: Test Ktor emulator examples
        run: |
          set -euo pipefail

          modules=(
            aws-ktor-s3-examples
            aws-ktor-sqs-examples
            aws-ktor-dynamodb-examples
          )

          for module in "${modules[@]}"; do
            export BLUETAPE4K_RETRY_JOB="${module}"
            export BLUETAPE4K_RETRY_ARTIFACT_DIR="ci-retry-artifacts/${module}"
            .github/scripts/run-gradle-with-classified-retry.sh \
              --fallback-emulator localstack -- \
              ./gradlew ":${module}:test" -Dbluetape4k.aws.emulator=floci --no-daemon --max-workers=1 --no-configuration-cache
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-aws-ktor-emulator-examples
          path: |
            **/build/test-results/test/*.xml
            ci-retry-artifacts/aws-ktor-s3-examples/**
            ci-retry-artifacts/aws-ktor-sqs-examples/**
            ci-retry-artifacts/aws-ktor-dynamodb-examples/**
          retention-days: 7

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - changes
      - test-aws
      - test-aws-kotlin
      - test-aws-exposed
      - test-aws-spring-boot
      - test-aws-ktor
    if: >
      always() && (
        needs.changes.outputs.aws == 'true' ||
        needs.changes.outputs.aws-kotlin == 'true' ||
        needs.changes.outputs.aws-exposed == 'true' ||
        needs.changes.outputs.aws-spring-boot == 'true' ||
        needs.changes.outputs.aws-ktor == 'true'
      )
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Test coverage artifact validator
        run: python3 .github/scripts/validate_kover_artifacts_test.py

      - name: Validate coverage artifacts
        run: |
          set -euo pipefail

          expected_artifacts=(
          )

          [[ "${{ needs.changes.outputs.aws }}" == "true" ]] && expected_artifacts+=(coverage-aws)
          [[ "${{ needs.changes.outputs['aws-kotlin'] }}" == "true" ]] && expected_artifacts+=(coverage-aws-kotlin)
          [[ "${{ needs.changes.outputs['aws-exposed'] }}" == "true" ]] && expected_artifacts+=(coverage-aws-exposed)
          [[ "${{ needs.changes.outputs['aws-spring-boot'] }}" == "true" ]] && expected_artifacts+=(coverage-aws-spring-boot)
          [[ "${{ needs.changes.outputs['aws-ktor'] }}" == "true" ]] && expected_artifacts+=(coverage-aws-ktor)

          python3 .github/scripts/validate_kover_artifacts.py coverage-artifacts "${expected_artifacts[@]}"

      - name: Aggregate Kover coverage summary
        run: python3 .github/scripts/aggregate-kover-coverage.py coverage-artifacts

      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-all
          path: coverage-artifacts/
          retention-days: 30

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - catalog-governance
      - gitleaks
      - validate-disabled-annotations
      - changes
      - build
      - coverage-report
      - test-aws
      - test-aws-kotlin
      - test-aws-exposed
      - test-aws-spring-boot
      - test-aws-ktor
      - test-aws-spring-boot-exposed-examples
      - test-aws-spring-boot-emulator-examples
      - test-aws-ktor-exposed-examples
      - test-aws-ktor-service-coverage-examples
      - test-aws-ktor-emulator-examples
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed (skipped jobs treated as success)"
