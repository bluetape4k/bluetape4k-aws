name: CI

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
  packages: read

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitleaks.toml'
      - '.editorconfig'
      - 'WIP.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitleaks.toml'
      - '.editorconfig'
      - 'WIP.md'
      - 'CHANGELOG.md'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  GITLEAKS_VERSION: '8.30.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-git --config .gitleaks.toml

  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

  validate-disabled-annotations:
    name: Validate @Disabled annotation format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v6
      - name: Check @Disabled annotations follow '#NNN — <reason>' format
        run: |
          python3 - <<'PYEOF'
          import sys, re
          from pathlib import Path

          # Required format: @Disabled("#NNN — <one-sentence reason>")
          pattern = re.compile(r'@Disabled\("#[0-9]+ — .+"\)')
          failed = []

          for kt in Path('.').rglob('*.kt'):
              for i, line in enumerate(kt.read_text(errors='replace').splitlines(), 1):
                  if '@Disabled' not in line:
                      continue
                  if line.strip().startswith('//'):
                      continue
                  if not pattern.search(line):
                      failed.append(f'{kt}:{i}: {line.strip()}')

          if failed:
              print('ERROR: @Disabled annotations missing required format:')
              for entry in failed:
                  print(f'  {entry}')
              print()
              print('Required: @Disabled("#NNN — <one-sentence reason>")')
              print('See docs/disabled-tests.md for the annotation convention.')
              sys.exit(1)

          count = sum(1 for _ in Path('.').rglob('*.kt'))
          print(f'OK: {count} Kotlin files checked — all @Disabled annotations properly formatted.')
          PYEOF

  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validate-wrapper
    outputs:
      aws: ${{ steps.filter.outputs.aws }}
      aws-kotlin: ${{ steps.filter.outputs.aws-kotlin }}
      aws-exposed: ${{ steps.filter.outputs.aws-exposed }}
      aws-spring-boot: ${{ steps.filter.outputs.aws-spring-boot }}
      aws-ktor: ${{ steps.filter.outputs.aws-ktor }}
      aws-spring-boot-exposed-examples: ${{ steps.filter.outputs.aws-spring-boot-exposed-examples }}
      aws-ktor-exposed-examples: ${{ steps.filter.outputs.aws-ktor-exposed-examples }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            aws:
              - 'aws/**'
            aws-kotlin:
              - 'aws-kotlin/**'
            aws-exposed:
              - 'aws-exposed/**'
            aws-spring-boot:
              - 'aws-spring-boot/**'
            aws-ktor:
              - 'aws-ktor/**'
            aws-spring-boot-exposed-examples:
              - 'examples/aws-spring-boot-exposed-examples/**'
              - 'aws-exposed/**'
              - 'aws-spring-boot/**'
            aws-ktor-exposed-examples:
              - 'examples/aws-ktor-exposed-examples/**'
              - 'aws-exposed/**'
              - 'aws-ktor/**'

  build:
    name: Build (compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate-wrapper, changes]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build (compile only)
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew build -x test --parallel --no-configuration-cache && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

  test-aws:
    name: Test / aws
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['aws'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-provider: basic
          cache-read-only: true
      - name: Test aws
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-aws-java:test --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-aws
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  test-aws-kotlin:
    name: Test / aws-kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['aws-kotlin'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
