        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-aws-ktor-exposed-examples
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - gitleaks
      - validate-disabled-annotations
      - changes
      - build
      - test-aws
      - test-aws-kotlin
      - test-aws-exposed
      - test-aws-spring-boot
      - test-aws-ktor
      - test-aws-spring-boot-exposed-examples
      - test-aws-ktor-exposed-examples
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed (skipped jobs treated as success)"
