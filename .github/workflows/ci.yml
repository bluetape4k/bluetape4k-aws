      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-aws-spring-boot
          path: |
            **/build/test-results/test/*.xml
            ci-retry-artifacts/aws-spring-boot/**
          retention-days: 7

  test-aws-exposed:
    name: Test / aws-exposed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['aws-exposed'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-provider: basic
          cache-read-only: true
      - name: Test aws-exposed
        run: .github/scripts/run-gradle-with-classified-retry.sh -- ./gradlew :bluetape4k-aws-exposed:test --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"
          BLUETAPE4K_RETRY_JOB: aws-exposed
