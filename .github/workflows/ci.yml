    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, changes]
    if: ${{ needs.changes.outputs['aws-spring-boot-exposed-examples'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
